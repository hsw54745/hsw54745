<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해성발전기 · 입출고 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F1EA;
    --surface:#FFFFFF;
    --surface-2:#FAF8F3;
    --border:#E1DCD0;
    --border-strong:#CFC8B8;
    --ink:#22242A;
    --ink-soft:#6B6E76;
    --ink-faint:#9A9C9F;
    --primary:#2C4A66;
    --primary-dark:#1B3247;
    --primary-tint:#E4ECF2;
    --ok:#2F7D4F;
    --ok-tint:#E4F1E8;
    --warn:#C97A1E;
    --warn-tint:#FBEDDB;
    --danger:#C23B3B;
    --danger-tint:#FBE6E6;
    --radius:10px;
    --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    --display:'Rajdhani','Noto Sans KR',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;padding-bottom:60px;}
  header{background:var(--primary-dark);color:#fff;padding:22px 20px 18px;}
  .brand-row{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:16px;flex-shrink:0;}
  .brand-name{font-size:13px;color:#B9C6D2;letter-spacing:.02em;}
  h1{font-family:var(--display);font-weight:700;font-size:24px;margin:6px 0 2px;letter-spacing:.01em;}
  .sub{font-size:13px;color:#9FB0BE;}
  nav{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;box-shadow:0 1px 0 rgba(0,0,0,.02);}
  nav button{flex:1;min-width:80px;border:none;background:transparent;padding:13px 6px;font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
  nav button.active{color:var(--primary-dark);border-bottom-color:var(--primary);font-weight:700;background:var(--surface-2);}
  main{max-width:1500px;width:100%;margin:0 auto;padding:18px 24px 40px;box-sizing:border-box;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:18px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;}
  .card .num{font-family:var(--mono);font-weight:700;font-size:26px;line-height:1;}
  .card .lbl{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .card.ok .num{color:var(--ok);} .card.warn .num{color:var(--warn);} .card.danger .num{color:var(--danger);}
  .section-title{font-size:15px;font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .section-title .cnt{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:13px;}
  .table-scroll{overflow-x:auto;}
  .table-scroll table{min-width:880px;}
  .table-scroll td, .table-scroll th{white-space:nowrap;}
  .table-scroll td.wrap-ok{white-space:normal;}
  thead th{background:var(--surface-2);text-align:left;font-weight:700;color:var(--ink-soft);font-size:12px;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  .gid{font-family:var(--mono);font-weight:700;color:var(--primary-dark);white-space:nowrap!important;}
  .table-scroll td.gid{white-space:nowrap!important;}
  .muted{color:var(--ink-faint);}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .pill.ok{background:var(--ok-tint);color:var(--ok);}
  .pill.warn{background:var(--warn-tint);color:var(--warn);}
  .pill.danger{background:var(--danger-tint);color:var(--danger);}
  .pill.gray{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border);}
  button.pill{cursor:pointer;font-family:var(--sans);}
  .gauge-wrap{display:flex;align-items:center;gap:8px;min-width:150px;}
  .gauge{flex:1;height:8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;}
  .gauge-fill{height:100%;border-radius:5px 0 0 5px;}
  .gauge-txt{font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap;min-width:64px;text-align:right;}
  .btn{font-family:var(--sans);font-size:13px;font-weight:700;border:1px solid var(--border-strong);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;}
  .btn:hover{background:var(--surface-2);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn.primary:hover{background:var(--primary-dark);}
  .btn.danger{background:var(--danger-tint);border-color:var(--danger);color:var(--danger);}
  .btn.warn{background:var(--warn-tint);border-color:var(--warn);color:var(--warn);}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;}
  .empty{padding:34px 14px;text-align:center;color:var(--ink-faint);font-size:13px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius);}
  .overlay{position:fixed;inset:0;background:rgba(20,22,26,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{background:#fff;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 20px 24px;}
  @media(min-width:640px){.modal{border-radius:16px;}}
  .modal h3{font-family:var(--display);font-size:19px;margin:0 0 4px;}
  .modal .modal-sub{font-size:12px;color:var(--ink-soft);margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field-row{display:flex;gap:10px;margin-bottom:14px;}
  .field-row .field{margin-bottom:0;flex:1;min-width:0;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border-strong);border-radius:8px;font-family:var(--sans);font-size:14px;background:#fff;color:var(--ink);}
  .field textarea{resize:vertical;min-height:60px;}
  .field .hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}
  .field.chk{display:flex;align-items:center;gap:8px;}
  .field.chk input{width:16px;height:16px;}
  .field.chk label{margin:0;font-size:13px;font-weight:500;color:var(--ink);}
  .err{color:var(--danger);font-size:12px;margin-top:5px;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .modal-actions .btn{flex:1;text-align:center;}
  select#hist-select,select#hist-model-select{max-width:220px;}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .toolbar select{padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;font-family:var(--sans);font-size:13px;background:#fff;}
  .detail-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:12px;}
  .detail-head .gid-big{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--primary-dark);}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .detail-grid .item .k{font-size:11px;color:var(--ink-soft);}
  .detail-grid .item .v{font-family:var(--mono);font-weight:700;font-size:14px;margin-top:2px;}
  .settings-table input{width:100%;padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:13px;font-family:var(--sans);}
  .settings-table select{padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:13px;font-family:var(--sans);width:100%;}
  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);}
  .table-scroll{overflow-x:auto;}
  .save-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--primary-dark);color:#fff;padding:20px 36px;border-radius:16px;font-size:22px;font-weight:800;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.35);text-align:center;}
  .save-flash.show{opacity:1;}
  .util-two-col{display:flex;gap:16px;}
  .util-two-col .table-scroll{flex:1;min-width:0;}
  .util-two-col .util-table{flex:1;min-width:0;overflow-x:visible;}
  .util-table table{width:100%;min-width:0;table-layout:fixed;}
  .util-table td, .util-table th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .util-table .gauge-wrap{min-width:0;gap:4px;}
  .util-table .gauge-txt{min-width:34px;font-size:11px;}
  .util-two-col .settings-table{flex:1;min-width:0;overflow-x:visible;}
  .util-two-col .settings-table table{width:100%;min-width:0;table-layout:auto;}
  .util-two-col .settings-table td, .util-two-col .settings-table th{white-space:normal;overflow:hidden;}
  .util-two-col .settings-table input, .util-two-col .settings-table select{min-width:0;}
  @media(max-width:760px){.util-two-col{flex-direction:column;}}
  .part-check{display:flex;align-items:center;gap:7px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--border);}
  .part-check:last-child{border-bottom:none;}
  .part-check input{width:15px;height:15px;flex-shrink:0;}
  .consumable-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
  .consumable-row input{flex:1;}
  .consumable-row input.qty{flex:0 0 60px;}
  .material-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
  .material-card .m-title{font-weight:700;font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .material-card .m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;font-size:12.5px;}
  .material-card .m-grid .k{color:var(--ink-soft);}
  .material-card .m-grid .v{font-family:var(--mono);font-weight:700;}
  .tag-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
  .tag{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:11px;}
  .prep-card{background:var(--warn-tint);border:1px solid var(--warn);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;}
  .prep-card .p-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;margin-bottom:6px;}
  .tech-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;max-width:520px;}

  /* 비밀번호 게이트 */
  #pw-gate{display:none;}
  #pw-gate.show{display:flex;position:fixed;inset:0;background:var(--primary-dark, #16324a);z-index:999;align-items:center;justify-content:center;padding:20px;}
  .pw-card{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.35);}
  .pw-title{font-size:19px;font-weight:800;margin-bottom:6px;text-align:center;}
  .pw-sub{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-bottom:18px;line-height:1.5;}
  .pw-input{width:100%;padding:11px 12px;border:1px solid var(--border-strong);border-radius:8px;font-size:15px;margin-bottom:10px;box-sizing:border-box;}
  .pw-err{color:var(--danger);font-size:12.5px;margin-top:-2px;margin-bottom:8px;}

  /* 사용설명서 */
  .manual-section{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:var(--surface);}
  .manual-section summary{cursor:pointer;padding:13px 16px;font-weight:800;font-size:14.5px;list-style:none;display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);}
  .manual-section summary::-webkit-details-marker{display:none;}
  .manual-section summary:after{content:'▾';font-size:12px;color:var(--ink-soft);transition:transform .15s;}
  .manual-section[open] summary:after{transform:rotate(180deg);}
  .manual-body{padding:4px 16px 14px;}
  .manual-body p{margin:0 0 10px;font-size:13px;color:var(--ink-soft);line-height:1.6;}
  .manual-btns{list-style:none;margin:0;padding:0;}
  .manual-btns li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--border);font-size:13px;line-height:1.5;}
  .manual-btns li:first-child{border-top:none;}
  .manual-btn-tag{flex-shrink:0;display:inline-block;background:var(--primary);color:#fff;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;margin-top:1px;}

  /* 인수증 미리보기 & 인쇄 */
  #receipt-overlay{display:none;}
  #receipt-overlay.show{display:block;position:fixed;inset:0;background:rgba(20,22,26,.6);z-index:300;overflow-y:auto;padding:20px 12px 40px;}
  .r-backdrop{min-height:100%;}
  .receipt-panel{background:#fff;max-width:720px;margin:0 auto;border-radius:12px;padding:18px;font-family:'Malgun Gothic','Noto Sans KR',sans-serif;color:#111;}
  .r-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .r-toolbar-title{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .print-msg{background:var(--warn-tint);border:1px solid var(--warn);color:#7a5314;font-size:12.5px;padding:10px 12px;border-radius:8px;margin-bottom:14px;}
  .r-copy{border:2px solid #222;border-radius:4px;padding:16px 18px;margin-bottom:12px;position:relative;overflow:hidden;}
  .r-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-size:52px;font-weight:900;letter-spacing:10px;color:rgba(120,120,120,0.16);white-space:nowrap;pointer-events:none;z-index:5;user-select:none;}
  .r-title{text-align:center;font-size:22px;font-weight:900;letter-spacing:4px;margin-bottom:12px;}
  .r-row{display:flex;gap:16px;font-size:13px;margin-bottom:9px;}
  .r-top{justify-content:space-between;}
  .r-half{flex:1;} .r-full{flex:1;}
  .r-fill{display:inline-block;border-bottom:1px solid #999;min-width:130px;padding:0 4px;}
  .r-fill.wide{min-width:260px;}
  .r-table{width:100%;border-collapse:collapse;margin-bottom:9px;font-size:12.5px;}
  .r-table th,.r-table td{border:1px solid #333;padding:8px 6px;text-align:center;}
  .r-table th{background:#f0f0f0;}
  .r-confirm-text{font-size:16px;font-weight:800;border-top:1px dashed #999;padding-top:9px;margin-bottom:2px;}
  .r-sign-row{display:flex;justify-content:flex-end;padding-right:10%;margin-top:14px;margin-bottom:6px;}
  .r-sign-label{font-size:12.5px;}
  .r-footer{text-align:center;font-size:16px;font-weight:700;color:#333;margin-top:6px;}
  .r-notice{text-align:center;font-size:15px;color:#666;margin-top:3px;}
  .r-divider{position:relative;border-top:2px dashed #999;margin:14px 0;text-align:center;}
  .r-divider span{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#fff;padding:0 12px;font-size:13px;color:#888;letter-spacing:2px;}
  @media print{
    body > header, body > nav, body > main, body > #modal-root, body > #flash{display:none!important;}
    #receipt-overlay{position:static!important;background:#fff!important;padding:0!important;}
    .receipt-panel{max-width:none!important;border-radius:0!important;padding:0!important;margin:0!important;}
    .no-print{display:none!important;}
    body{padding-bottom:0!important;}
    @page{size:A4 portrait;margin:16mm 14mm;}
  }
</style>
<!-- 인쇄시 브라우저 기본 머리글/바닥글(주소, 날짜, 페이지번호)을 원치 않으면
     인쇄 대화상자의 "추가 설정 > 머리글과 바닥글" 체크를 꺼주세요. -->

</head>
<body>

<div id="pw-gate"></div>

<header>
  <div class="brand-row">
    <div class="brand-mark">S</div>
    <div class="brand-name">해성발전기</div>
    <span id="last-saved-indicator" style="margin-left:auto;font-size:11px;color:rgba(255,255,255,.6);"></span>
    <button id="save-all-btn" onclick="saveAllNow()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:700;">💾 전체 저장</button>
    <button id="user-badge" onclick="changeUserName()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;">이름 선택</button>
  </div>
  <h1>해성 발전기 입출고 관리 시스템</h1>
  <div class="sub">정비 주기 기본 350시간 (발전기별 개별 설정 가능) · 이 화면을 여는 모든 사람과 데이터가 공유됩니다</div>
</header>

<nav id="tabbar"></nav>
<main id="content"><div class="loading">불러오는 중…</div></main>
<div id="modal-root"></div>
<div id="receipt-overlay"></div>
<div id="flash" class="save-flash"></div>

<script>
// ===== Firebase Realtime Database 연동 (Claude 아티팩트의 window.storage 대체) =====
// 이 앱은 원래 window.storage API로 데이터를 저장했으나, 이 파일을 클로드 밖에서
// 팀원들과 공유되는 독립 웹페이지로 쓰기 위해 Firebase Realtime Database로 교체했습니다.
const FIREBASE_DB_URL = 'https://haesung3732-default-rtdb.asia-southeast1.firebasedatabase.app';
function fbKey(key){ return encodeURIComponent(key); }
window.storage = {
  async get(key, shared){
    const path = (shared ? 'shared/' : 'personal/') + fbKey(key);
    try{
      const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`);
      if(!res.ok) throw new Error('네트워크 오류');
      const data = await res.json();
      if(data === null) throw new Error('키 없음');
      return {key, value: data, shared};
    }catch(e){
      if(!shared){
        const v = localStorage.getItem('gen-personal-'+key);
        if(v!==null) return {key, value:v, shared};
      }
      throw e;
    }
  },
  async set(key, value, shared){
    const path = (shared ? 'shared/' : 'personal/') + fbKey(key);
    try{
      const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`, {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(value)
      });
      if(!res.ok) throw new Error('저장 실패');
      if(!shared) localStorage.setItem('gen-personal-'+key, value);
      return {key, value, shared};
    }catch(e){
      if(!shared){ localStorage.setItem('gen-personal-'+key, value); return {key, value, shared}; }
      return null;
    }
  },
  async delete(key, shared){
    const path = (shared ? 'shared/' : 'personal/') + fbKey(key);
    try{
      const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`, {method:'DELETE'});
      if(!shared) localStorage.removeItem('gen-personal-'+key);
      if(!res.ok) throw new Error('삭제 실패');
      return {key, deleted:true, shared};
    }catch(e){ return null; }
  },
  async list(prefix, shared){
    const base = shared ? 'shared' : 'personal';
    try{
      const res = await fetch(`${FIREBASE_DB_URL}/${base}.json?shallow=true`);
      if(!res.ok) throw new Error('목록 조회 실패');
      const data = await res.json();
      const keys = data ? Object.keys(data) : [];
      const filtered = (prefix ? keys.filter(k=>k.startsWith(fbKey(prefix))) : keys).map(k=>decodeURIComponent(k));
      return {keys: filtered, prefix, shared};
    }catch(e){ return {keys:[], prefix, shared}; }
  }
};
// ===== Firebase 연동 끝 =====

// ---------- 비밀번호 게이트 ----------
const PW_STORAGE_KEY = 'gen-app-password-v1';
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function getStoredPassword(){
  try{
    const r = await window.storage.get(PW_STORAGE_KEY, true);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
function pwGateShow(html){
  const el = document.getElementById('pw-gate');
  if(!el) return;
  el.innerHTML = html;
  el.classList.add('show');
}
function pwGateHide(){
  const el = document.getElementById('pw-gate');
  if(!el) return;
  el.classList.remove('show');
  el.innerHTML = '';
}
async function initPasswordGate(){
  if(sessionStorage.getItem('gen-pw-unlocked')==='yes'){ init(); return; }
  const stored = await getStoredPassword();
  if(!stored){ renderPwSetupScreen(); }
  else { renderPwLoginScreen(); }
}
function renderPwSetupScreen(){
  pwGateShow(`
    <div class="pw-card">
      <div class="pw-title">🔒 비밀번호 설정</div>
      <div class="pw-sub">아직 비밀번호가 설정되어 있지 않습니다. 팀에서 공통으로 쓸 비밀번호를 만들어두면, 다음부터는 이 비밀번호를 아는 사람만 화면을 볼 수 있습니다. (설정 탭에서 나중에 바꾸거나 해제할 수 있어요)</div>
      <input type="password" id="pw-setup-1" class="pw-input" placeholder="새 비밀번호 (4자 이상)">
      <input type="password" id="pw-setup-2" class="pw-input" placeholder="비밀번호 확인" onkeydown="if(event.key==='Enter')submitPwSetup()">
      <div id="pw-setup-err" class="pw-err" style="display:none;"></div>
      <button class="btn primary" style="width:100%;" onclick="submitPwSetup()">설정하고 시작하기</button>
      <button class="btn" style="width:100%;margin-top:8px;" onclick="skipPwSetup()">비밀번호 없이 계속 사용하기</button>
    </div>
  `);
}
async function submitPwSetup(){
  const p1 = document.getElementById('pw-setup-1').value;
  const p2 = document.getElementById('pw-setup-2').value;
  const errEl = document.getElementById('pw-setup-err');
  if(!p1 || p1.length<4){ errEl.textContent='비밀번호는 4자 이상 입력해주세요.'; errEl.style.display='block'; return; }
  if(p1!==p2){ errEl.textContent='비밀번호가 서로 다릅니다.'; errEl.style.display='block'; return; }
  const hash = await sha256Hex(p1);
  try{
    const r = await window.storage.set(PW_STORAGE_KEY, JSON.stringify({hash}), true);
    if(!r){ errEl.textContent='저장에 실패했습니다. 다시 시도해주세요.'; errEl.style.display='block'; return; }
  }catch(e){ errEl.textContent='저장에 실패했습니다. 다시 시도해주세요.'; errEl.style.display='block'; return; }
  sessionStorage.setItem('gen-pw-unlocked','yes');
  pwGateHide();
  init();
}
function skipPwSetup(){
  sessionStorage.setItem('gen-pw-unlocked','yes');
  pwGateHide();
  init();
}
function renderPwLoginScreen(){
  pwGateShow(`
    <div class="pw-card">
      <div class="pw-title">🔒 비밀번호 입력</div>
      <div class="pw-sub">해성발전기 입출고 관리 · 팀 공통 비밀번호를 입력해주세요.</div>
      <input type="password" id="pw-login" class="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')submitPwLogin()">
      <div id="pw-login-err" class="pw-err" style="display:none;"></div>
      <button class="btn primary" style="width:100%;" onclick="submitPwLogin()">확인</button>
    </div>
  `);
  setTimeout(()=>{ const el=document.getElementById('pw-login'); if(el) el.focus(); }, 50);
}
async function submitPwLogin(){
  const p = document.getElementById('pw-login').value;
  const errEl = document.getElementById('pw-login-err');
  if(!p){ errEl.textContent='비밀번호를 입력해주세요.'; errEl.style.display='block'; return; }
  const stored = await getStoredPassword();
  if(!stored){
    // 그 사이 다른 사람이 비밀번호를 해제한 경우
    sessionStorage.setItem('gen-pw-unlocked','yes');
    pwGateHide(); init(); return;
  }
  const hash = await sha256Hex(p);
  if(hash===stored.hash){
    sessionStorage.setItem('gen-pw-unlocked','yes');
    pwGateHide();
    init();
  } else {
    errEl.textContent='비밀번호가 틀렸습니다.'; errEl.style.display='block';
    document.getElementById('pw-login').value='';
  }
}
async function changeAppPassword(){
  const curEl = document.getElementById('f-pw-current');
  const newEl = document.getElementById('f-pw-new');
  const confEl = document.getElementById('f-pw-confirm');
  const msgEl = document.getElementById('f-pw-msg');
  const showMsg = (text, ok)=>{ msgEl.textContent=text; msgEl.style.display='block'; msgEl.style.color = ok? 'var(--ok)':'var(--danger)'; };
  const stored = await getStoredPassword();
  if(stored){
    const curHash = await sha256Hex(curEl.value||'');
    if(curHash!==stored.hash){ showMsg('현재 비밀번호가 올바르지 않습니다.', false); return; }
  }
  const nw = newEl.value, conf = confEl.value;
  if(!nw || nw.length<4){ showMsg('새 비밀번호는 4자 이상 입력해주세요.', false); return; }
  if(nw!==conf){ showMsg('새 비밀번호가 서로 다릅니다.', false); return; }
  const hash = await sha256Hex(nw);
  try{
    const r = await window.storage.set(PW_STORAGE_KEY, JSON.stringify({hash}), true);
    if(!r){ showMsg('저장에 실패했습니다.', false); return; }
  }catch(e){ showMsg('저장에 실패했습니다.', false); return; }
  curEl.value=''; newEl.value=''; confEl.value='';
  showMsg('비밀번호가 설정/변경되었습니다.', true);
}
async function removeAppPassword(){
  const curEl = document.getElementById('f-pw-current');
  const msgEl = document.getElementById('f-pw-msg');
  const showMsg = (text, ok)=>{ msgEl.textContent=text; msgEl.style.display='block'; msgEl.style.color = ok? 'var(--ok)':'var(--danger)'; };
  const stored = await getStoredPassword();
  if(!stored){ showMsg('이미 비밀번호 보호가 꺼져 있습니다.', true); return; }
  const curHash = await sha256Hex(curEl.value||'');
  if(curHash!==stored.hash){ showMsg('현재 비밀번호가 올바르지 않습니다.', false); return; }
  openConfirmModal('비밀번호 보호를 완전히 해제할까요? 앞으로 이 링크를 여는 누구나 바로 데이터를 볼 수 있게 됩니다.', async function(){
    try{ await window.storage.delete(PW_STORAGE_KEY, true); }catch(e){}
    closeModal();
    curEl.value='';
    flash('비밀번호 보호가 해제되었습니다');
  }, '해제');
}

async function getOrInit(key, defVal){
  try{
    const r = await window.storage.get(key, true);
    return r ? JSON.parse(r.value) : defVal;
  }catch(e){
    try{ await window.storage.set(key, JSON.stringify(defVal), true); }catch(e2){ /* 저장 실패해도 기본값은 반환 */ }
    return defVal;
  }
}
async function peekStorage(key, fallback){
  try{
    const r = await window.storage.get(key, true);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){
    return fallback;
  }
}
async function getOrInitPersonal(key, defVal){
  try{
    const r = await window.storage.get(key, false);
    return r ? JSON.parse(r.value) : defVal;
  }catch(e){
    return defVal;
  }
}
async function storageSetChecked(key, value, shared){
  beginSaving('저장중입니다…');
  try{
    const r = await window.storage.set(key, value, shared);
    if(!r) throw new Error('저장 실패(응답 없음): '+key);
    return r;
  } finally {
    endSaving();
  }
}
let lastSavedAt = null;
function updateLastSavedIndicator(){
  const el = document.getElementById('last-saved-indicator');
  if(el) el.textContent = lastSavedAt ? `마지막 저장: ${lastSavedAt}` : '';
}
let saveInFlightCount = 0;
async function saveOneWithRetry(fn, retries){
  let lastErr = null;
  for(let i=0; i<=retries; i++){
    try{ await fn(); return {ok:true}; }
    catch(e){ lastErr = e; if(i<retries) await new Promise(r=>setTimeout(r, 500*(i+1))); }
  }
  return {ok:false, err: lastErr};
}
async function saveWithRetry(fn, retries){
  saveInFlightCount++;
  try{
    const r = await saveOneWithRetry(fn, retries!=null?retries:3);
    if(r.ok){
      lastSavedAt = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
      updateLastSavedIndicator();
      return true;
    } else {
      showInfoModal('저장 중 오류가 발생했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.');
      return false;
    }
  } finally {
    saveInFlightCount = Math.max(0, saveInFlightCount-1);
  }
}

// 배경(overlay)을 마우스로 누른 채 안쪽 표를 옆으로 스크롤하다가 바깥에서 손을 떼도
// 창이 닫히지 않도록, 마우스를 누른 지점과 뗀 지점이 모두 배경 위일 때만 닫습니다.
let _lastMouseDownTarget = null;
document.addEventListener('mousedown', function(e){ _lastMouseDownTarget = e.target; }, true);
document.addEventListener('touchstart', function(e){ _lastMouseDownTarget = e.target; }, true);
function backdropClick(el, evt, closeFn){
  if(evt.target===el && _lastMouseDownTarget===el){ closeFn(); }
}
function flash(msg){
  const f = document.getElementById('flash');
  f.textContent = msg;
  f.style.fontSize = '';
  f.classList.add('show');
  clearTimeout(f._hideTimer);
  f._hideTimer = setTimeout(()=>f.classList.remove('show'), 2600);
}
function flashSaving(msg){
  // 저장이 끝날 때까지 계속 노출되며, flashSavingEnd()가 호출되기 전까지는 자동으로 사라지지 않습니다.
  const f = document.getElementById('flash');
  f.textContent = msg;
  f.style.fontSize = '';
  f.classList.add('show');
  clearTimeout(f._hideTimer);
}
function flashSavingEnd(){
  const f = document.getElementById('flash');
  clearTimeout(f._hideTimer);
  f.classList.remove('show');
}
// 어떤 저장이든(개별 항목 저장이든 "전체 저장"이든) 진행 중에는 "저장중입니다…" 메세지가
// 계속 떠 있다가, 진행 중인 저장이 모두 끝난 순간에만 사라지도록 depth 카운터로 관리합니다.
let _savingDepth = 0;
function beginSaving(msg){
  _savingDepth++;
  flashSaving(msg || '저장중입니다…');
}
function endSaving(){
  _savingDepth = Math.max(0, _savingDepth-1);
  if(_savingDepth===0) flashSavingEnd();
}

function findGen(id){ return DB.gens.find(g=>g.id===id); }
function displayModel(g){ return g && g.model ? g.model : '미설정'; }

function elapsedHours(g){
  return Math.max(0, (g.hours||0) - (g.lastMaintHours||0));
}
function remainingHours(g){
  return getCycle(g) - elapsedHours(g);
}
function maintStatus(remaining){
  if(remaining<=0) return 'danger';
  if(remaining<=(DB.warnThreshold||50)) return 'warn';
  return 'ok';
}
function activeGens(){ return DB.gens.filter(g=>!g.retired); }
function estCurrentHours(g){
  if(g.status==='out' && g.rental && g.rental.longTerm && g.rental.estDaily>0 && g.rental.outDate){
    const days = Math.max(0,(Date.now() - new Date(g.rental.outDate+'T00:00:00').getTime())/86400000);
    return g.rental.startHours + days*g.rental.estDaily;
  }
  return g.hours||0;
}
function estElapsed(g){ return Math.max(0, estCurrentHours(g) - (g.lastMaintHours||0)); }
function estRemaining(g){ return getCycle(g) - estElapsed(g); }

function predictedDate(g){
  if(!(g.status==='out' && g.rental && g.rental.longTerm && g.rental.estDaily>0)) return null;
  const rem = estRemaining(g);
  if(rem<=0) return {overdue:true};
  const days = rem / g.rental.estDaily;
  const d = new Date(Date.now() + days*86400000);
  return {overdue:false, date: toLocalDateStr(d), days: Math.round(days)};
}

// 출고예정(입고예정) 계산: 출고일 + 사용일수
function expectedInDate(rt){
  if(!rt || !rt.usageDays || !rt.outDate) return null;
  const days = Number(rt.usageDays);
  if(!days || days<=0) return null;
  const d = new Date(rt.outDate+'T00:00:00');
  d.setDate(d.getDate()+days);
  return toLocalDateStr(d);
}
function daysFromToday(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const t = new Date(todayStr()+'T00:00:00');
  return Math.round((d-t)/86400000);
}
function dow(dateStr){
  if(!dateStr) return dateStr;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  const days=['일','월','화','수','목','금','토'];
  return `${dateStr}(${days[d.getDay()]})`;
}
function inDateLabel(dateStr){
  const diff = daysFromToday(dateStr);
  if(diff===0) return '오늘입고';
  if(diff===1) return '내일입고';
  if(diff===2) return '내일모레입고';
  if(diff<0) return `${dow(dateStr)} (지연)`;
  return dow(dateStr);
}
// 하루 최대 사용시간 기준 (이 시간을 초과해서 사용된 임대 건을 "과다사용"으로 표시합니다)
const OVERUSE_DAILY_LIMIT = 10;
function rentalDays(r){
  if(!r || !r.outDate || !r.inDate) return null;
  const out = new Date(r.outDate+'T00:00:00');
  const inD = new Date(r.inDate+'T00:00:00');
  if(isNaN(out.getTime()) || isNaN(inD.getTime())) return null;
  const days = Math.round((inD-out)/86400000);
  return days>0 ? days : 1; // 당일 반납 등은 최소 1일로 계산
}
function rentalAvgDaily(r){
  const days = rentalDays(r);
  if(!days || r.usedHours==null) return null;
  return r.usedHours/days;
}
function isRentalOveruse(r){
  const avg = rentalAvgDaily(r);
  return avg!=null && avg>OVERUSE_DAILY_LIMIT;
}
function overuseRentalsList(){
  return DB.rentals.filter(isRentalOveruse).sort((a,b)=>rentalAvgDaily(b)-rentalAvgDaily(a));
}
function inDCountLabel(dateStr){
  const diff = daysFromToday(dateStr);
  if(diff<0) return `${dow(dateStr)} (지연)`;
  if(diff===0) return '오늘입고';
  return `입고${diff}일전`;
}

function gaugeHtml(elapsed, remaining, cycle){
  const cyc = cycle || DEFAULT_CYCLE;
  const pct = Math.min(100, Math.max(0,(elapsed/cyc)*100));
  const st = maintStatus(remaining);
  const color = st==='danger'?'var(--danger)':st==='warn'?'var(--warn)':'var(--ok)';
  const txt = remaining<0 ? (Math.abs(Math.round(remaining))+'h 초과') : (Math.round(remaining)+'h 남음');
  return `<div class="gauge-wrap"><div class="gauge"><div class="gauge-fill" style="width:${pct}%;background:${color}"></div></div><span class="gauge-txt" style="color:${color}">${txt}</span></div>`;
}

  if(m.fuelFilterName) parts.push({label:`연료필터1: ${m.fuelFilterName}${m.fuelFilterQty?` ×${m.fuelFilterQty}`:''}`, partName:m.fuelFilterName, qty:m.fuelFilterQty||1, kind:'fuelFilter1'});
  if(m.fuelFilter2Name) parts.push({label:`연료필터2: ${m.fuelFilter2Name}${m.fuelFilter2Qty?` ×${m.fuelFilter2Qty}`:''}`, partName:m.fuelFilter2Name, qty:m.fuelFilter2Qty||1, kind:'fuelFilter2'});
  if(m.airFilterName) parts.push({label:`에어필터: ${m.airFilterName}${m.airFilterQty?` ×${m.airFilterQty}`:''}`, partName:m.airFilterName, qty:m.airFilterQty||1, kind:'airFilter'});
  if(m.fanBeltName) parts.push({label:`팬벨트: ${m.fanBeltName}${m.fanBeltQty?` ×${m.fanBeltQty}`:''}`, partName:m.fanBeltName, qty:m.fanBeltQty||1, kind:'fanBelt'});
  (m.consumables||[]).forEach(c=>{ if(c.name) parts.push({label:`${c.name}${c.qty?` ×${c.qty}`:''}`, partName:c.name, qty:c.qty||1, kind:'consumable'}); });
  return parts;
}
function allKnownPartNames(){
  const names = new Set();
  Object.values(DB.materials||{}).forEach(m=>{
    materialCandidatePartsFromMaterial(m).forEach(p=>names.add(p.partName));
  });
  Object.keys(DB.partsStock||{}).forEach(n=>names.add(n));
  return [...names].filter(Boolean);
}
function materialCandidatePartsFromMaterial(m){
  if(!m) return [];
  const parts = [];
  if(m.engineOilLiters) parts.push({partName:'엔진오일'});
  if(m.oilFilter1Name) parts.push({partName:m.oilFilter1Name});
  if(m.oilFilter2Name) parts.push({partName:m.oilFilter2Name});
  if(m.fuelFilterName) parts.push({partName:m.fuelFilterName});
  if(m.fuelFilter2Name) parts.push({partName:m.fuelFilter2Name});
  if(m.airFilterName) parts.push({partName:m.airFilterName});
  if(m.fanBeltName) parts.push({partName:m.fanBeltName});
  (m.consumables||[]).forEach(c=>{ if(c.name) parts.push({partName:c.name}); });
  return parts;
}

function regionOf(address){
  if(!address) return '기타';
  const a = address;
  if(/서울/.test(a)) return '서울';
  if(/인천/.test(a)) return '인천';
  if(/대전/.test(a)) return '대전';
  if(/세종/.test(a)) return '세종';
  if(/대구/.test(a)) return '대구';
  if(/부산/.test(a)) return '부산';
  if(/울산/.test(a)) return '울산';
  if(/제주/.test(a)) return '제주';
  const gyeonggiNorth = ['고양','파주','의정부','동두천','양주','포천','연천','가평','남양주','구리','김포'];
  const gyeonggiSouth = ['수원','성남','용인','안양','부천','안산','평택','화성','시흥','군포','의왕','하남','오산','이천','안성','여주','과천','광명'];
  if(gyeonggiNorth.some(c=>a.includes(c))) return '경기북부';
  if(gyeonggiSouth.some(c=>a.includes(c))) return '경기남부';
  if(/경기/.test(a)) return '경기(기타)';
  if(/광주/.test(a)) return '광주';
  const chungnam = ['천안','아산','서산','당진','논산','공주','보령','계룡','금산','부여','서천','청양','홍성','예산','태안'];
  if(chungnam.some(c=>a.includes(c)) || /충남/.test(a)) return '충남';
  const chungbuk = ['청주','충주','제천','보은','옥천','영동','증평','진천','괴산','음성','단양'];
  if(chungbuk.some(c=>a.includes(c)) || /충북/.test(a)) return '충북';
  const gangwon = ['춘천','원주','강릉','동해','태백','속초','삼척','홍천','횡성','영월','평창','정선','철원','화천','양구','인제','고성','양양'];
  if(gangwon.some(c=>a.includes(c)) || /강원/.test(a)) return '강원';
  const gyeongbuk = ['포항','경주','김천','안동','구미','영주','영천','상주','문경','경산','군위','의성','청송','영양','영덕','청도','고령','성주','칠곡','예천','봉화','울진','울릉'];
  if(gyeongbuk.some(c=>a.includes(c)) || /경북/.test(a)) return '경북';
  const gyeongnam = ['창원','진주','통영','사천','김해','밀양','거제','양산','의령','함안','창녕','남해','하동','산청','함양','거창','합천'];
  if(gyeongnam.some(c=>a.includes(c)) || /경남/.test(a)) return '경남';
  const jeonbuk = ['전주','군산','익산','정읍','남원','김제','완주','진안','무주','장수','임실','순창','고창','부안'];
  if(jeonbuk.some(c=>a.includes(c)) || /전북/.test(a)) return '전북';
  const jeonnam = ['목포','여수','순천','나주','광양','담양','곡성','구례','고흥','보성','화순','장흥','강진','해남','영암','무안','함평','영광','장성','완도','진도','신안'];
  if(jeonnam.some(c=>a.includes(c)) || /전남/.test(a)) return '전남';
  return '기타';
}

function overuseBannerHtml(){

    </div>`;
}
function renderDashboard(){
  const active = activeGens();
  const total = active.length;
  const inCount = active.filter(g=>g.status==='in').length;
  const outCount = active.filter(g=>g.status==='out').length;
  const brokenCount = active.filter(g=>g.underRepair).length;
  const forcedOutCount = active.filter(g=>g.status==='out' && g.rental && g.rental.forcedOut).length;
  const resCount = DB.reservations.length;
  const urgent = active.filter(g=>{
    if(!hasHourData(g)) return false;
    const r = g.status==='in'? remainingHours(g) : estRemaining(g);
    return maintStatus(r)!=='ok';
  });
  urgent.sort((a,b)=>{
    const ra = a.status==='in'? remainingHours(a) : estRemaining(a);
    const rb = b.status==='in'? remainingHours(b) : estRemaining(b);
    return ra-rb;
  });
  const dangerCount = urgent.filter(g=>{
    const r = g.status==='in'? remainingHours(g): estRemaining(g);
    return r<=0;
  }).length;

  let rows = urgent.slice(0,15).map(g=>{
    const r = g.status==='in'? remainingHours(g): estRemaining(g);
    const el = g.status==='in'? elapsedHours(g): estElapsed(g);
    return `<tr>
      <td class="gid">${g.id}</td>
      <td class="wrap-ok">${displayModel(g)}</td>
      <td>${g.status==='in'?'<span class="pill gray">입고</span>':'<span class="pill gray">출고중(추정)</span>'}</td>
      <td>${gaugeHtml(el, r, getCycle(g))}</td>
      <td>${pillHtml(maintStatus(r))}</td>
    </tr>`;
  }).join('');
  if(urgent.length===0) rows = `<tr><td colspan="5" class="muted" style="text-align:center;padding:20px;">정비가 임박한 발전기가 없습니다.</td></tr>`;

  // 입고 예정 리스트 (출고일 + 사용일수 기반)
  const expList = active.filter(g=>g.status==='out' && g.rental && expectedInDate(g.rental))
    .map(g=>({g, date: expectedInDate(g.rental)}))
    .sort((a,b)=>a.date.localeCompare(b.date));
  let expRows = expList.map(x=>{
    const rt = x.g.rental;
    return `<tr>
      <td class="gid">${x.g.id}</td>
      <td class="wrap-ok">${displayModel(x.g)}</td>
      <td class="wrap-ok">${rt.customer||'-'}${rt.site? `<div class="muted" style="font-size:11px;">${rt.site}</div>`:''}</td>
      <td><span class="pill ${daysFromToday(x.date)<=0?'warn':'gray'}">${inDateLabel(x.date)}</span></td>
    </tr>`;
  }).join('');

  // 지역별 출고 현황 (출고중인 발전기의 주소 기준)
  const outGens = active.filter(g=>g.status==='out' && g.rental);
  const regionCounts = {};
  outGens.forEach(g=>{
    const region = regionOf(g.rental.address || g.rental.site || '');
    regionCounts[region] = (regionCounts[region]||0) + 1;
  });
  const regionEntries = Object.entries(regionCounts).sort((a,b)=>b[1]-a[1]);

  // 출고 대기 최근 요약 (상차대기 우선, 날짜순)
  const reserveSummary = [...DB.reservations]
    .sort((a,b)=>{
      const aP = a.pendingLoad?0:1, bP = b.pendingLoad?0:1;
      if(aP!==bP) return aP-bP;
      const ad = a.loadDate||a.outDate||a.plannedOutDate||'';
      const bd = b.loadDate||b.outDate||b.plannedOutDate||'';
      return ad.localeCompare(bd);
    }).slice(0,5);
  const reserveSummaryRows = reserveSummary.map(r=>{
    const g = findGen(r.genId);
    return `<tr>
      <td class="gid">${r.genId}</td>

      <td>${r.pendingLoad? '<span class="pill warn">상차대기</span>' : '<span class="pill gray">출고예정</span>'}</td>
    </tr>`;
  }).join('');

  // 출고중 최근 요약 (출고일 최근순)
  const outSummary = [...outGens]
    .sort((a,b)=>((b.rental&&b.rental.outDate)||'').localeCompare((a.rental&&a.rental.outDate)||''))
    .slice(0,5);
  const outSummaryRows = outSummary.map(g=>{
    const rt = g.rental;
    return `<tr>
      <td class="gid">${g.id}</td>
      <td class="wrap-ok">${displayModel(g)}</td>

    const aOpen = a.purchasedBy?1:0, bOpen = b.purchasedBy?1:0;

  const coSummaryRows = coSummary.map(item=>{

    </tr>`;
  }).join('');

  // 보완요청 요약 (미해결 우선, 최근순)

    const aOpen = !a.completedBy, bOpen = !b.completedBy;
    if(aOpen!==bOpen) return aOpen? -1:1;
    return (b.createdDate||'').localeCompare(a.createdDate||'');
  }).slice(0,5);
  const impSummaryRows = impSummary.map(item=>{
    const done = !!item.completedBy;
    return `<tr>
      <td class="wrap-ok" style="font-size:13px;">${escR((item.content||'').slice(0,40))}${(item.content||'').length>40? '…':''}</td>

      <td>${done? '<span class="pill ok">완료</span>' : '<span class="pill warn">미해결</span>'}</td>
    </tr>`;
  }).join('');

  return `
    ${backupReminderBannerHtml()}
    ${lowStockBannerHtml()}
    ${longtermMaintBannerHtml()}
    ${overuseBannerHtml()}
    <div class="cards">
      <div class="card" style="cursor:pointer;" onclick="switchTab('history')"><div class="num">${total}</div><div class="lbl">전체 발전기</div></div>
      <div class="card ok" style="cursor:pointer;" onclick="switchTab('in')"><div class="num">${inCount}</div><div class="lbl">입고</div></div>
      <div class="card warn" style="cursor:pointer;" onclick="switchTab('out')"><div class="num">${outCount}<span style="font-size:14px;font-weight:700;margin-left:3px;">(${total>0?Math.round(outCount/total*100):0}%)</span></div><div class="lbl">출고중 · 출고율</div></div>

    </div>
    <div class="section-title">지역별 출고 현황 <span class="cnt">${outGens.length}대</span></div>
    ${regionEntries.length===0? `<div class="empty">현재 출고중인 발전기가 없습니다.</div>` : `
    <div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(90px,1fr));">
      ${regionEntries.map(([region,count])=>`
        <div class="card" style="cursor:pointer;" onclick="viewRegionOutList('${region.replace(/'/g,"\\'")}')">
          <div class="num">${count}</div>
          <div class="lbl">${region}</div>
        </div>
      `).join('')}
    </div>`}
    <div class="section-title">정비 임박 / 필요 <span class="cnt">${urgent.length}대</span></div>

      <thead><tr><th>번호</th><th>모델</th><th>상태</th><th>정비 주기</th><th></th></tr></thead>

function capacityOf(g){
  const m = (g.model||'').match(/(\d+(?:\.\d+)?)\s*kW/i);
  return m ? parseFloat(m[1]) : Infinity;
}
function capacityFromModelStr(model){
  const m = (model||'').match(/(\d+(?:\.\d+)?)\s*kW/i);
  return m ? parseFloat(m[1]) : Infinity;
}
function sortModelsByCapacity(models){
  return [...models].sort((a,b)=>{
    const ca = capacityFromModelStr(a), cb = capacityFromModelStr(b);
    if(ca!==cb) return ca-cb;
    return a.localeCompare(b,'ko');
  });
}
function usableCapacityHtml(g){
  const cap = capacityOf(g);
  const ratio = g.usageRatio && g.usageRatio>0 && g.usageRatio<100 ? g.usageRatio : 100;
  if(!isFinite(cap) || ratio>=100) return '';
  const usable = Math.round(cap*ratio/100*10)/10;
  return `<div class="muted" style="font-size:11px;">정격 대비 ${ratio}% 사용 (약 ${usable}kW)</div>`;
}
function usableCapacityCell(g){
  const cap = capacityOf(g);
  if(!isFinite(cap)) return '<span class="muted">-</span>';
  const ratio = g.usageRatio && g.usageRatio>0 && g.usageRatio<=100 ? g.usageRatio : 100;
  const usable = Math.round(cap*ratio/100*10)/10;
  if(ratio>=100) return `<span class="muted">${cap}kW (100%)</span>`;
  return `<span style="color:var(--warn);font-weight:700;">${usable}kW</span> <span class="muted" style="font-size:11px;">(정격 ${cap}kW의 ${ratio}%)</span>`;
}
function sortByIdNatural(a, b){
  const aL = /^L-/i.test(a.id);
  const bL = /^L-/i.test(b.id);
  if(aL !== bL) return aL ? 1 : -1; // L 시리즈는 항상 맨 아래
  if(aL && bL){
    const priority = ['L-11','L-12','L-13']; // 이 세 대는 L 시리즈 내에서 항상 맨 위
    const aP = priority.indexOf(a.id.toUpperCase());
    const bP = priority.indexOf(b.id.toUpperCase());
    if(aP!==-1 || bP!==-1){
      if(aP!==-1 && bP!==-1) return aP-bP;
      return aP!==-1 ? -1 : 1;
    }
  }
  return a.id.localeCompare(b.id, undefined, {numeric:true, sensitivity:'base'});
}
function sortInListOrder(a, b){
  const aL = /^L-/i.test(a.id);
  const bL = /^L-/i.test(b.id);
  if(aL !== bL) return aL ? 1 : -1; // L 시리즈는 항상 맨 아래
  if(aL && bL){
    const priority = ['L-11','L-12','L-13']; // 이 세 대는 L 시리즈 내에서 항상 맨 위
    const aP = priority.indexOf(a.id.toUpperCase());
    const bP = priority.indexOf(b.id.toUpperCase());
    if(aP!==-1 || bP!==-1){
      if(aP!==-1 && bP!==-1) return aP-bP;
      return aP!==-1 ? -1 : 1;
    }
    const an = parseInt((a.id.match(/\d+/)||['0'])[0], 10);
    const bn = parseInt((b.id.match(/\d+/)||['0'])[0], 10);
    return an - bn; // 나머지는 L-1, L-2, L-3 순차적으로
  }
  const ac = capacityOf(a), bc = capacityOf(b);
  if(ac !== bc) return ac - bc; // 낮은 용량부터
  return a.id.localeCompare(b.id, undefined, {numeric:true});
}

function lastFuelInfo(genId){
  const recs = DB.rentals.filter(r=>r.genId===genId && r.measuredFuelHeightCm!=null).sort((a,b)=>(b.inDate||'').localeCompare(a.inDate||''));
  return recs.length>0 ? recs[0] : null;
}
function tankDimsOf(g){
  const m = DB.materials && g && DB.materials[g.model];
  return {
    width: (m && m.tankWidth) || null,
    depth: (m && m.tankDepth) || null,
    height: (m && m.tankHeight) || null
  };
}
function computeFuelLiters(g, heightCm){
  const {width:w, depth:d, height:h} = tankDimsOf(g);
  if(heightCm==null || !(w>0 && d>0)) return null;
  const clampedHeight = h>0 ? Math.min(heightCm, h) : heightCm;
  return Math.round(w*d*clampedHeight/1000*10)/10;
}

function recomputeLastMaint(genId){
  const g = findGen(genId);
  if(!g) return;
  const recs = DB.maint.filter(m=>m.genId===genId);
  if(recs.length===0) return;
  const maxHours = Math.max(...recs.map(r=>r.hours||0));
  g.lastMaintHours = maxHours;
  if((g.hours||0) < maxHours) g.hours = maxHours;
  g.hoursKnown = true;
  const atMax = recs.filter(r=>(r.hours||0)===maxHours).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(atMax.length>0 && atMax[0].date) g.lastMaintDate = atMax[0].date;
}

function csvEscape(v){
  const s = (v==null?'':String(v));
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadCsv(filename, rows){
  const csv = '\uFEFF'+rows.map(row=>row.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function handleRestoreFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{
      parsed = JSON.parse(e.target.result);
    }catch(err){
      showInfoModal('백업 파일을 읽을 수 없습니다. 올바른 백업(.json) 파일인지 확인해주세요.');
      input.value = '';
      return;
    }
    if(!parsed || parsed.backupType!=='gen-fleet-full-backup' || !parsed.data){
      showInfoModal('이 파일은 이 앱의 백업 파일 형식이 아닙니다.');
      input.value = '';
      return;
    }
    const d = parsed.data;
    const dateInfo = parsed.backupDate ? ` (백업일: ${parsed.backupDate})` : '';
    openConfirmModal(`백업 파일${dateInfo}을 복원할까요?\n\n현재 저장되어 있는 모든 데이터(발전기 목록, 임대·정비 이력, 예약, 자재정보, 부품재고)가 이 백업 내용으로 완전히 대체됩니다. 되돌릴 수 없으니 신중하게 진행해주세요.`, async function(){
      DB.gens = d.gens || [];
      DB.rentals = d.rentals || [];
      DB.maint = d.maint || [];
      DB.reservations = d.reservations || [];
      DB.materials = d.materials || {};
      DB.technicians = d.technicians || ['','',''];
      DB.warnThreshold = d.warnThreshold || 50;
      DB.partsStock = d.partsStock || {};
      DB.partsSpecs = d.partsSpecs || {};
      DB.partsSupplier = d.partsSupplier || {};
      DB.partsMinStock = d.partsMinStock || {};
      DB.partsPurchaseLog = d.partsPurchaseLog || [];
      DB.consumableOrders = d.consumableOrders || [];
      DB.improvements = d.improvements || [];
      DB.orderMarks = d.orderMarks || {};
      await saveGens();
      await saveRentals();
      await saveMaint();
      await saveReservations();
      await saveMaterials();
      await saveTechnicians();
      await saveWarnThreshold();
      await savePartsStock();
      await savePartsSpecs();
      await savePartsSupplier();
      await savePartsMinStock();
      await savePartsPurchaseLog();

      renderTabbar();
      renderContent();
      flash('백업이 복원되었습니다');
    }, '복원');
    input.value = '';
  };
  reader.readAsText(file);
}

function usageGraphSvg(maints){
  const sorted = [...maints].sort((a,b)=>(a.hours||0)-(b.hours||0));
  if(sorted.length<2) return `<div class="muted" style="font-size:12px;">정비 기록이 2건 이상일 때 사용 이력 그래프가 표시됩니다.</div>`;
  const intervals = [];
  for(let i=1;i<sorted.length;i++){
    intervals.push({label: sorted[i].date, val: Math.max(0,(sorted[i].hours||0)-(sorted[i-1].hours||0))});
  }
  const w = 640, barGap = 10, barW = Math.max(18, Math.min(48, Math.floor((w-20)/intervals.length)-barGap));
  const maxV = Math.max(...intervals.map(x=>x.val), 1);
  const chartH = 140;
  let x = 10;
  const bars = intervals.map(it=>{
    const h = Math.round((it.val/maxV)*chartH);
    const rect = `<rect x="${x}" y="${chartH-h+20}" width="${barW}" height="${h}" fill="#2C4A66" rx="3"></rect>`;
    const txt = `<text x="${x+barW/2}" y="${chartH+34}" font-size="10" fill="#6B6E76" text-anchor="middle">${it.label.slice(5)}</text>`;
    const vtxt = `<text x="${x+barW/2}" y="${chartH-h+14}" font-size="10" fill="#22242A" text-anchor="middle">${Math.round(it.val)}h</text>`;
    x += barW + barGap;
    return rect+txt+vtxt;
  }).join('');
  return `<svg viewBox="0 0 ${x+10} ${chartH+44}" style="width:100%;max-width:${w}px;height:auto;">${bars}</svg>`;
}

function deleteMaint(mid, genId){
  openConfirmModal('이 정비 이력을 삭제할까요? 삭제하면 되돌릴 수 없습니다. (차감된 부품 재고는 복원됩니다)', async function(){
    const rec = DB.maint.find(m=>m.id===mid);
    const stockLinkedContent = ['오일필터1교체','오일필터2교체','에어필터교체','연료필터1교체','연료필터2교체'];
    if(rec){
      let changed = false;
      if(rec.partsUsed){
        rec.partsUsed.forEach(p=>{
          if(typeof p==='object' && p.partName){
            DB.partsStock[p.partName] = (DB.partsStock[p.partName]||0) + (p.qty||1);
            changed = true;
          }
        });
      }
      if(rec.contentItems){
        rec.contentItems.forEach(c=>{
          if(stockLinkedContent.includes(c)){
            DB.partsStock[c] = (DB.partsStock[c]||0) + 1;
            changed = true;
          }
        });
      }
      if(changed) await savePartsStock();
    }
    DB.maint = DB.maint.filter(m=>m.id!==mid);
    recomputeLastMaint(genId);
    await saveMaint();
    await saveGens();
    renderGenHistory();
    flash('삭제되었습니다');
  }, '삭제');
}

function renderSettlementTab(){
  const cutoff = new Date(Date.now()-90*86400000);
  const utilList = activeGens().sort(sortByIdNatural).map(g=>{
    const gRentals = DB.rentals.filter(r=>r.genId===g.id && r.outDate && r.inDate);
    let daysOut = 0;
    gRentals.forEach(r=>{
      const outD = new Date(r.outDate+'T00:00:00');
      const inD = new Date(r.inDate+'T00:00:00');
      const s = outD>cutoff ? outD : cutoff;
      if(inD>s) daysOut += Math.round((inD-s)/86400000);
    });
    if(g.status==='out' && g.rental && g.rental.outDate){
      const outD = new Date(g.rental.outDate+'T00:00:00');
      const s = outD>cutoff ? outD : cutoff;
      const now = new Date();
      if(now>s) daysOut += Math.round((now-s)/86400000);
    }
    const rate = Math.max(0, Math.min(100, Math.round(daysOut/90*100)));
    return {g, rate, daysOut};
  }).sort((a,b)=>b.rate-a.rate);
  const utilRowHtml = x=>{
    const color = x.rate>=70? 'var(--ok)' : x.rate>=40? 'var(--warn)' : 'var(--danger)';
    return `<tr><td class="gid">${x.g.id}</td><td class="wrap-ok">${displayModel(x.g)}</td><td class="muted">${x.daysOut}일</td><td><div class="gauge-wrap"><div class="gauge"><div class="gauge-fill" style="width:${x.rate}%;background:${color};"></div></div><span class="gauge-txt" style="color:${color};">${x.rate}%</span></div></td></tr>`;
  };
  const utilHalf = Math.ceil(utilList.length/2);
  const utilRows1 = utilList.slice(0, utilHalf).map(utilRowHtml).join('');
  const utilRows2 = utilList.slice(utilHalf).map(utilRowHtml).join('');

  const byCustomer = {};
  DB.rentals.forEach(r=>{
    const key = r.customer || '미상';
    if(!byCustomer[key]) byCustomer[key] = {count:0};
    byCustomer[key].count++;

  const overuseList = overuseRentalsList();
  const overuseRows = overuseList.map(r=>{
    const g = findGen(r.genId);
    const avg = rentalAvgDaily(r);
    const days = rentalDays(r);
    return `<tr>
      <td class="gid">${r.genId}</td>
      <td class="wrap-ok">${g? displayModel(g) : '-'}</td>
      <td class="wrap-ok">${escR(r.customer||'-')}</td>
      <td class="muted" style="font-size:12px;">${dow(r.outDate)||'-'} ~ ${dow(r.inDate)||'-'}</td>
      <td class="muted">${(r.usedHours||0).toLocaleString()}h / ${days}일</td>
      <td><span style="color:var(--danger);font-weight:800;">${avg.toFixed(1)}h/일</span></td>
    </tr>`;
  }).join('');

  return `
    <div class="section-title">거래처별 임대 건수</div>
    ${Object.keys(byCustomer).length===0? `<div class="empty">데이터가 없습니다.</div>` : `
    <div class="table-scroll"><table>
      <thead><tr><th>거래처</th><th>임대 건수</th></tr></thead>
      <tbody>${customerRows}</tbody>
    </table></div>`}

    <div class="section-title" style="color:${overuseList.length>0?'var(--danger)':''};">🚨 일일 과다사용 이력 (하루 ${OVERUSE_DAILY_LIMIT}시간 초과) <span class="cnt" style="${overuseList.length>0?'background:var(--danger-tint);color:var(--danger);border-color:var(--danger);':''}">${overuseList.length}건</span></div>
    <p class="muted" style="font-size:13px;margin-top:-4px;">임대기간 동안 하루 평균 ${OVERUSE_DAILY_LIMIT}시간을 초과해서 사용된 건입니다. (출고시 누적시간과 입고시 누적시간의 차이 ÷ 사용일수로 계산) 과다사용이 잦으면 정비 주기가 앞당겨질 수 있으니 확인해주세요.</p>
    ${overuseList.length===0? `<div class="empty">과다사용 이력이 없습니다.</div>` : `
    <div class="table-scroll"><table>
      <thead><tr><th>번호</th><th>모델</th><th>거래처</th><th>기간</th><th>총사용/일수</th><th>일평균 사용</th></tr></thead>
      <tbody>${overuseRows}</tbody>
    </table></div>`}

    <div class="section-title">발전기별 가동률 (최근 90일)</div>
    <p class="muted" style="font-size:13px;margin-top:-4px;">최근 90일 중 출고(임대)되어 있던 일수 비율입니다. 낮은 순으로 확인하면 놀고 있는 장비를 파악할 수 있습니다.</p>

function normalizeUrl(u){
  const s = (u||'').trim();
  if(!s) return '';
  if(/^https?:\/\//i.test(s)) return s;
  return `https://${s}`;
}

  wrap.innerHTML = list.map(item=>{

    <p class="muted" style="font-size:13px;margin-top:-4px;">이 시스템에서 고쳤으면 하는 점, 불편한 점, 버그 등을 자유롭게 남겨주세요. 작성자 이름이 함께 기록되고, 나중에 수정한 사람이 "개선완료"로 표시할 수 있습니다.</p>
    <div class="field" style="max-width:100%;margin-top:6px;">

        <textarea id="f-imp-content" placeholder="예: 출고 화면에서 ○○ 항목이 자꾸 초기화돼요" style="flex:1;min-width:220px;min-height:60px;"></textarea>

  `;
}
function renderImprovementsList(){
  const wrap = document.getElementById('improvements-wrap');
  if(!wrap) return;
  const list = [...(DB.improvements||[])].sort((a,b)=>{
    const aOpen = !a.completedBy, bOpen = !b.completedBy;
    if(aOpen!==bOpen) return aOpen? -1:1;
    return (b.createdDate||'').localeCompare(a.createdDate||'');
  });
  if(list.length===0){ wrap.innerHTML = `<div class="empty">등록된 보완요청이 없습니다.</div>`; return; }
  wrap.innerHTML = list.map(item=>{
    const done = !!item.completedBy;
    return `<div class="material-card" style="${done? 'opacity:.72;':''}">
      <div class="m-title" style="align-items:flex-start;">
        <span class="muted" style="font-size:11.5px;">✍ ${escR(item.authorBy||'이름미상')} · ${dow(item.createdDate)||'-'}</span>
        <div class="btn-row" style="flex-wrap:nowrap;">
          ${done
            ? `<button type="button" class="btn sm" style="white-space:nowrap;" onclick="unmarkImprovementDone('${item.id}')" title="다시 미해결로 되돌리려면 클릭">완료취소</button>`
            : `<button type="button" class="btn sm primary" style="white-space:nowrap;" onclick="markImprovementDone('${item.id}')">개선완료로 표시</button>`}
          <button type="button" class="btn sm danger" onclick="removeImprovement('${item.id}')">삭제</button>
        </div>
      </div>
      <div style="font-size:13.5px;white-space:pre-wrap;line-height:1.5;">${escR(item.content)}</div>
      ${done? `<div style="margin-top:8px;"><span class="pill ok">✅ 개선완료</span> <span class="muted" style="font-size:11.5px;">${escR(item.completedBy)} · ${dow(item.completedDate)}</span></div>` : ''}
    </div>`;
  }).join('');
}
async function addImprovement(){
  const ta = document.getElementById('f-imp-content');
  const content = ta.value.trim();
  if(!content){ flash('내용을 입력해주세요'); return; }
  DB.improvements = [...(DB.improvements||[]), {
    id: uid(), content, authorBy: DB.currentUserName||'이름미상', createdDate: todayStr(),
    completedBy: null, completedDate: null
  }];
  await saveImprovements();
  ta.value = '';
  renderImprovementsList();
  flash('보완요청이 등록되었습니다');
}
async function markImprovementDone(id){
  const item = (DB.improvements||[]).find(x=>x.id===id);
  if(!item) return;
  item.completedBy = DB.currentUserName || '이름미상';
  item.completedDate = todayStr();
  await saveImprovements();
  renderImprovementsList();
  flash('개선완료로 표시되었습니다');
}
async function unmarkImprovementDone(id){
  const item = (DB.improvements||[]).find(x=>x.id===id);
  if(!item) return;
  item.completedBy = null;
  item.completedDate = null;
  await saveImprovements();
  renderImprovementsList();
  flash('완료 표시가 취소되었습니다');
}
function removeImprovement(id){
  openConfirmModal('이 보완요청을 삭제할까요?', async function(){
    DB.improvements = (DB.improvements||[]).filter(x=>x.id!==id);
    await saveImprovements();
    closeModal();
    renderImprovementsList();
    flash('삭제되었습니다');
  }, '삭제');
}

async function updateWarnThreshold(value){
  const v = Number(value);
  if(isNaN(v) || v<=0) return;
  DB.warnThreshold = v;
  await saveWarnThreshold();
  renderContent();
  flash('저장되었습니다');
}
function retireGen(id, reason){
  const g = findGen(id);
  if(!g) return;
  const label = reason || '폐기';
  if(g.status==='out'){ showInfoModal(`출고중인 발전기는 먼저 입고 처리 후 ${label} 처리해주세요.`); return; }
  openRetireDetailModal(id, label);
}
function openRetireDetailModal(id, label){
  const g = findGen(id);
  if(!g) return;
  const isDisposal = label==='폐기';
  const fieldsHtml = isDisposal ? `
      <div class="field"><label>폐기일자</label><input type="date" id="f-ret-schedule" value="${todayStr()}"></div>
      <div class="field"><label>폐기업체명</label><input type="text" id="f-ret-company" placeholder="예: 00고철상사"></div>
      <div class="field"><label>전화번호</label><input type="text" id="f-ret-phone" placeholder="예: 010-1234-5678"></div>
      <div class="field"><label>처리방법</label><input type="text" id="f-ret-method" placeholder="예: 고철업체 매각, 부품 재활용 후 폐차"></div>
      <div class="field"><label>폐기사유</label><textarea id="f-ret-reason" placeholder="예: 엔진 노후화로 수리비 과다"></textarea></div>
      <div class="field"><label>폐차수익(원)</label><input type="number" id="f-ret-revenue" min="0" placeholder="예: 500000"></div>

      <div class="field"><label>구매자 업체명</label><input type="text" id="f-ret-buyercompany" placeholder="예: 00중고기계"></div>
      <div class="field"><label>연락처</label><input type="text" id="f-ret-buyerphone" placeholder="예: 010-1234-5678"></div>
      <div class="field"><label>주소</label><input type="text" id="f-ret-buyeraddress" placeholder="예: 경기 화성시 ..."></div>
      <div class="field"><label>매각가격(원)</label><input type="number" id="f-ret-saleamount" min="0" placeholder="예: 3000000"></div>
    `;
  document.getElementById('modal-root').innerHTML = `
  <div class="overlay" onclick="backdropClick(this,event,closeModal)">
    <div class="modal">
      <h3>${label} 처리</h3>
      <div class="modal-sub">${g.id} · ${displayModel(g)}</div>
      ${fieldsHtml}
      <div id="f-err" class="err" style="display:none;"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">취소</button>
        <button class="btn primary" onclick="submitRetireDetail('${g.id}','${label}')">${label} 처리</button>
      </div>
    </div>
  </div>`;
}
async function submitRetireDetail(id, label){
  const g = findGen(id);
  if(!g) return;
  const isDisposal = label==='폐기';
  g.retired = true;
  g.retiredReason = label;
  if(isDisposal){
    g.disposalSchedule = document.getElementById('f-ret-schedule').value || todayStr();
    g.disposalCompany = document.getElementById('f-ret-company').value.trim();
    g.disposalPhone = document.getElementById('f-ret-phone').value.trim();
    g.disposalMethod = document.getElementById('f-ret-method').value.trim();
    g.disposalReason = document.getElementById('f-ret-reason').value.trim();
    g.disposalRevenue = Number(document.getElementById('f-ret-revenue').value)||null;
    g.retiredDate = g.disposalSchedule;
    g.buyerName = null; g.buyerCompany = null; g.buyerPhone = null; g.buyerAddress = null; g.saleAmount = null;
  } else {
    g.buyerName = document.getElementById('f-ret-buyername').value.trim();
    g.buyerCompany = document.getElementById('f-ret-buyercompany').value.trim();
    g.buyerPhone = document.getElementById('f-ret-buyerphone').value.trim();
    g.buyerAddress = document.getElementById('f-ret-buyeraddress').value.trim();
    g.saleAmount = Number(document.getElementById('f-ret-saleamount').value)||null;
    g.retiredDate = todayStr();
    g.disposalSchedule = null; g.disposalCompany = null; g.disposalPhone = null; g.disposalMethod = null; g.disposalReason = null; g.disposalRevenue = null;
  }
  await saveGens();
  closeModal();
  renderContent();
  flash(`${label} 처리되었습니다`);
}

  ] : [

let voltageGuidePendingDataUrl = null;
function previewVoltageGuidePhoto(){
  const input = document.getElementById('f-vg-photo');
  const file = input && input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width*scale);
      canvas.height = Math.round(img.height*scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      voltageGuidePendingDataUrl = canvas.toDataURL('image/jpeg', 0.72);
      const previewWrap = document.getElementById('f-vg-preview-wrap');
      const preview = document.getElementById('f-vg-preview');
      if(preview) preview.src = voltageGuidePendingDataUrl;
      if(previewWrap) previewWrap.style.display = 'block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
async function submitVoltageGuide(model, kind){
  const note = document.getElementById('f-vg-note').value.trim();
  const existing = (DB.materials[model] && DB.materials[model][`voltageGuidePhoto_${kind}`]) || null;
  const photo = voltageGuidePendingDataUrl || existing;
  const errEl = document.getElementById('f-err');
  if(!photo){ errEl.textContent = '사진을 선택해주세요.'; errEl.style.display='block'; return; }
  if(!DB.materials[model]) DB.materials[model] = {};
  DB.materials[model][`voltageGuidePhoto_${kind}`] = photo;
  DB.materials[model][`voltageGuideNote_${kind}`] = note;
  voltageGuidePendingDataUrl = null;
  await saveMaterials();
  closeModal();
  renderContent();
  flash('전압 설정 방법이 저장되었습니다');
}

const UNASSIGNED_SUPPLIER = '공급업체 미지정';
function neededOrderParts(){
  const names = allKnownPartNames().sort((a,b)=>a.localeCompare(b,'ko'));
  return names.map(n=>{
    const stock = DB.partsStock[n]!==undefined ? DB.partsStock[n] : 0;
    const minQty = (DB.partsMinStock && DB.partsMinStock[n]) || 0;
    if(!minQty || stock>minQty) return null;
    const orderQty = Math.max(minQty - stock, 1);
    const spec = (DB.partsSpecs && DB.partsSpecs[n]) || '';
    const supplier = (DB.partsSupplier && DB.partsSupplier[n]) || UNASSIGNED_SUPPLIER;
    const mark = (DB.orderMarks && DB.orderMarks[n]) || null;
    return {name:n, stock, minQty, orderQty, spec, supplier, mark};
  }).filter(Boolean);
}
function groupBySupplier(needed){
  const groups = {};
  needed.forEach(p=>{
    if(!groups[p.supplier]) groups[p.supplier] = [];
    groups[p.supplier].push(p);
  });
  return groups;
}
function openPartsOrderListModal(){
  const needed = neededOrderParts();
  const groups = groupBySupplier(needed);
  const supplierNames = Object.keys(groups).sort((a,b)=>{
    if(a===UNASSIGNED_SUPPLIER) return 1;
    if(b===UNASSIGNED_SUPPLIER) return -1;
    return a.localeCompare(b,'ko');
  });
  const dateLabel = dow(todayStr());
  const pendingCount = needed.filter(p=>!p.mark).length;
  let text;
  if(needed.length===0){
    text = `[부품 발주 리스트] ${dateLabel}\n\n최소재고 미달인 부품이 없습니다.`;
  } else {
    const blocks = supplierNames.map(sup=>{
      const lines = groups[sup].map(p=>`- ${p.name}${p.spec? ` [${p.spec}]`:''} : 현재고 ${p.stock} / 최소재고 ${p.minQty} → 발주 ${p.orderQty}개${p.mark? ` (구매완료 ${dow(p.mark.date)}${p.mark.by? ` · ${p.mark.by}`:''})`:''}`);
      return `■ ${sup}\n${lines.join('\n')}`;

  const dateOf = r => r.pendingLoad ? (r.loadDate||r.outDate) : r.plannedOutDate;
  const delayedCount = list.filter(r=>dateOf(r) && daysFromToday(dateOf(r))<0).length;
  const pendingCount = list.filter(r=>r.pendingLoad).length;
  const rows = list.map(r=>{
    const g = findGen(r.genId);

    const isDelayed = d && daysFromToday(d)<0;
    const fuelForList = r.fuelActual!=null ? r.fuelActual : r.fuelRequested;
    const voltageChanged = g && g.voltage && r.voltage && g.voltage!==r.voltage;

function cancelReservation(id){
  const r = DB.reservations.find(x=>x.id===id);
  const isPending = r && r.pendingLoad;
  const msg = isPending ? '이 출고(상차대기)를 취소할까요? 취소하면 발전기는 다시 입고 상태로 남습니다.' : '이 출고 대기를 취소할까요?';
  openConfirmModal(msg, async function(){
    DB.reservations = DB.reservations.filter(r=>r.id!==id);
    await saveReservations();
    renderContent();
    flash('취소되었습니다');
  }, isPending ? '입고로 되돌리기' : '예약 취소');
}
function processReservation(resId){
  const r = DB.reservations.find(x=>x.id===resId);
  if(!r) return;
  const g = findGen(r.genId);
  if(!g){ showInfoModal('해당 발전기를 찾을 수 없습니다.'); return; }
  if(g.status==='out'){ showInfoModal('입고 처리가 완료되지 않은 발전기입니다. 먼저 입고 처리를 완료한 뒤 출고해주세요.'); return; }
  if(g.underRepair){ showInfoModal('고장 수리 중인 발전기입니다. 수리 완료 처리 후 출고할 수 있습니다.'); return; }
  openOutModal(r.genId, resId);
}
function confirmLoadPrompt(resId){
  openConfirmModal('제품 상차를 완료하시겠습니까?', function(){ confirmLoad(resId); }, '예', '아니오');
}
async function confirmLoad(resId){
  const r = DB.reservations.find(x=>x.id===resId);
  if(!r){ return; }
  const g = findGen(r.genId);
  if(!g){ showInfoModal('해당 발전기를 찾을 수 없습니다.'); return; }
  if(g.status==='out'){
    showInfoModal('이미 출고된 발전기입니다.');
    DB.reservations = DB.reservations.filter(x=>x.id!==resId);
    await saveReservations();
    renderContent();
    return;
  }
  if(g.underRepair){
    showInfoModal('고장 수리 중인 발전기라 상차완료 처리할 수 없습니다. 수리 완료 처리 후 다시 시도해주세요.');
    return;
  }
  g.status = 'out';
  g.hours = r.startHours;
  g.rental = {
    customer: r.customer, manager: r.manager, phone: r.phone, site: r.site, address: r.address,
    supplies: r.supplies, voltage: r.voltage, qty: r.qty, fuelRequested: r.fuelRequested, fuelActual: r.fuelActual,
    usageDays: r.usageDays, loadDate: r.loadDate, arriveTime: r.arriveTime, freightBearer: r.freightBearer, paymentConfirmed: r.paymentConfirmed||false, forcedOut: r.forcedOut||false, forceReason: r.forceReason||'', forcedBy: r.forcedBy||null, note: r.note,
    outDate: r.outDate, startHours: r.startHours, longTerm: r.longTerm, estDaily: r.estDaily,
    outProcessedBy: r.outProcessedBy || null, loadConfirmedBy: DB.currentUserName || null
  };
  DB.reservations = DB.reservations.filter(x=>x.id!==resId);
  await saveGens();
  await saveReservations();
  renderContent();
  flash('상차 확인 완료 - 출고되었습니다');
  printReceipt(g.id);
}

function syncUsageDaysToReturnDate(){
  const outEl = document.getElementById('f-outdate');
  const daysEl = document.getElementById('f-usagedays');
  const retEl = document.getElementById('f-returndate');
  if(!outEl || !daysEl || !retEl) return;
  const days = Number(daysEl.value);
  if(!outEl.value || !days || days<=0){ retEl.value = ''; return; }
  const d = new Date(outEl.value+'T00:00:00');
  d.setDate(d.getDate()+days);
  retEl.value = toLocalDateStr(d);
}
function syncReturnDateToUsageDays(){
  const outEl = document.getElementById('f-outdate');
  const daysEl = document.getElementById('f-usagedays');
  const retEl = document.getElementById('f-returndate');
  if(!outEl || !daysEl || !retEl) return;
  if(!outEl.value || !retEl.value) return;
  const start = new Date(outEl.value+'T00:00:00');
  const end = new Date(retEl.value+'T00:00:00');
  const days = Math.round((end-start)/86400000);
  if(days>0) daysEl.value = days;
}

function knownCustomerRecords(){
  const map = {};
  const consider = (rec)=>{
    if(!rec || !rec.customer) return;
    const key = rec.customer.trim();
    if(!key) return;
    const dateKey = rec.outDate || rec.plannedOutDate || rec.createdAt || '';
    if(!map[key] || (dateKey && dateKey > (map[key].outDate||''))){
      map[key] = {customer: key, manager: rec.manager||'', phone: rec.phone||'', address: rec.address||'', site: rec.site||'', outDate: dateKey};
    }
  };
  DB.rentals.forEach(consider);
  DB.reservations.forEach(consider);
  DB.gens.forEach(g=>{ if(g.rental) consider(g.rental); });
  return Object.values(map).sort((a,b)=>a.customer.localeCompare(b.customer,'ko'));
}
function onCustomerNameInput(){
  const el = document.getElementById('f-site');
  if(!el) return;
  const val = el.value.trim();
  if(!val) return;
  const records = knownCustomerRecords();
  const match = records.find(r=>r.customer===val);
  if(!match) return;
  const managerEl = document.getElementById('f-manager');
  const phoneEl = document.getElementById('f-phone');

  if(managerEl && !managerEl.value) managerEl.value = match.manager;
  if(phoneEl && !phoneEl.value) phoneEl.value = match.phone;
  if(addressEl && !addressEl.value) addressEl.value = match.address || match.site;

function syncOieUsageDaysToReturnDate(){
  const outEl = document.getElementById('f-oie-outdate');
  const daysEl = document.getElementById('f-oie-usagedays');
  const retEl = document.getElementById('f-oie-returndate');
  if(!outEl || !daysEl || !retEl) return;
  const days = Number(daysEl.value);
  if(!outEl.value || !days || days<=0){ retEl.value = ''; return; }
  const d = new Date(outEl.value+'T00:00:00');
  d.setDate(d.getDate()+days);
  retEl.value = toLocalDateStr(d);
}
function syncOieReturnDateToUsageDays(){
  const outEl = document.getElementById('f-oie-outdate');
  const daysEl = document.getElementById('f-oie-usagedays');
  const retEl = document.getElementById('f-oie-returndate');
  if(!outEl || !daysEl || !retEl) return;
  if(!outEl.value || !retEl.value) return;
  const start = new Date(outEl.value+'T00:00:00');
  const end = new Date(retEl.value+'T00:00:00');
  const days = Math.round((end-start)/86400000);
  if(days>0) daysEl.value = days;
}
async function submitOutInfoEdit(id){
  const g = findGen(id);
  if(!g || !g.rental) return;
  const errEl = document.getElementById('f-err');

  if(!site){ errEl.textContent='거래처명을 입력해주세요.'; errEl.style.display='block'; return; }
  const startHours = Number(document.getElementById('f-oie-starthours').value);
  const usageDays = Number(document.getElementById('f-oie-usagedays').value)||null;
  g.rental = {
    ...g.rental,
    customer: site,
    site,
    manager: document.getElementById('f-oie-manager').value.trim(),
    phone: document.getElementById('f-oie-phone').value.trim(),
    address: document.getElementById('f-oie-address').value.trim(),
    voltage: document.getElementById('f-oie-voltage').value.trim(),
    qty: Number(document.getElementById('f-oie-qty').value)||1,
    supplies: document.getElementById('f-oie-supplies').value.trim(),
    fuelRequested: Number(document.getElementById('f-oie-fuel-req').value)||null,
    fuelActual: Number(document.getElementById('f-oie-fuel-actual').value)||null,
    usageDays,
    outDate: document.getElementById('f-oie-outdate').value || todayStr(),
    loadDate: document.getElementById('f-oie-loaddate').value || null,
    arriveTime: document.getElementById('f-oie-arrivetime').value.trim() || null,
    freightBearer: document.getElementById('f-oie-freight').value,
    note: document.getElementById('f-oie-note').value.trim(),
    startHours: isNaN(startHours) ? (g.rental.startHours||0) : startHours
  };
  if(document.getElementById('f-oie-voltage').value.trim()) g.voltage = document.getElementById('f-oie-voltage').value.trim();
  if(!isNaN(startHours)) g.hours = startHours;
  closeModal();
  renderContent();
  flash('출고 정보가 저장되었습니다');
  saveWithRetry(saveGens);
}

function syncBulkUsageDaysToReturnDate(){
  const outEl = document.getElementById('fb-outdate');
  const daysEl = document.getElementById('fb-usagedays');
  const retEl = document.getElementById('fb-returndate');
  if(!outEl.value || !daysEl.value || Number(daysEl.value)<=0){ retEl.value=''; return; }
  const d = new Date(outEl.value+'T00:00:00');
  d.setDate(d.getDate()+Number(daysEl.value));
  retEl.value = toLocalDateStr(d);
}
function syncBulkReturnDateToUsageDays(){
  const outEl = document.getElementById('fb-outdate');
  const daysEl = document.getElementById('fb-usagedays');
  const retEl = document.getElementById('fb-returndate');
  if(!outEl.value || !retEl.value) return;
  const start = new Date(outEl.value+'T00:00:00');
  const end = new Date(retEl.value+'T00:00:00');
  const days = Math.round((end-start)/86400000);
  if(days>0) daysEl.value = days;
}

async function submitBulkOut(){
  const ids = [...bulkOutSelection];
  const errEl = document.getElementById('fb-err');
  if(ids.length===0){ closeModal(); return; }
  const customer = document.getElementById('fb-site').value.trim();
  const site = customer;
  const manager = document.getElementById('fb-manager').value.trim();
  const phone = document.getElementById('fb-phone').value.trim();
  const address = document.getElementById('fb-address').value.trim();
  const supplies = document.getElementById('fb-supplies').value.trim();
  const voltage = document.getElementById('fb-voltage').value.trim();
  const fuelRequested = Number(document.getElementById('fb-fuel-req').value)||null;
  const fuelActual = Number(document.getElementById('fb-fuel-actual').value)|| fuelRequested || null;
  const usageDays = Number(document.getElementById('fb-usagedays').value)||null;
  const loadDate = document.getElementById('fb-loaddate').value || null;
  const arriveTime = document.getElementById('fb-arrivetime').value || null;
  const freightBearer = document.getElementById('fb-freight').value;
  const paymentConfirmed = document.getElementById('fb-payment-confirmed').checked;
  const forcedOut = !paymentConfirmed && document.getElementById('fb-force-out').checked;
  const forceReason = forcedOut ? document.getElementById('fb-force-reason').value.trim() : '';
  const note = document.getElementById('fb-note').value.trim();
  const outDate = document.getElementById('fb-outdate').value;
  const longTerm = document.getElementById('fb-longterm').checked;
  const estDaily = longTerm ? Number(document.getElementById('fb-estdaily').value||0) : null;
  if(!customer || !address || !manager || !phone){
    errEl.textContent = '거래처명, 현장 주소, 담당자, 연락처를 모두 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(!paymentConfirmed && !forcedOut){
    errEl.textContent = '입금 확인 체크를 하거나, 급한 경우 "강제출고"를 체크하고 사유를 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(forcedOut && !forceReason){
    errEl.textContent = '강제출고 사유를 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(!outDate){
    errEl.textContent = '도착일을 확인해주세요.';
    errEl.style.display='block'; return;
  }
  if(longTerm && (!estDaily || estDaily<=0)){
    errEl.textContent = '장기 임대는 예상 일일 사용시간을 입력해주세요.';
    errEl.style.display='block'; return;
  }
  // 발전기별 누적 사용시간 검증
  const hoursMap = {};
  for(const id of ids){
    const g = findGen(id);
    if(!g) continue;
    const el = document.getElementById(`fb-hours-${id}`);
    const v = el ? Number(el.value) : NaN;
    if(isNaN(v) || v < (g.hours||0)){
      errEl.textContent = `${id}의 누적 사용시간을 확인해주세요. (현재 누적시간 ${(g.hours||0).toLocaleString()}h보다 작을 수 없습니다)`;
      errEl.style.display='block'; return;
    }
    hoursMap[id] = v;
  }
  const skipped = [];
  ids.forEach(id=>{
    const g = findGen(id);
    if(!g || g.status!=='in' || g.underRepair || DB.reservations.some(r=>r.genId===id)){ skipped.push(id); return; }
    DB.reservations.push({
      id: uid(), genId: id, pendingLoad: true,
      customer, manager, phone, site, address, supplies, voltage, qty:1,
      fuelRequested, fuelActual, usageDays, loadDate, arriveTime, freightBearer, paymentConfirmed, forcedOut, forceReason, forcedBy: forcedOut ? (DB.currentUserName||null) : null, note,

    });
  });
  await saveReservations();
  bulkOutSelection.clear();
  closeModal();
  currentTab = 'reserve';
  renderTabbar();
  renderContent();
  const doneCount = ids.length - skipped.length;
  flash(skipped.length>0
    ? `${doneCount}대는 출고 대기에 등록되었고, ${skipped.length}대는 상태 변경으로 제외되었습니다.`

}

async function submitBulkIn(){
  const ids = [...bulkInSelection];
  const errEl = document.getElementById('fbi-err');
  if(ids.length===0){ closeModal(); return; }
  const inDate = document.getElementById('fbi-indate').value;
  if(!inDate){
    errEl.textContent = '입고일을 확인해주세요.';
    errEl.style.display='block'; return;
  }
  const gens = ids.map(findGen).filter(Boolean);
  const suppliesGens = gens.filter(g=>g.rental && g.rental.supplies);
  if(suppliesGens.length>0){
    const confirmedEl = document.getElementById('fbi-supplies-confirmed');
    if(!confirmedEl || !confirmedEl.checked){
      errEl.textContent = '부자재가 있는 발전기가 있습니다. 회수 확인 체크를 해주세요.';
      errEl.style.display='block'; return;
    }
  }
  // 발전기별 누적 사용시간 검증
  const hoursMap = {};
  for(const g of gens){
    const el = document.getElementById(`fbi-hours-${g.id}`);
    const v = el ? Number(el.value) : NaN;
    if(isNaN(v) || v < (g.rental.startHours||0)){
      errEl.textContent = `${g.id}의 누적 사용시간을 확인해주세요. (출고시 누적시간 ${(g.rental.startHours||0).toLocaleString()}h보다 작을 수 없습니다)`;
      errEl.style.display='block'; return;
    }
    hoursMap[g.id] = v;
  }
  gens.forEach(g=>{
    const rt = g.rental;
    const endHours = hoursMap[g.id];
    DB.rentals.push({
      id: uid(), genId: g.id, customer: rt.customer, manager: rt.manager, phone: rt.phone,
      site: rt.site, address: rt.address, supplies: rt.supplies, suppliesRecovered: !!rt.supplies, suppliesNote: '', fuelRequested: rt.fuelRequested, fuelActual: rt.fuelActual, usageDays: rt.usageDays, loadDate: rt.loadDate, arriveTime: rt.arriveTime, freightBearer: rt.freightBearer, note: rt.note,

      measuredFuelHeightCm: null, remainingFuelLiters: null,

    });

    g.rental = null;
  });
  await Promise.all([saveGens(), saveRentals()]);
  bulkInSelection.clear();
  closeModal();

  flash(`${gens.length}대가 입고 처리되었습니다`);
}

function readAndCompressImageToDataUrl(file, maxW, quality){
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const scale = Math.min(1, (maxW||900)/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width*scale));
        canvas.height = Math.max(1, Math.round(img.height*scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality||0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  try{
