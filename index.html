function parseRentalRow(r, rowNum){
  const genId = String(r['발전기번호']||'').trim();
  let model = String(r['모델명']||'').trim();
  const capacityRaw = r['용량(kW)'];
  const capacity = (capacityRaw!==''&&capacityRaw!=null&&!isNaN(Number(capacityRaw))) ? Number(capacityRaw) : null;
  if(capacity && !/kw/i.test(model)) model = model? `${model} ${capacity}kW` : `${capacity}kW`;
  const customer = String(r['거래처명']||'').trim();
  const manager = String(r['담당자']||'').trim();
  const phone = String(r['연락처']||'').trim();
  const address = String(r['현장주소']||'').trim();
  const voltage = String(r['전압']||'').trim();
  const qtyRaw = r['수량'];
  const qty = (qtyRaw!==''&&qtyRaw!=null&&!isNaN(Number(qtyRaw))) ? Number(qtyRaw) : 1;
  const supplies = String(r['부자재']||'').trim();
  const fuelReqRaw = r['연료요청(L)'];
  const fuelRequested = (fuelReqRaw!==''&&fuelReqRaw!=null&&!isNaN(Number(fuelReqRaw))) ? Number(fuelReqRaw) : null;
  const fuelActRaw = r['연료실제(L)'];
  const fuelActual = (fuelActRaw!==''&&fuelActRaw!=null&&!isNaN(Number(fuelActRaw))) ? Number(fuelActRaw) : fuelRequested;
  const usageDaysRaw = r['사용일수'];
  const usageDays = (usageDaysRaw!==''&&usageDaysRaw!=null&&!isNaN(Number(usageDaysRaw))) ? Number(usageDaysRaw) : null;
  const loadDate = excelDateToStr(r['상차일']) || null;
  const arriveTime = String(r['도착시간']||'').trim() || null;
  const freightBearer = String(r['운임부담']||'').trim()==='고객부담' ? '고객부담' : '우리부담';
  const paymentConfirmed = excelBoolYN(r['입금확인']);
  const forcedOut = excelBoolYN(r['강제출고']);
  const forceReason = String(r['강제출고사유']||'').trim();
  const note = String(r['비고']||'').trim();
  const outDateRaw = r['출고일'];
  const inDateRaw = r['입고일'];
  const outDate = excelDateToStr(outDateRaw);
  const inDate = excelDateToStr(inDateRaw);
  const startHoursRaw = r['출고시누적시간(h)'];
  const startHours = (startHoursRaw!==''&&startHoursRaw!=null) ? Number(startHoursRaw) : NaN;
  const endHoursRaw = r['입고시누적시간(h)'];
  const endHours = (endHoursRaw!==''&&endHoursRaw!=null&&!isNaN(Number(endHoursRaw))) ? Number(endHoursRaw) : null;
  const suppliesRecoveredRaw = r['부자재회수'];
  const suppliesRecovered = suppliesRecoveredRaw==='' ? true : excelBoolYN(suppliesRecoveredRaw);
  const suppliesNote = String(r['부자재미회수비고']||'').trim();

  const reasons = [];
  if(!genId) reasons.push('발전기번호 없음');
  if(!customer) reasons.push('거래처명 없음');
  if(outDateRaw && !outDate) reasons.push('출고일 형식을 못 읽음 (YYYY-MM-DD)');
  if(!outDateRaw) reasons.push('출고일 없음');
  if(startHoursRaw==='' || startHoursRaw==null) reasons.push('출고시누적시간(h) 없음');
  else if(isNaN(startHours)) reasons.push('출고시누적시간(h)이 숫자가 아님');
  if(inDateRaw && !inDate) reasons.push('입고일 형식을 못 읽음 (YYYY-MM-DD)');
  if(endHoursRaw!=='' && endHoursRaw!=null && isNaN(Number(endHoursRaw))) reasons.push('입고시누적시간(h)이 숫자가 아님');
  if(endHours!=null && !isNaN(startHours) && endHours < startHours) reasons.push('입고시누적시간이 출고시누적시간보다 작음');
  if((inDate && endHours==null) || (!inDate && endHours!=null)) reasons.push('입고일과 입고시누적시간(h)은 둘 다 채우거나 둘 다 비워야 함');
  if(forcedOut && !paymentConfirmed && !forceReason) reasons.push('강제출고인데 강제출고사유가 없음');

  if(reasons.length>0) return {ok:false, kind:'rental', rowNum, label: genId||'(번호 없음)', reasons};
  const completed = !!(inDate && endHours!=null);
  return {ok:true, kind:'rental', rowNum, genId, model, customer, manager, phone, address, voltage, qty,
    supplies, fuelRequested, fuelActual, usageDays, loadDate, arriveTime, freightBearer, paymentConfirmed,
    forcedOut, forceReason, note, outDate, inDate, startHours, endHours, suppliesRecovered, suppliesNote, completed};
}

// ---- 정비이력 ----
function parsePartsUsedText(s){
  return String(s||'').split(',').map(x=>x.trim()).filter(Boolean).map(entry=>{
    const [name, qtyStr] = entry.split(':').map(x=>(x||'').trim());
    const qty = Number(qtyStr);
    return {partName: name, qty: (qtyStr && !isNaN(qty)) ? qty : 1};
  }).filter(p=>p.partName);
}
function parseMaintRow(r, rowNum){
  const genId = String(r['발전기번호']||'').trim();
  const dateRaw = r['정비일자'];
  const date = excelDateToStr(dateRaw);
  const hoursRaw = r['정비시누적시간(h)'];
  const hours = (hoursRaw!==''&&hoursRaw!=null) ? Number(hoursRaw) : NaN;
  let type = String(r['정비유형']||'').trim();
  if(!['정기정비','고장수리','기타'].includes(type)) type = type || '기타';
  const content = String(r['정비내용']||'').trim();
  const partsUsed = parsePartsUsedText(r['사용부품']);
  const technician = String(r['정비사']||'').trim();
  const note = String(r['비고']||'').trim();

  const reasons = [];
  if(!genId) reasons.push('발전기번호 없음');
  if(dateRaw && !date) reasons.push('정비일자 형식을 못 읽음 (YYYY-MM-DD)');
  if(!dateRaw) reasons.push('정비일자 없음');
  if(hoursRaw==='' || hoursRaw==null) reasons.push('정비시누적시간(h) 없음');
  else if(isNaN(hours)) reasons.push('정비시누적시간(h)이 숫자가 아님');

  if(reasons.length>0) return {ok:false, kind:'maint', rowNum, label: genId||'(번호 없음)', reasons};
  return {ok:true, kind:'maint', rowNum, genId, date, hours, type, content, partsUsed, technician, note};
}

// ---- 자재목록 / 부자재목록 ----
function parsePartRow(r, rowNum){
  const name = String(r['부품명']||'').trim();
  if(!name) return {ok:false, kind:'part', rowNum, label:'(부품명 없음)', reasons:['부품명 없음']};
  const spec = String(r['규격']||'').trim();
  const unit = String(r['단위']||'').trim();
  const category = String(r['카테고리']||'').trim();
  const supplier = String(r['공급처']||'').trim();
  const stockRaw = r['현재재고'];
  const stock = (stockRaw!==''&&stockRaw!=null&&!isNaN(Number(stockRaw))) ? Number(stockRaw) : null;
  const minRaw = r['최소재고'];
  const minStock = (minRaw!==''&&minRaw!=null&&!isNaN(Number(minRaw))) ? Number(minRaw) : null;
  return {ok:true, kind:'part', rowNum, name, spec, unit, category, supplier, stock, minStock};
}
function parseSupplyRow(r, rowNum){
  const name = String(r['부자재명']||'').trim();
  if(!name) return {ok:false, kind:'supply', rowNum, label:'(부자재명 없음)', reasons:['부자재명 없음']};
  const spec = String(r['규격']||'').trim();
  const category = String(r['카테고리']||'').trim();
  const stockRaw = r['현재재고'];
  const stock = (stockRaw!==''&&stockRaw!=null&&!isNaN(Number(stockRaw))) ? Number(stockRaw) : null;
  return {ok:true, kind:'supply', rowNum, name, spec, category, stock};
}
function parseNameRow(r, rowNum, colName, kind){
  const name = String(r[colName]||'').trim();
  if(!name) return {ok:false, kind, rowNum, label:'(이름 없음)', reasons:['이름 없음']};
  return {ok:true, kind, rowNum, name};
}

async function handleExcelImportFile(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!isAdminModeUnlocked()){
    showInfoModal('관리자 모드가 잠겨있습니다. 먼저 관리자 모드를 열어주세요.');
    event.target.value = '';
    return;
  }
  if(file.size > 8*1024*1024){
    showInfoModal('파일이 너무 큽니다 (8MB 이하만 가능). 양식 그대로 쓰셨는지 확인해주세요.');
    event.target.value = '';
    return;
  }
  if(typeof XLSX === 'undefined'){
    showInfoModal('엑셀 처리 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침 해주세요.');
    event.target.value = '';
    return;
  }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    if(!wb.SheetNames || wb.SheetNames.length===0){
      showInfoModal('엑셀 파일 안에 시트를 찾지 못했습니다.');
      event.target.value = '';
      return;
    }
    const rentalRows = sheetRowsOf(wb, '임대이력').map(x=>parseRentalRow(x.r, x.rowNum));
    const maintRows = sheetRowsOf(wb, '정비이력').map(x=>parseMaintRow(x.r, x.rowNum));
    const partRows = sheetRowsOf(wb, '자재목록').map(x=>parsePartRow(x.r, x.rowNum));
    const supplyRows = sheetRowsOf(wb, '부자재목록').map(x=>parseSupplyRow(x.r, x.rowNum));
    const techRows = sheetRowsOf(wb, '정비사명단').map(x=>parseNameRow(x.r, x.rowNum, '이름', 'tech'));
    const userRows = sheetRowsOf(wb, '사용자명단').map(x=>parseNameRow(x.r, x.rowNum, '이름', 'user'));

    const allParsed = [...rentalRows, ...maintRows, ...partRows, ...supplyRows, ...techRows, ...userRows];
    const valid = allParsed.filter(p=>p.ok);
    const invalid = allParsed.filter(p=>!p.ok);
    if(allParsed.length===0){
      showInfoModal('시트에서 채워진 행을 하나도 찾지 못했습니다. 양식 그대로 쓰셨는지, 시트 이름이 [임대이력]/[정비이력]/[자재목록]/[부자재목록]/[정비사명단]/[사용자명단]과 같은지 확인해주세요.');
      event.target.value = '';
      return;
    }
    if(valid.length===0){
      const sample = invalid.slice(0,8).map(p=>`${p.kind} ${p.rowNum}행 (${p.label}): ${p.reasons.join(', ')}`).join('\n');
      showInfoModal(`가져올 수 있는 행이 없습니다.\n\n${sample}${invalid.length>8? `\n외 ${invalid.length-8}건 더`:''}`);
      event.target.value = '';
      return;
    }
    showExcelImportPreview({
      rentals: valid.filter(p=>p.kind==='rental'),
      maint: valid.filter(p=>p.kind==='maint'),
      parts: valid.filter(p=>p.kind==='part'),
      supplies: valid.filter(p=>p.kind==='supply'),
      techs: valid.filter(p=>p.kind==='tech'),
      users: valid.filter(p=>p.kind==='user'),
    }, invalid);
  }catch(err){
    showInfoModal('엑셀 파일을 읽는 중 오류가 발생했습니다: ' + (err&&err.message?err.message:err) + '\n\n파일이 손상되지 않았는지, .xlsx 형식이 맞는지 확인해주세요.');
  }
  event.target.value = '';
}
function showExcelImportPreview(data, invalidRows){
  pendingExcelImport = data;
  const rows = data.rentals;
  const seenGenIds = new Set();
  let newGenCount = 0, completedCount = 0, ongoingCount = 0;
  const ongoingGenIds = new Set();
  const dupOngoing = new Set();
  rows.forEach(row=>{
    if(!findGen(row.genId) && !seenGenIds.has(row.genId)){ newGenCount++; }
    seenGenIds.add(row.genId);
    if(row.completed){ completedCount++; }
    else {
      if(ongoingGenIds.has(row.genId)) dupOngoing.add(row.genId);
      ongoingGenIds.add(row.genId);
      ongoingCount++;
    }
  });
  data.maint.forEach(row=>{ if(!findGen(row.genId) && !seenGenIds.has(row.genId)){ newGenCount++; seenGenIds.add(row.genId); } });
  const alreadyOutConflict = [...ongoingGenIds].filter(id=>{ const g=findGen(id); return g && g.status==='out'; });
  const maintUnknownGen = data.maint.filter(row=>!findGen(row.genId) && !rows.some(r=>r.genId===row.genId));
  const techOverflow = Math.max(0, data.techs.length - 3);

  const invalidHtml = (invalidRows && invalidRows.length>0) ? `
    <div class="hint" style="color:var(--warn);font-weight:700;margin-top:10px;">⚠️ 건너뛴 행 ${invalidRows.length}개</div>
    <div class="detail-card" style="padding:8px 12px;max-height:140px;overflow-y:auto;font-size:12px;">
      ${invalidRows.slice(0,20).map(p=>`<div>[${escR(p.kind)}] ${p.rowNum}행 (${escR(p.label)}): ${escR(p.reasons.join(', '))}</div>`).join('')}
      ${invalidRows.length>20? `<div class="muted">외 ${invalidRows.length-20}건 더</div>`:''}
    </div>` : '';
  const warnHtml = [
    dupOngoing.size>0? `<div class="hint" style="color:var(--danger);">같은 발전기번호가 "임대중"으로 [임대이력]에 여러 번 있습니다 (${[...dupOngoing].join(', ')}) — 마지막 줄 내용으로만 등록됩니다.</div>`:'',
    alreadyOutConflict.length>0? `<div class="hint" style="color:var(--danger);">이미 [출고중]인 발전기가 "임대중" 건에 포함되어 있습니다 (${alreadyOutConflict.join(', ')}) — 기존 출고 정보를 새 내용으로 덮어씁니다.</div>`:'',
    maintUnknownGen.length>0? `<div class="hint" style="color:var(--warn);">[정비이력]에 [임대이력]/기존 목록에는 없는 발전기번호가 있습니다 (${[...new Set(maintUnknownGen.map(r=>r.genId))].join(', ')}) — 새 발전기로 자동 등록 후 정비이력만 추가됩니다.</div>`:'',
    techOverflow>0? `<div class="hint" style="color:var(--warn);">[정비사명단]이 ${data.techs.length}명인데 앱에는 3명까지만 등록 가능해서 앞 3명만 반영됩니다.</div>`:''
  ].filter(Boolean).join('');
  document.getElementById('modal-root').innerHTML = `
  <div class="overlay" onclick="backdropClick(this,event,cancelExcelImport)">
    <div class="modal">
      <h3>엑셀 가져오기 확인</h3>
      <div class="modal-sub">시트별로 가져올 내용을 확인해주세요.</div>
      <div class="detail-card" style="padding:12px 14px;margin-bottom:10px;">
        <div class="k">새로 등록될 발전기</div><div class="v">${newGenCount}대</div>
        <div class="k">임대이력 - 완료 (이력 조회에 추가)</div><div class="v">${completedCount}건</div>
        <div class="k">임대이력 - 임대중 (출고중에 추가)</div><div class="v">${ongoingCount}건</div>
        <div class="k">정비이력</div><div class="v">${data.maint.length}건</div>
        <div class="k">자재목록</div><div class="v">${data.parts.length}종</div>
        <div class="k">부자재목록</div><div class="v">${data.supplies.length}종</div>
        <div class="k">정비사명단</div><div class="v">${data.techs.length}명${techOverflow>0? ` (3명만 반영)`:''}</div>
        <div class="k">사용자명단</div><div class="v">${data.users.length}명</div>
      </div>
      ${warnHtml}
      ${invalidHtml}
      <div class="modal-actions">
        <button class="btn" onclick="cancelExcelImport()">취소</button>
        <button class="btn primary" onclick="commitExcelImport()">가져오기 실행</button>
      </div>
    </div>
  </div>`;
}
function cancelExcelImport(){
  pendingExcelImport = null;
  closeModal();
}
async function commitExcelImport(){
  if(!isAdminModeUnlocked()){
    showInfoModal('관리자 모드 시간이 만료되었습니다. 다시 열고 처음부터 진행해주세요.');
    pendingExcelImport = null;
    closeModal();
    return;
  }
  const data = pendingExcelImport;
  if(!data){ closeModal(); return; }
  let newGens=0, completedCount=0, ongoingCount=0, maintCount=0, partCount=0, supplyCount=0, techCount=0, userCount=0;
  try{
    // 1. 임대이력
    for(const row of data.rentals){
      let g = findGen(row.genId);
      if(!g){
        g = {id: row.genId, model: row.model||'', manufactureDate:'', voltage: row.voltage||'', hours:0, lastMaintHours:0, hoursKnown:true, status:'in', rental:null};
        DB.gens.push(g);
        newGens++;
      }
      if(row.completed){
        DB.rentals.push({
          id: uid(), genId: g.id, customer: row.customer, manager: row.manager, phone: row.phone,
          site: row.customer, address: row.address, supplies: row.supplies, suppliesItems: [], suppliesCustom: '',
          suppliesRecovered: row.suppliesRecovered, suppliesNote: row.suppliesNote, fuelRequested: row.fuelRequested, fuelActual: row.fuelActual,
          usageDays: row.usageDays, loadDate: row.loadDate || row.outDate, arriveTime: row.arriveTime, freightBearer: row.freightBearer, note: row.note,
          outDate: row.outDate, inDate: row.inDate, startHours: row.startHours, endHours: row.endHours,
          usedHours: row.endHours - row.startHours, longTerm: false, estDaily: null,
          voltage: row.voltage || g.voltage || '', outProcessedBy: null, loadConfirmedBy: null,
          inProcessedBy: DB.currentUserName || null, inProcessedAt: nowDateTimeStr(),
          measuredFuelHeightCm: null, remainingFuelLiters: null,
          paymentConfirmed: row.paymentConfirmed, forcedOut: row.forcedOut, forceReason: row.forceReason, forcedBy: row.forcedOut ? (DB.currentUserName||null) : null, importedFromExcel: true
        });
        if((g.hours||0) < row.endHours){ g.hours = row.endHours; }
        g.hoursKnown = true;
        completedCount++;
      } else {
        g.status = 'out';
        g.hours = row.startHours;
        g.hoursKnown = true;
        if(row.voltage) g.voltage = row.voltage;
        g.rental = {
          customer: row.customer, manager: row.manager, phone: row.phone, site: row.customer, address: row.address,
          supplies: row.supplies, suppliesItems: [], suppliesCustom: '', voltage: row.voltage||'', qty: row.qty||1,
          fuelRequested: row.fuelRequested, fuelActual: row.fuelActual, usageDays: row.usageDays, loadDate: row.loadDate || row.outDate, arriveTime: row.arriveTime,
          freightBearer: row.freightBearer, paymentConfirmed: row.paymentConfirmed, forcedOut: row.forcedOut, forceReason: row.forceReason, forcedBy: row.forcedOut ? (DB.currentUserName||null) : null, note: row.note,
          outDate: row.outDate, startHours: row.startHours, longTerm: false, estDaily: null,
          outProcessedBy: null, loadConfirmedBy: DB.currentUserName || null
        };
        ongoingCount++;
      }
    }
    // 2. 정비이력
    for(const row of data.maint){
      let g = findGen(row.genId);
      if(!g){
        g = {id: row.genId, model: '', manufactureDate:'', voltage:'', hours: row.hours||0, lastMaintHours:0, hoursKnown:true, status:'in', rental:null};
        DB.gens.push(g);
        newGens++;
      }
      DB.maint.push({
        id: uid(), genId: g.id, model: g.model||'', date: row.date, hours: row.hours,
        content: row.content, contentItems: [], contentEtc: row.content, technician: row.technician,
        partsUsed: row.partsUsed, type: row.type, photos: [], importedFromExcel: true
      });
      maintCount++;
    }
    // 3. 자재목록
    for(const row of data.parts){
      DB.partsStock = DB.partsStock || {};
      DB.partsSpecs = DB.partsSpecs || {};
      DB.partsUnit = DB.partsUnit || {};
      DB.partsCategory = DB.partsCategory || {};
      DB.partsSupplier = DB.partsSupplier || {};
      DB.partsMinStock = DB.partsMinStock || {};
      if(row.stock!=null) DB.partsStock[row.name] = row.stock;
      else if(DB.partsStock[row.name]===undefined) DB.partsStock[row.name] = 0;
      if(row.spec) DB.partsSpecs[row.name] = row.spec;
      if(row.unit) DB.partsUnit[row.name] = row.unit;
      if(row.category) DB.partsCategory[row.name] = row.category;
      if(row.supplier) DB.partsSupplier[row.name] = row.supplier;
      if(row.minStock!=null) DB.partsMinStock[row.name] = row.minStock;
      partCount++;
    }
    // 4. 부자재목록
    for(const row of data.supplies){
      DB.suppliesCatalog = DB.suppliesCatalog || [];
      DB.suppliesStock = DB.suppliesStock || {};
      DB.suppliesSizes = DB.suppliesSizes || {};
      DB.suppliesCategories = DB.suppliesCategories || {};
      if(!DB.suppliesCatalog.includes(row.name)) DB.suppliesCatalog.push(row.name);
      if(row.stock!=null) DB.suppliesStock[row.name] = row.stock;
      else if(DB.suppliesStock[row.name]===undefined) DB.suppliesStock[row.name] = 0;
      if(row.spec) DB.suppliesSizes[row.name] = row.spec;
      if(row.category) DB.suppliesCategories[row.name] = row.category;
      supplyCount++;
    }
    // 5. 정비사명단 (최대 3명)
    data.techs.slice(0,3).forEach((row, i)=>{
      DB.technicians[i] = row.name;
      techCount++;
    });
    // 6. 사용자명단
    DB.teamMembers = DB.teamMembers || [];
    for(const row of data.users){
      if(!DB.teamMembers.includes(row.name)){ DB.teamMembers.push(row.name); userCount++; }
    }
    await saveGens();
    await saveRentals();
    if(data.maint.length>0) await saveWithRetry(saveMaint);
    if(data.parts.length>0){
      await saveWithRetry(savePartsStock);
      await saveWithRetry(savePartsSpecs);
      await saveWithRetry(async()=>{ await storageSetChecked('gen-parts-unit-v1', JSON.stringify(DB.partsUnit), true); });
      await saveWithRetry(savePartsCategory);
      await saveWithRetry(savePartsSupplier);
      await saveWithRetry(savePartsMinStock);
    }
    if(data.supplies.length>0){
      await saveWithRetry(saveSuppliesCatalog);
      await saveWithRetry(saveSuppliesStock);
      await saveWithRetry(saveSuppliesSizes);
      await saveWithRetry(saveSuppliesCategories);
    }
    if(data.techs.length>0) await saveWithRetry(saveTechnicians);
    if(data.users.length>0) await saveWithRetry(saveTeamMembers);
    pendingExcelImport = null;
    closeModal();
    renderContent();
    flash(`엑셀 가져오기 완료 — 새 발전기 ${newGens}대, 임대이력 ${completedCount+ongoingCount}건, 정비이력 ${maintCount}건, 자재 ${partCount}종, 부자재 ${supplyCount}종, 정비사 ${techCount}명, 사용자 ${userCount}명 추가`);
  }catch(err){
    showInfoModal('가져오기 중 오류가 발생해 일부만 저장됐을 수 있습니다: ' + (err&&err.message?err.message:err) + '\n\n[설정 → 전체 데이터 백업]에서 백업을 받아 상태를 확인해주세요.');
  }
}
initPasswordGate();

</script>
</body>
</html>
