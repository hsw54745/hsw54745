<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해성발전기 · 입출고 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F1EA;
    --surface:#FFFFFF;
    --surface-2:#FAF8F3;
    --border:#E1DCD0;
    --border-strong:#CFC8B8;
    --ink:#22242A;
    --ink-soft:#6B6E76;
    --ink-faint:#9A9C9F;
    --primary:#2C4A66;
    --primary-dark:#1B3247;
    --primary-tint:#E4ECF2;
    --ok:#2F7D4F;
    --ok-tint:#E4F1E8;
    --warn:#C97A1E;
    --warn-tint:#FBEDDB;
    --danger:#C23B3B;
    --danger-tint:#FBE6E6;
    --radius:10px;
    --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    --display:'Rajdhani','Noto Sans KR',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;padding-bottom:60px;}
  header{background:var(--primary-dark);color:#fff;padding:22px 20px 18px;}
  .brand-row{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:16px;flex-shrink:0;}
  .brand-name{font-size:13px;color:#B9C6D2;letter-spacing:.02em;}
  h1{font-family:var(--display);font-weight:700;font-size:24px;margin:6px 0 2px;letter-spacing:.01em;}
  .sub{font-size:13px;color:#9FB0BE;}
  nav{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;box-shadow:0 1px 0 rgba(0,0,0,.02);}
  nav button{flex:1;min-width:80px;border:none;background:transparent;padding:13px 6px;font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
  nav button.active{color:var(--primary-dark);border-bottom-color:var(--primary);font-weight:700;background:var(--surface-2);}
  main{max-width:1500px;width:100%;margin:0 auto;padding:18px 24px 40px;box-sizing:border-box;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:18px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;}
  .card .num{font-family:var(--mono);font-weight:700;font-size:26px;line-height:1;}
  .card .lbl{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .card.ok .num{color:var(--ok);} .card.warn .num{color:var(--warn);} .card.danger .num{color:var(--danger);}
  .section-title{font-size:18px;font-weight:800;margin:26px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .section-title .cnt{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:13px;}
  .table-scroll{overflow-x:auto;}
  .table-scroll table{min-width:880px;}
  .table-scroll td, .table-scroll th{white-space:nowrap;}
  .table-scroll td.wrap-ok{white-space:normal;}
  thead th{background:var(--surface-2);text-align:left;font-weight:700;color:var(--ink-soft);font-size:12px;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  .gid{font-family:var(--mono);font-weight:700;color:var(--primary-dark);white-space:nowrap!important;}
  .table-scroll td.gid{white-space:nowrap!important;}
  .muted{color:var(--ink-faint);}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .pill.ok{background:var(--ok-tint);color:var(--ok);}
  .pill.warn{background:var(--warn-tint);color:var(--warn);}
  .pill.danger{background:var(--danger-tint);color:var(--danger);}
  .pill.gray{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border);}
  button.pill{cursor:pointer;font-family:var(--sans);}
  .gauge-wrap{display:flex;align-items:center;gap:8px;min-width:150px;}
  .gauge{flex:1;height:8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;}
  .gauge-fill{height:100%;border-radius:5px 0 0 5px;}
  .gauge-txt{font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap;min-width:64px;text-align:right;}
  .btn{font-family:var(--sans);font-size:13px;font-weight:700;border:1px solid var(--border-strong);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;}
  .btn:hover{background:var(--surface-2);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn.primary:hover{background:var(--primary-dark);}
  .btn.danger{background:var(--danger-tint);border-color:var(--danger);color:var(--danger);}
  .btn.warn{background:var(--warn-tint);border-color:var(--warn);color:var(--warn);}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;}
  .empty{padding:34px 14px;text-align:center;color:var(--ink-faint);font-size:13px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius);}
  .overlay{position:fixed;inset:0;background:rgba(20,22,26,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{background:#fff;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 20px 24px;}
  @media(min-width:640px){.modal{border-radius:16px;}}
  .modal h3{font-family:var(--display);font-size:19px;margin:0 0 4px;}
  .modal .modal-sub{font-size:12px;color:var(--ink-soft);margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field-row{display:flex;gap:10px;margin-bottom:14px;}
  .field-row .field{margin-bottom:0;flex:1;min-width:0;}
  .field label{display:block;font-size:13.5px;font-weight:700;color:var(--primary);margin-bottom:5px;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border-strong);border-radius:8px;font-family:var(--sans);font-size:14px;background:#fff;color:var(--ink);}
  .field textarea{resize:vertical;min-height:60px;}
  input::placeholder,textarea::placeholder{color:var(--ink-faint)!important;font-weight:400!important;opacity:.8;}
  .field .hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}
  .field.chk{display:flex;align-items:center;gap:8px;}
  .field.chk input{width:16px;height:16px;}
  .field.chk label{margin:0;font-size:13px;font-weight:500;color:var(--ink);}
  .err{color:var(--danger);font-size:12px;margin-top:5px;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .modal-actions .btn{flex:1;text-align:center;}
  select#hist-select,select#hist-model-select{max-width:220px;}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .toolbar select{padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;font-family:var(--sans);font-size:13px;background:#fff;}
  .detail-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:12px;}
  .detail-head .gid-big{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--primary-dark);}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .detail-grid .item .k{font-size:11px;color:var(--ink-soft);}
  .detail-grid .item .v{font-family:var(--mono);font-weight:700;font-size:14px;margin-top:2px;}
  .settings-table input{width:100%;padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:13px;font-family:var(--sans);}
  .settings-table select{padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:13px;font-family:var(--sans);width:100%;}
  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);}
  .table-scroll{overflow-x:auto;}
  .save-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--primary-dark);color:#fff;padding:20px 36px;border-radius:16px;font-size:22px;font-weight:800;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.35);text-align:center;}
  .save-flash.show{opacity:1;}
  .util-two-col{display:flex;gap:16px;}
  .model-cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  @media(max-width:760px){.model-cards-grid{grid-template-columns:1fr;}}
  .util-two-col .table-scroll{flex:1;min-width:0;}
  .util-two-col .util-table{flex:1;min-width:0;overflow-x:visible;}
  .util-table table{width:100%;min-width:0;table-layout:fixed;}
  .util-table td, .util-table th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .util-table .gauge-wrap{min-width:0;gap:4px;}
  .util-table .gauge-txt{min-width:40px;font-size:14px;}
  .util-two-col .settings-table{flex:1;min-width:0;overflow-x:visible;}
  .util-two-col .settings-table table{width:100%;min-width:0;table-layout:auto;}
  .util-two-col .settings-table td, .util-two-col .settings-table th{white-space:normal;overflow:hidden;}
  .util-two-col .settings-table input, .util-two-col .settings-table select{min-width:0;}
  .model-settings-table table{table-layout:fixed;}
  .model-settings-table th, .model-settings-table td{padding:5px 6px;font-size:12.5px;}
  .model-settings-table td.gid{font-size:12.5px;}
  .model-settings-table input, .model-settings-table select{padding:4px 6px;font-size:12.5px;}
  .model-settings-table .btn.sm{padding:3px 7px;font-size:11px;}
  @media(max-width:760px){.util-two-col{flex-direction:column;}}
  .part-check{display:flex;align-items:center;gap:7px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--border);}
  .part-check:last-child{border-bottom:none;}
  .part-check input{width:15px;height:15px;flex-shrink:0;}
  .consumable-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
  .consumable-row input{flex:1;}
  .consumable-row input.qty{flex:0 0 60px;}
  .material-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
  .material-card .m-title{font-weight:700;font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .material-card .m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;font-size:12.5px;}
  .material-card .m-grid .k{color:var(--ink-soft);}
  .material-card .m-grid .v{font-family:var(--mono);font-weight:700;}
  .tag-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
  .tag{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:11px;}
  .prep-card{background:var(--warn-tint);border:1px solid var(--warn);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;}
  .prep-card .p-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;margin-bottom:6px;}
  .tech-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;max-width:520px;}

  /* 비밀번호 게이트 */
  #pw-gate{display:none;}
  #pw-gate.show{display:flex;position:fixed;inset:0;background:var(--primary-dark, #16324a);z-index:999;align-items:center;justify-content:center;padding:20px;}
  .pw-card{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.35);}
  .pw-title{font-size:19px;font-weight:800;margin-bottom:6px;text-align:center;}
  .pw-sub{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-bottom:18px;line-height:1.5;}
  .pw-input{width:100%;padding:11px 12px;border:1px solid var(--border-strong);border-radius:8px;font-size:15px;margin-bottom:10px;box-sizing:border-box;}
  .pw-err{color:var(--danger);font-size:12.5px;margin-top:-2px;margin-bottom:8px;}

  /* 사용설명서 */
  .manual-section{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:var(--surface);}
  .manual-section summary{cursor:pointer;padding:13px 16px;font-weight:800;font-size:14.5px;list-style:none;display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);}
  .manual-section summary::-webkit-details-marker{display:none;}
  .manual-section summary:after{content:'▾';font-size:12px;color:var(--ink-soft);transition:transform .15s;}
  .manual-section[open] summary:after{transform:rotate(180deg);}
  .manual-body{padding:4px 16px 14px;}
  .manual-body p{margin:0 0 10px;font-size:13px;color:var(--ink-soft);line-height:1.6;}
  .manual-btns{list-style:none;margin:0;padding:0;}
  .manual-btns li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--border);font-size:13px;line-height:1.5;}
  .manual-btns li:first-child{border-top:none;}
  .manual-btn-tag{flex-shrink:0;display:inline-block;background:var(--primary);color:#fff;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;margin-top:1px;}

  /* 인수증 미리보기 & 인쇄 */
  #receipt-overlay{display:none;}
  #receipt-overlay.show{display:block;position:fixed;inset:0;background:rgba(20,22,26,.6);z-index:300;overflow-y:auto;padding:20px 12px 40px;}
  .r-backdrop{min-height:100%;}
  .receipt-panel{background:#fff;max-width:720px;margin:0 auto;border-radius:12px;padding:18px;font-family:'Malgun Gothic','Noto Sans KR',sans-serif;color:#111;}
  .r-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .r-toolbar-title{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .print-msg{background:var(--warn-tint);border:1px solid var(--warn);color:#7a5314;font-size:12.5px;padding:10px 12px;border-radius:8px;margin-bottom:14px;}
  .r-copy{border:2px solid #222;border-radius:4px;padding:16px 18px;margin-bottom:12px;position:relative;overflow:hidden;}
  .r-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-size:52px;font-weight:900;letter-spacing:10px;color:rgba(120,120,120,0.07);white-space:nowrap;pointer-events:none;z-index:5;user-select:none;}
  .r-title{text-align:center;font-size:22px;font-weight:900;letter-spacing:4px;margin-bottom:12px;}
  .r-title .r-copy-tag{display:block;font-size:13px;font-weight:500;letter-spacing:2px;color:var(--ink-soft);margin-top:2px;}
  .r-row{display:flex;gap:16px;font-size:13px;margin-bottom:9px;}
  .r-top{justify-content:space-between;}
  .r-half{flex:1;} .r-full{flex:1;}
  .r-fill{display:inline-block;border-bottom:1px solid #999;min-width:130px;padding:0 4px;}
  .r-fill.wide{min-width:260px;}
  .r-table{width:100%;border-collapse:collapse;margin-bottom:9px;font-size:12.5px;}
  .r-table th,.r-table td{border:1px solid #333;padding:8px 6px;text-align:center;}
  .r-table th{background:#f0f0f0;}
  .r-confirm-text{font-size:16px;font-weight:800;border-top:1px dashed #999;padding-top:9px;margin-bottom:2px;}
  .r-sign-row{display:flex;justify-content:flex-end;padding-right:10%;margin-top:14px;margin-bottom:6px;}
  .r-sign-label{font-size:12.5px;}
  .r-footer{text-align:center;font-size:16px;font-weight:700;color:#333;margin-top:6px;}
  .r-notice{text-align:center;font-size:15px;color:#666;margin-top:3px;}
  .r-divider{position:relative;border-top:2px dashed #999;margin:14px 0;text-align:center;}
  .r-divider span{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#fff;padding:0 12px;font-size:13px;color:#888;letter-spacing:2px;}
  @media print{
    body > header, body > nav, body > main, body > #modal-root, body > #flash{display:none!important;}
    #receipt-overlay{position:static!important;background:#fff!important;padding:0!important;}
    .receipt-panel{max-width:170mm!important;border-radius:0!important;padding:0!important;margin:0 auto!important;}
    .no-print{display:none!important;}
    body{padding-bottom:0!important;}
    @page{size:A4 portrait;margin:16mm 14mm;}
  }
</style>
<!-- 인쇄시 브라우저 기본 머리글/바닥글(주소, 날짜, 페이지번호)을 원치 않으면
     인쇄 대화상자의 "추가 설정 > 머리글과 바닥글" 체크를 꺼주세요. -->

</head>
<body>

<div id="pw-gate"></div>

<header>
  <div class="brand-row">
    <div class="brand-mark">S</div>
    <div class="brand-name" id="brand-name-text">해성발전기</div>
    <span id="conn-status-badge" style="font-size:11px;margin-left:auto;"></span>
    <span id="last-saved-indicator" style="font-size:11px;color:rgba(255,255,255,.6);"></span>
    <button id="hard-refresh-btn" onclick="hardRefresh()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:700;">🔄 새로고침</button>
    <button id="save-all-btn" onclick="saveAllNow()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:700;">💾 전체 저장</button>
    <button id="user-badge" onclick="changeUserName()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;">이름 선택</button>
  </div>
  <div id="datetime-indicator" style="text-align:right;font-family:var(--mono);font-size:20px;font-weight:700;color:#FFD166;margin-top:6px;letter-spacing:.02em;"></div>
  <div style="text-align:right;font-size:12.5px;font-weight:700;color:#FFD166;margin-top:2px;">© 해성발전기 · 무단 복제 및 배포 금지 · 만든이: 홍승우</div>
  <h1 id="app-title-text">해성발전기 입출고 관리 시스템</h1>
  <div class="sub">입력한 내용은 인터넷을 통해 실시간으로 저장되어, 이 주소로 접속하는 모든 팀원 화면에 그대로 표시됩니다</div>
</header>

<nav id="tabbar"></nav>
<main id="content"><div class="loading">불러오는 중…</div></main>
<div id="modal-root"></div>
<div id="receipt-overlay"></div>
<div id="flash" class="save-flash"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// ===== Firebase 익명 로그인 (보안 규칙을 "로그인한 사용자만" 으로 걸기 위함) =====
// 사용자는 아무것도 입력하지 않아도 앱이 열리자마자 자동으로 조용히 로그인됩니다.
// 화면의 "🔒 접속 비밀번호"와는 별개입니다 — 그건 화면 잠금이고, 이건 데이터베이스 접근 권한입니다.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBFsyc9pVNruWNOinoiJt-OZlfTHK__aE8",
  authDomain: "haesung3732.firebaseapp.com",
  databaseURL: "https://haesung3732-default-rtdb.asia-southeast1.firebasedatabase.app"
};
let firebaseAuthReady = null;
if(typeof firebase === 'undefined'){
  firebaseAuthReady = Promise.resolve(false);
} else {
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    firebaseAuthReady = new Promise(function(resolve){
      let settled = false;
      firebase.auth().onAuthStateChanged(function(user){
        if(user && !settled){ settled = true; resolve(true); }
      });
      firebase.auth().signInAnonymously().catch(function(err){
        if(!settled){ settled = true; resolve(false); }
      });
      setTimeout(function(){ if(!settled){ settled = true; resolve(false); } }, 8000);
    });
  }catch(e){
    firebaseAuthReady = Promise.resolve(false);
  }
}
async function getAuthQuery(){
  try{
    await firebaseAuthReady;
    const user = firebase.auth().currentUser;
    if(!user) return '';
    const token = await user.getIdToken();
    return 'auth='+encodeURIComponent(token);
  }catch(e){ return ''; }
}

// ===== Firebase Realtime Database 연동 (Claude 아티팩트의 window.storage 대체) =====
// 이 앱은 원래 window.storage API로 데이터를 저장했으나, 이 파일을 클로드 밖에서
// 팀원들과 공유되는 독립 웹페이지로 쓰기 위해 Firebase Realtime Database로 교체했습니다.
const FIREBASE_DB_URL = 'https://haesung3732-default-rtdb.asia-southeast1.firebasedatabase.app';
function fbKey(key){ return encodeURIComponent(key); }
function updateConnStatus(offline){
  const el = document.getElementById('conn-status-badge');
  if(!el) return;
  if(offline){
    el.textContent = '🟡 로컬 임시저장 (인터넷 연결 안됨)';
    el.style.color = '#FFD166';
  } else {
    el.textContent = '🟢 온라인';
    el.style.color = 'rgba(255,255,255,.55)';
  }
}
window.storage = {
  async get(key, shared){
    const cacheKey = 'gen-cache-'+(shared?'s-':'p-')+key;
    const path = (shared ? 'shared/' : 'personal/') + fbKey(key);
    try{
      const authQ = await getAuthQuery();
      const res = await fetch(`${FIREBASE_DB_URL}/${path}.json${authQ? '?'+authQ:''}`);
      if(!res.ok) throw new Error('네트워크 오류');
      const data = await res.json();
      if(data === null) throw new Error('키 없음');
      try{ localStorage.setItem(cacheKey, JSON.stringify({v:data})); }catch(e2){}
      updateConnStatus(false);
      return {key, value: data, shared};
    }catch(e){
      try{
        const cached = localStorage.getItem(cacheKey);
        if(cached!==null){
          updateConnStatus(true);
          return {key, value: JSON.parse(cached).v, shared};
        }
      }catch(e2){}
      throw e;
    }
  },
  async set(key, value, shared){
    const cacheKey = 'gen-cache-'+(shared?'s-':'p-')+key;
    try{ localStorage.setItem(cacheKey, JSON.stringify({v:value})); }catch(e2){}
    const path = (shared ? 'shared/' : 'personal/') + fbKey(key);
    try{
      const authQ = await getAuthQuery();
      const res = await fetch(`${FIREBASE_DB_URL}/${path}.json${authQ? '?'+authQ:''}`, {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(value)
      });
      if(!res.ok) throw new Error('저장 실패');
      updateConnStatus(false);
      return {key, value, shared};
    }catch(e){
      updateConnStatus(true);
      return {key, value, shared, offline:true};
    }
  },
  async delete(key, shared){
    const cacheKey = 'gen-cache-'+(shared?'s-':'p-')+key;
    const path = (shared ? 'shared/' : 'personal/') + fbKey(key);
    try{
      const authQ = await getAuthQuery();
      const res = await fetch(`${FIREBASE_DB_URL}/${path}.json${authQ? '?'+authQ:''}`, {method:'DELETE'});
      localStorage.removeItem(cacheKey);
      if(!res.ok) throw new Error('삭제 실패');
      updateConnStatus(false);
      return {key, deleted:true, shared};
    }catch(e){ updateConnStatus(true); return null; }
  },
  async list(prefix, shared){
    const base = shared ? 'shared' : 'personal';
    try{
      const authQ = await getAuthQuery();
      const res = await fetch(`${FIREBASE_DB_URL}/${base}.json?shallow=true${authQ? '&'+authQ:''}`);
      if(!res.ok) throw new Error('목록 조회 실패');
      const data = await res.json();
      const keys = data ? Object.keys(data) : [];
      const filtered = (prefix ? keys.filter(k=>k.startsWith(fbKey(prefix))) : keys).map(k=>decodeURIComponent(k));
      return {keys: filtered, prefix, shared};
    }catch(e){ return {keys:[], prefix, shared}; }
  }
};

const PW_STORAGE_KEY = 'gen-app-password-v1';
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function getStoredPassword(){
  try{
    const r = await window.storage.get(PW_STORAGE_KEY, true);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}

async function submitPwLogin(){
  const p = document.getElementById('pw-login').value;
  const errEl = document.getElementById('pw-login-err');
  if(!p){ errEl.textContent='비밀번호를 입력해주세요.'; errEl.style.display='block'; return; }
  const stored = await getStoredPassword();
  if(!stored){
    // 그 사이 다른 사람이 비밀번호를 해제한 경우
    sessionStorage.setItem('gen-pw-unlocked','yes');
    pwGateHide(); init(); return;
  }
  const hash = await sha256Hex(p);
  if(hash===stored.hash){
    sessionStorage.setItem('gen-pw-unlocked','yes');
    pwGateHide();
    init();
  } else {
    errEl.textContent='비밀번호가 틀렸습니다.'; errEl.style.display='block';
    document.getElementById('pw-login').value='';
  }

async function getOrInit(key, defVal){
  try{
    const r = await window.storage.get(key, true);
    return r ? JSON.parse(r.value) : defVal;
  }catch(e){
    try{ await window.storage.set(key, JSON.stringify(defVal), true); }catch(e2){ /* 저장 실패해도 기본값은 반환 */ }
    return defVal;
  }
}
async function peekStorage(key, fallback){
  try{
    const r = await window.storage.get(key, true);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){
    return fallback;
  }
}
async function getOrInitPersonal(key, defVal){
  try{
    const r = await window.storage.get(key, false);
    return r ? JSON.parse(r.value) : defVal;
  }catch(e){
    return defVal;
  }
}
async function storageSetChecked(key, value, shared){
  beginSaving('저장중입니다…');
  try{
    const r = await window.storage.set(key, value, shared);
    if(!r) throw new Error('저장 실패(응답 없음): '+key);
    return r;
  } finally {
    endSaving();
  }
}
function updateDateTimeIndicator(){
  const el = document.getElementById('datetime-indicator');

  const now = new Date();
  const dateStr = now.toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric', weekday:'short'});
  const timeStr = now.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  el.textContent = `${dateStr} ${timeStr}`;
}

async function saveOneWithRetry(fn, retries){
  let lastErr = null;
  for(let i=0; i<=retries; i++){
    try{ await fn(); return {ok:true}; }
    catch(e){ lastErr = e; if(i<retries) await new Promise(r=>setTimeout(r, 500*(i+1))); }
  }
  return {ok:false, err: lastErr};
}
async function hardRefresh(){
  const btn = document.getElementById('hard-refresh-btn');
  if(btn){ btn.disabled = true; btn.textContent = '새로고침 중…'; }
  try{
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  const url = new URL(window.location.href);
  url.searchParams.set('_r', Date.now());
  window.location.href = url.toString();
}
async function saveWithRetry(fn, retries){
  saveInFlightCount++;
  try{
    const r = await saveOneWithRetry(fn, retries!=null?retries:3);
    if(r.ok){
      lastSavedAt = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
      updateLastSavedIndicator();
      return true;
    } else {
      showInfoModal('저장 중 오류가 발생했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.');
      return false;
    }
  } finally {
    saveInFlightCount = Math.max(0, saveInFlightCount-1);
  }
}

function hasHourData(g){
  if(g.status==='in') return !!g.hoursKnown;
  return !!(g.rental && g.rental.longTerm && g.rental.estDaily>0);
}

// 배경(overlay)을 마우스로 누른 채 안쪽 표를 옆으로 스크롤하다가 바깥에서 손을 떼도
// 창이 닫히지 않도록, 마우스를 누른 지점과 뗀 지점이 모두 배경 위일 때만 닫습니다.
let _lastMouseDownTarget = null;
document.addEventListener('mousedown', function(e){ _lastMouseDownTarget = e.target; }, true);
document.addEventListener('touchstart', function(e){ _lastMouseDownTarget = e.target; }, true);
function backdropClick(el, evt, closeFn){
  if(evt.target===el && _lastMouseDownTarget===el){ closeFn(); }
}
function flash(msg){
  const f = document.getElementById('flash');
  f.textContent = msg;
  f.style.fontSize = '';
  f.classList.add('show');
  clearTimeout(f._hideTimer);
  f._hideTimer = setTimeout(()=>f.classList.remove('show'), 2600);
}
function flashSaving(msg){
  // 저장이 끝날 때까지 계속 노출되며, flashSavingEnd()가 호출되기 전까지는 자동으로 사라지지 않습니다.
  const f = document.getElementById('flash');
  f.textContent = msg;
  f.style.fontSize = '';
  f.classList.add('show');
  clearTimeout(f._hideTimer);
}
function flashSavingEnd(){
  const f = document.getElementById('flash');
  clearTimeout(f._hideTimer);
  f.classList.remove('show');
}
// 어떤 저장이든(개별 항목 저장이든 "전체 저장"이든) 진행 중에는 "저장중입니다…" 메세지가
// 계속 떠 있다가, 진행 중인 저장이 모두 끝난 순간에만 사라지도록 depth 카운터로 관리합니다.
let _savingDepth = 0;
function beginSaving(msg){
  _savingDepth++;
  flashSaving(msg || '저장중입니다…');
}
function endSaving(){
  _savingDepth = Math.max(0, _savingDepth-1);
  if(_savingDepth===0) flashSavingEnd();
}

function elapsedHours(g){
  return Math.max(0, (g.hours||0) - (g.lastMaintHours||0));
}
function remainingHours(g){
  return getCycle(g) - elapsedHours(g);
}
function maintStatus(remaining){
  if(remaining<=0) return 'danger';
  if(remaining<=(DB.warnThreshold||50)) return 'warn';
  return 'ok';
}
function activeGens(){ return DB.gens.filter(g=>!g.retired); }
function estCurrentHours(g){
  if(g.status==='out' && g.rental && g.rental.longTerm && g.rental.estDaily>0 && g.rental.outDate){
    const days = Math.max(0,(Date.now() - new Date(g.rental.outDate+'T00:00:00').getTime())/86400000);
    return g.rental.startHours + days*g.rental.estDaily;
  }
  return g.hours||0;
}
function estElapsed(g){ return Math.max(0, estCurrentHours(g) - (g.lastMaintHours||0)); }
function estRemaining(g){ return getCycle(g) - estElapsed(g); }

function predictedDate(g){
  if(!(g.status==='out' && g.rental && g.rental.longTerm && g.rental.estDaily>0)) return null;
  const rem = estRemaining(g);
  if(rem<=0) return {overdue:true};
  const days = rem / g.rental.estDaily;
  const d = new Date(Date.now() + days*86400000);
  return {overdue:false, date: toLocalDateStr(d), days: Math.round(days)};
}

}
function daysFromToday(dateStr){

// 전화번호 입력칸에서 숫자만 입력해도 자동으로 하이픈(-)을 넣어줍니다.
// 서울(02) 지역번호는 2-3-4자리, 그 외(휴대폰 010 등, 지역번호)는 3-3-4 또는 3-4-4자리로 나눕니다.
function formatPhoneNumber(v){
  const num = (v||'').replace(/[^0-9]/g,'').slice(0,11);
  if(num.length < 4) return num;
  if(num.startsWith('02')){
    if(num.length <= 5) return num.slice(0,2)+'-'+num.slice(2);
    if(num.length <= 9) return num.slice(0,2)+'-'+num.slice(2,5)+'-'+num.slice(5);
    return num.slice(0,2)+'-'+num.slice(2,6)+'-'+num.slice(6,10);
  }
  if(num.length <= 6) return num.slice(0,3)+'-'+num.slice(3);
  if(num.length <= 10) return num.slice(0,3)+'-'+num.slice(3,6)+'-'+num.slice(6);
  return num.slice(0,3)+'-'+num.slice(3,7)+'-'+num.slice(7,11);
}
// 기존에 하이픈 없이(또는 다르게) 저장되어 있던 전화번호를 불러올 때 자동으로 정리합니다.
// (새로 입력하는 칸은 각 입력칸의 oninput에서 즉시 처리되고, 이 함수는 이미 저장돼 있던 옛날 데이터를 대상으로 합니다)
function migratePhoneFieldsInPlace(){
  const changed = {gens:false, rentals:false, reservations:false, companyInfo:false};
  (DB.gens||[]).forEach(g=>{
    if(g.rental && g.rental.phone){
      const f = formatPhoneNumber(g.rental.phone);
      if(f !== g.rental.phone){ g.rental.phone = f; changed.gens = true; }
    }
    if(g.disposalPhone){
      const f = formatPhoneNumber(g.disposalPhone);
      if(f !== g.disposalPhone){ g.disposalPhone = f; changed.gens = true; }
    }
    if(g.buyerPhone){
      const f = formatPhoneNumber(g.buyerPhone);
      if(f !== g.buyerPhone){ g.buyerPhone = f; changed.gens = true; }
    }
  });
  (DB.rentals||[]).forEach(r=>{
    if(r.phone){
      const f = formatPhoneNumber(r.phone);
      if(f !== r.phone){ r.phone = f; changed.rentals = true; }
    }
  });
  (DB.reservations||[]).forEach(r=>{
    if(r.phone){
      const f = formatPhoneNumber(r.phone);
      if(f !== r.phone){ r.phone = f; changed.reservations = true; }
    }
  });
  if(DB.companyInfo){
    if(DB.companyInfo.phone){
      const f = formatPhoneNumber(DB.companyInfo.phone);
      if(f !== DB.companyInfo.phone){ DB.companyInfo.phone = f; changed.companyInfo = true; }
    }
    if(DB.companyInfo.mobile){
      const f = formatPhoneNumber(DB.companyInfo.mobile);
      if(f !== DB.companyInfo.mobile){ DB.companyInfo.mobile = f; changed.companyInfo = true; }
    }
  }
  return changed;
}
async function persistPhoneMigration(changed){

  }catch(e){}
}
function dow(dateStr){
  if(!dateStr) return dateStr;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  const days=['일','월','화','수','목','금','토'];
  return `${dateStr}(${days[d.getDay()]})`;
}
function inDateLabel(dateStr){
  const diff = daysFromToday(dateStr);
  if(diff===0) return '오늘입고';
  if(diff===1) return '내일입고';
  if(diff===2) return '내일모레입고';
  if(diff<0) return `${dow(dateStr)} (지연)`;
  return dow(dateStr);
}
// 하루 최대 사용시간 기준 (이 시간을 초과해서 사용된 임대 건을 "과다사용"으로 표시합니다)
const OVERUSE_DAILY_LIMIT_DEFAULT = 10;
function overuseLimit(){ return (DB.overuseDailyLimit && DB.overuseDailyLimit>0) ? DB.overuseDailyLimit : OVERUSE_DAILY_LIMIT_DEFAULT; }
function rentalDays(r){
  if(!r || !r.outDate || !r.inDate) return null;
  const out = new Date(r.outDate+'T00:00:00');
  const inD = new Date(r.inDate+'T00:00:00');
  if(isNaN(out.getTime()) || isNaN(inD.getTime())) return null;
  const days = Math.round((inD-out)/86400000);
  return days>0 ? days : 1; // 당일 반납 등은 최소 1일로 계산
}
function rentalAvgDaily(r){
  const days = rentalDays(r);
  if(!days || r.usedHours==null) return null;
  return r.usedHours/days;
}
function isRentalOveruse(r){
  const avg = rentalAvgDaily(r);
  if(avg==null || avg<=overuseLimit()) return false;
  const historyCount = DB.rentals.filter(x=>x.genId===r.genId).length;
  return historyCount>=3;
}
function overuseRentalsList(){
  return DB.rentals.filter(isRentalOveruse).sort((a,b)=>rentalAvgDaily(b)-rentalAvgDaily(a));
}
function inDCountLabel(dateStr){

  if(diff<0) return `${dow(dateStr)} (지연)`;
  if(diff===0) return '오늘입고';
  return `입고${diff}일전`;
}

function inferConsumableKind(name, usedKinds){
  if(!name) return null;
  if(/오일필터/.test(name)) return !usedKinds.has('oilFilter1') ? 'oilFilter1' : (!usedKinds.has('oilFilter2') ? 'oilFilter2' : null);
  if(/연료필터/.test(name)) return !usedKinds.has('fuelFilter1') ? 'fuelFilter1' : (!usedKinds.has('fuelFilter2') ? 'fuelFilter2' : null);
  if(/에어필터/.test(name)) return !usedKinds.has('airFilter') ? 'airFilter' : null;
  if(!/필터/.test(name) && /오일/.test(name)) return !usedKinds.has('engineOil') ? 'engineOil' : null;
  return null;
}

  if(m.fuelFilter2Name){ parts.push({label:`연료필터2: ${m.fuelFilter2Name}${m.fuelFilter2Qty?` ×${m.fuelFilter2Qty}`:''}`, partName:m.fuelFilter2Name, qty:m.fuelFilter2Qty||1, kind:'fuelFilter2'}); usedKinds.add('fuelFilter2'); }

  if(m.fanBeltName) parts.push({label:`팬벨트: ${m.fanBeltName}${m.fanBeltQty?` ×${m.fanBeltQty}`:''}`, partName:m.fanBeltName, qty:m.fanBeltQty||1, kind:'fanBelt'});
  (m.consumables||[]).forEach(c=>{

  });

  const names = new Set();
  Object.values(DB.materials||{}).forEach(m=>{
    materialCandidatePartsFromMaterial(m).forEach(p=>names.add(p.partName));
  });
  Object.keys(DB.partsStock||{}).forEach(n=>names.add(n));
  return [...names].filter(Boolean);
}
function materialCandidatePartsFromMaterial(m){
  if(!m) return [];
  const parts = [];
  if(m.engineOilLiters) parts.push({partName:'엔진오일'});
  if(m.oilFilter1Name) parts.push({partName:m.oilFilter1Name});
  if(m.oilFilter2Name) parts.push({partName:m.oilFilter2Name});
  if(m.fuelFilterName) parts.push({partName:m.fuelFilterName});
  if(m.fuelFilter2Name) parts.push({partName:m.fuelFilter2Name});
  if(m.airFilterName) parts.push({partName:m.airFilterName});
  if(m.fanBeltName) parts.push({partName:m.fanBeltName});
  (m.consumables||[]).forEach(c=>{ if(c.name) parts.push({partName:c.name}); });
  return parts;
}

function captureFocusState(){
  try{
    const el = document.activeElement;
    if(!el || !el.id) return null;
    const state = {id: el.id, tag: el.tagName};
    if(typeof el.selectionStart === 'number'){
      try{ state.selStart = el.selectionStart; state.selEnd = el.selectionEnd; }catch(e){}
    }
    return state;
  }catch(e){ return null; }
}
function restoreFocusState(state){
  if(!state) return;
  try{
    const el = document.getElementById(state.id);
    if(!el) return;
    const active = document.activeElement;
    if(active && active.id === state.id) return;
    el.focus({preventScroll:true});
    if(typeof state.selStart === 'number' && typeof el.setSelectionRange === 'function'){
      try{ el.setSelectionRange(state.selStart, state.selEnd); }catch(e){}
    }
  }catch(e){}
}

function regionOf(address){
  if(!address) return '기타';
  const a = address;
  if(/서울/.test(a)) return '서울';
  if(/인천/.test(a)) return '인천';
  if(/대전/.test(a)) return '대전';
  if(/세종/.test(a)) return '세종';
  if(/대구/.test(a)) return '대구';
  if(/부산/.test(a)) return '부산';
  if(/울산/.test(a)) return '울산';
  if(/제주/.test(a)) return '제주';
  const gyeonggiNorth = ['고양','파주','의정부','동두천','양주','포천','연천','가평','남양주','구리','김포'];
  const gyeonggiSouth = ['수원','성남','용인','안양','부천','안산','평택','화성','시흥','군포','의왕','하남','오산','이천','안성','여주','과천','광명'];
  if(gyeonggiNorth.some(c=>a.includes(c))) return '경기북부';
  if(gyeonggiSouth.some(c=>a.includes(c))) return '경기남부';
  if(/경기/.test(a)) return '경기(기타)';
  if(/광주/.test(a)) return '광주';
  const chungnam = ['천안','아산','서산','당진','논산','공주','보령','계룡','금산','부여','서천','청양','홍성','예산','태안'];
  if(chungnam.some(c=>a.includes(c)) || /충남/.test(a)) return '충남';
  const chungbuk = ['청주','충주','제천','보은','옥천','영동','증평','진천','괴산','음성','단양'];
  if(chungbuk.some(c=>a.includes(c)) || /충북/.test(a)) return '충북';
  const gangwon = ['춘천','원주','강릉','동해','태백','속초','삼척','홍천','횡성','영월','평창','정선','철원','화천','양구','인제','고성','양양'];
  if(gangwon.some(c=>a.includes(c)) || /강원/.test(a)) return '강원';
  const gyeongbuk = ['포항','경주','김천','안동','구미','영주','영천','상주','문경','경산','군위','의성','청송','영양','영덕','청도','고령','성주','칠곡','예천','봉화','울진','울릉'];
  if(gyeongbuk.some(c=>a.includes(c)) || /경북/.test(a)) return '경북';
  const gyeongnam = ['창원','진주','통영','사천','김해','밀양','거제','양산','의령','함안','창녕','남해','하동','산청','함양','거창','합천'];
  if(gyeongnam.some(c=>a.includes(c)) || /경남/.test(a)) return '경남';
  const jeonbuk = ['전주','군산','익산','정읍','남원','김제','완주','진안','무주','장수','임실','순창','고창','부안'];
  if(jeonbuk.some(c=>a.includes(c)) || /전북/.test(a)) return '전북';
  const jeonnam = ['목포','여수','순천','나주','광양','담양','곡성','구례','고흥','보성','화순','장흥','강진','해남','영암','무안','함평','영광','장성','완도','진도','신안'];
  if(jeonnam.some(c=>a.includes(c)) || /전남/.test(a)) return '전남';
  return '기타';
}

function capacityOf(g){
  const m = (g.model||'').match(/(\d+(?:\.\d+)?)\s*kW/i);
  return m ? parseFloat(m[1]) : Infinity;
}
function capacityFromModelStr(model){
  const m = (model||'').match(/(\d+(?:\.\d+)?)\s*kW/i);
  return m ? parseFloat(m[1]) : Infinity;
}
function sortModelsByCapacity(models){
  return [...models].sort((a,b)=>{
    const ca = capacityFromModelStr(a), cb = capacityFromModelStr(b);
    if(ca!==cb) return ca-cb;
    return a.localeCompare(b,'ko');
  });
}
function usableCapacityHtml(g){
  const cap = capacityOf(g);
  const ratio = g.usageRatio && g.usageRatio>0 && g.usageRatio<100 ? g.usageRatio : 100;
  if(!isFinite(cap) || ratio>=100) return '';
  const usable = Math.round(cap*ratio/100*10)/10;
  return `<div class="muted" style="font-size:11px;">정격 대비 ${ratio}% 사용 (약 ${usable}kW)</div>`;
}
function usableCapacityCell(g){
  const cap = capacityOf(g);
  if(!isFinite(cap)) return '<span class="muted">-</span>';
  const ratio = g.usageRatio && g.usageRatio>0 && g.usageRatio<=100 ? g.usageRatio : 100;
  const usable = Math.round(cap*ratio/100*10)/10;
  if(ratio>=100) return `<span class="muted">${cap}kW (100%)</span>`;
  return `<span style="color:var(--warn);font-weight:700;">${usable}kW</span> <span class="muted" style="font-size:11px;">(정격 ${cap}kW의 ${ratio}%)</span>`;
}
function sortByIdNatural(a, b){
  const aL = /^L-/i.test(a.id);
  const bL = /^L-/i.test(b.id);
  if(aL !== bL) return aL ? 1 : -1; // L 시리즈는 항상 맨 아래
  if(aL && bL){
    const priority = ['L-11','L-12','L-13']; // 이 세 대는 L 시리즈 내에서 항상 맨 위
    const aP = priority.indexOf(a.id.toUpperCase());
    const bP = priority.indexOf(b.id.toUpperCase());
    if(aP!==-1 || bP!==-1){
      if(aP!==-1 && bP!==-1) return aP-bP;
      return aP!==-1 ? -1 : 1;
    }
  }
  return a.id.localeCompare(b.id, undefined, {numeric:true, sensitivity:'base'});
}
function lastFuelInfo(genId){
  const recs = DB.rentals.filter(r=>r.genId===genId && r.measuredFuelHeightCm!=null).sort((a,b)=>(b.inDate||'').localeCompare(a.inDate||''));
  return recs.length>0 ? recs[0] : null;
}
function tankDimsOf(g){
  const m = DB.materials && g && DB.materials[g.model];
  return {
    width: (g && g.tankWidth>0) ? g.tankWidth : ((m && m.tankWidth) || null),
    depth: (g && g.tankDepth>0) ? g.tankDepth : ((m && m.tankDepth) || null),
    height: (g && g.tankHeight>0) ? g.tankHeight : ((m && m.tankHeight) || null)
  };
}
function genSizeOf(g){
  const m = DB.materials && g && DB.materials[g.model];
  return {
    width: (g && g.genWidth>0) ? g.genWidth : ((m && m.genWidth) || null),
    depth: (g && g.genDepth>0) ? g.genDepth : ((m && m.genDepth) || null),
    height: (g && g.genHeight>0) ? g.genHeight : ((m && m.genHeight) || null)
  };
}
function fuelBaselineOf(g){
  const m = DB.materials && g && DB.materials[g.model];
  const modelDefault = (m && m.fuelBaselineHeight>0) ? m.fuelBaselineHeight : 0;
  return (g && g.fuelBaselineHeight>0) ? g.fuelBaselineHeight : modelDefault;
}
function computeFuelLiters(g, heightCm){
  const {width:w, depth:d, height:h} = tankDimsOf(g);
  if(heightCm==null || !(w>0 && d>0)) return null;
  const baseline = fuelBaselineOf(g);
  const effectiveHeight = heightCm + baseline;
  const clampedHeight = h>0 ? Math.min(effectiveHeight, h) : effectiveHeight;
  return Math.round(w*d*clampedHeight/1000*10)/10;
}
let inCapacityFilter = null; // 숫자(kW) 또는 null
let tankDimFilterId = ''; // 발전기별 탱크 규격 개별설정 - 발전기 번호 필터

          <button class="btn sm" onclick="quickForceInPrompt('${g.id}')" style="white-space:nowrap;" title="거래처·연료·부자재 등 정보 입력 없이 바로 [입고] 상태로 전환합니다. 잘못 출고 처리한 발전기를 되돌릴 때 사용하세요. 이번 출고 이력은 기록되지 않습니다.">⚡ 정보없이 강제입고</button>

    </tr>`;
  };

  const longList = list.filter(g=>g.rental.longTerm);

  return `
    <div class="section-title">출고중 발전기 <span class="cnt">${list.length}대</span>${outRegionFilter? ` <span class="cnt" style="background:var(--warn-tint);color:var(--warn);border-color:var(--warn);">지역: ${escR(outRegionFilter)} <button onclick="clearOutRegionFilter()" style="border:none;background:none;cursor:pointer;font-weight:700;margin-left:4px;">✕</button></span>`:''} <button type="button" class="btn sm" onclick="downloadOutFieldListFile()">🖨 출고 리스트 인쇄(단기/장기)</button></div>

    <div id="bulk-in-bar">${bulkInBarHtml()}</div>
    ${list.length===0? `<div class="empty">${outRegionFilter? `"${escR(outRegionFilter)}" 지역에 출고중인 발전기가 없습니다.`:'출고중인 발전기가 없습니다.'}</div>` : `
    <div class="section-title" style="font-size:14px;margin-top:14px;">단기임대 <span class="cnt">${shortList.length}대</span></div>
    ${shortList.length===0? `<div class="empty">단기임대 중인 발전기가 없습니다.</div>` : `
    <div class="table-scroll"><table>
      ${theadHtml}
      <tbody>${shortRows}</tbody>
    </table></div>`}
    <div class="section-title" style="font-size:14px;margin-top:20px;">장기임대 <span class="cnt">${longList.length}대</span></div>
    ${longList.length===0? `<div class="empty">장기임대 중인 발전기가 없습니다.</div>` : `
    <div class="table-scroll"><table>
      ${theadHtml}
      <tbody>${longRows}</tbody>
    </table></div>`}
    `}
    <div class="section-title">장기임대 정비 준비 리스트 <span class="cnt">${ltList.length}대</span>${ltList.length>0? ` <button type="button" class="btn sm" onclick="downloadLongtermPrepFile()">🖨 인쇄</button>`:''}</div>
    <p class="muted" style="font-size:12.5px;margin-top:-4px;">현장에서 실사용 시간을 바로 알 수 없는 장기임대 발전기를, 예상 사용시간을 기준으로 정비 임박 순으로 정렬했습니다. 방문 정비시 챙길 자재(엔진오일량·필터 품명/규격/수량)가 함께 표시됩니다.</p>
    ${ltList.length===0? `<div class="empty">장기임대 중인 발전기가 없습니다.</div>` : ltHtml}
  `;
}

function toggleLongterm(id){
  const g = findGen(id);
  const rt = g.rental;
  if(!rt) return;
  if(rt.longTerm){
    openConfirmModal('이 발전기를 "장기"에서 "단기"로 변경할까요?', function(){
      rt.longTerm = false;
      rt.estDaily = null;
      saveGens();
      renderContent();
      flash('단기로 변경되었습니다');
    });
  } else {
    openLongtermConvertModal(id);
  }
}
function openLongtermConvertModal(id){
  const g = findGen(id);
  document.getElementById('modal-root').innerHTML = `

async function submitLongtermConvert(id){

}

function toggleCHoursUnknown(){
  const unknown = document.getElementById('f-chours-unknown').checked;
  document.getElementById('f-chours-fields').style.display = unknown ? 'none' : 'block';
}
async function submitCheckHours(id){
  const g = findGen(id);
  const unknown = document.getElementById('f-chours-unknown').checked;
  if(unknown){
    g.hoursKnown = false;
    g.hoursNA = true;
    g.hoursUpdatedAt = nowDateTimeStr();
    g.hoursUpdatedBy = DB.currentUserName || null;
    await saveGens();
    closeModal();
    renderContent();
    flash('해당없음으로 표시되었습니다');
    return;
  }
  const hours = Number(document.getElementById('f-chours').value);
  const lastMaint = Number(document.getElementById('f-clastmaint').value);
  const errEl = document.getElementById('f-err');
  if(isNaN(hours) || hours<0 || isNaN(lastMaint) || lastMaint<0){
    errEl.textContent='숫자를 정확히 입력해주세요.'; errEl.style.display='block'; return;
  }
  if(lastMaint>hours){
    errEl.textContent='마지막 정비시 누적시간은 현재 누적시간보다 클 수 없습니다.'; errEl.style.display='block'; return;
  }
  g.hours = hours;
  g.lastMaintHours = lastMaint;
  g.hoursKnown = true;
  g.hoursNA = false;
  g.hoursUpdatedAt = nowDateTimeStr();
  g.hoursUpdatedBy = DB.currentUserName || null;
  await saveGens();
  closeModal();
  renderContent();
  flash('저장되었습니다');
}

function renderMaintList(){
  const wrapCnt = document.getElementById('maint-list-cnt');
  const wrap = document.getElementById('maint-list-wrap');
  if(!wrap) return;
  const sorted = [...activeGens()].sort((a,b)=>{
    const ra = hasHourData(a) ? (a.status==='in'? remainingHours(a): estRemaining(a)) : 9999;
    const rb = hasHourData(b) ? (b.status==='in'? remainingHours(b): estRemaining(b)) : 9999;
    return ra-rb;
  });
  if(wrapCnt) wrapCnt.textContent = `${sorted.length}대`;
  let rows = sorted.map(g=>{
    const known = hasHourData(g);
    const el = g.status==='in'? elapsedHours(g): estElapsed(g);
    const rem = g.status==='in'? remainingHours(g): estRemaining(g);
    return `<tr>
      <td class="gid">${g.id}</td>
      <td class="wrap-ok">${displayModel(g)}</td>
      <td class="muted" style="font-size:12px;">${g.status==='in'?'입고':'출고중'}</td>
      <td>${known? gaugeHtml(el,rem,getCycle(g)) : '<span class="muted" style="font-size:12px;">확인 불가</span>'}</td>
      <td>${known? pillHtml(maintStatus(rem)) : '<span class="pill gray">-</span>'}</td>
      <td><div class="btn-row">
        <button class="btn sm" onclick="openMaintModal('${g.id}')">정비 등록</button>
        <button class="btn sm" onclick="goToHistory('${g.id}')">이력조회</button>
        <button class="btn sm" onclick="openAdjustModal('${g.id}')">직접수정</button>
        <button class="btn sm" onclick="openCycleModal('${g.id}')" style="${getCycle(g)!==DEFAULT_CYCLE? 'color:var(--danger);font-weight:700;border-color:var(--danger);':''}">정비주기(${getCycle(g)}h)</button>
      </div></td>
    </tr>`;
  }).join('');
  wrap.innerHTML = sorted.length===0 ? `<div class="empty">검색 결과가 없습니다.</div>` : `
    <div class="table-scroll"><table>
      <thead><tr><th>번호</th><th>모델</th><th>현황</th><th>정비 주기</th><th>상태</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}
function renderMaintByModel(){
  const model = document.getElementById('maint-model-filter').value;
  const el = document.getElementById('maint-model-result');
  if(!model){ el.innerHTML=''; return; }
  const recs = DB.maint.filter(m=>m.model===model).sort((a,b)=>b.date.localeCompare(a.date));
  if(recs.length===0){ el.innerHTML = `<div class="empty">"${model}" 모델의 정비 이력이 없습니다.</div>`; return; }
  el.innerHTML = `<div class="table-scroll"><table>
    <thead><tr><th>정비일</th><th>번호</th><th>정비시 누적시간</th><th>구분</th><th>정비자</th><th>사용부품</th><th>정비 내용</th></tr></thead>
    <tbody>${recs.map(r=>`<tr><td>${dow(r.date)}</td><td class="gid">${r.genId}</td><td class="muted">${(r.hours||0).toLocaleString()}h</td><td>${r.type==='고장수리'?'<span class="pill danger">고장수리</span>':'<span class="pill gray">정기정비</span>'}</td><td>${r.technician||'-'}</td><td class="wrap-ok" style="font-size:12px;">${(r.partsUsed||[]).map(p=>typeof p==='string'?p:p.label).join(', ')||'-'}</td><td class="wrap-ok">${r.content||'-'}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

async function submitAdjust(id){
  const g = findGen(id);
  const model = document.getElementById('f-adj-model').value.trim();
  const unknown = document.getElementById('f-adj-unknown').checked;
  const fuelBaselineHeight = Number(document.getElementById('f-adj-fuelbaseline').value)||null;
  const errEl = document.getElementById('f-err');
  g.model = model;
  g.fuelBaselineHeight = fuelBaselineHeight;
  if(unknown){
    g.hoursKnown = false;
    g.hoursNA = true;
  } else {
    const hours = Number(document.getElementById('f-adj-hours').value);
    const lastMaint = Number(document.getElementById('f-adj-lastmaint').value);
    const lastMaintDate = document.getElementById('f-adj-lastmaintdate').value || null;
    if(isNaN(hours) || hours<0 || isNaN(lastMaint) || lastMaint<0){
      errEl.textContent='숫자를 정확히 입력해주세요.'; errEl.style.display='block'; return;

    g.hours = hours;
    g.lastMaintHours = lastMaint;
    g.lastMaintDate = lastMaintDate;
    g.hoursKnown = true;
    g.hoursNA = false;
  }

  g.hoursUpdatedBy = DB.currentUserName || null;
  await saveGens();
  closeModal();

}

function recomputeLastMaint(genId){
  const g = findGen(genId);
  if(!g) return;
  const recs = DB.maint.filter(m=>m.genId===genId);
  if(recs.length===0) return;
  const maxHours = Math.max(...recs.map(r=>r.hours||0));
  g.lastMaintHours = maxHours;
  if((g.hours||0) < maxHours) g.hours = maxHours;
  g.hoursKnown = true;
  const atMax = recs.filter(r=>(r.hours||0)===maxHours).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(atMax.length>0 && atMax[0].date) g.lastMaintDate = atMax[0].date;
}

function csvEscape(v){
  const s = (v==null?'':String(v));
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadCsv(filename, rows){
  const csv = '\uFEFF'+rows.map(row=>row.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function usageGraphSvg(maints){
  const sorted = [...maints].sort((a,b)=>(a.hours||0)-(b.hours||0));
  if(sorted.length<2) return `<div class="muted" style="font-size:12px;">정비 기록이 2건 이상일 때 사용 이력 그래프가 표시됩니다.</div>`;
  const intervals = [];
  for(let i=1;i<sorted.length;i++){
    intervals.push({label: sorted[i].date, val: Math.max(0,(sorted[i].hours||0)-(sorted[i-1].hours||0))});
  }
  const w = 640, barGap = 10, barW = Math.max(18, Math.min(48, Math.floor((w-20)/intervals.length)-barGap));
  const maxV = Math.max(...intervals.map(x=>x.val), 1);
  const chartH = 140;
  let x = 10;
  const bars = intervals.map(it=>{
    const h = Math.round((it.val/maxV)*chartH);
    const rect = `<rect x="${x}" y="${chartH-h+20}" width="${barW}" height="${h}" fill="#2C4A66" rx="3"></rect>`;
    const txt = `<text x="${x+barW/2}" y="${chartH+34}" font-size="10" fill="#6B6E76" text-anchor="middle">${it.label.slice(5)}</text>`;
    const vtxt = `<text x="${x+barW/2}" y="${chartH-h+14}" font-size="10" fill="#22242A" text-anchor="middle">${Math.round(it.val)}h</text>`;
    x += barW + barGap;
    return rect+txt+vtxt;
  }).join('');
  return `<svg viewBox="0 0 ${x+10} ${chartH+44}" style="width:100%;max-width:${w}px;height:auto;">${bars}</svg>`;
}

function deleteMaint(mid, genId){
  openConfirmModal('이 정비 이력을 삭제할까요? 삭제하면 되돌릴 수 없습니다. (차감된 부품 재고는 복원됩니다)', async function(){
    const rec = DB.maint.find(m=>m.id===mid);
    if(rec){
      let changed = false;
      if(rec.partsUsed){
        rec.partsUsed.forEach(p=>{
          if(typeof p==='object' && p.partName){
            DB.partsStock[p.partName] = (DB.partsStock[p.partName]||0) + (p.qty||1);
            changed = true;
          }
        });
      }
      if(changed) await savePartsStock();
    }
    DB.maint = DB.maint.filter(m=>m.id!==mid);
    recomputeLastMaint(genId);
    await saveMaint();
    await saveGens();
    renderGenHistory();
    flash('삭제되었습니다');
  }, '삭제');
}

function renderSettlementTab(){
  const cutoff = new Date(Date.now()-90*86400000);
  const utilList = activeGens().sort(sortByIdNatural).map(g=>{
    const gRentals = DB.rentals.filter(r=>r.genId===g.id && r.outDate && r.inDate);
    let daysOut = 0;
    gRentals.forEach(r=>{
      const outD = new Date(r.outDate+'T00:00:00');
      const inD = new Date(r.inDate+'T00:00:00');
      const s = outD>cutoff ? outD : cutoff;
      if(inD>s) daysOut += Math.round((inD-s)/86400000);
    });
    if(g.status==='out' && g.rental && g.rental.outDate){
      const outD = new Date(g.rental.outDate+'T00:00:00');
      const s = outD>cutoff ? outD : cutoff;
      const now = new Date();
      if(now>s) daysOut += Math.round((now-s)/86400000);
    }
    const rate = Math.max(0, Math.min(100, Math.round(daysOut/90*100)));
    return {g, rate, daysOut};
  }).sort((a,b)=>b.rate-a.rate);
  const utilRowHtml = x=>{
    const color = x.rate>=70? 'var(--ok)' : x.rate>=40? 'var(--warn)' : 'var(--danger)';
    return `<tr><td class="gid">${x.g.id}</td><td class="wrap-ok">${displayModel(x.g)}</td><td class="muted">${x.daysOut}일</td><td><div class="gauge-wrap"><div class="gauge"><div class="gauge-fill" style="width:${x.rate}%;background:${color};"></div></div><span class="gauge-txt" style="color:${color};">${x.rate}%</span></div></td></tr>`;
  };
  const utilHalf = Math.ceil(utilList.length/2);
  const utilRows1 = utilList.slice(0, utilHalf).map(utilRowHtml).join('');

  const byCustomer = {};

  const overuseList = overuseRentalsList();

    const days = rentalDays(r);
    return `<tr>
      <td class="gid">${r.genId}</td>
      <td class="wrap-ok">${g? displayModel(g) : '-'}</td>
      <td class="wrap-ok">${escR(r.customer||'-')}</td>
      <td class="muted" style="font-size:12px;">${dow(r.outDate)||'-'} ~ ${dow(r.inDate)||'-'}</td>
      <td class="muted">${(r.usedHours||0).toLocaleString()}h / ${days}일</td>
      <td><span style="color:var(--danger);font-weight:800;">${avg.toFixed(1)}h/일</span></td>
    </tr>`;
  }).join('');

  return `
    <div class="section-title">거래처별 임대 건수</div>
    ${Object.keys(byCustomer).length===0? `<div class="empty">데이터가 없습니다.</div>` : `
    <div class="table-scroll"><table>
      <thead><tr><th>거래처</th><th>임대 건수</th></tr></thead>
      <tbody>${customerRows}</tbody>
    </table></div>`}

    <div class="section-title" style="color:${overuseList.length>0?'var(--danger)':''};">🚨 일일 과다사용 이력 (하루 ${overuseLimit()}시간 초과) <span class="cnt" style="${overuseList.length>0?'background:var(--danger-tint);color:var(--danger);border-color:var(--danger);':''}">${overuseList.length}건</span></div>
    <p class="muted" style="font-size:13px;margin-top:-4px;">임대기간 동안 하루 평균 ${overuseLimit()}시간을 초과해서 사용된 건입니다. (출고시 누적시간과 입고시 누적시간의 차이 ÷ 사용일수로 계산) 과다사용이 잦으면 정비 주기가 앞당겨질 수 있으니 확인해주세요.</p>
    ${overuseList.length===0? `<div class="empty">과다사용 이력이 없습니다.</div>` : `
    <div class="table-scroll"><table>
      <thead><tr><th>번호</th><th>모델</th><th>거래처</th><th>기간</th><th>총사용/일수</th><th>일평균 사용</th></tr></thead>
      <tbody>${overuseRows}</tbody>

function normalizeUrl(u){
  const s = (u||'').trim();
  if(!s) return '';
  if(/^https?:\/\//i.test(s)) return s;
  return `https://${s}`;
}

async function submitConsumableOrderEdit(id){
  const item = (DB.consumableOrders||[]).find(x=>x.id===id);
  if(!item) return;
  item.name = document.getElementById('f-coe-name').value.trim();
  item.spec1 = document.getElementById('f-coe-spec1').value.trim();
  item.spec2 = document.getElementById('f-coe-spec2').value.trim();
  item.url = document.getElementById('f-coe-url').value.trim();
  item.note = document.getElementById('f-coe-note').value.trim();
  await saveConsumableOrders();
  closeModal();
  renderConsumableOrderTable();
  flash('저장되었습니다');
}
async function markConsumableOrderPurchased(id){
  const item = (DB.consumableOrders||[]).find(x=>x.id===id);
  if(!item) return;
  item.purchasedBy = DB.currentUserName || '이름미상';
  item.purchasedDate = todayStr();
  await saveConsumableOrders();
  renderConsumableOrderTable();
  flash('구입완료로 표시되었습니다');
}
async function unmarkConsumableOrderPurchased(id){
  const item = (DB.consumableOrders||[]).find(x=>x.id===id);
  if(!item) return;
  item.purchasedBy = null;
  item.purchasedDate = null;
  await saveConsumableOrders();
  renderConsumableOrderTable();
  flash('구입완료 표시가 취소되었습니다');
}
function removeConsumableOrder(id){
  openConfirmModal('이 소모품주문 항목을 삭제할까요?', async function(){
    DB.consumableOrders = (DB.consumableOrders||[]).filter(x=>x.id!==id);
    await saveConsumableOrders();
    renderConsumableOrderTable();
    flash('삭제되었습니다');
  }, '삭제');
}
function manualSection(icon, title, open, desc, items){
  const rows = items.map(([tag,text])=>`<li><span class="manual-btn-tag">${escR(tag)}</span><span>${text}</span></li>`).join('');
  return `<details class="manual-section"${open?' open':''}>
    <summary>${icon} ${escR(title)}</summary>
    <div class="manual-body">
      <p>${desc}</p>
      <ul class="manual-btns">${rows}</ul>
    </div>
  </details>`;
}

    <p class="muted" style="font-size:13px;margin-top:-4px;">이 시스템에서 고쳤으면 하는 점, 불편한 점, 버그 등을 자유롭게 남겨주세요. 작성자 이름이 함께 기록되고, 나중에 수정한 사람이 "개선완료"로 표시할 수 있습니다.</p>
    <div class="field" style="max-width:100%;margin-top:6px;">

      <div class="consumable-row" style="flex-wrap:wrap;">
        <textarea id="f-imp-content" placeholder="예: 출고 화면에서 ○○ 항목이 자꾸 초기화돼요" style="flex:1;min-width:220px;min-height:60px;"></textarea>
        <button type="button" class="btn sm primary" style="align-self:flex-start;" onclick="addImprovement()">등록</button>
      </div>
    </div>
    <div id="improvements-wrap" style="margin-top:14px;"></div>
  `;
}
function renderImprovementsList(){
  const wrap = document.getElementById('improvements-wrap');
  if(!wrap) return;
  const list = [...(DB.improvements||[])].sort((a,b)=>{
    const aOpen = !a.completedBy, bOpen = !b.completedBy;
    if(aOpen!==bOpen) return aOpen? -1:1;
    return (b.createdDate||'').localeCompare(a.createdDate||'');
  });
  if(list.length===0){ wrap.innerHTML = `<div class="empty">등록된 보완요청이 없습니다.</div>`; return; }
  wrap.innerHTML = list.map(item=>{
    const done = !!item.completedBy;
    return `<div class="material-card" style="${done? 'opacity:.72;':''}">
      <div class="m-title" style="align-items:flex-start;">
        <span class="muted" style="font-size:11.5px;">✍ ${escR(item.authorBy||'이름미상')} · ${dow(item.createdDate)||'-'}</span>
        <div class="btn-row" style="flex-wrap:nowrap;">
          ${done
            ? `<button type="button" class="btn sm" style="white-space:nowrap;" onclick="unmarkImprovementDone('${item.id}')" title="다시 미해결로 되돌리려면 클릭">완료취소</button>`
            : `<button type="button" class="btn sm primary" style="white-space:nowrap;" onclick="markImprovementDone('${item.id}')">개선완료로 표시</button>`}
          <button type="button" class="btn sm danger" onclick="removeImprovement('${item.id}')">삭제</button>
        </div>
      </div>
      <div style="font-size:13.5px;white-space:pre-wrap;line-height:1.5;">${escR(item.content)}</div>
      ${done? `<div style="margin-top:8px;"><span class="pill ok">✅ 개선완료</span> <span class="muted" style="font-size:11.5px;">${escR(item.completedBy)} · ${dow(item.completedDate)}</span></div>` : ''}
    </div>`;
  }).join('');
}
async function addImprovement(){
  const ta = document.getElementById('f-imp-content');
  const content = ta.value.trim();
  if(!content){ flash('내용을 입력해주세요'); return; }
  DB.improvements = [...(DB.improvements||[]), {
    id: uid(), content, authorBy: DB.currentUserName||'이름미상', createdDate: todayStr(),
    completedBy: null, completedDate: null
  }];
  await saveImprovements();
  ta.value = '';
  renderImprovementsList();
  flash('보완요청이 등록되었습니다');
}
async function markImprovementDone(id){
  const item = (DB.improvements||[]).find(x=>x.id===id);
  if(!item) return;
  item.completedBy = DB.currentUserName || '이름미상';
  item.completedDate = todayStr();
  await saveImprovements();
  renderImprovementsList();
  flash('개선완료로 표시되었습니다');
}
async function unmarkImprovementDone(id){
  const item = (DB.improvements||[]).find(x=>x.id===id);
  if(!item) return;
  item.completedBy = null;
  item.completedDate = null;
  await saveImprovements();
  renderImprovementsList();
  flash('완료 표시가 취소되었습니다');
}
function removeImprovement(id){
  openConfirmModal('이 보완요청을 삭제할까요?', async function(){
    DB.improvements = (DB.improvements||[]).filter(x=>x.id!==id);
    await saveImprovements();
    closeModal();
    renderImprovementsList();
    flash('삭제되었습니다');
  }, '삭제');
}

let calYear = null, calMonth = null;
function initCalendarView(){
  if(calYear==null || calMonth==null){
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
  }
}
function navCalendar(delta){
  initCalendarView();
  calMonth += delta;
  if(calMonth<0){ calMonth = 11; calYear--; }
  else if(calMonth>11){ calMonth = 0; calYear++; }
  renderCalendar();
}
function calendarGoToday(){
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();
}
function pad2(n){ return String(n).padStart(2,'0'); }
function renderCalendar(){
  const wrap = document.getElementById('calendar-wrap');
  if(!wrap) return;
  initCalendarView();
  const labelEl = document.getElementById('calendar-month-label');
  if(labelEl) labelEl.textContent = `${calYear}년 ${calMonth+1}월`;
  const firstDow = new Date(calYear, calMonth, 1).getDay();
  const totalDays = new Date(calYear, calMonth+1, 0).getDate();
  const todayS = todayStr();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=totalDays; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  const dowLabels = ['일','월','화','수','목','금','토'];
  const headHtml = dowLabels.map((l,i)=>`<div style="text-align:center;font-size:13px;font-weight:700;padding:5px 0;color:${i===0?'var(--danger)':i===6?'var(--primary-dark)':'var(--ink-soft)'};">${l}</div>`).join('');
  const cellsHtml = cells.map((d,idx)=>{
    if(d==null) return `<div style="min-height:88px;background:var(--surface-2);border-radius:6px;"></div>`;
    const dateStr = `${calYear}-${pad2(calMonth+1)}-${pad2(d)}`;
    const isToday = dateStr===todayS;
    const dowIdx = idx % 7;
    const evs = (DB.calendarEvents||[]).filter(e=>e.date===dateStr);
    const evHtml = evs.slice(0,4).map(e=>`<div style="color:var(--primary-dark);font-weight:600;font-size:11.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escR(e.text)}</div>`).join('');
    const moreTxt = evs.length>4? `<div class="muted" style="font-size:10.5px;margin-top:1px;">+${evs.length-4}건 더</div>` : '';
    return `<div style="min-height:88px;border:1px solid var(--border);border-radius:6px;padding:5px;cursor:pointer;${isToday?'background:var(--warn-tint);border-color:var(--warn);':''}" onclick="openCalendarDayModal('${dateStr}')">
      <div style="font-size:13px;font-weight:${isToday?'800':'600'};color:${dowIdx===0?'var(--danger)':dowIdx===6?'var(--primary-dark)':'var(--ink)'};">${d}</div>
      ${evHtml}${moreTxt}
    </div>`;
  }).join('');
  wrap.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:2px;">${headHtml}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${cellsHtml}</div>
  `;
}

async function submitRenameGen(oldId){
  const newId = document.getElementById('f-rename-id').value.trim();
  const errEl = document.getElementById('f-err');
  if(!newId){ errEl.textContent='번호를 입력해주세요.'; errEl.style.display='block'; return; }
  if(newId!==oldId && DB.gens.some(g=>g.id===newId)){ errEl.textContent='이미 존재하는 번호입니다.'; errEl.style.display='block'; return; }
  const g = findGen(oldId);
  if(!g) return;
  g.id = newId;
  (DB.maint||[]).forEach(m=>{ if(m.genId===oldId) m.genId=newId; });
  (DB.reservations||[]).forEach(r=>{ if(r.genId===oldId) r.genId=newId; });
  (DB.rentals||[]).forEach(r=>{ if(r.genId===oldId) r.genId=newId; });
  if(DB.genColorOverrides && DB.genColorOverrides[oldId]!==undefined){
    DB.genColorOverrides[newId] = DB.genColorOverrides[oldId];
    delete DB.genColorOverrides[oldId];
    await saveGenColorOverrides();
  }
  await saveGens();
  await saveMaint();
  await saveReservations();
  await saveRentals();
  closeModal();
  renderContent();
  flash(`${oldId} → ${newId} 로 번호가 수정되었습니다`);
}
function confirmDeleteGen(id){
  openConfirmModal(`${id} 발전기를 완전히 삭제할까요?\n\n이 발전기와 관련된 정비 이력, 예약, 임대 이력이 모두 함께 삭제되며 절대 되돌릴 수 없습니다. 등록을 잘못하셨을 때만 사용하세요.`, async function(){
    DB.gens = DB.gens.filter(x=>x.id!==id);
    DB.maint = (DB.maint||[]).filter(m=>m.genId!==id);
    DB.reservations = (DB.reservations||[]).filter(r=>r.genId!==id);
    DB.rentals = (DB.rentals||[]).filter(r=>r.genId!==id);
    if(DB.genColorOverrides) delete DB.genColorOverrides[id];
    await saveGens();
    await saveMaint();
    await saveReservations();
    await saveRentals();
    await saveGenColorOverrides();
    renderContent();
    flash('완전히 삭제되었습니다');
  }, '완전 삭제');
}

let voltageGuidePendingDataUrl = null;
function previewVoltageGuidePhoto(){
  const input = document.getElementById('f-vg-photo');
  const file = input && input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width*scale);
      canvas.height = Math.round(img.height*scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      voltageGuidePendingDataUrl = canvas.toDataURL('image/jpeg', 0.72);
      const previewWrap = document.getElementById('f-vg-preview-wrap');
      const preview = document.getElementById('f-vg-preview');
      if(preview) preview.src = voltageGuidePendingDataUrl;
      if(previewWrap) previewWrap.style.display = 'block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  if(!DB.materials[model]) DB.materials[model] = {};

  if(existing.length>=3){ errEl.textContent = '사진은 최대 3장까지 등록할 수 있습니다.'; errEl.style.display='block'; return; }
  existing.push(voltageGuidePendingDataUrl);
  DB.materials[model][`voltageGuidePhotos_${kind}`] = existing;
  DB.materials[model][`voltageGuideNote_${kind}`] = document.getElementById('f-vg-note').value.trim();

const UNASSIGNED_SUPPLIER = '공급업체 미지정';
function neededOrderParts(){
  const names = allKnownPartNames().sort((a,b)=>a.localeCompare(b,'ko'));
  return names.map(n=>{
    const stock = DB.partsStock[n]!==undefined ? DB.partsStock[n] : 0;
    const minQty = (DB.partsMinStock && DB.partsMinStock[n]) || 0;
    if(!minQty || stock>minQty) return null;
    const orderQty = Math.max(minQty - stock, 1);
    const spec = (DB.partsSpecs && DB.partsSpecs[n]) || '';
    const category = (DB.partsCategory && DB.partsCategory[n]) || '';
    const unit = partUnitOf(n);
    const supplier = (DB.partsSupplier && DB.partsSupplier[n]) || UNASSIGNED_SUPPLIER;
    const mark = (DB.orderMarks && DB.orderMarks[n]) || null;
    return {name:n, stock, minQty, orderQty, spec, category, unit, supplier, mark};
  }).filter(Boolean);
}
function groupBySupplier(needed){
  const groups = {};
  needed.forEach(p=>{
    if(!groups[p.supplier]) groups[p.supplier] = [];
    groups[p.supplier].push(p);
  });
  return groups;
}

function aggregatePrepParts(gensList){
  const totals = {};
  const order = [];
  const push = (key, label, qty, unit)=>{
    if(!qty) return;
    if(!totals[key]){ totals[key] = {label, qty:0, unit}; order.push(key); }
    totals[key].qty += qty;
  };
  gensList.forEach(g=>{
    const m = DB.materials && DB.materials[g.model];
    if(!m) return;
    if(m.engineOilLiters) push(`oil:${m.engineOilSpec||''}`, `엔진오일${m.engineOilSpec? ' '+m.engineOilSpec:''}`, Number(m.engineOilLiters)||0, 'L');
    if(m.oilFilter1Name) push(`part:${m.oilFilter1Name}`, m.oilFilter1Name, Number(m.oilFilter1Qty)||1, '개');
    if(m.oilFilter2Name) push(`part:${m.oilFilter2Name}`, m.oilFilter2Name, Number(m.oilFilter2Qty)||1, '개');
    if(m.fuelFilterName) push(`part:${m.fuelFilterName}`, m.fuelFilterName, Number(m.fuelFilterQty)||1, '개');
    if(m.fuelFilter2Name) push(`part:${m.fuelFilter2Name}`, m.fuelFilter2Name, Number(m.fuelFilter2Qty)||1, '개');
    if(m.airFilterName) push(`part:${m.airFilterName}`, m.airFilterName, Number(m.airFilterQty)||1, '개');
    if(m.fanBeltName) push(`part:${m.fanBeltName}`, m.fanBeltName, Number(m.fanBeltQty)||1, '개');
    (m.consumables||[]).forEach(c=>{ if(c.name) push(`part:${c.name}`, c.name, Number(c.qty)||1, partUnitOf(c.name)||'개'); });
  });
  return order.map(k=>totals[k]).sort((a,b)=>a.label.localeCompare(b.label,'ko'));
}

function suggestVehicleForModel(model, qty, genId){
  qty = Math.max(1, Number(qty)||1);
  const g = genId ? findGen(genId) : null;
  const size = genSizeOf(g || {model});
  if(!(size.width>0) || !(size.depth>0) || !(size.height>0)) return {status:'no-size'};
  const list = DB.vehicleTypes||[];
  if(list.length===0) return {status:'no-vehicles'};
  const gh = size.height;
  // 지게차 포크 구멍은 발전기 "긴 변" 측면에 뚫려 있어, 지게차가 차량 옆에서만 포크를 꽂아 실을 수 있습니다.
  // 그래서 발전기를 90도로 돌려 싣는 건 불가능하고, 항상 짧은 변이 적재함 가로(폭), 긴 변이 적재함 세로(길이) 방향으로만 실립니다.
  const longSide = Math.max(size.width, size.depth);
  const shortSide = Math.min(size.width, size.depth);
  const unitW = shortSide, unitD = longSide;
  const bestGridFit = (n, bedW, bedD)=>{
    let best = null;
    for(let cols=1; cols<=n; cols++){
      const rows = Math.ceil(n/cols);
      const totalW = cols*unitW, totalD = rows*unitD;
      if(totalW<=bedW && totalD<=bedD){
        const area = totalW*totalD;
        if(!best || area<best.area) best = {cols, rows, totalW, totalD, unitW, unitD};
      }
    }
    return best;
  };
  const results = [];
  list.forEach(v=>{
    if(!(v.width>0 && v.depth>0 && v.height>0) || gh>v.height) return;
    const fit = bestGridFit(qty, v.width, v.depth);
    if(fit) results.push({vehicle:v, fit});
  });
  if(results.length===0) return {status:'none-fit', genWidth:size.width, genDepth:size.depth, genHeight:gh, qty};
  results.sort((a,b)=>(a.vehicle.width*a.vehicle.depth*a.vehicle.height)-(b.vehicle.width*b.vehicle.depth*b.vehicle.height));
  return {status:'ok', best:results[0], all:results, genWidth:size.width, genDepth:size.depth, genHeight:gh, qty};
}
function vehicleLoadDiagramSvg(vehicle, fit, qty){
  const scale = 190 / Math.max(vehicle.width, vehicle.depth);
  const bedWpx = vehicle.width*scale, bedDpx = vehicle.depth*scale;
  const padX = 10, topLabelH = 16, bottomLabelH = 16, capH = 16;
  const w = bedWpx+padX*2;
  const h = topLabelH+bedDpx+bottomLabelH+capH;
  let boxes = '';
  let count = 0;
  for(let r=0; r<fit.rows && count<qty; r++){
    for(let c=0; c<fit.cols && count<qty; c++){
      const x = padX + c*fit.unitW*scale;
      const y = topLabelH + r*fit.unitD*scale;
      const bw = fit.unitW*scale, bd = fit.unitD*scale;
      boxes += `<rect x="${(x+2).toFixed(1)}" y="${(y+2).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${(bd-4).toFixed(1)}" rx="4" fill="#FFD166" fill-opacity="0.9" stroke="#7a5314" stroke-width="1.5"/><text x="${(x+bw/2).toFixed(1)}" y="${(y+bd/2).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="800" fill="#3a2c00">${count+1}</text>`;
      count++;
    }
  }
  return `<svg viewBox="0 0 ${w.toFixed(1)} ${h.toFixed(1)}" style="width:100%;max-width:220px;height:auto;display:block;margin:6px auto 2px;background:#f4f4f4;border-radius:6px;">
    <text x="${(w/2).toFixed(1)}" y="${(topLabelH-4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#C0392B">▲ 차량 앞부분</text>
    <rect x="${padX}" y="${topLabelH}" width="${bedWpx.toFixed(1)}" height="${bedDpx.toFixed(1)}" fill="#fff" stroke="#555" stroke-width="2" stroke-dasharray="4 3"/>
    ${boxes}
    <text x="${(w/2).toFixed(1)}" y="${(topLabelH+bedDpx+bottomLabelH-4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#C0392B">▼ 차량 뒷부분</text>
    <text x="${(w/2).toFixed(1)}" y="${(h-4).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#666">적재함 위에서 본 모양 (가로${vehicle.width}×세로${vehicle.depth}cm)</text>
  </svg>`;
}

function safeIdFrag(s){
  return String(s).replace(/[\s"'<>&]/g, '_');
}
async function addStockQty(name, inputEl){
  const idFrag = safeIdFrag(name);
  const input = inputEl || document.getElementById(`addqty-${idFrag}`);
  if(!input) return;
  const addQty = Number(input.value);
  if(!addQty || addQty<=0){ input.value=''; return; }
  DB.partsStock[name] = (DB.partsStock[name]||0) + addQty;
  DB.partsPurchaseLog = [...(DB.partsPurchaseLog||[]), {id: uid(), date: todayStr(), partName: name, qty: addQty, by: DB.currentUserName||null}];
  const hadMark = DB.orderMarks && DB.orderMarks[name];
  if(hadMark) delete DB.orderMarks[name];
  await savePartsStock();
  await savePartsPurchaseLog();
  if(hadMark) await saveOrderMarks();
  renderPartsStockTable();
  flash(`${name} 재고에 ${addQty} 추가되었습니다 (현재 ${DB.partsStock[name]})`);
}
function deletePartsPurchaseLogEntry(id){
  const entry = (DB.partsPurchaseLog||[]).find(l=>l.id===id);
  if(!entry) return;
  openConfirmModal(`"${entry.partName}" +${entry.qty} 입고 내역을 삭제할까요? 삭제하면 재고에서도 ${entry.qty}만큼 다시 차감됩니다.`, async function(){
    DB.partsPurchaseLog = (DB.partsPurchaseLog||[]).filter(l=>l.id!==id);
    DB.partsStock[entry.partName] = (DB.partsStock[entry.partName]||0) - entry.qty;
    await savePartsStock();
    await savePartsPurchaseLog();
    closeModal();
    renderPartsStockTable();
    flash('삭제되었습니다');
  }, '삭제');
}

async function addStockPart(){
  const baseName = document.getElementById('f-newpart-name').value.trim();
  const category = document.getElementById('f-newpart-category').value.trim();
  const spec = document.getElementById('f-newpart-spec').value.trim();
  const qty = Number(document.getElementById('f-newpart-qty').value)||0;
  if(!baseName) return;
  const key = spec ? `${baseName} ${spec}` : baseName;
  DB.partsStock[key] = (DB.partsStock[key]||0) + qty;
  DB.partsCategory = DB.partsCategory || {};
  if(category) DB.partsCategory[key] = category;
  if(spec) DB.partsSpecs[key] = spec;
  await savePartsStock();
  if(category) await savePartsCategory();
  if(spec) await savePartsSpecs();
  renderPartsStockTable();
  document.getElementById('f-newpart-name').value='';
  document.getElementById('f-newpart-category').value='';
  document.getElementById('f-newpart-spec').value='';
  document.getElementById('f-newpart-qty').value='0';
  flash('부품이 추가되었습니다');
}
function removeStockPart(name){
  const linkedModels = Object.keys(DB.materials||{}).filter(model=>{
    return materialCandidatePartsFromMaterial(DB.materials[model]).some(p=>p.partName===name);
  });
  let msg = `"${name}" 재고 항목을 삭제할까요?`;
  if(linkedModels.length>0){
    msg += `\n\n이 부품명은 아래 모델의 자재 정보에도 등록되어 있어 그냥 재고만 지우면 목록에 다시 나타납니다:\n- ${linkedModels.join(', ')}\n\n확인을 누르면 재고와 함께 위 모델들의 자재 정보에서도 이 부품명을 제거합니다.`;
  }
  openConfirmModal(msg, async function(){
    delete DB.partsStock[name];
    delete DB.partsSpecs[name];
    delete DB.partsSupplier[name];
    if(DB.partsCategory) delete DB.partsCategory[name];
    if(DB.partsUnit) delete DB.partsUnit[name];
    if(linkedModels.length>0){
      linkedModels.forEach(model=>{
        const m = DB.materials[model];
        if(!m) return;
        if(m.oilFilter1Name===name){ m.oilFilter1Name=''; m.oilFilter1Qty=null; }
        if(m.oilFilter2Name===name){ m.oilFilter2Name=''; m.oilFilter2Qty=null; }
        if(m.fuelFilterName===name){ m.fuelFilterName=''; m.fuelFilterQty=null; }
        if(m.fuelFilter2Name===name){ m.fuelFilter2Name=''; m.fuelFilter2Qty=null; }
        if(m.airFilterName===name){ m.airFilterName=''; m.airFilterQty=null; }
        if(m.fanBeltName===name){ m.fanBeltName=''; m.fanBeltQty=null; }
        if(m.consumables){ m.consumables = m.consumables.filter(c=>c.name!==name); }
      });
      await saveMaterials();
    }
    await savePartsStock();
    await savePartsSpecs();
    await savePartsSupplier();
    renderPartsStockTable();
    flash('삭제되었습니다');
  }, '삭제');
}
function migrateLegacyConsumables(m){
  const list = (m.consumables||[]).map(c=>({...c}));
  const has = name => list.some(c=>c.name===name);
  const catFor = name => (DB.partsCategory && DB.partsCategory[name]) || '';
  const specFor = name => (DB.partsSpecs && DB.partsSpecs[name]) || '';
  if(m.engineOilLiters && !has('엔진오일')) list.push({name:'엔진오일', qty:Number(m.engineOilLiters)||1, category: catFor('엔진오일'), spec: m.engineOilSpec || specFor('엔진오일')});
  if(m.oilFilter1Name && !has(m.oilFilter1Name)) list.push({name:m.oilFilter1Name, qty:m.oilFilter1Qty||1, category: catFor(m.oilFilter1Name), spec: specFor(m.oilFilter1Name)});
  if(m.oilFilter2Name && !has(m.oilFilter2Name)) list.push({name:m.oilFilter2Name, qty:m.oilFilter2Qty||1, category: catFor(m.oilFilter2Name), spec: specFor(m.oilFilter2Name)});
  if(m.fuelFilterName && !has(m.fuelFilterName)) list.push({name:m.fuelFilterName, qty:m.fuelFilterQty||1, category: catFor(m.fuelFilterName), spec: specFor(m.fuelFilterName)});
  if(m.fuelFilter2Name && !has(m.fuelFilter2Name)) list.push({name:m.fuelFilter2Name, qty:m.fuelFilter2Qty||1, category: catFor(m.fuelFilter2Name), spec: specFor(m.fuelFilter2Name)});
  if(m.airFilterName && !has(m.airFilterName)) list.push({name:m.airFilterName, qty:m.airFilterQty||1, category: catFor(m.airFilterName), spec: specFor(m.airFilterName)});
  if(m.fanBeltName && !has(m.fanBeltName)) list.push({name:m.fanBeltName, qty:m.fanBeltQty||1, category: catFor(m.fanBeltName), spec: specFor(m.fanBeltName)});
  return list;
}
