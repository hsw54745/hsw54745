function cancelReservation(id){
  const r = DB.reservations.find(x=>x.id===id);
  const isPending = r && r.pendingLoad;
  const msg = isPending ? '이 출고(상차대기)를 취소할까요? 취소하면 발전기는 다시 입고 상태로 남습니다.' : '이 출고 대기를 취소할까요?';
  openConfirmModal(msg, async function(){
    DB.reservations = DB.reservations.filter(r=>r.id!==id);
    await saveReservations();
    renderContent();
    flash('취소되었습니다');
  }, isPending ? '입고로 되돌리기' : '예약 취소');
}
function processReservation(resId){
  const r = DB.reservations.find(x=>x.id===resId);
  if(!r) return;
  const g = findGen(r.genId);
  if(!g){ showInfoModal('해당 발전기를 찾을 수 없습니다.'); return; }
  if(g.status==='out'){ showInfoModal('입고 처리가 완료되지 않은 발전기입니다. 먼저 입고 처리를 완료한 뒤 출고해주세요.'); return; }
  if(g.underRepair){ showInfoModal('고장 수리 중인 발전기입니다. 수리 완료 처리 후 출고할 수 있습니다.'); return; }
  openOutModal(r.genId, resId);
}
function confirmLoadPrompt(resId){
  openConfirmModal('제품 상차를 완료하시겠습니까?', function(){ confirmLoad(resId); }, '예', '아니오');
}
async function confirmLoad(resId){
  const r = DB.reservations.find(x=>x.id===resId);
  if(!r){ return; }
  const g = findGen(r.genId);
  if(!g){ showInfoModal('해당 발전기를 찾을 수 없습니다.'); return; }
  if(g.status==='out'){
    showInfoModal('이미 출고된 발전기입니다.');
    DB.reservations = DB.reservations.filter(x=>x.id!==resId);
    await saveReservations();
    renderContent();
    return;
  }
  if(g.underRepair){
    showInfoModal('고장 수리 중인 발전기라 상차완료 처리할 수 없습니다. 수리 완료 처리 후 다시 시도해주세요.');
    return;
  }
  g.status = 'out';
  g.hours = r.startHours;
  g.rental = {
    customer: r.customer, manager: r.manager, phone: r.phone, site: r.site, address: r.address,
    supplies: r.supplies, suppliesItems: r.suppliesItems||[], suppliesCustom: r.suppliesCustom||'', voltage: r.voltage, qty: r.qty, fuelRequested: r.fuelRequested, fuelActual: r.fuelActual,
    usageDays: r.usageDays, loadDate: r.loadDate, arriveTime: r.arriveTime, freightBearer: r.freightBearer, paymentConfirmed: r.paymentConfirmed||false, forcedOut: r.forcedOut||false, forceReason: r.forceReason||'', forcedBy: r.forcedBy||null, note: r.note,
    outDate: r.outDate, startHours: r.startHours, longTerm: r.longTerm, estDaily: r.estDaily,
    outProcessedBy: r.outProcessedBy || null, loadConfirmedBy: DB.currentUserName || null
  };
  if(r.suppliesItems && r.suppliesItems.length){
    DB.suppliesStock = DB.suppliesStock || {};
    r.suppliesItems.forEach(it=>{
      DB.suppliesStock[it.name] = (DB.suppliesStock[it.name]!==undefined ? DB.suppliesStock[it.name] : 0) - (it.qty||1);
    });
    await saveSuppliesStock();
  }
  DB.reservations = DB.reservations.filter(x=>x.id!==resId);
  await saveGens();
  await saveReservations();
  renderContent();
  flash('상차 확인 완료 - 출고되었습니다');
  printReceipt(g.id);
}

function syncUsageDaysToReturnDate(){
  const outEl = document.getElementById('f-outdate');
  const daysEl = document.getElementById('f-usagedays');
  const retEl = document.getElementById('f-returndate');
  if(!outEl || !daysEl || !retEl) return;
  const days = Number(daysEl.value);
  if(!outEl.value || !days || days<=0){ retEl.value = ''; return; }
  const d = new Date(outEl.value+'T00:00:00');
  d.setDate(d.getDate()+days);
  retEl.value = toLocalDateStr(d);
}
function syncReturnDateToUsageDays(){
  const outEl = document.getElementById('f-outdate');
  const daysEl = document.getElementById('f-usagedays');
  const retEl = document.getElementById('f-returndate');
  if(!outEl || !daysEl || !retEl) return;
  if(!outEl.value || !retEl.value) return;
  const start = new Date(outEl.value+'T00:00:00');
  const end = new Date(retEl.value+'T00:00:00');
  const days = Math.round((end-start)/86400000);
  if(days>0) daysEl.value = days;
}

function knownCustomerRecords(){
  const map = {};
  const consider = (rec)=>{
    if(!rec || !rec.customer) return;
    const key = rec.customer.trim();
    if(!key) return;
    const dateKey = rec.outDate || rec.plannedOutDate || rec.createdAt || '';
    if(!map[key] || (dateKey && dateKey > (map[key].outDate||''))){
      map[key] = {customer: key, manager: rec.manager||'', phone: rec.phone||'', address: rec.address||'', site: rec.site||'', outDate: dateKey};
    }
  };
  DB.rentals.forEach(consider);
  DB.reservations.forEach(consider);
  DB.gens.forEach(g=>{ if(g.rental) consider(g.rental); });
  return Object.values(map).sort((a,b)=>a.customer.localeCompare(b.customer,'ko'));
}

async function submitOutInfoEdit(id){
  const g = findGen(id);

  const startHours = Number(document.getElementById('f-oie-starthours').value);

  const oldVoltage = g.voltage||'';
  const newVoltageVal = document.getElementById('f-oie-voltage').value.trim();
  g.rental = {

    customer: site,
    site,
    manager: document.getElementById('f-oie-manager').value.trim(),
    phone: document.getElementById('f-oie-phone').value.trim(),
    address: document.getElementById('f-oie-address').value.trim(),

    supplies: document.getElementById('f-oie-supplies').value.trim(),
    fuelRequested: Number(document.getElementById('f-oie-fuel-req').value)||null,

  };

  if(!isNaN(startHours)) g.hours = startHours;
  closeModal();

  flash('출고 정보가 저장되었습니다');

async function submitOut(id, reservationId){
  const g = findGen(id);

  }
  if(g.underRepair){
    if(errElGuard){ errElGuard.textContent = '고장 수리 중인 발전기는 출고할 수 없습니다. 수리 완료 처리 후 출고해주세요.'; errElGuard.style.display='block'; }
    return;
  }
  const customer = document.getElementById('f-site').value.trim();
  const site = customer;
  const manager = document.getElementById('f-manager').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const address = document.getElementById('f-address').value.trim();
  const supplies = document.getElementById('f-supplies').value.trim();
  let suppliesItems = [];

  const qty = Number(document.getElementById('f-qty').value)||1;
  const fuelRequested = Number(document.getElementById('f-fuel-req').value)||null;
  const fuelActual = Number(document.getElementById('f-fuel-actual').value)|| fuelRequested || null;
  const usageDays = Number(document.getElementById('f-usagedays').value)||null;
  const loadDate = document.getElementById('f-loaddate').value || null;
  const arriveTime = document.getElementById('f-arrivetime').value || null;
  const freightBearer = document.getElementById('f-freight').value;
  const paymentConfirmed = document.getElementById('f-payment-confirmed').checked;
  const forcedOut = !paymentConfirmed && document.getElementById('f-force-out').checked;
  const forceReason = forcedOut ? document.getElementById('f-force-reason').value.trim() : '';
  const note = document.getElementById('f-note').value.trim();
  const outDate = document.getElementById('f-outdate').value;
  const startHours = Number(document.getElementById('f-starthours').value);
  const longTerm = document.getElementById('f-longterm').checked;
  const estDaily = longTerm ? Number(document.getElementById('f-estdaily').value||0) : null;
  const errEl = document.getElementById('f-err');
  if(!customer || !address || !manager || !phone){
    errEl.textContent = '거래처명, 현장 주소, 담당자, 연락처를 모두 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(!paymentConfirmed && !forcedOut){
    errEl.textContent = '입금 확인 체크를 하거나, 급한 경우 "강제출고"를 체크하고 사유를 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(forcedOut && !forceReason){
    errEl.textContent = '강제출고 사유를 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(!outDate || isNaN(startHours) || startHours < (g.hours||0)){
    errEl.textContent = '도착일과 누적 사용시간을 확인해주세요. (현재 누적시간보다 작을 수 없습니다)';

  }

    errEl.textContent = '장기 임대는 예상 일일 사용시간을 입력해주세요.';
    errEl.style.display='block'; return;
  }
  const existing = reservationId ? DB.reservations.find(r=>r.id===reservationId) : null;

    id: reservationId || uid(), genId: id, pendingLoad: true,

    fuelRequested, fuelActual, usageDays, loadDate, arriveTime, freightBearer, paymentConfirmed, forcedOut, forceReason, forcedBy: forcedOut ? (DB.currentUserName||null) : null, note,
    outDate, startHours, longTerm, estDaily: longTerm? estDaily: null,
    outProcessedBy: DB.currentUserName || (existing&&existing.outProcessedBy) || null,
    createdAt: (existing && existing.createdAt) || todayStr()
  };
  const idx = reservationId ? DB.reservations.findIndex(r=>r.id===reservationId) : -1;

    vals: {customer, manager, phone, address, supplies, voltage, qty, fuelRequested, fuelActual, usageDays, loadDate, arriveTime, freightBearer, paymentConfirmed, forcedOut, forceReason, note, outDate, startHours, longTerm, estDaily}
  };

function syncBulkUsageDaysToReturnDate(){
  const outEl = document.getElementById('fb-outdate');
  const daysEl = document.getElementById('fb-usagedays');
  const retEl = document.getElementById('fb-returndate');
  if(!outEl.value || !daysEl.value || Number(daysEl.value)<=0){ retEl.value=''; return; }
  const d = new Date(outEl.value+'T00:00:00');
  d.setDate(d.getDate()+Number(daysEl.value));
  retEl.value = toLocalDateStr(d);
}
function syncBulkReturnDateToUsageDays(){
  const outEl = document.getElementById('fb-outdate');
  const daysEl = document.getElementById('fb-usagedays');
  const retEl = document.getElementById('fb-returndate');
  if(!outEl.value || !retEl.value) return;
  const start = new Date(outEl.value+'T00:00:00');
  const end = new Date(retEl.value+'T00:00:00');
  const days = Math.round((end-start)/86400000);
  if(days>0) daysEl.value = days;
}

async function submitBulkOut(){
  const ids = [...bulkOutSelection];
  const errEl = document.getElementById('fb-err');
  if(ids.length===0){ closeModal(); return; }
  const customer = document.getElementById('fb-site').value.trim();
  const site = customer;
  const manager = document.getElementById('fb-manager').value.trim();
  const phone = document.getElementById('fb-phone').value.trim();
  const address = document.getElementById('fb-address').value.trim();
  const supplies = document.getElementById('fb-supplies').value.trim();
  const voltage = document.getElementById('fb-voltage').value.trim();
  const fuelRequested = Number(document.getElementById('fb-fuel-req').value)||null;
  const fuelActual = Number(document.getElementById('fb-fuel-actual').value)|| fuelRequested || null;
  const usageDays = Number(document.getElementById('fb-usagedays').value)||null;
  const loadDate = document.getElementById('fb-loaddate').value || null;
  const arriveTime = document.getElementById('fb-arrivetime').value || null;
  const freightBearer = document.getElementById('fb-freight').value;
  const paymentConfirmed = document.getElementById('fb-payment-confirmed').checked;
  const forcedOut = !paymentConfirmed && document.getElementById('fb-force-out').checked;
  const forceReason = forcedOut ? document.getElementById('fb-force-reason').value.trim() : '';
  const note = document.getElementById('fb-note').value.trim();
  const outDate = document.getElementById('fb-outdate').value;
  const longTerm = document.getElementById('fb-longterm').checked;
  const estDaily = longTerm ? Number(document.getElementById('fb-estdaily').value||0) : null;
  if(!customer || !address || !manager || !phone){
    errEl.textContent = '거래처명, 현장 주소, 담당자, 연락처를 모두 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(!paymentConfirmed && !forcedOut){
    errEl.textContent = '입금 확인 체크를 하거나, 급한 경우 "강제출고"를 체크하고 사유를 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(forcedOut && !forceReason){
    errEl.textContent = '강제출고 사유를 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(!outDate){
    errEl.textContent = '도착일을 확인해주세요.';
    errEl.style.display='block'; return;
  }
  if(longTerm && (!estDaily || estDaily<=0)){
    errEl.textContent = '장기 임대는 예상 일일 사용시간을 입력해주세요.';
    errEl.style.display='block'; return;
  }
  // 발전기별 누적 사용시간 검증
  const hoursMap = {};
  for(const id of ids){
    const g = findGen(id);
    if(!g) continue;
    const el = document.getElementById(`fb-hours-${id}`);
    const v = el ? Number(el.value) : NaN;
    if(isNaN(v) || v < (g.hours||0)){
      errEl.textContent = `${id}의 누적 사용시간을 확인해주세요. (현재 누적시간 ${(g.hours||0).toLocaleString()}h보다 작을 수 없습니다)`;
      errEl.style.display='block'; return;
    }
    hoursMap[id] = v;
  }
  const skipped = [];
  ids.forEach(id=>{
    const g = findGen(id);
    if(!g || g.status!=='in' || g.underRepair || DB.reservations.some(r=>r.genId===id)){ skipped.push(id); return; }
    DB.reservations.push({
      id: uid(), genId: id, pendingLoad: true,
      customer, manager, phone, site, address, supplies, voltage, qty:1,
      fuelRequested, fuelActual, usageDays, loadDate, arriveTime, freightBearer, paymentConfirmed, forcedOut, forceReason, forcedBy: forcedOut ? (DB.currentUserName||null) : null, note,
      outDate, startHours: hoursMap[id], longTerm, estDaily: longTerm? estDaily: null,
      outProcessedBy: DB.currentUserName || null,
      createdAt: todayStr()
    });
  });
  await saveReservations();
  bulkOutSelection.clear();
  closeModal();
  currentTab = 'reserve';
  renderTabbar();
  renderContent();
  const doneCount = ids.length - skipped.length;
  flash(skipped.length>0
    ? `${doneCount}대는 출고 대기에 등록되었고, ${skipped.length}대는 상태 변경으로 제외되었습니다.`
    : `${doneCount}대가 출고 대기(상차대기)에 등록되었습니다. 상차완료를 눌러야 출고됩니다.`);
}

function readAndCompressImageToDataUrl(file, maxW, quality){
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const scale = Math.min(1, (maxW||900)/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width*scale));
        canvas.height = Math.max(1, Math.round(img.height*scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality||0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function calcRemainingFuel(id){
  const g = findGen(id);
  const heightEl = document.getElementById('f-fuel-height');
  const resultEl = document.getElementById('f-fuel-calc-result');
  if(!g || !heightEl || !resultEl) return;
  const height = Number(heightEl.value);
  if(!height || height<=0){ resultEl.style.display='none'; return; }
  const {width:w, depth:d, height:h} = tankDimsOf(g);
  const baseline = fuelBaselineOf(g);
  if(!(w>0 && d>0)){
    resultEl.style.display = 'block';
    resultEl.innerHTML = `<div class="muted" style="font-size:12px;">측정 높이 ${height}cm로 기록됩니다. (탱크 규격이 없어 리터 환산은 생략)</div>`;
    return;
  }
  const effectiveHeight = height + baseline;
  const clampedHeight = h>0 ? Math.min(effectiveHeight, h) : effectiveHeight;
  const liters = Math.round(w*d*clampedHeight/1000*10)/10;
  const overTank = h>0 && effectiveHeight>h;
  resultEl.style.display = 'block';
  resultEl.innerHTML = `<div style="font-size:13px;">남은 연료량 약 <b style="font-size:16px;color:var(--primary-dark);">${liters.toLocaleString()}L</b></div>${baseline>0? `<div class="muted" style="font-size:11px;">기준높이 ${baseline}cm + 측정높이 ${height}cm = 총 ${effectiveHeight}cm 기준</div>`:''}${overTank? `<div class="muted" style="font-size:11px;color:var(--danger);">계산된 높이가 탱크 높이(${h}cm)를 초과해 탱크 높이 기준으로 계산했습니다.</div>` : ''}`;
}

  const supRecoveredVal = supRecoveredEl ? supRecoveredEl.value : 'yes';
  const suppliesRecovered = supRecoveredVal==='yes';
  const supNoteEl = document.getElementById('f-supplies-note');
  const suppliesNote = (!suppliesRecovered && supNoteEl) ? supNoteEl.value.trim() : '';
  const errEl = document.getElementById('f-err');
  if(!supRecoveredVal){
    errEl.textContent = '부자재 회수 여부(회수됨/회수안됨)를 선택해주세요.';
    errEl.style.display='block'; return;
  }
  if(!inDate || isNaN(endHours) || endHours < g.rental.startHours){
    errEl.textContent = '입고일과 누적 사용시간을 확인해주세요. (출고시 누적시간보다 작을 수 없습니다)';

  const repairNote = repairNoteEl ? repairNoteEl.value.trim() : '';
  if(condition==='broken' && !repairNote){
    errEl.textContent = '고장 내용을 입력해주세요.';
    errEl.style.display='block'; return;
  }
  const fuelHeightEl = document.getElementById('f-fuel-height');
  const measuredFuelHeightCm = fuelHeightEl ? (Number(fuelHeightEl.value)||null) : null;
  let remainingFuelLiters = null;
  if(measuredFuelHeightCm!=null){
    remainingFuelLiters = computeFuelLiters(g, measuredFuelHeightCm);
  }
  const rt = g.rental;
  DB.rentals.push({
    id: uid(), genId: g.id, customer: rt.customer, manager: rt.manager, phone: rt.phone,
    site: rt.site, address: rt.address, supplies: rt.supplies, suppliesItems: rt.suppliesItems||[], suppliesCustom: rt.suppliesCustom||'', suppliesRecovered, suppliesNote, fuelRequested: rt.fuelRequested, fuelActual: rt.fuelActual, usageDays: rt.usageDays, loadDate: rt.loadDate, arriveTime: rt.arriveTime, freightBearer: rt.freightBearer, note: rt.note,

    voltage, outProcessedBy: rt.outProcessedBy||null, loadConfirmedBy: rt.loadConfirmedBy||null, inProcessedBy: DB.currentUserName||null,

    paymentConfirmed: rt.paymentConfirmed||false, forcedOut: rt.forcedOut||false, forceReason: rt.forceReason||'', forcedBy: rt.forcedBy||null
  });
  g.hours = endHours;
  g.hoursKnown = true;
  g.status = 'in';
  g.voltage = voltage;
  g.rental = null;
  if(condition==='broken'){
    g.underRepair = true;
    g.repairNote = repairNote;
    g.repairSince = inDate;
  } else {
    g.underRepair = false;
    g.repairNote = '';
    g.repairSince = null;
  }
  if(suppliesRecovered && rt.suppliesItems && rt.suppliesItems.length){
    DB.suppliesStock = DB.suppliesStock || {};
    rt.suppliesItems.forEach(it=>{
      DB.suppliesStock[it.name] = (DB.suppliesStock[it.name]!==undefined ? DB.suppliesStock[it.name] : 0) + (it.qty||1);
    });
    await saveSuppliesStock();
  }
  await saveGens();
  await saveRentals();
  closeModal();
  renderContent();
  flash(condition==='broken' ? '입고 처리되었습니다 (고장 등록 - 수리 완료 전까지 출고 불가)' : '입고 처리되었습니다');
  maybeLogVoltageChange(id, oldVoltageForLog, voltage);
}

async function submitMaint(id, editId, completeRepair){
  const g = findGen(id);
  const date = document.getElementById('f-mdate').value;
  const hours = Number(document.getElementById('f-mhours').value);
  const type = document.getElementById('f-mtype').value;
  const technician = document.getElementById('f-mtech').value;
  const contentOptions = ['엔진오일교체','엔진오일점검','에어필터교체','에어필터점검','오일필터1교체','오일필터1점검','오일필터2교체','오일필터2점검','연료필터1교체','연료필터1점검','연료필터2교체','연료필터2점검','부동액교체','부동액점검','배터리교체','배터리점검','팬벨트교체','출력단자체결상태','누전차단기볼트교체','배터리터미널조임상태','팬청소'];
  const contentItems = contentOptions.filter((c,i)=>{
    const el = document.getElementById(`f-mcontent-${i}`);
    return el && el.checked;
  });
  const contentEtc = document.getElementById('f-mcontent-etc').value.trim();
  const content = [contentItems.join(', '), contentEtc].filter(Boolean).join(' / ');
  const errEl = document.getElementById('f-err');
  if(!date || isNaN(hours) || hours<0){
    errEl.textContent = '정비일과 누적 사용시간을 확인해주세요.';
    errEl.style.display='block'; return;
  }
  const candidates = materialCandidateParts(g.model);
  const partsUsed = [];
  const prevParts = editId ? ((DB.maint.find(m=>m.id===editId)||{}).partsUsed || []) : [];
  // 수정인 경우, 기존 차감분을 먼저 재고에 복원 후 다시 차감(중복 차감 방지)
  prevParts.forEach(p=>{
    if(typeof p==='object' && p.partName){
      DB.partsStock[p.partName] = (DB.partsStock[p.partName]||0) + (p.qty||1);
    }
  });
  candidates.forEach((p,i)=>{
    const el = document.getElementById(`f-part-${i}`);
    if(el && el.checked){
      partsUsed.push({label:p.label, partName:p.partName, qty:p.qty});
      DB.partsStock[p.partName] = (DB.partsStock[p.partName]!==undefined ? DB.partsStock[p.partName] : 0) - (p.qty||1);
    }
  });
  if(editId){
    const rec = DB.maint.find(m=>m.id===editId);
    if(rec){
      rec.date = date; rec.hours = hours; rec.content = content;
      rec.contentItems = contentItems; rec.contentEtc = contentEtc;
      rec.technician = technician; rec.partsUsed = partsUsed; rec.model = g.model; rec.type = type;
      rec.photo = maintPhotoPendingDataUrl || null;
    }
  } else {
    DB.maint.push({id: uid(), genId: g.id, model: g.model, date, hours, content, contentItems, contentEtc, technician, partsUsed, type, photo: maintPhotoPendingDataUrl || null});
  }
  maintPhotoPendingDataUrl = null;
  recomputeLastMaint(g.id);
  if(completeRepair){
    g.underRepair = false;
    g.repairNote = '';
  }
  await saveGens();
  await saveMaint();
  await savePartsStock();
  closeModal();
  renderContent();
  flash(completeRepair ? '수리 완료 처리되었습니다. 이제 출고할 수 있습니다.' : (editId? '정비 기록이 수정되었습니다' : '정비 등록되었습니다'));
}

  // 하나가 실패해도 나머지는 정상 진행되도록 allSettled를 사용합니다.
  const keys = [
    ['gens', 'gen-fleet-v2', defaultFleet(), true],

    ['maint', 'gen-maintenance-v2', [], true],

    ['lastBackupDate', 'gen-last-backup-date-v1', '', true],
    ['teamMembers', 'gen-team-members-v1', ['홍승우','이영숙','이성웅'], true],
    ['suppliesCatalog', 'gen-supplies-catalog-v1', [], true],
    ['suppliesStock', 'gen-supplies-stock-v1', {}, true],
    ['vehicleTypes', 'gen-vehicle-types-v1', [], true],
    ['vehicleSuggestEnabled', 'gen-vehicle-suggest-enabled-v1', true, true],
    ['genSizeDisplayEnabled', 'gen-size-display-enabled-v1', false, true],
    ['modelColors', 'gen-model-colors-v1', {}, true],
    ['notices', 'gen-notices-v1', [], true],
    ['calendarEvents', 'gen-calendar-events-v1', [], true],
    ['genColorOverrides', 'gen-gen-color-overrides-v1', {'S-14':'#808080'}, true],
    ['suppliesSizes', 'gen-supplies-sizes-v1', {}, true],
    ['suppliesSpecs', 'gen-supplies-specs-v1', {}, true],
    ['suppliesCategories', 'gen-supplies-categories-v1', {}, true],
    ['palletDefaultRemoved', 'gen-pallet-default-removed-v1', false, true],
    ['companyInfo', 'gen-company-info-v1', {name:'해성발전기', address:'', phone:'031-355-2569', mobile:'010-5644-3732'}, true],
    ['currentUserName', 'gen-user-name-v1', '', false]
  ];
  const results = {};
  const BATCH_SIZE = 5;
  for(let i=0; i<keys.length; i+=BATCH_SIZE){
    const batch = keys.slice(i, i+BATCH_SIZE);
    const settled = await Promise.allSettled(batch.map(([name, key, defVal, shared]) =>
      shared ? getOrInit(key, defVal) : getOrInitPersonal(key, defVal)
    ));
    settled.forEach((r, idx) => {
      const [name, , defVal] = batch[idx];
      results[name] = r.status==='fulfilled' ? r.value : defVal;
    });
  }
  DB.gens = results.gens;
  DB.rentals = results.rentals;
  DB.maint = results.maint;
  DB.reservations = results.reservations;
  DB.materials = results.materials;
  let techs = results.techsRaw;

  DB.calendarEvents = results.calendarEvents;
  DB.genColorOverrides = results.genColorOverrides;
  DB.suppliesSizes = results.suppliesSizes;
  DB.suppliesSpecs = results.suppliesSpecs;
  DB.suppliesCategories = results.suppliesCategories || {};
  DB.companyInfo = results.companyInfo && results.companyInfo.name ? results.companyInfo : {name:'해성발전기', address:'', phone:'031-355-2569', mobile:'010-5644-3732'};
  if(!results.palletDefaultRemoved && (DB.suppliesCatalog||[]).includes('깔판')){
    DB.suppliesCatalog = DB.suppliesCatalog.filter(n=>n!=='깔판');
    if(DB.suppliesStock) delete DB.suppliesStock['깔판'];
    if(DB.suppliesSizes) delete DB.suppliesSizes['깔판'];
    if(DB.suppliesSpecs) delete DB.suppliesSpecs['깔판'];

    saveSuppliesStock();
    saveSuppliesSizes();
    saveSuppliesSpecs();

  DB.currentUserName = results.currentUserName;

async function saveAllNow(){
  const btn = document.getElementById('save-all-btn');
  if(btn){ btn.disabled = true; btn.textContent = '저장 중…'; }
  beginSaving('저장중입니다…');
  saveInFlightCount++;
  const tasks = [
    ['발전기 목록', saveGens], ['임대 이력', saveRentals], ['정비 이력', saveMaint],
    ['출고 대기', saveReservations], ['자재 정보', saveMaterials], ['정비사 목록', saveTechnicians],
    ['정비 경고 기준', saveWarnThreshold], ['부품 재고', savePartsStock], ['부품 규격', savePartsSpecs], ['부품 공급업체', savePartsSupplier],
    ['부품 최소재고', savePartsMinStock], ['부품 입고내역', savePartsPurchaseLog], ['소모품주문', saveConsumableOrders], ['발주 완료표시', saveOrderMarks], ['보완요청', saveImprovements], ['팀원 목록', saveTeamMembers], ['부자재 목록', saveSuppliesCatalog], ['부자재 재고', saveSuppliesStock], ['차량 종류', saveVehicleTypes], ['차량 추천 사용여부', saveVehicleSuggestEnabled], ['발전기 크기 표시 사용여부', saveGenSizeDisplayEnabled], ['모델 색상', saveModelColors], ['공지사항', saveNotices], ['일정표', saveCalendarEvents], ['발전기별 색상', saveGenColorOverrides], ['부자재 크기', saveSuppliesSizes], ['부자재 규격', saveSuppliesSpecs], ['과다사용 기준', saveOveruseDailyLimit], ['업체 정보', saveCompanyInfo]
  ];
  // 동시 요청으로 인한 실패를 피하기 위해 하나씩 순서대로, 실패시 재시도까지 하며 저장합니다.
  const failed = [];
  for(const [label, fn] of tasks){
    const r = await saveOneWithRetry(fn, 3);
    if(!r.ok) failed.push(label);
  }
  saveInFlightCount = Math.max(0, saveInFlightCount-1);
  if(btn){ btn.disabled = false; btn.textContent = '💾 전체 저장'; }
  endSaving();
  if(failed.length===0){
    lastSavedAt = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
    updateLastSavedIndicator();
    flash('전체 저장이 완료되었습니다');
  } else {
    showInfoModal(`다음 항목 저장에 실패했습니다:\n${failed.join(', ')}\n\n인터넷 연결을 확인하고 "전체 저장"을 다시 눌러주세요.`);
  }
}
function renderUserBadge(){
  const el = document.getElementById('user-badge');
  if(!el) return;
  el.textContent = DB.currentUserName ? `${DB.currentUserName}님` : '이름 선택';
}
function openUserNameGate(){
  const names = [...new Set([...(DB.teamMembers||[]), '이성웅','홍승우','이영숙'])];
  const cur = DB.currentUserName;
  const options = names.map(n=>`<button type="button" class="btn${n===cur?' primary':''}" style="font-size:16px;padding:14px 10px;" onclick="submitUserName('${n.replace(/'/g,"\\'")}')">${escR(n)}${n===cur? ' (이전 접속)':''}</button>`).join('');
  document.getElementById('modal-root').innerHTML = `
  <div class="overlay">
    <div class="modal">
      <h3>사용자 선택</h3>
      <div class="modal-sub">이 화면을 여는 모든 사람과 데이터가 공유됩니다. 본인 이름을 눌러주세요.</div>
      <div class="btn-row" style="flex-direction:column;gap:8px;margin-top:10px;">${options}</div>
    </div>
  </div>`;
}
async function submitUserName(nameArg){
  const name = (nameArg||'').trim();
  if(!name) return;
  DB.currentUserName = name;
  closeModal();
  renderUserBadge();
  flash(`${name}님, 환영합니다`);
  saveWithRetry(saveCurrentUserName);
  if(!(DB.teamMembers||[]).includes(name)){
    DB.teamMembers = [...(DB.teamMembers||[]), name];
    saveWithRetry(saveTeamMembers);
  }
}
function changeUserName(){
  openUserNameGate();
}
function shouldSkipSync(){
  if(saveInFlightCount>0) return true;
  const modalRoot = document.getElementById('modal-root');
  if(modalRoot && modalRoot.innerHTML.trim() !== '') return true;
  const active = document.activeElement;
  if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return true;
  return false;
}
let syncInFlight = false;

      peekStorage('gen-fleet-v2', DB.gens),

      peekStorage('gen-maintenance-v2', DB.maint),

      peekStorage('gen-materials-v1', DB.materials),

      peekStorage('gen-parts-minstock-v1', DB.partsMinStock),

      peekStorage('gen-consumable-orders-v1', DB.consumableOrders),
      peekStorage('gen-order-marks-v1', DB.orderMarks),
      peekStorage('gen-improvements-v1', DB.improvements),
      peekStorage('gen-team-members-v1', DB.teamMembers),
      peekStorage('gen-supplies-catalog-v1', DB.suppliesCatalog),
      peekStorage('gen-supplies-stock-v1', DB.suppliesStock),
      peekStorage('gen-vehicle-types-v1', DB.vehicleTypes),
      peekStorage('gen-vehicle-suggest-enabled-v1', DB.vehicleSuggestEnabled),
      peekStorage('gen-size-display-enabled-v1', DB.genSizeDisplayEnabled),
      peekStorage('gen-model-colors-v1', DB.modelColors),
      peekStorage('gen-notices-v1', DB.notices),
      peekStorage('gen-calendar-events-v1', DB.calendarEvents),
      peekStorage('gen-gen-color-overrides-v1', DB.genColorOverrides),
      peekStorage('gen-supplies-sizes-v1', DB.suppliesSizes),
      peekStorage('gen-supplies-specs-v1', DB.suppliesSpecs),
      peekStorage('gen-supplies-categories-v1', DB.suppliesCategories),
      peekStorage('gen-company-info-v1', DB.companyInfo),
      peekStorage('gen-last-backup-date-v1', DB.lastBackupDate)
    ]);
    const before = JSON.stringify({gens:DB.gens,rentals:DB.rentals,maint:DB.maint,reservations:DB.reservations,materials:DB.materials,technicians:DB.technicians,warnThreshold:DB.warnThreshold,overuseDailyLimit:DB.overuseDailyLimit,partsStock:DB.partsStock,partsSpecs:DB.partsSpecs,partsUnit:DB.partsUnit,partsCategory:DB.partsCategory,partsSupplier:DB.partsSupplier,partsMinStock:DB.partsMinStock,partsPurchaseLog:DB.partsPurchaseLog,consumableOrders:DB.consumableOrders,orderMarks:DB.orderMarks,improvements:DB.improvements,teamMembers:DB.teamMembers,suppliesCatalog:DB.suppliesCatalog,suppliesStock:DB.suppliesStock,vehicleTypes:DB.vehicleTypes,vehicleSuggestEnabled:DB.vehicleSuggestEnabled,genSizeDisplayEnabled:DB.genSizeDisplayEnabled,modelColors:DB.modelColors,notices:DB.notices,calendarEvents:DB.calendarEvents,genColorOverrides:DB.genColorOverrides,suppliesSizes:DB.suppliesSizes,suppliesSpecs:DB.suppliesSpecs,suppliesCategories:DB.suppliesCategories,companyInfo:DB.companyInfo,lastBackupDate:DB.lastBackupDate});
    const after = JSON.stringify({gens,rentals,maint,reservations,materials,technicians,warnThreshold,overuseDailyLimit,partsStock,partsSpecs,partsUnit,partsCategory,partsSupplier,partsMinStock,partsPurchaseLog,consumableOrders,orderMarks,improvements,teamMembers,suppliesCatalog,suppliesStock,vehicleTypes,vehicleSuggestEnabled,genSizeDisplayEnabled,modelColors,notices,calendarEvents,genColorOverrides,suppliesSizes,suppliesSpecs,suppliesCategories,companyInfo,lastBackupDate});
    if(before !== after){
      const newNotices = (notices||[]).filter(n=>n && !seenNoticeIds.has(n.id) && n.authorBy!==DB.currentUserName);
      const newEvents = (calendarEvents||[]).filter(e=>e && !seenEventIds.has(e.id) && e.authorBy!==DB.currentUserName);
      seenNoticeIds = new Set((notices||[]).map(n=>n.id));

      DB.gens = gens; DB.rentals = rentals; DB.maint = maint; DB.reservations = reservations;
      DB.materials = materials; DB.technicians = technicians; DB.warnThreshold = warnThreshold; DB.overuseDailyLimit = overuseDailyLimit;

initPasswordGate();
