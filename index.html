const CUSTOMER_TAG_PRESETS = ['입금 문제','장비 관리 불량','회수일자 지연','과다사용'];
function customerRentalStats(customer){
  const all = [];
  DB.rentals.forEach(r=>{ if(r.customer===customer) all.push({...r, status:'완료'}); });
  DB.reservations.forEach(r=>{ if(r.customer===customer) all.push({...r, status: r.pendingLoad? '상차대기':'예약'}); });
  DB.gens.forEach(g=>{ if(g.rental && g.rental.customer===customer) all.push({...g.rental, genId:g.id, status:'진행중'}); });
  return all;
}
function renderCustomerHistoryView(){
  const wrap = document.getElementById('customer-history-wrap');
  if(!wrap) return;
  const records = knownCustomerRecords()
    .map(r=>({...r, cnt: customerRentalStats(r.customer).length}))
    .sort((a,b)=>b.cnt-a.cnt || a.customer.localeCompare(b.customer,'ko'));
  if(records.length===0){ wrap.innerHTML = `<div class="empty">임대 이력이 없습니다.</div>`; return; }
  const rows = records.map(r=>{
    const notes = DB.customerNotes && DB.customerNotes[r.customer];
    const tags = (notes && notes.tags) || [];
    return `<tr${tags.length>0? ` style="background:var(--danger-tint);"`:''}>
      <td class="wrap-ok" style="cursor:pointer;text-decoration:underline dotted;" onclick="openCustomerNotesModal('${r.customer.replace(/'/g,"\\'")}')">${escR(r.customer)}</td>
      <td class="muted">${r.cnt}건</td>
      <td>${tags.length>0? tags.map(t=>`<span class="pill danger" style="margin-right:3px;">${escR(t)}</span>`).join('') : `<span class="muted">-</span>`}</td>
      <td class="muted" style="font-size:12px;">${notes&&notes.note? escR(notes.note) : '-'}</td>
      <td><button class="btn sm" onclick="openCustomerNotesModal('${r.customer.replace(/'/g,"\\'")}')">주의사항 설정</button></td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `<div class="table-scroll"><table>
    <thead><tr><th>거래처명</th><th>임대건수</th><th>주의태그</th><th>주의사항</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}
function openCustomerNotesModal(customer){
  const notes = (DB.customerNotes && DB.customerNotes[customer]) || {tags:[], note:''};
  const allTagOptions = [...new Set([...CUSTOMER_TAG_PRESETS, ...(notes.tags||[])])];
  const rentals = customerRentalStats(customer).sort((a,b)=>((b.outDate||b.plannedOutDate||'')).localeCompare((a.outDate||a.plannedOutDate||'')));
  const statusPill = st => {
    if(st==='완료') return `<span class="pill gray">완료</span>`;
    if(st==='진행중') return `<span class="pill warn">진행중</span>`;
    if(st==='상차대기') return `<span class="pill warn">상차대기</span>`;
    return `<span class="pill gray">예약</span>`;
  };
  const cardHtml = r=>{
    const g = findGen(r.genId);
    const fuel = r.fuelRequested!=null ? r.fuelRequested : r.fuelActual;
    const overuse = r.status==='완료' && isRentalOveruse(r);
    const period = r.status==='완료'
      ? `${dow(r.outDate)||'-'} ~ ${dow(r.inDate)||'-'} (${rentalDays(r)||'-'}일, 사용 ${(r.usedHours||0).toLocaleString()}h)`
      : `${dow(r.outDate||r.plannedOutDate)||'-'} 출고${r.usageDays? ` · 사용일수 ${r.usageDays}일 예정`:''}`;
    return `<div style="border:1px solid ${overuse?'var(--danger)':'var(--border)'};border-radius:8px;padding:10px 12px;margin-bottom:8px;${overuse?'background:var(--danger-tint);':''}">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;">
        <b class="gid">${escR(r.genId||'-')}</b>
        <span class="muted" style="font-size:12.5px;">${g? displayModel(g):(r.model? escR(r.model):'')}</span>
        ${statusPill(r.status)}
        ${overuse? `<span class="pill danger" title="일평균 ${rentalAvgDaily(r).toFixed(1)}h/일">🚨 과다사용</span>`:''}
      </div>
      <div class="muted" style="font-size:12.5px;line-height:1.6;">
        기간: ${period}<br>
        담당자/연락처: ${escR(r.manager||'-')} / ${escR(r.phone||'-')}<br>
        현장 주소: ${escR(r.address||r.site||'-')}<br>
        전압: ${escR(r.voltage||'-')} · 부자재: ${escR(r.supplies||'없음')} · 연료: ${fuel!=null? fuel+'L':'-'}
        ${r.note? `<br>비고: ${escR(r.note)}`:''}
      </div>
    </div>`;
  };
  const histHtml = rentals.length>0 ? `<div style="max-height:400px;overflow-y:auto;margin-top:6px;">${rentals.map(cardHtml).join('')}</div>` : `<div class="hint">임대 이력이 없습니다.</div>`;
  document.getElementById('modal-root').innerHTML = `
  <div class="overlay" onclick="backdropClick(this,event,closeModal)">
    <div class="modal" style="max-width:820px;">
      <h3>거래처 주의사항</h3>
      <div class="modal-sub">${escR(customer)}</div>
      <div class="field">
        <label>주의 태그 (여러 개 선택 가능)</label>
        <div class="btn-row" id="cn-tags-wrap">${allTagOptions.map(t=>`<button type="button" class="btn sm${notes.tags.includes(t)?' danger':''}" onclick="toggleCustomerTag(this)" data-tag="${escR(t)}">${escR(t)}</button>`).join('')}</div>
        <div class="consumable-row" style="margin-top:8px;">
          <input type="text" id="cn-new-tag" placeholder="새 태그 직접 입력 (예: VIP거래처)" onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomCustomerTag();}">
          <button type="button" class="btn sm" onclick="addCustomCustomerTag()">태그 추가</button>
        </div>
      </div>
      <div class="field"><label>주의사항 (자유 입력)</label><textarea id="cn-note" placeholder="예: 2026년 3월 대금 3주 지연 지급됨" style="min-height:110px;">${escR(notes.note||'')}</textarea></div>
      <div class="section-title" style="font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <span>이 거래처 임대 이력 <span class="cnt">${rentals.length}건</span></span>
        <button type="button" class="btn sm" onclick="downloadCustomerHistoryPrintFile('${customer.replace(/'/g,"\\'")}')">🖨 인쇄</button>
      </div>
      ${histHtml}
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">취소</button>
        ${(notes.tags.length>0||notes.note)? `<button class="btn danger" onclick="clearCustomerNotes('${customer.replace(/'/g,"\\'")}')">주의사항 삭제</button>`:''}
        <button class="btn primary" onclick="submitCustomerNotes('${customer.replace(/'/g,"\\'")}')">저장</button>
      </div>
    </div>
  </div>`;
}
function toggleCustomerTag(btn){
  btn.classList.toggle('danger');
}
function addCustomCustomerTag(){
  const input = document.getElementById('cn-new-tag');
  if(!input) return;
  const val = input.value.trim();
  if(!val) return;
  const wrap = document.getElementById('cn-tags-wrap');
  const existing = [...wrap.querySelectorAll('button')].find(b=>b.dataset.tag===val);
  if(existing){ existing.classList.add('danger'); input.value=''; return; }
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'btn sm danger';
  btn.dataset.tag = val;
  btn.textContent = val;
  btn.onclick = function(){ toggleCustomerTag(btn); };
  wrap.appendChild(btn);
  input.value = '';
}

function csvEscape(v){
  const s = (v==null?'':String(v));
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadCsv(filename, rows){
  const csv = '\uFEFF'+rows.map(row=>row.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

// ---------- 폴더 자동 저장 (File System Access API, 크롬/엣지 전용) ----------
function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('gen-app-fsapi', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGetHandle(key){
  try{
    const db = await idbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get(key);
      req.onsuccess = ()=> resolve(req.result||null);
      req.onerror = ()=> reject(req.error);
    });
  }catch(e){ return null; }
}
async function idbSetHandle(key, value){
  try{
    const db = await idbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(value, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){ return false; }
}
function supportsAutoBackupFolder(){ return typeof window.showDirectoryPicker === 'function'; }
async function setupAutoBackupFolder(){
  if(!supportsAutoBackupFolder()){
    showInfoModal('이 브라우저는 폴더 자동 저장 기능을 지원하지 않습니다. 크롬(Chrome)·엣지(Edge)·네이버 웨일 같은 브라우저로 접속해서 다시 시도해주세요.');
    return;
  }
  try{
    const dirHandle = await window.showDirectoryPicker();
    const perm = await dirHandle.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){ showInfoModal('폴더 쓰기 권한이 허용되지 않았습니다.'); return; }
    if((DB.gens||[]).length===0){
      showInfoModal('발전기 데이터가 아직 불러와지지 않은 상태입니다. 화면을 새로고침해서 데이터가 다 보이는 걸 확인한 뒤 다시 시도해주세요.');
      return;
    }
    await idbSetHandle('backupDir', dirHandle);
    await writeBackupToHandle(dirHandle);
    localStorage.setItem('gen-auto-backup-last-date', todayStr());
    localStorage.setItem('gen-auto-backup-last-gencount', String((DB.gens||[]).length));
    flash('자동 백업 폴더가 설정되었습니다. 앱을 열 때마다 이 폴더에 최신 백업이 자동으로 저장됩니다.');
    renderContent();
  }catch(e){

let autoBackupFolderActive = false;
async function writeBackupToHandle(dirHandle){
  const backup = buildFullBackupObject();
  const fileHandle = await dirHandle.getFileHandle(`발전기관리_자동백업_${todayStr()}.json`, {create:true});
  const writable = await fileHandle.createWritable();
  await writable.write(JSON.stringify(backup, null, 2));
  await writable.close();
}
async function tryAutoBackupToFolder(){
  if(!supportsAutoBackupFolder()) return;
  const dirHandle = await idbGetHandle('backupDir');
  if(!dirHandle) return;
  try{
    const perm = await dirHandle.queryPermission({mode:'readwrite'});
    if(perm!=='granted') return; // 권한이 사라졌으면 조용히 건너뜀 (설정 화면에서 다시 지정하도록 안내)
    autoBackupFolderActive = true;
    if(currentTab==='dashboard') renderContent(); // 백업 리마인더 배너를 즉시 감추기 위해
    if(localStorage.getItem('gen-auto-backup-last-date')===todayStr()) return;
    // 안전장치: 새로고침 도중 일부 데이터를 못 불러와 비정상적으로 적은 상태로
    // 자동저장이 실행되어 정상 백업을 덮어쓰는 사고를 막습니다.
    const genCount = (DB.gens||[]).length;
    const lastKnownGood = Number(localStorage.getItem('gen-auto-backup-last-gencount')||0);
    if(genCount===0 || (lastKnownGood>0 && genCount < lastKnownGood*0.5)){
      console.warn(`자동저장 건너뜀: 발전기 수(${genCount})가 이전 저장 시점(${lastKnownGood})보다 비정상적으로 적어 데이터 로딩이 덜 된 것으로 보입니다. 다음 접속시 다시 시도합니다.`);
      return;
    }
    await writeBackupToHandle(dirHandle);
    localStorage.setItem('gen-auto-backup-last-date', todayStr());
    localStorage.setItem('gen-auto-backup-last-gencount', String(genCount));
    flash(`"${dirHandle.name}" 폴더에 자동저장되었습니다`);
  }catch(e){ /* 조용히 무시, 다음 접속시 재시도 */ }
}
async function turnOffAutoBackupFolder(){
  await idbSetHandle('backupDir', null);

      let changed = false;
      if(rec.partsUsed){
        rec.partsUsed.forEach(p=>{
          if(typeof p==='object' && p.partName){
            DB.partsStock[p.partName] = (DB.partsStock[p.partName]||0) + (p.qty||1);
            changed = true;
          }
        });
      }
      if(changed) await savePartsStock();
    }
    DB.maint = DB.maint.filter(m=>m.id!==mid);
    recomputeLastMaint(genId);
    await saveMaint();
    await saveGens();
    renderGenHistory();
    flash('삭제되었습니다');
  }, '삭제');
}

function renderSettlementTab(){
  const cutoff = new Date(Date.now()-90*86400000);
  const utilList = activeGens().sort(sortByIdNatural).map(g=>{
    const gRentals = DB.rentals.filter(r=>r.genId===g.id && r.outDate && r.inDate);
    let daysOut = 0;
    gRentals.forEach(r=>{
      const outD = new Date(r.outDate+'T00:00:00');
      const inD = new Date(r.inDate+'T00:00:00');
      const s = outD>cutoff ? outD : cutoff;
      if(inD>s) daysOut += Math.round((inD-s)/86400000);
    });
    if(g.status==='out' && g.rental && g.rental.outDate){
      const outD = new Date(g.rental.outDate+'T00:00:00');
      const s = outD>cutoff ? outD : cutoff;
      const now = new Date();
      if(now>s) daysOut += Math.round((now-s)/86400000);
    }
    const rate = Math.max(0, Math.min(100, Math.round(daysOut/90*100)));
    return {g, rate, daysOut};
  }).sort((a,b)=>b.rate-a.rate);
  const utilRowHtml = x=>{
    const color = x.rate>=70? 'var(--ok)' : x.rate>=40? 'var(--warn)' : 'var(--danger)';
    return `<tr><td class="gid">${x.g.id}</td><td class="wrap-ok">${displayModel(x.g)}</td><td class="muted">${x.daysOut}일</td><td><div class="gauge-wrap"><div class="gauge"><div class="gauge-fill" style="width:${x.rate}%;background:${color};"></div></div><span class="gauge-txt" style="color:${color};">${x.rate}%</span></div></td></tr>`;
  };
  const utilHalf = Math.ceil(utilList.length/2);
  const utilRows1 = utilList.slice(0, utilHalf).map(utilRowHtml).join('');
  const utilRows2 = utilList.slice(utilHalf).map(utilRowHtml).join('');

  const byCustomer = {};
  DB.rentals.forEach(r=>{

    byCustomer[key].count++;

  const overuseList = overuseRentalsList();
  const overuseRows = overuseList.map(r=>{
    const g = findGen(r.genId);
    const avg = rentalAvgDaily(r);
    const days = rentalDays(r);
    return `<tr>
      <td class="gid">${r.genId}</td>
      <td class="wrap-ok">${g? displayModel(g) : '-'}</td>
      <td class="wrap-ok">${escR(r.customer||'-')}</td>
      <td class="muted" style="font-size:12px;">${dow(r.outDate)||'-'} ~ ${dow(r.inDate)||'-'}</td>
      <td class="muted">${(r.usedHours||0).toLocaleString()}h / ${days}일</td>
      <td><span style="color:var(--danger);font-weight:800;">${avg.toFixed(1)}h/일</span></td>
    </tr>`;
  }).join('');

  return `
    <div class="section-title">거래처별 임대 건수</div>
    ${Object.keys(byCustomer).length===0? `<div class="empty">데이터가 없습니다.</div>` : `
    <div class="table-scroll"><table>
      <thead><tr><th>거래처</th><th>임대 건수</th></tr></thead>
      <tbody>${customerRows}</tbody>
    </table></div>`}

    <div class="section-title" style="color:${overuseList.length>0?'var(--danger)':''};">🚨 일일 과다사용 이력 (하루 ${overuseLimit()}시간 초과) <span class="cnt" style="${overuseList.length>0?'background:var(--danger-tint);color:var(--danger);border-color:var(--danger);':''}">${overuseList.length}건</span></div>
    <p class="muted" style="font-size:13px;margin-top:-4px;">임대기간 동안 하루 평균 ${overuseLimit()}시간을 초과해서 사용된 건입니다. (출고시 누적시간과 입고시 누적시간의 차이 ÷ 사용일수로 계산) 과다사용이 잦으면 정비 주기가 앞당겨질 수 있으니 확인해주세요.</p>
    ${overuseList.length===0? `<div class="empty">과다사용 이력이 없습니다.</div>` : `
    <div class="table-scroll"><table>
      <thead><tr><th>번호</th><th>모델</th><th>거래처</th><th>기간</th><th>총사용/일수</th><th>일평균 사용</th></tr></thead>
      <tbody>${overuseRows}</tbody>

    <p class="muted" style="font-size:13px;margin-top:-4px;">최근 90일 중 출고(임대)되어 있던 일수 비율입니다. 낮은 순으로 확인하면 놀고 있는 장비를 파악할 수 있습니다.</p>

function normalizeUrl(u){
  const s = (u||'').trim();
  if(!s) return '';
  if(/^https?:\/\//i.test(s)) return s;
  return `https://${s}`;
}
function renderConsumableOrderTable(){
  const wrap = document.getElementById('consumable-order-wrap');

  const list = DB.consumableOrders || [];
  if(list.length===0){ wrap.innerHTML = `<div class="empty">등록된 소모품주문 항목이 없습니다. 위에서 추가해주세요.</div>`; return; }
  wrap.innerHTML = list.map(item=>{

    const specParts = [item.spec1, item.spec2].filter(Boolean).join(' / ');

      ['📱 QR 코드 관리', '발전기마다 붙일 QR코드를 만드는 곳입니다. "🖨 신규 발전기 QR 인쇄 파일 만들기"는 아직 QR을 뽑은 적 없는 발전기만 골라서 인쇄용 파일을 만들어주고, 한번 뽑은 발전기는 번호가 그대로면 다음에 새 발전기를 추가로 등록해도 다시 뽑히지 않아 이미 붙여둔 QR과 계속 같은 채로 유지됩니다. 지금 몇 대가 신규 발급 대상인지도 화면에 숫자로 보여줍니다. QR을 분실·훼손해서 이미 뽑은 것까지 포함해 전부 다시 뽑아야 할 때는 "🔁 전체 다시 인쇄" 버튼을 따로 이용합니다(확인 문구가 한 번 뜹니다). 발전기 한 대씩 QR을 다시 보고 싶으면 [발전기 모델 설정] 목록의 "관리" 버튼 안 "📱 QR코드 보기"에서도 확인할 수 있습니다.'],
      ['📥 엑셀로 불러오기', '[설정 → 관리자 모드] 안에 있는 기능입니다. "📋 엑셀 양식 다운로드" 버튼을 누르면 정해진 양식(시트 6개: 임대이력·정비이력·자재목록·부자재목록·정비사명단·사용자명단) 파일이 바로 받아지고, 그 양식에 맞춰 다른 곳에서 관리하던 데이터를 작성해서 올리면 한 번에 옮겨옵니다. [임대이력]에서 목록에 없는 발전기번호는 새 발전기로 자동 등록되고, 입고일까지 채워진 완료 건은 [이력 조회]에, 입고일을 비워둔(아직 반납 안 된) 건은 [출고중] 목록에 들어갑니다. [정비이력]은 부품:수량 형식으로 사용부품까지 정비이력에 반영되고, [자재목록]·[부자재목록]은 재고·규격·카테고리까지, [정비사명단]은 최대 3명, [사용자명단]은 팀원 목록에 추가됩니다. 필요 없는 시트는 비워두면 됩니다. 업로드하면 시트별로 몇 건씩 들어가는지, 형식이 안 맞아 건너뛴 행은 몇 번째 줄이고 왜 건너뛰었는지까지 먼저 보여주고 "가져오기 실행"을 눌러야 실제로 반영됩니다.'],
      ['전체 백업 다운로드 / 복원', '발전기·임대·정비·예약·자재·부품재고·부자재·차량종류·색상설정·팀원목록 등 모든 데이터를 파일 하나로 저장하거나, 백업 파일로 되돌립니다. (접속 비밀번호는 보안상 백업 대상에서 제외됩니다) 비밀번호 없이 누구나 바로 이용할 수 있습니다.'],
      ['📁 폴더 자동 저장', '"자동 백업 폴더 설정" 버튼으로 컴퓨터의 폴더를 한 번 지정해두면, 그 다음부터는 다운로드 버튼을 안 눌러도 앱을 열 때마다 그 폴더에 최신 백업 파일이 자동으로 저장되고, 저장되면 "OO 폴더에 자동저장되었습니다" 메시지가 잠깐 뜹니다. 파일은 지정한 그 폴더 안에 "발전기관리_자동백업_YYYY-MM-DD.json" 이름으로 날짜별로 쌓여서 저장되어, 예전 날짜 백업도 폴더 안에 그대로 남아있습니다. 자동 저장이 켜져 있으면 [전체현황]에 뜨던 "정기 백업을 아직 안 하셨어요" 리마인더 배너는 더 이상 뜨지 않습니다. 새로고침 도중 네트워크 문제로 발전기 데이터를 다 못 불러온 비정상적인 상태에서는 자동저장을 건너뛰어, 불완전한 상태로 오늘자 백업이 덮어써지는 사고를 방지합니다(다음 접속시 정상 상태면 다시 저장됩니다). 크롬·엣지·네이버 웨일 같은 크로미움 기반 브라우저에서만 되고, 사파리·파이어폭스는 지원하지 않습니다. 이 설정은 지정한 그 컴퓨터·그 브라우저에만 적용되며(다른 팀원 화면에는 영향 없음), 하루에 한 번만 저장하고, "폴더 변경"·"자동 저장 끄기"로 언제든 바꿀 수 있습니다.'],
      ['🔐 관리자 모드 (업체 정보 · 위험 구역)', '업체 정보 수정과 위험 구역(초기화) 작업은 관리자 모드 안에 있습니다. 사이트 접속 비밀번호와는 별개인 전용 관리자 비밀번호를 입력해야 열리며, 이 비밀번호는 화면에서 바꿀 수 없게 고정되어 있습니다. 열리면 5분 동안 유지되고, "지금 잠그기"를 누르거나 5분이 지나면 자동으로 다시 잠깁니다. 열린 동안에는 업체명·주소·전화번호·휴대폰 번호를 수정할 수 있고, 입고로 초기화·출고로 초기화·정비내역 초기화·부품재고 초기화·고객정보 초기화·전체 초기화 버튼도 다시 잠글 때까지 계속 이용할 수 있습니다. 되돌릴 수 없는 작업들이니 실행 전 먼저 백업을 받아두세요.'],
      ['정비 임박 경고 기준 / 과다사용 기준', '잔여시간이 얼마 이하면 "임박"으로 표시할지, 하루 몇 시간 초과 사용을 "과다사용"으로 볼지 각각 숫자로 직접 설정할 수 있습니다. 기본값은 각각 50h, 10h입니다.'],
      ['팀원 목록', '사용자 선택 화면에 뜨는 이름 목록을 관리합니다.'],
      ['정비사 목록', '정비 등록시 선택할 정비사 이름을 최대 3명까지 등록합니다. 여기 등록된 이름과 접속시 선택한 이름이 같아야만 전압 변경, 정비 등록·수정·삭제, 소요자재입력, 부품 재고 등록·수정·삭제 같은 작업을 할 수 있습니다. 등록 안 된 이름으로 시도하면 "정비사로 등록된 사람만 할 수 있습니다" 안내가 뜨고 저장되지 않습니다.'],
      ['발전기 모델 설정', '번호별 모델(용량), 년식, 정격대비사용을 입력합니다. "관리" 버튼으로 번호(ID) 수정, 매각/폐기 처리, 완전 삭제(등록을 잘못했을 때만)까지 한 곳에서 할 수 있습니다. 폐기 처리시 폐기일자·폐기업체명·전화번호·처리방법·폐기사유·폐차수익을 함께 기록할 수 있습니다.'],
      ['모델별 색상 설정', '모델마다 색상을 지정하면 발전기 목록(입고/출고중/출고대기 등)에서 모델명 옆에 색상 점으로 표시되어 구분하기 쉽습니다. 용량대별로 묶어서 모델명과 함께 보여줍니다.'],
      ['발전기별 색상 고정', '특정 발전기 번호에 색을 고정하면, 모델명이 바뀌거나 그 모델의 색상이 바뀌어도 그 발전기만은 항상 지정한 색으로 표시됩니다. 모델별 색상보다 우선 적용됩니다.'],
      ['연료탱크 규격 · 전압 설정 방법', '모델별 탱크 크기(자동 연료환산용), 발전기 자체 크기(가로×세로×높이 — 차량 추천에 사용), 220V/380V/380V 이상/기타참고 셋팅법 사진(종류별 최대 3장)을 등록합니다. 사진 등록·수정·삭제는 이 화면(설정)에서만 가능하며, 입고 목록의 전압 클릭·입고 처리 화면에는 등록된 사진이 보기 전용(클릭하면 크게 보기)으로만 나타납니다.'],
      ['발전기별 발전기 크기 (개별 설정)', '같은 모델이라도 실제 발전기 크기(가로×세로×높이)가 다른 경우, 번호로 찾아서 그 발전기만 따로 입력할 수 있습니다. 비워두면 모델 기본값을 그대로 사용하며, 차량 추천 계산에도 개별 값이 우선 적용됩니다. 개별 설정된 발전기는 목록에 바로 표시되고, "삭제" 버튼으로 개별 설정을 지우면 모델 기본값으로 되돌아갑니다.'],
      ['발전기별 탱크 규격 · 기준높이 (개별 설정)', '같은 모델이라도 실제 탱크 크기가 다른 발전기가 있으면, 번호로 찾아서 그 발전기만 가로×세로×높이와 바닥 기준높이(모델 기본값과 다른 경우)를 한 번에 입력할 수 있습니다. 비워두면 위 "연료탱크 규격 · 전압 설정 방법"에서 등록한 모델 기본값이 그대로 적용됩니다. 계산되는 "남은 연료량"은 이 기준높이만큼(항상 남아있어 실제로 쓸 수 없는 양)을 자동으로 빼고 계산됩니다. 개별 설정된 발전기는 목록에 바로 표시되고, "삭제" 버튼으로 지울 수 있습니다. 높이가 세로(깊이)에 비해 유난히 낮게 입력된 경우(세로·높이를 바꿔 입력하는 실수가 흔함) 그 항목이 빨간색으로 표시되어 바로 눈에 띕니다.'],
      ['차량 종류 · 적재함 크기', '보유 차량과 적재함 크기(가로×세로×높이)를 등록해두면, 출고하기 화면에서 발전기 크기와 비교해 어떤 차량을 써야 하는지, 여러 대를 함께 실을 수 있는지까지 자동으로 추천해줍니다. "차량 추천 기능 사용"과 "발전기 크기만 표시" 두 체크박스로 출고하기 화면에 무엇을 보여줄지 따로 켜고 끌 수 있습니다.'],
      ['폐기된/매각된 발전기', '처리된 발전기 목록입니다. "복원" 버튼으로 다시 살릴 수 있습니다.']
    ])}

    ${manualSection('💡','잘 안 보이는 기능들 (숨은 기능 모음)', true,
      '화면에 버튼은 없지만 뒤에서 자동으로 동작하거나, 알아두면 편한 기능들을 모았습니다.', [
      ['🔔 새 소식 자동 알림', '다른 팀원이 새 공지사항이나 새 일정을 올리면, 앱을 켜둔 모든 사람 화면에 자동으로 팝업이 뜹니다. "내용 확인"을 누르면 해당 내용으로 바로 이동합니다. 본인이 쓴 글로는 본인에게 팝업이 뜨지 않습니다.'],
      ['✅ 출고하기 2단계 확인', "[입고] 탭에서 출고하기를 누르고 정보를 다 입력한 뒤 '출고하기'를 다시 누르면, 바로 저장되지 않고 인수증 모양의 확인 화면이 한 번 더 뜹니다. 입력한 내용이 맞는지 확인하고 '✅ 확인, 출고 등록'을 눌러야 실제로 등록됩니다. '✏️ 돌아가서 수정'을 누르면 방금 입력한 값이 그대로 복원됩니다."],
      ['🔒 관리자 모드는 별도 고정 비밀번호로 보호됨', '[설정 → 🔐 관리자 모드]는 접속 비밀번호와는 별개인 전용 관리자 비밀번호로만 열립니다. 이 비밀번호는 화면 어디에서도 바꿀 수 없게 고정되어 있습니다. 한 번 열면 업체 정보 수정과 위험 구역 작업을 5분 동안 자유롭게 할 수 있고, 5분이 지나거나 "지금 잠그기"를 누르면 자동으로 다시 잠깁니다.'],
      ['🎨 발전기별 색상 고정', '[설정 → 발전기별 색상 고정]에 번호를 등록해두면, 그 발전기는 모델이 바뀌든 모델 색상이 바뀌든 항상 지정한 색으로만 표시됩니다. 특정 발전기를 한눈에 구분하고 싶을 때 씁니다.'],
      ...(DB.vehicleSuggestEnabled===false? [] : [['🚚 차량 추천 (여러 대 동시 적재 포함)', '[설정]에서 발전기 크기와 차량 적재함 크기를 등록해두면, 출고하기 화면에서 이 발전기를 실을 수 있는 차량을 자동으로 추천해줍니다. "수량"을 2대 이상으로 입력하면, 한 차량에 여러 대를 함께 실을 수 있는지까지 계산해서 적재함 위에서 본 배치 그림과 함께 추천해줍니다. 지게차 포크 구멍이 발전기 긴 변에 있어 차량 옆에서만 실을 수 있다는 점을 반영해서, 발전기를 90도로 돌려 싣는 경우는 계산하지 않습니다 (짧은 변이 항상 적재함 가로, 긴 변이 세로 방향). 배치 그림에는 위쪽이 "▲ 차량 앞부분", 아래쪽이 "▼ 차량 뒷부분"으로 빨간 글씨로 표시되어 어느 방향으로 실어야 하는지 헷갈리지 않습니다.']]),
      ...(DB.genSizeDisplayEnabled? [['🚛 발전기 크기만 표시', '[설정 → 차량 종류 · 적재함 크기]에서 "발전기 크기만 표시"를 켜두면, 출고하기 화면에서 차량 매칭 없이 이 발전기의 가로×세로×높이만 참고용으로 보여줍니다. 차량 추천 기능과는 별개로 켜고 끌 수 있어, 둘 다 켜면 차량 추천이 우선 표시됩니다.']] : []),
      ['👤 거래처 자동완성', '출고하기에서 거래처명을 입력할 때 이전에 거래했던 곳을 선택하면 담당자·연락처·주소가 자동으로 채워집니다.'],
      ['🔧 정비 부품 자동 선택', '정비 등록에서 "필터 교체" 같은 정비 내용을 체크하면, 그 모델에 등록해둔 해당 부품이 자동으로 같이 선택되고 재고가 차감됩니다.'],

function renderImprovementsTab(){
  const cnt = (DB.improvements||[]).length;
  const openCnt = (DB.improvements||[]).filter(x=>!x.completedBy).length;
  return `
    <div class="section-title">🛠 보완요청 <span class="cnt">${cnt}건</span>${openCnt>0? ` <span class="cnt" style="background:var(--warn-tint);color:var(--warn);border-color:var(--warn);">미해결 ${openCnt}건</span>`:''}</div>
    <p class="muted" style="font-size:13px;margin-top:-4px;">이 시스템에서 고쳤으면 하는 점, 불편한 점, 버그 등을 자유롭게 남겨주세요. 작성자 이름이 함께 기록되고, 나중에 수정한 사람이 "개선완료"로 표시할 수 있습니다.</p>
    <div class="field" style="max-width:100%;margin-top:6px;">
      <label>보완요청 작성 (작성자: ${escR(DB.currentUserName||'이름 미선택')})</label>
      <div class="consumable-row" style="flex-wrap:wrap;">
        <textarea id="f-imp-content" placeholder="예: 출고 화면에서 ○○ 항목이 자꾸 초기화돼요" style="flex:1;min-width:220px;min-height:60px;"></textarea>
        <button type="button" class="btn sm primary" style="align-self:flex-start;" onclick="addImprovement()">등록</button>
      </div>
    </div>
    <div id="improvements-wrap" style="margin-top:14px;"></div>
  `;
}
function renderImprovementsList(){
  const wrap = document.getElementById('improvements-wrap');
  if(!wrap) return;
  const list = [...(DB.improvements||[])].sort((a,b)=>{
    const aOpen = !a.completedBy, bOpen = !b.completedBy;
    if(aOpen!==bOpen) return aOpen? -1:1;
    return (b.createdDate||'').localeCompare(a.createdDate||'');
  });
  if(list.length===0){ wrap.innerHTML = `<div class="empty">등록된 보완요청이 없습니다.</div>`; return; }
  wrap.innerHTML = list.map(item=>{
    const done = !!item.completedBy;
    return `<div class="material-card" style="${done? 'opacity:.72;':''}">
      <div class="m-title" style="align-items:flex-start;">
        <span class="muted" style="font-size:11.5px;">✍ ${escR(item.authorBy||'이름미상')} · ${dow(item.createdDate)||'-'}</span>
        <div class="btn-row" style="flex-wrap:nowrap;">
          ${done
            ? `<button type="button" class="btn sm" style="white-space:nowrap;" onclick="unmarkImprovementDone('${item.id}')" title="다시 미해결로 되돌리려면 클릭">완료취소</button>`
            : `<button type="button" class="btn sm primary" style="white-space:nowrap;" onclick="markImprovementDone('${item.id}')">개선완료로 표시</button>`}
          <button type="button" class="btn sm danger" onclick="removeImprovement('${item.id}')">삭제</button>
        </div>
      </div>
      <div style="font-size:13.5px;white-space:pre-wrap;line-height:1.5;">${escR(item.content)}</div>
      ${done? `<div style="margin-top:8px;"><span class="pill ok">✅ 개선완료</span> <span class="muted" style="font-size:11.5px;">${escR(item.completedBy)} · ${dow(item.completedDate)}</span></div>` : ''}
    </div>`;
  }).join('');
}
async function addImprovement(){
  const ta = document.getElementById('f-imp-content');
  const content = ta.value.trim();
  if(!content){ flash('내용을 입력해주세요'); return; }
  const newId = uid();
  DB.improvements = [...(DB.improvements||[]), {
    id: newId, content, authorBy: DB.currentUserName||'이름미상', createdDate: todayStr(),
    completedBy: null, completedDate: null
  }];
  markOneReadFor('improvements', newId);
  await saveImprovements();
  ta.value = '';
  renderImprovementsList();
  renderTabbar();
  flash('보완요청이 등록되었습니다');
}
async function markImprovementDone(id){
  const item = (DB.improvements||[]).find(x=>x.id===id);
  if(!item) return;
  item.completedBy = DB.currentUserName || '이름미상';
  item.completedDate = todayStr();
  await saveImprovements();
  renderImprovementsList();
  flash('개선완료로 표시되었습니다');
}
async function unmarkImprovementDone(id){
  const item = (DB.improvements||[]).find(x=>x.id===id);
  if(!item) return;
  item.completedBy = null;
  item.completedDate = null;
  await saveImprovements();
  renderImprovementsList();
  flash('완료 표시가 취소되었습니다');
}
function removeImprovement(id){
  openConfirmModal('이 보완요청을 삭제할까요?', async function(){
    DB.improvements = (DB.improvements||[]).filter(x=>x.id!==id);
    await saveImprovements();
    closeModal();
    renderImprovementsList();
    flash('삭제되었습니다');
  }, '삭제');
}

let calYear = null, calMonth = null;
function initCalendarView(){
  if(calYear==null || calMonth==null){
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
  }
}
function navCalendar(delta){
  initCalendarView();
  calMonth += delta;
  if(calMonth<0){ calMonth = 11; calYear--; }
  else if(calMonth>11){ calMonth = 0; calYear++; }
  renderCalendar();
}
function calendarGoToday(){
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();
}
function pad2(n){ return String(n).padStart(2,'0'); }
function renderCalendar(){
  const wrap = document.getElementById('calendar-wrap');
  if(!wrap) return;
  initCalendarView();
  const labelEl = document.getElementById('calendar-month-label');
  if(labelEl) labelEl.textContent = `${calYear}년 ${calMonth+1}월`;
  const firstDow = new Date(calYear, calMonth, 1).getDay();
  const totalDays = new Date(calYear, calMonth+1, 0).getDate();
  const todayS = todayStr();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=totalDays; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  const dowLabels = ['일','월','화','수','목','금','토'];
  const headHtml = dowLabels.map((l,i)=>`<div style="text-align:center;font-size:13px;font-weight:700;padding:5px 0;color:${i===0?'var(--danger)':i===6?'var(--primary-dark)':'var(--ink-soft)'};">${l}</div>`).join('');
  const cellsHtml = cells.map((d,idx)=>{
    if(d==null) return `<div style="min-height:88px;background:var(--surface-2);border-radius:6px;"></div>`;
    const dateStr = `${calYear}-${pad2(calMonth+1)}-${pad2(d)}`;
    const isToday = dateStr===todayS;
    const dowIdx = idx % 7;
    const evs = (DB.calendarEvents||[]).filter(e=>e.date===dateStr);
    const evHtml = evs.slice(0,4).map(e=>`<div style="color:var(--primary-dark);font-weight:600;font-size:11.5px;margin-top:3px;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${escR(e.text)}</div>`).join('');
    const moreTxt = evs.length>4? `<div class="muted" style="font-size:10.5px;margin-top:1px;">+${evs.length-4}건 더</div>` : '';
    return `<div style="min-height:88px;border:1px solid var(--border);border-radius:6px;padding:5px;cursor:pointer;${isToday?'background:var(--warn-tint);border-color:var(--warn);':''}" onclick="openCalendarDayModal('${dateStr}')">
      <div style="font-size:13px;font-weight:${isToday?'800':'600'};color:${dowIdx===0?'var(--danger)':dowIdx===6?'var(--primary-dark)':'var(--ink)'};">${d}</div>
      ${evHtml}${moreTxt}
    </div>`;
  }).join('');
  wrap.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:2px;">${headHtml}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${cellsHtml}</div>
  `;
}

function tomorrowStr(){
  const d = new Date(todayStr()+'T00:00:00');
  d.setDate(d.getDate()+1);
  return toLocalDateStr(d);
}
function loadingPopupData(){
  const today = todayStr(), tomorrow = tomorrowStr();
  const pending = (DB.reservations||[]).filter(r=>r.pendingLoad);
  const loadDateOf = r => r.loadDate || r.outDate;
  const todayLoad = pending.filter(r=>loadDateOf(r)===today).sort((a,b)=>(a.genId||'').localeCompare(b.genId||''));
  const tomorrowLoad = pending.filter(r=>loadDateOf(r)===tomorrow).sort((a,b)=>(a.genId||'').localeCompare(b.genId||''));
  const outWithExpected = activeGens().filter(g=>g.status==='out' && g.rental && expectedInDate(g.rental));
  const todayIn = outWithExpected.filter(g=>expectedInDate(g.rental)===today).sort(sortByIdNatural);
  const tomorrowIn = outWithExpected.filter(g=>expectedInDate(g.rental)===tomorrow).sort(sortByIdNatural);
  return {today, tomorrow, todayLoad, tomorrowLoad, todayIn, tomorrowIn,
    total: todayLoad.length+tomorrowLoad.length+todayIn.length+tomorrowIn.length};
}

  const {today, tomorrow, todayLoad, tomorrowLoad, todayIn, tomorrowIn} = loadingPopupData();
  const loadRowHtml = r=>{

    const extra = [r.supplies? `부자재: ${escR(r.supplies)}` : '', r.note? `비고: ${escR(r.note)}` : ''].filter(Boolean).join(' · ');

  const inCol = `<div style="flex:1;min-width:0;">${section(`📥 오늘(${dow(today)}) 입고예정`, todayIn, inRowHtml)}${section(`📥 내일(${dow(tomorrow)}) 입고예정`, tomorrowIn, inRowHtml)}</div>`;
  return `<div class="util-two-col" style="align-items:flex-start;">${loadCol}${inCol}</div>`;
}

async function submitRenameGen(oldId){
  const newId = document.getElementById('f-rename-id').value.trim();
  const errEl = document.getElementById('f-err');
  if(!newId){ errEl.textContent='번호를 입력해주세요.'; errEl.style.display='block'; return; }
  if(newId!==oldId && DB.gens.some(g=>g.id===newId)){ errEl.textContent='이미 존재하는 번호입니다.'; errEl.style.display='block'; return; }
  const g = findGen(oldId);
  if(!g) return;
  g.id = newId;
  (DB.maint||[]).forEach(m=>{ if(m.genId===oldId) m.genId=newId; });
  (DB.reservations||[]).forEach(r=>{ if(r.genId===oldId) r.genId=newId; });
  (DB.rentals||[]).forEach(r=>{ if(r.genId===oldId) r.genId=newId; });
  if(DB.genColorOverrides && DB.genColorOverrides[oldId]!==undefined){
    DB.genColorOverrides[newId] = DB.genColorOverrides[oldId];
    delete DB.genColorOverrides[oldId];
    await saveGenColorOverrides();
  }
  await saveGens();
  await saveMaint();
  await saveReservations();
  await saveRentals();
  closeModal();
  renderContent();
  flash(`${oldId} → ${newId} 로 번호가 수정되었습니다`);
}
function confirmDeleteGen(id){
  openConfirmModal(`${id} 발전기를 완전히 삭제할까요?\n\n이 발전기와 관련된 정비 이력, 예약, 임대 이력이 모두 함께 삭제되며 절대 되돌릴 수 없습니다. 등록을 잘못하셨을 때만 사용하세요.`, async function(){
    DB.gens = DB.gens.filter(x=>x.id!==id);
    DB.maint = (DB.maint||[]).filter(m=>m.genId!==id);
    DB.reservations = (DB.reservations||[]).filter(r=>r.genId!==id);
    DB.rentals = (DB.rentals||[]).filter(r=>r.genId!==id);
    if(DB.genColorOverrides) delete DB.genColorOverrides[id];
    await saveGens();
    await saveMaint();
    await saveReservations();
    await saveRentals();
    await saveGenColorOverrides();
    renderContent();
    flash('완전히 삭제되었습니다');
  }, '완전 삭제');
}

let voltageGuidePendingDataUrl = null;
function previewVoltageGuidePhoto(){
  const input = document.getElementById('f-vg-photo');
  const file = input && input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width*scale);
      canvas.height = Math.round(img.height*scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      voltageGuidePendingDataUrl = canvas.toDataURL('image/jpeg', 0.72);
      const previewWrap = document.getElementById('f-vg-preview-wrap');
      const preview = document.getElementById('f-vg-preview');
      if(preview) preview.src = voltageGuidePendingDataUrl;
      if(previewWrap) previewWrap.style.display = 'block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function submitVoltageEdit(id){
  if(!requireTechnician('전압 변경')) return;
  const g = findGen(id);
  const oldVoltage = g ? (g.voltage||'') : '';
  const value = document.getElementById('f-volt-edit').value;
  const changed = value.trim() !== oldVoltage.trim();
  if(!changed){
    closeModal();
    return;
  }
  if(g && g.voltageUpdatedAtMs && (Date.now()-g.voltageUpdatedAtMs) < 24*60*60*1000){
    openConfirmModal(`이 발전기는 24시간 이내(${g.voltageUpdatedAt||''})에 이미 전압을 변경했습니다. 그래도 다시 변경하시겠습니까?`, async function(){
      closeModal();
      await updateVoltage(id, value);
      maybeLogVoltageChange(id, oldVoltage, value);
    }, '예, 변경합니다', '아니오');
    return;
  }
  await updateVoltage(id, value);
  closeModal();
  maybeLogVoltageChange(id, oldVoltage, value);
}

const UNASSIGNED_SUPPLIER = '공급업체 미지정';
function neededOrderParts(){
  const names = allKnownPartNames().sort((a,b)=>a.localeCompare(b,'ko'));
  return names.map(n=>{
    const stock = DB.partsStock[n]!==undefined ? DB.partsStock[n] : 0;
    const minQty = (DB.partsMinStock && DB.partsMinStock[n]) || 0;
    if(!minQty || stock>minQty) return null;
    const orderQty = Math.max(minQty - stock, 1);
    const spec = (DB.partsSpecs && DB.partsSpecs[n]) || '';
    const category = (DB.partsCategory && DB.partsCategory[n]) || '';
    const unit = partUnitOf(n);
    const supplier = (DB.partsSupplier && DB.partsSupplier[n]) || UNASSIGNED_SUPPLIER;
    const mark = (DB.orderMarks && DB.orderMarks[n]) || null;
    const baseName = (spec && n.endsWith(' '+spec)) ? n.slice(0, n.length - spec.length - 1) : n;
    return {name:baseName, fullKey:n, stock, minQty, orderQty, spec, category, unit, supplier, mark};
  }).filter(Boolean);
}
function groupBySupplier(needed){
  const groups = {};
  needed.forEach(p=>{
    if(!groups[p.supplier]) groups[p.supplier] = [];
    groups[p.supplier].push(p);
  });
  return groups;
}

function downloadInGensPrintFile(){

<div class="ig-wrap">

  </table>
</div>
<script>window.onload = function(){ setTimeout(function(){ window.print(); }, 300); };<\/script>

  const blob = new Blob([doc], {type:'text/html;charset=utf-8;'});

function aggregatePrepParts(gensList){
  const totals = {};
  const order = [];
  const push = (key, label, qty, unit)=>{
    if(!qty) return;
    if(!totals[key]){ totals[key] = {label, qty:0, unit}; order.push(key); }
    totals[key].qty += qty;
  };
  gensList.forEach(g=>{
    const m = DB.materials && DB.materials[g.model];
    if(!m) return;
    if(m.engineOilLiters) push(`oil:${m.engineOilSpec||''}`, `엔진오일${m.engineOilSpec? ' '+m.engineOilSpec:''}`, Number(m.engineOilLiters)||0, 'L');
    if(m.oilFilter1Name) push(`part:${m.oilFilter1Name}`, m.oilFilter1Name, Number(m.oilFilter1Qty)||1, '개');
    if(m.oilFilter2Name) push(`part:${m.oilFilter2Name}`, m.oilFilter2Name, Number(m.oilFilter2Qty)||1, '개');
    if(m.fuelFilterName) push(`part:${m.fuelFilterName}`, m.fuelFilterName, Number(m.fuelFilterQty)||1, '개');
    if(m.fuelFilter2Name) push(`part:${m.fuelFilter2Name}`, m.fuelFilter2Name, Number(m.fuelFilter2Qty)||1, '개');
    if(m.airFilterName) push(`part:${m.airFilterName}`, m.airFilterName, Number(m.airFilterQty)||1, '개');
    if(m.fanBeltName) push(`part:${m.fanBeltName}`, m.fanBeltName, Number(m.fanBeltQty)||1, '개');
    (m.consumables||[]).forEach(c=>{ if(c.name) push(`part:${c.name}`, c.name, Number(c.qty)||1, partUnitOf(c.name)||'개'); });
  });
  return order.map(k=>totals[k]).sort((a,b)=>a.label.localeCompare(b.label,'ko'));
}

function suggestVehicleForModel(model, qty, genId){
  qty = Math.max(1, Number(qty)||1);
  const g = genId ? findGen(genId) : null;
  const size = genSizeOf(g || {model});
  if(!(size.width>0) || !(size.depth>0) || !(size.height>0)) return {status:'no-size'};
  const list = DB.vehicleTypes||[];
  if(list.length===0) return {status:'no-vehicles'};
  const gh = size.height;
  // 지게차 포크 구멍은 발전기 "긴 변" 측면에 뚫려 있어, 지게차가 차량 옆에서만 포크를 꽂아 실을 수 있습니다.
  // 그래서 발전기를 90도로 돌려 싣는 건 불가능하고, 항상 짧은 변이 적재함 가로(폭), 긴 변이 적재함 세로(길이) 방향으로만 실립니다.
  const longSide = Math.max(size.width, size.depth);
  const shortSide = Math.min(size.width, size.depth);
  const unitW = shortSide, unitD = longSide;
  const bestGridFit = (n, bedW, bedD)=>{
    let best = null;
    for(let cols=1; cols<=n; cols++){
      const rows = Math.ceil(n/cols);
      const totalW = cols*unitW, totalD = rows*unitD;
      if(totalW<=bedW && totalD<=bedD){
        const area = totalW*totalD;
        if(!best || area<best.area) best = {cols, rows, totalW, totalD, unitW, unitD};
      }
    }
    return best;
  };
  const results = [];
  list.forEach(v=>{
    if(!(v.width>0 && v.depth>0 && v.height>0) || gh>v.height) return;
    const fit = bestGridFit(qty, v.width, v.depth);
    if(fit) results.push({vehicle:v, fit});
  });
  if(results.length===0) return {status:'none-fit', genWidth:size.width, genDepth:size.depth, genHeight:gh, qty};
  results.sort((a,b)=>(a.vehicle.width*a.vehicle.depth*a.vehicle.height)-(b.vehicle.width*b.vehicle.depth*b.vehicle.height));
  return {status:'ok', best:results[0], all:results, genWidth:size.width, genDepth:size.depth, genHeight:gh, qty};
}
function vehicleLoadDiagramSvg(vehicle, fit, qty){
  const scale = 190 / Math.max(vehicle.width, vehicle.depth);
  const bedWpx = vehicle.width*scale, bedDpx = vehicle.depth*scale;

      count++;
    }
  }
  return `<svg viewBox="0 0 ${w.toFixed(1)} ${h.toFixed(1)}" style="width:100%;max-width:220px;height:auto;display:block;margin:6px auto 2px;background:#f4f4f4;border-radius:6px;">
    <text x="${(w/2).toFixed(1)}" y="${(topLabelH-4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#C0392B">▲ 차량 앞부분</text>
    <rect x="${padX}" y="${topLabelH}" width="${bedWpx.toFixed(1)}" height="${bedDpx.toFixed(1)}" fill="#fff" stroke="#555" stroke-width="2" stroke-dasharray="4 3"/>
    ${boxes}
    <text x="${(w/2).toFixed(1)}" y="${(topLabelH+bedDpx+bottomLabelH-4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#C0392B">▼ 차량 뒷부분</text>
    <text x="${(w/2).toFixed(1)}" y="${(h-4).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#666">적재함 위에서 본 모양 (가로${vehicle.width}×세로${vehicle.depth}cm)</text>
  </svg>`;
}

function safeIdFrag(s){
  return String(s).replace(/[\s"'<>&]/g, '_');
}
async function addStockQty(name, inputEl){
  if(!requireTechnician('부품 재고 입고')) return;
  const idFrag = safeIdFrag(name);
  const input = inputEl || document.getElementById(`addqty-${idFrag}`);
  if(!input) return;
  const addQty = Number(input.value);
  if(!addQty || addQty<=0){ input.value=''; return; }
  DB.partsStock[name] = (DB.partsStock[name]||0) + addQty;
  DB.partsPurchaseLog = [...(DB.partsPurchaseLog||[]), {id: uid(), date: todayStr(), partName: name, qty: addQty, by: DB.currentUserName||null}];
  const hadMark = DB.orderMarks && DB.orderMarks[name];
  if(hadMark) delete DB.orderMarks[name];
  await savePartsStock();
  await savePartsPurchaseLog();
  if(hadMark) await saveOrderMarks();
  renderPartsStockTable();
  flash(`${name} 재고에 ${addQty} 추가되었습니다 (현재 ${DB.partsStock[name]})`);
}
function deletePartsPurchaseLogEntry(id){
  if(!requireTechnician('부품 재고 입고내역 삭제')) return;
  const entry = (DB.partsPurchaseLog||[]).find(l=>l.id===id);
  if(!entry) return;
  openConfirmModal(`"${entry.partName}" +${entry.qty} 입고 내역을 삭제할까요? 삭제하면 재고에서도 ${entry.qty}만큼 다시 차감됩니다.`, async function(){
    DB.partsPurchaseLog = (DB.partsPurchaseLog||[]).filter(l=>l.id!==id);
    DB.partsStock[entry.partName] = (DB.partsStock[entry.partName]||0) - entry.qty;
    await savePartsStock();
    await savePartsPurchaseLog();
    closeModal();
    renderPartsStockTable();
    flash('삭제되었습니다');
  }, '삭제');
}

  if(m.fuelFilterName && !has(m.fuelFilterName)) list.push({name:m.fuelFilterName, qty:m.fuelFilterQty||1, category: catFor(m.fuelFilterName), spec: specFor(m.fuelFilterName)});
  if(m.fuelFilter2Name && !has(m.fuelFilter2Name)) list.push({name:m.fuelFilter2Name, qty:m.fuelFilter2Qty||1, category: catFor(m.fuelFilter2Name), spec: specFor(m.fuelFilter2Name)});
  if(m.airFilterName && !has(m.airFilterName)) list.push({name:m.airFilterName, qty:m.airFilterQty||1, category: catFor(m.airFilterName), spec: specFor(m.airFilterName)});
  if(m.fanBeltName && !has(m.fanBeltName)) list.push({name:m.fanBeltName, qty:m.fanBeltQty||1, category: catFor(m.fanBeltName), spec: specFor(m.fanBeltName)});
  return list;
}

function partOptionsForCategory(category){

  const names = allKnownPartNames();
  const filtered = cat ? names.filter(n=>{
    const nc = (DB.partsCategory && DB.partsCategory[n]) || '';
    return nc===cat || nc==='발전기전체사용';
  }) : names;
  return filtered.sort((a,b)=>a.localeCompare(b,'ko')).map(n=>`<option value="${n.replace(/"/g,'&quot;')}">`).join('');
}
function updateRowPartOptions(i, category){

function autoFillConsumableFields(i, name){
  if(!materialsModalState.consumables[i]) return;
  const trimmed = name.trim();
  const knownCat = DB.partsCategory && DB.partsCategory[trimmed];
  const knownSpec = DB.partsSpecs && DB.partsSpecs[trimmed];
  let changed = false;
  if(knownCat && !materialsModalState.consumables[i].category){ materialsModalState.consumables[i].category = knownCat; changed = true; }
  if(knownSpec && !materialsModalState.consumables[i].spec){ materialsModalState.consumables[i].spec = knownSpec; changed = true; }
  if(changed) renderConsumableRows();
}

  materialsModalState.consumables.unshift({name:'', qty:1, category:'', spec:''});

function removeConsumableRow(i){

function updateConsumableField(i, field, value){

async function confirmLoad(resId){
  const r = DB.reservations.find(x=>x.id===resId);
  if(!r){ return; }
  const g = findGen(r.genId);
  if(!g){ showInfoModal('해당 발전기를 찾을 수 없습니다.'); return; }
  if(g.status==='out'){
    showInfoModal('이미 출고된 발전기입니다.');
    DB.reservations = DB.reservations.filter(x=>x.id!==resId);
    await saveReservations();
    renderContent();
    return;
  }
  if(g.underRepair){
    showInfoModal('고장 수리 중인 발전기라 상차완료 처리할 수 없습니다. 수리 완료 처리 후 다시 시도해주세요.');
    return;
  }
  g.status = 'out';
  g.hours = r.startHours;
  g.rental = {
    customer: r.customer, manager: r.manager, phone: r.phone, site: r.site, address: r.address,
    supplies: r.supplies, suppliesItems: r.suppliesItems||[], suppliesCustom: r.suppliesCustom||'', voltage: r.voltage, qty: r.qty, fuelRequested: r.fuelRequested, fuelActual: r.fuelActual,
    usageDays: r.usageDays, loadDate: r.loadDate, arriveTime: r.arriveTime, freightBearer: r.freightBearer, paymentConfirmed: r.paymentConfirmed||false, forcedOut: r.forcedOut||false, forceReason: r.forceReason||'', forcedBy: r.forcedBy||null, note: r.note,
    outDate: r.outDate, startHours: r.startHours, longTerm: r.longTerm, estDaily: r.estDaily,
    outProcessedBy: r.outProcessedBy || null, loadConfirmedBy: DB.currentUserName || null
  };
  if(r.suppliesItems && r.suppliesItems.length){
    DB.suppliesStock = DB.suppliesStock || {};
    r.suppliesItems.forEach(it=>{
      DB.suppliesStock[it.name] = (DB.suppliesStock[it.name]!==undefined ? DB.suppliesStock[it.name] : 0) - (it.qty||1);
    });
    await saveSuppliesStock();
  }

function syncUsageDaysToReturnDate(){

  if(!outEl || !daysEl || !retEl) return;

  const d = new Date(outEl.value+'T00:00:00');

function syncReturnDateToUsageDays(){

function knownCustomerRecords(){
  const map = {};
  const consider = (rec)=>{
    if(!rec || !rec.customer) return;
    const key = rec.customer.trim();
    if(!key) return;
    const dateKey = rec.outDate || rec.plannedOutDate || rec.createdAt || '';
    if(!map[key] || (dateKey && dateKey > (map[key].outDate||''))){
      map[key] = {customer: key, manager: rec.manager||'', phone: rec.phone||'', address: rec.address||'', site: rec.site||'', outDate: dateKey};
    }
  };
  DB.rentals.forEach(consider);
  DB.reservations.forEach(consider);
  DB.gens.forEach(g=>{ if(g.rental) consider(g.rental); });
  return Object.values(map).sort((a,b)=>a.customer.localeCompare(b.customer,'ko'));
}

async function submitOut(idParam, reservationId){
  const targetSelEl = document.getElementById('f-target-gen');
  const id = targetSelEl ? targetSelEl.value : idParam;
  const g = findGen(id);
  const errElGuard = document.getElementById('f-err');
  if(!g){
    if(errElGuard){ errElGuard.textContent = '선택한 발전기를 찾을 수 없습니다.'; errElGuard.style.display='block'; }
    return;
  }
  if(targetSelEl && id!==idParam){
    if(g.status!=='in'){
      if(errElGuard){ errElGuard.textContent = `${g.id}은(는) 지금 입고 상태가 아니라 선택할 수 없습니다.`; errElGuard.style.display='block'; }
      return;
    }
    if(g.underRepair){
      if(errElGuard){ errElGuard.textContent = `${g.id}은(는) 고장 수리 중이라 선택할 수 없습니다.`; errElGuard.style.display='block'; }
      return;
    }
    if(DB.reservations.some(r=>r.genId===id && r.id!==reservationId)){
      if(errElGuard){ errElGuard.textContent = `${g.id}은(는) 이미 다른 출고 대기에 등록되어 있어 선택할 수 없습니다.`; errElGuard.style.display='block'; }
      return;
    }
  }
  if(g.status==='out' && !(reservationId && DB.reservations.find(r=>r.id===reservationId && r.pendingLoad))){
    if(errElGuard){ errElGuard.textContent = '입고 처리가 완료되지 않은 발전기는 출고할 수 없습니다.'; errElGuard.style.display='block'; }
    return;
  }
  if(g.underRepair){
    if(errElGuard){ errElGuard.textContent = '고장 수리 중인 발전기는 출고할 수 없습니다. 수리 완료 처리 후 출고해주세요.'; errElGuard.style.display='block'; }
    return;
  }
  const customer = document.getElementById('f-site').value.trim();
  const site = customer;
  const manager = document.getElementById('f-manager').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const address = document.getElementById('f-address').value.trim();
  const supplies = document.getElementById('f-supplies').value.trim();
  let suppliesItems = [];
  try{ suppliesItems = JSON.parse(document.getElementById('f-supplies-items').value || '[]'); }catch(e){ suppliesItems = []; }
  const suppliesCustomEl = document.getElementById('f-supplies-custom');
  const suppliesCustom = suppliesCustomEl ? suppliesCustomEl.value.trim() : '';
  const voltage = document.getElementById('f-voltage').value.trim();
  const qty = Number(document.getElementById('f-qty').value)||1;
  const fuelEnabled = document.getElementById('f-fuel-toggle') ? document.getElementById('f-fuel-toggle').checked : true;
  const fuelRequested = fuelEnabled ? (Number(document.getElementById('f-fuel-req').value)||null) : null;
  const fuelActual = fuelEnabled ? (Number(document.getElementById('f-fuel-actual').value)|| fuelRequested || null) : null;
  const usageDays = Number(document.getElementById('f-usagedays').value)||null;
  const loadDate = document.getElementById('f-loaddate').value || null;
  const arriveTime = document.getElementById('f-arrivetime').value || null;
  const freightBearer = document.getElementById('f-freight').value;
  const paymentConfirmed = document.getElementById('f-payment-confirmed').checked;
  const forcedOut = !paymentConfirmed && document.getElementById('f-force-out').checked;
  const forceReason = forcedOut ? document.getElementById('f-force-reason').value.trim() : '';
  const note = document.getElementById('f-note').value.trim();
  const outDate = document.getElementById('f-outdate').value;
  const startHours = Number(document.getElementById('f-starthours').value);
  const longTerm = document.getElementById('f-longterm').checked;
  const estDaily = longTerm ? Number(document.getElementById('f-estdaily').value||0) : null;
  const errEl = document.getElementById('f-err');
  if(!customer || !address || !manager || !phone){
    errEl.textContent = '거래처명, 현장 주소, 담당자, 연락처를 모두 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(!paymentConfirmed && !forcedOut){
    errEl.textContent = '입금 확인 체크를 하거나, 급한 경우 "강제출고"를 체크하고 사유를 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(forcedOut && !forceReason){
    errEl.textContent = '강제출고 사유를 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(!outDate || isNaN(startHours) || startHours < (g.hours||0)){
    errEl.textContent = '도착일과 누적 사용시간을 확인해주세요. (현재 누적시간보다 작을 수 없습니다)';
    errEl.style.display='block'; return;
  }
  if(longTerm && (!estDaily || estDaily<=0)){
    errEl.textContent = '장기 임대는 예상 일일 사용시간을 입력해주세요.';
    errEl.style.display='block'; return;
  }
  const existing = reservationId ? DB.reservations.find(r=>r.id===reservationId) : null;
  const pendingData = {
    id: reservationId || uid(), genId: id, pendingLoad: true, batchId: (existing && existing.batchId) || null,
    customer, manager, phone, site, address, supplies, suppliesItems, suppliesCustom, voltage, qty,
    fuelRequested, fuelActual, usageDays, loadDate, arriveTime, freightBearer, paymentConfirmed, forcedOut, forceReason, forcedBy: forcedOut ? (DB.currentUserName||null) : null, note,
    outDate, startHours, longTerm, estDaily: longTerm? estDaily: null,
    outProcessedBy: DB.currentUserName || (existing&&existing.outProcessedBy) || null,
    createdAt: (existing && existing.createdAt) || todayStr()
  };
  const idx = reservationId ? DB.reservations.findIndex(r=>r.id===reservationId) : -1;
  const wasPending = idx>=0 && DB.reservations[idx].pendingLoad;
  pendingOutSubmitCtx = {
    id, reservationId, pendingData, existing, idx, wasPending,
    vals: {customer, manager, phone, address, supplies, voltage, qty, fuelRequested, fuelActual, usageDays, loadDate, arriveTime, freightBearer, paymentConfirmed, forcedOut, forceReason, note, outDate, startHours, longTerm, estDaily}
  };
  showOutSubmitPreview(g, pendingData);
}
let pendingOutSubmitCtx = null;
function showOutSubmitPreview(g, pendingData){
  const previewHtml = receiptCopyHtml(g, '공급받는자용', pendingData);
  document.getElementById('modal-root').innerHTML = `
  <div class="overlay" onclick="backdropClick(this,event,cancelOutSubmitPreview)">
    <div class="modal" style="max-width:640px;">
      <h3>출고 내용 확인</h3>
      <div class="modal-sub">인쇄용이 아니라, 입력한 내용이 맞는지 한 번 더 확인하는 미리보기입니다.</div>
      <div style="max-height:55vh;overflow-y:auto;border:1px solid var(--border);border-radius:8px;">${previewHtml}</div>
      <div id="f-preview-err" class="err" style="display:none;margin-top:8px;"></div>
      <div class="modal-actions">
        <button class="btn" onclick="cancelOutSubmitPreview()">✏️ 돌아가서 수정</button>
        <button class="btn primary" onclick="confirmOutSubmit()">✅ 확인, 출고 등록</button>
      </div>
    </div>
  </div>`;
}
function cancelOutSubmitPreview(){
  const ctx = pendingOutSubmitCtx;
  pendingOutSubmitCtx = null;
  if(!ctx){ closeModal(); return; }
  reopenOutModalWithValues(ctx.id, ctx.reservationId, ctx.vals);
}
async function confirmOutSubmit(){
  const ctx = pendingOutSubmitCtx;
  if(!ctx) return;
  const {reservationId, pendingData, existing, idx, wasPending} = ctx;
  try{
    if(idx>=0) DB.reservations[idx] = pendingData;
    else DB.reservations.push(pendingData);
    // 배치 판별: 명시적으로 batchId가 같으면 그걸로 묶고, batchId가 없는 건들끼리는
    // 거래처명+현장주소가 같으면 "같이 나가는 묶음"으로 보고 같은 batchId를 새로 붙여줍니다.
    const siblings = DB.reservations.filter(r=>{
      if(r.id===pendingData.id || !r.pendingLoad) return false;
      if(pendingData.batchId && r.batchId===pendingData.batchId) return true;
      if(!pendingData.batchId && !r.batchId && r.customer===pendingData.customer && r.address===pendingData.address) return true;
      return false;
    });
    if(siblings.length>0){
      if(!pendingData.batchId) pendingData.batchId = uid();
      siblings.forEach(r=>{
        r.batchId = pendingData.batchId;
        r.customer = pendingData.customer; r.manager = pendingData.manager; r.phone = pendingData.phone;
        r.site = pendingData.site; r.address = pendingData.address; r.supplies = pendingData.supplies;
        r.suppliesItems = pendingData.suppliesItems; r.suppliesCustom = pendingData.suppliesCustom;
        r.voltage = pendingData.voltage; r.qty = pendingData.qty;
        r.fuelRequested = pendingData.fuelRequested; r.fuelActual = pendingData.fuelActual;
        r.usageDays = pendingData.usageDays; r.loadDate = pendingData.loadDate; r.arriveTime = pendingData.arriveTime;
        r.freightBearer = pendingData.freightBearer; r.paymentConfirmed = pendingData.paymentConfirmed;
        r.forcedOut = pendingData.forcedOut; r.forceReason = pendingData.forceReason; r.forcedBy = pendingData.forcedBy;
        r.note = pendingData.note; r.outDate = pendingData.outDate; r.longTerm = pendingData.longTerm; r.estDaily = pendingData.estDaily;
      });
    }
    const siblingCount = siblings.length;
    await saveReservations();
    pendingOutSubmitCtx = null;
    closeModal();
    currentTab = 'reserve';
    renderTabbar();
    renderContent();
    flash(wasPending
      ? (siblingCount>0? `상차대기 내용이 수정되었습니다. (거래처·주소가 같은 ${siblingCount}대에도 함께 적용됨)` : '상차대기 내용이 수정되었습니다.')
      : '출고 대기(상차대기)에 등록되었습니다. 상차완료를 눌러야 출고됩니다.');
  }catch(err){
    if(idx>=0) DB.reservations[idx] = existing; else DB.reservations = DB.reservations.filter(r=>r!==pendingData);
    const errEl = document.getElementById('f-preview-err');
    if(errEl){ errEl.textContent = '저장 중 오류가 발생했습니다: ' + (err && err.message ? err.message : err); errEl.style.display='block'; }
  }
}
function reopenOutModalWithValues(id, reservationId, vals){
  openOutModal(id, reservationId);
  setTimeout(function(){
    const setVal = (elId, v)=>{ const el = document.getElementById(elId); if(el && v!=null && v!=='') el.value = v; };
    setVal('f-starthours', vals.startHours);
    setVal('f-outdate', vals.outDate);
    setVal('f-loaddate', vals.loadDate);
    setVal('f-freight', vals.freightBearer);
    setVal('f-site', vals.customer);
    setVal('f-usagedays', vals.usageDays);
    setVal('f-address', vals.address);
    setVal('f-manager', vals.manager);
    setVal('f-phone', vals.phone);
    setVal('f-voltage', vals.voltage);
    setVal('f-qty', vals.qty);
    setVal('f-fuel-req', vals.fuelRequested);

function syncBulkUsageDaysToReturnDate(){
  const outEl = document.getElementById('fb-outdate');
  const daysEl = document.getElementById('fb-usagedays');
  const retEl = document.getElementById('fb-returndate');
  if(!outEl.value || !daysEl.value || Number(daysEl.value)<=0){ retEl.value=''; return; }
  const d = new Date(outEl.value+'T00:00:00');
  d.setDate(d.getDate()+Number(daysEl.value));
  retEl.value = toLocalDateStr(d);
}
function syncBulkReturnDateToUsageDays(){
  const outEl = document.getElementById('fb-outdate');
  const daysEl = document.getElementById('fb-usagedays');
  const retEl = document.getElementById('fb-returndate');
  if(!outEl.value || !retEl.value) return;
  const start = new Date(outEl.value+'T00:00:00');
  const end = new Date(retEl.value+'T00:00:00');
  const days = Math.round((end-start)/86400000);
  if(days>0) daysEl.value = days;
}

async function submitBulkOut(){
  const ids = [...bulkOutSelection];
  const errEl = document.getElementById('fb-err');
  if(ids.length===0){ closeModal(); return; }
  const customer = document.getElementById('fb-site').value.trim();
  const site = customer;
  const manager = document.getElementById('fb-manager').value.trim();
  const phone = document.getElementById('fb-phone').value.trim();
  const address = document.getElementById('fb-address').value.trim();
  const supplies = document.getElementById('fb-supplies').value.trim();
  const voltage = document.getElementById('fb-voltage').value.trim();
  const fbFuelEnabled = document.getElementById('fb-fuel-toggle') ? document.getElementById('fb-fuel-toggle').checked : true;
  const usageDays = Number(document.getElementById('fb-usagedays').value)||null;
  const loadDate = document.getElementById('fb-loaddate').value || null;
  const arriveTime = document.getElementById('fb-arrivetime').value || null;
  const freightBearer = document.getElementById('fb-freight').value;
  const paymentConfirmed = document.getElementById('fb-payment-confirmed').checked;
  const forcedOut = !paymentConfirmed && document.getElementById('fb-force-out').checked;
  const forceReason = forcedOut ? document.getElementById('fb-force-reason').value.trim() : '';
  const note = document.getElementById('fb-note').value.trim();
  const outDate = document.getElementById('fb-outdate').value;
  const longTerm = document.getElementById('fb-longterm').checked;
  const estDaily = longTerm ? Number(document.getElementById('fb-estdaily').value||0) : null;
  if(!customer || !address || !manager || !phone){
    errEl.textContent = '거래처명, 현장 주소, 담당자, 연락처를 모두 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(!paymentConfirmed && !forcedOut){
    errEl.textContent = '입금 확인 체크를 하거나, 급한 경우 "강제출고"를 체크하고 사유를 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(forcedOut && !forceReason){
    errEl.textContent = '강제출고 사유를 입력해주세요.';
    errEl.style.display='block'; return;
  }
  if(!outDate){
    errEl.textContent = '도착일을 확인해주세요.';
    errEl.style.display='block'; return;
  }
  if(longTerm && (!estDaily || estDaily<=0)){
    errEl.textContent = '장기 임대는 예상 일일 사용시간을 입력해주세요.';
    errEl.style.display='block'; return;
  }
  // 발전기별 누적 사용시간 검증
  const hoursMap = {};
  for(const id of ids){
    const g = findGen(id);
    if(!g) continue;
    const el = document.getElementById(`fb-hours-${id}`);
    const v = el ? Number(el.value) : NaN;
    if(isNaN(v) || v < (g.hours||0)){
      errEl.textContent = `${id}의 누적 사용시간을 확인해주세요. (현재 누적시간 ${(g.hours||0).toLocaleString()}h보다 작을 수 없습니다)`;
      errEl.style.display='block'; return;
    }
    hoursMap[id] = v;
  }
  const skipped = [];
  const batchId = uid();
  ids.forEach(id=>{
    const g = findGen(id);
    if(!g || g.status!=='in' || g.underRepair || DB.reservations.some(r=>r.genId===id)){ skipped.push(id); return; }
    const reqEl = document.getElementById(`fb-fuel-req-${id}`);
    const actEl = document.getElementById(`fb-fuel-actual-${id}`);
    const fuelRequested = fbFuelEnabled && reqEl ? (Number(reqEl.value)||null) : null;
    const fuelActual = fbFuelEnabled && actEl ? (Number(actEl.value)|| fuelRequested || null) : null;
    DB.reservations.push({
      id: uid(), genId: id, pendingLoad: true, batchId,
      customer, manager, phone, site, address, supplies, voltage, qty:1,
      fuelRequested, fuelActual, usageDays, loadDate, arriveTime, freightBearer, paymentConfirmed, forcedOut, forceReason, forcedBy: forcedOut ? (DB.currentUserName||null) : null, note,
      outDate, startHours: hoursMap[id], longTerm, estDaily: longTerm? estDaily: null,
      outProcessedBy: DB.currentUserName || null,
      createdAt: todayStr()
    });
  });
  await saveReservations();
  bulkOutSelection.clear();
  closeModal();
  currentTab = 'reserve';
  renderTabbar();
  renderContent();
  const doneCount = ids.length - skipped.length;
  flash(skipped.length>0
    ? `${doneCount}대는 출고 대기에 등록되었고, ${skipped.length}대는 상태 변경으로 제외되었습니다.`
    : `${doneCount}대가 출고 대기(상차대기)에 등록되었습니다. 상차완료를 눌러야 출고됩니다.`);
  if(doneCount>0) printBatchReceipt(batchId);
}

      errEl.textContent = `${g.id}의 누적 사용시간을 확인해주세요. (출고시 누적시간 ${(g.rental.startHours||0).toLocaleString()}h보다 작을 수 없습니다)`;

    }
    hoursMap[g.id] = v;
  }
  gens.forEach(g=>{
    const rt = g.rental;
    const endHours = hoursMap[g.id];
    DB.rentals.push({
      id: uid(), genId: g.id, customer: rt.customer, manager: rt.manager, phone: rt.phone,
      site: rt.site, address: rt.address, supplies: rt.supplies, suppliesRecovered: !!rt.supplies, suppliesNote: '', fuelRequested: rt.fuelRequested, fuelActual: rt.fuelActual, usageDays: rt.usageDays, loadDate: rt.loadDate, arriveTime: rt.arriveTime, freightBearer: rt.freightBearer, note: rt.note,

      usedHours: endHours - (rt.startHours||0), longTerm: rt.longTerm, estDaily: rt.estDaily,
      voltage: g.voltage||rt.voltage||'', outProcessedBy: rt.outProcessedBy||null, loadConfirmedBy: rt.loadConfirmedBy||null, inProcessedBy: DB.currentUserName||null,
      measuredFuelHeightCm: null, remainingFuelLiters: null,
      paymentConfirmed: rt.paymentConfirmed||false, forcedOut: rt.forcedOut||false, forceReason: rt.forceReason||'', forcedBy: rt.forcedBy||null
    });
    g.hours = endHours;
    g.hoursKnown = true;
    g.status = 'in';
    g.rental = null;
  });
  await Promise.all([saveGens(), saveRentals()]);
  bulkInSelection.clear();
  closeModal();
  renderTabbar();
  renderContent();
  flash(`${gens.length}대가 입고 처리되었습니다`);
}

function escR(s){
  return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDateKR(s){
  if(!s) return '　　년　　월　　일';
  const parts = s.split('-');
  if(parts.length!==3) return s;
  const [y,m,d] = parts;
  const dt = new Date(s+'T00:00:00');
  const wk = isNaN(dt.getTime()) ? '' : `(${['일','월','화','수','목','금','토'][dt.getDay()]})`;
  return `${y}년 ${m}월 ${d}일 ${wk}`;
}

function downloadCustomerVCard(id){
  const g = findGen(id);
  if(!g) return;
  const rt = receiptOverrideRT || g.rental;
  if(!rt) return;
  const customer = (rt.customer||'').trim();
  const manager = (rt.manager||'').trim();
  const fn = (customer && manager) ? `${customer} ${manager}` : (customer || manager || '거래처');
  const lines = ['BEGIN:VCARD','VERSION:3.0', `FN:${fn}`];
  if(customer) lines.push(`ORG:${customer}`);
  if(rt.phone) lines.push(`TEL;TYPE=CELL:${rt.phone}`);
  if(rt.address) lines.push(`ADR;TYPE=WORK:;;${rt.address};;;;`);
  lines.push('END:VCARD');
  const vcf = lines.join('\r\n');
  const blob = new Blob([vcf], {type:'text/vcard;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${fn.replace(/[\\/:*?"<>|]/g,'')}.vcf`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  flash('연락처 파일이 다운로드되었습니다. 파일을 열면 연락처 추가 화면이 뜹니다.');
}

function readAndCompressImageToDataUrl(file, maxW, quality){
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const scale = Math.min(1, (maxW||900)/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width*scale));
        canvas.height = Math.max(1, Math.round(img.height*scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality||0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function copyTextareaById(taId, msgId){
  const ta = document.getElementById(taId);
  if(!ta) return;
  const msgEl = msgId ? document.getElementById(msgId) : null;
  let ok = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(ta.value);
      ok = true;
    }
  }catch(e){ ok = false; }
  if(!ok){
    try{
      ta.removeAttribute('readonly');
      ta.focus();
      ta.select();
      ok = document.execCommand('copy');
      ta.setAttribute('readonly','readonly');
    }catch(e){ ok = false; }
  }
  if(msgEl){
    msgEl.style.display='block';
    msgEl.textContent = ok ? '복사되었습니다.' : '자동 복사에 실패했습니다. 위 텍스트 상자를 길게 눌러 직접 선택 후 복사해주세요.';

function calcRemainingFuel(id){
  const g = findGen(id);
  const heightEl = document.getElementById('f-fuel-height');
  const resultEl = document.getElementById('f-fuel-calc-result');
  if(!g || !heightEl || !resultEl) return;
  if(heightEl.value===''){ resultEl.style.display='none'; return; }
  const height = Number(heightEl.value);
  if(isNaN(height) || height < -5){ resultEl.style.display='none'; return; }
  const {width:w, depth:d, height:h} = tankDimsOf(g);
  const baseline = fuelBaselineOf(g);
  if(!(w>0 && d>0)){
    resultEl.style.display = 'block';
    resultEl.innerHTML = `<div class="muted" style="font-size:12px;">측정 높이 ${height}cm로 기록됩니다. (탱크 규격이 없어 리터 환산은 생략)</div>`;
    return;
  }
  const maxUsableHeight = h>0 ? Math.max(h - baseline, 0) : null;
  const clampedHeight = (maxUsableHeight>0 && height>0) ? Math.min(height, maxUsableHeight) : height;
  const liters = Math.round(w*d*clampedHeight/1000*10)/10;
  const overTank = maxUsableHeight>0 && height>maxUsableHeight;
  const underBaseline = height<0;
  let mainLine;
  if(liters>0){
    mainLine = `<div style="font-size:13px;">남은 연료량 약 <b style="font-size:16px;color:var(--primary-dark);">${liters.toLocaleString()}L</b></div>`;
  } else if(liters===0){
    mainLine = `<div style="font-size:13px;font-weight:700;color:var(--primary-dark);">출고시 연료 모두 소진되어 입고</div>`;
  } else {
    mainLine = `<div style="font-size:13px;"><b style="font-size:16px;color:var(--danger);">${liters.toLocaleString()}L</b> 더 사용</div>`;
  }

function updateInUsagePreview(startHours, outDate){
  const input = document.getElementById('f-endhours');
  const wrap = document.getElementById('in-usage-preview');
  const valueEl = document.getElementById('in-usage-preview-value');
  const avgEl = document.getElementById('in-usage-preview-avg');
  if(!input || !wrap || !valueEl) return;
  const endHours = Number(input.value);
  if(!input.value || isNaN(endHours) || endHours < startHours){
    wrap.style.display = 'none';
    return;
  }
  const used = endHours - startHours;
  valueEl.textContent = `${used.toLocaleString()}h`;
  if(avgEl){
    avgEl.textContent = '';
    const indateEl = document.getElementById('f-indate');
    const inDate = indateEl ? indateEl.value : '';
    if(outDate && inDate){
      const out = new Date(outDate+'T00:00:00');
      const inD = new Date(inDate+'T00:00:00');
      if(!isNaN(out.getTime()) && !isNaN(inD.getTime())){
        const days = Math.max(1, Math.round((inD-out)/86400000));
        const avg = used/days;
        avgEl.textContent = `${days}일간, 일평균 ${avg.toFixed(1)}h/일`;
      }
    }
  }
  wrap.style.display = 'flex';
}

async function submitIn(id){
  const g = findGen(id);
  const inDate = document.getElementById('f-indate').value;
  const endHours = Number(document.getElementById('f-endhours').value);
  const voltage = document.getElementById('f-in-voltage').value.trim();
  const oldVoltageForLog = g ? (g.voltage||'') : '';
  const supRecoveredEl = document.getElementById('f-sup-recovered');
  const supRecoveredVal = supRecoveredEl ? supRecoveredEl.value : 'yes';
  const suppliesRecovered = supRecoveredVal==='yes';
  const supNoteEl = document.getElementById('f-supplies-note');
  const suppliesNote = (!suppliesRecovered && supNoteEl) ? supNoteEl.value.trim() : '';
  const errEl = document.getElementById('f-err');
  if(!supRecoveredVal){
    errEl.textContent = '부자재 회수 여부(회수됨/회수안됨)를 선택해주세요.';
    errEl.style.display='block'; return;
  }
  const noteAckEl = document.getElementById('f-note-ack');
  if(g.rental.note && noteAckEl && !noteAckEl.checked){
    const noteErrEl = document.getElementById('f-note-ack-err');
    if(noteErrEl) noteErrEl.style.display = 'block';
    errEl.textContent = '출고시 비고 내용을 확인했다는 체크를 해야 입고 처리할 수 있습니다.';
    errEl.style.display='block'; return;
  }
  if(!inDate || isNaN(endHours) || endHours < g.rental.startHours){
    errEl.textContent = '입고일과 누적 사용시간을 확인해주세요. (출고시 누적시간보다 작을 수 없습니다)';
    errEl.style.display='block'; return;
  }
  // 하루 24시간을 초과하는 물리적으로 불가능한 사용시간 감지 (데이터 입력 실수 방지)
  // 단, 출고 당시 누적시간을 몰랐던(미확인) 발전기는 이번이 첫 실측이라 정상적으로 큰 값이 나올 수 있으므로 제외
  if(g.rental.outDate && inDate && g.hoursKnown){
    const usedH = endHours - g.rental.startHours;
    const outD = new Date(g.rental.outDate+'T00:00:00');
    const inD = new Date(inDate+'T00:00:00');
    const days = Math.max(1, Math.round((inD-outD)/86400000));
    const avgDaily = usedH/days;
    if(avgDaily > 24){
      errEl.textContent = `입력하신 누적시간 차이(${usedH.toLocaleString()}h)를 임대일수(${days}일)로 나누면 하루 평균 ${avgDaily.toFixed(1)}시간이 됩니다. 하루는 24시간을 넘을 수 없으니, 출고시 누적시간(${g.rental.startHours.toLocaleString()}h) 또는 지금 입력한 누적시간을 다시 확인해주세요.`;
      errEl.style.display='block'; return;
    }
  }
  const conditionEl = document.getElementById('f-in-condition');
  const condition = conditionEl ? conditionEl.value : 'ok';
  const repairNoteEl = document.getElementById('f-in-repairnote');
  const repairNote = repairNoteEl ? repairNoteEl.value.trim() : '';
  if(condition==='broken' && !repairNote){
    errEl.textContent = '고장 내용을 입력해주세요.';
    errEl.style.display='block'; return;
  }
  const fuelNotUsedEl = document.getElementById('f-fuel-not-used');
  const fuelNotUsed = fuelNotUsedEl && fuelNotUsedEl.value==='yes';
  const fuelHeightEl = document.getElementById('f-fuel-height');
  const measuredFuelHeightCm = (!fuelNotUsed && fuelHeightEl && fuelHeightEl.value!=='') ? Number(fuelHeightEl.value) : null;
  let remainingFuelLiters = null;
  if(measuredFuelHeightCm!=null){
    remainingFuelLiters = computeFuelLiters(g, measuredFuelHeightCm);
  }
  const fuelExhaustNote = (remainingFuelLiters===0) ? '출고시 연료 모두 소진되어 입고' : '';
  const rt = g.rental;
  const combinedNote = [rt.note, fuelExhaustNote].filter(Boolean).join(' / ');
  const newRentalId = uid();
  DB.rentals.push({
    id: newRentalId, genId: g.id, customer: rt.customer, manager: rt.manager, phone: rt.phone,
    site: rt.site, address: rt.address, supplies: rt.supplies, suppliesItems: rt.suppliesItems||[], suppliesCustom: rt.suppliesCustom||'', suppliesRecovered, suppliesNote, fuelRequested: rt.fuelRequested, fuelActual: rt.fuelActual, usageDays: rt.usageDays, loadDate: rt.loadDate, arriveTime: rt.arriveTime, freightBearer: rt.freightBearer, note: combinedNote,
    outDate: rt.outDate, inDate, startHours: rt.startHours, endHours,
    usedHours: endHours - rt.startHours, longTerm: rt.longTerm, estDaily: rt.estDaily,
    voltage, outProcessedBy: rt.outProcessedBy||null, loadConfirmedBy: rt.loadConfirmedBy||null, inProcessedBy: DB.currentUserName||null, inProcessedAt: nowDateTimeStr(),
    measuredFuelHeightCm, remainingFuelLiters, fuelNotUsed,
    paymentConfirmed: rt.paymentConfirmed||false, forcedOut: rt.forcedOut||false, forceReason: rt.forceReason||'', forcedBy: rt.forcedBy||null
  });
  g.hours = endHours;
  g.hoursKnown = true;
  g.status = 'in';
  g.voltage = voltage;
  g.rental = null;
  if(condition==='broken'){
    g.underRepair = true;
    g.repairNote = repairNote;
    g.repairSince = inDate;
  } else {
    g.underRepair = false;
    g.repairNote = '';
    g.repairSince = null;
  }
  if(suppliesRecovered && rt.suppliesItems && rt.suppliesItems.length){
    DB.suppliesStock = DB.suppliesStock || {};
    rt.suppliesItems.forEach(it=>{
      DB.suppliesStock[it.name] = (DB.suppliesStock[it.name]!==undefined ? DB.suppliesStock[it.name] : 0) + (it.qty||1);
    });
    await saveSuppliesStock();
  }
  await saveGens();
  await saveRentals();
  closeModal();
  renderContent();
  flash(condition==='broken' ? '입고 처리되었습니다 (고장 등록 - 수리 완료 전까지 출고 불가)' : '입고 처리되었습니다');
  if(!checkOveruseOnReturn(newRentalId, id, oldVoltageForLog, voltage)){
    maybeLogVoltageChange(id, oldVoltageForLog, voltage);
  }
}

async function submitMaint(id, editId, completeRepair){
  if(!requireTechnician('정비 등록/수정')) return;
  const g = findGen(id);
  const date = document.getElementById('f-mdate').value;
  const hours = Number(document.getElementById('f-mhours').value);
  const type = document.getElementById('f-mtype').value;
  const technician = document.getElementById('f-mtech').value;
  const contentOptions = ['엔진오일교체','엔진오일점검','에어필터교체','에어필터점검','오일필터1차교체','오일필터1차점검','오일필터2차교체','오일필터2차점검','연료필터1교체','연료필터1점검','연료필터2교체','연료필터2점검','부동액교체','부동액점검 및 보충','배터리교체','배터리점검','팬벨트교체','출력단자체결상태','누전차단기볼트교체','배터리터미널조임상태','팬청소'];
  const contentItems = contentOptions.filter((c,i)=>{
    const el = document.getElementById(`f-mcontent-${i}`);
    return el && el.checked;
  });
  const contentEtc = document.getElementById('f-mcontent-etc').value.trim();
  const content = [contentItems.join(', '), contentEtc].filter(Boolean).join(' / ');
  const errEl = document.getElementById('f-err');
  if(!date || isNaN(hours) || hours<0){
    errEl.textContent = '정비일과 누적 사용시간을 확인해주세요.';
    errEl.style.display='block'; return;
  }
  const candidates = materialCandidateParts(g.model);
  const partsUsed = [];
  const prevParts = editId ? ((DB.maint.find(m=>m.id===editId)||{}).partsUsed || []) : [];
  // 수정인 경우, 기존 차감분을 먼저 재고에 복원 후 다시 차감(중복 차감 방지)
  prevParts.forEach(p=>{
    if(typeof p==='object' && p.partName){
      DB.partsStock[p.partName] = (DB.partsStock[p.partName]||0) + (p.qty||1);
    }
  });
  candidates.forEach((p,i)=>{
    const el = document.getElementById(`f-part-${i}`);
    if(el && el.checked){
      partsUsed.push({label:p.label, partName:p.partName, qty:p.qty});
      DB.partsStock[p.partName] = (DB.partsStock[p.partName]!==undefined ? DB.partsStock[p.partName] : 0) - (p.qty||1);
    }
  });
  if(editId){
    const rec = DB.maint.find(m=>m.id===editId);
    if(rec){
      rec.date = date; rec.hours = hours; rec.content = content;
      rec.contentItems = contentItems; rec.contentEtc = contentEtc;
      rec.technician = technician; rec.partsUsed = partsUsed; rec.model = g.model; rec.type = type;
      rec.photos = maintPhotosPending.slice(0,5);
      delete rec.photo;
    }
  } else {
    DB.maint.push({id: uid(), genId: g.id, model: g.model, date, hours, content, contentItems, contentEtc, technician, partsUsed, type, photos: maintPhotosPending.slice(0,5)});
  }
  maintPhotosPending = [];
  recomputeLastMaint(g.id);
  if(completeRepair){
    g.underRepair = false;
    g.repairNote = '';
  }
  await saveGens();
  await saveMaint();
  await savePartsStock();
  closeModal();
  renderContent();
  flash(completeRepair ? '수리 완료 처리되었습니다. 이제 출고할 수 있습니다.' : (editId? '정비 기록이 수정되었습니다' : '정비 등록되었습니다'));
}

function startQrScanner(){
  const msg = document.getElementById('qr-scan-msg');
  if(typeof Html5Qrcode === 'undefined'){
    if(msg){ msg.textContent = 'QR 스캔 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침 해주세요.'; msg.style.color = 'var(--danger)'; }
    return;
  }
  qrScannerInstance = new Html5Qrcode('qr-reader');
  qrScannerInstance.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 240, height: 240 } },
    (decodedText)=>{ handleQrScanResult(decodedText); },
    ()=>{ /* 인식 실패시 계속 스캔 시도, 조용히 무시 */ }
  ).catch(()=>{
    if(msg){ msg.textContent = '카메라를 열 수 없습니다. 카메라 권한을 허용했는지 확인해주세요.'; msg.style.color = 'var(--danger)'; }
  });
}
function stopQrScanner(){
  if(qrScannerInstance){
    const inst = qrScannerInstance;
    qrScannerInstance = null;
    inst.stop().then(()=>inst.clear()).catch(()=>{});
  }
}
function closeQrScanModal(){
  stopQrScanner();
  closeModal();
}
function genQrUrl(id){
  return location.origin + location.pathname + '?gen=' + encodeURIComponent(id);
}
function extractGenIdFromScan(decodedText){
  const raw = (decodedText||'').trim();
  try{
    const u = new URL(raw);
    const q = u.searchParams.get('gen');
    if(q) return q.trim();
  }catch(e){ /* URL이 아니면 무시하고 아래에서 처리 */ }
  const m = raw.match(/^GEN:(.+)$/i);
  return (m? m[1] : raw).trim();
}
function routeGenQrAction(id){
  const g = findGen(id);
  if(!g){
    showInfoModal(`"${escR(id)}" 발전기를 찾을 수 없습니다. QR코드가 이 발전기 목록에 등록된 번호인지 확인해주세요.`);
    return;
  }
  if(g.retired){
    showInfoModal(`${g.id}은(는) 폐기(또는 매각) 처리된 발전기입니다.`);
    return;
  }
  const pendingRes = DB.reservations.find(r=>r.genId===g.id);
  if(g.status!=='out' && pendingRes){
    // 이미 사무실에서 거래처 등 정보를 입력해 출고 대기(상차대기)로 등록된 발전기
    // → 필드에서는 내용만 확인하고 상차완료만 누르면 됨
    confirmLoadPrompt(pendingRes.id);
    return;
  }
  if(g.status==='out'){
    // 입고: 현재 사용시간과 출고시 나갔던 정보만 확인하면 되도록 이미 구성된 입고 처리 화면 사용
    openInModal(g.id);
    return;
  }
  // 사전 등록된 출고 대기 정보가 없는 상태에서 바로 출고하는 경우 → 신규 출고 정보 입력
  openOutModal(g.id);
}
function handleQrScanResult(decodedText){
  stopQrScanner();
  closeModal();
  const id = extractGenIdFromScan(decodedText);
  routeGenQrAction(id);
}
function checkQrUrlParamOnLoad(){
  const params = new URLSearchParams(location.search);
  const id = params.get('gen');
  if(!id) return;
  params.delete('gen');
  const newQuery = params.toString();
  const newUrl = location.pathname + (newQuery? '?'+newQuery : '') + location.hash;
  history.replaceState(null, '', newUrl);
  routeGenQrAction(id.trim());
}
function buildQrDataUrl(text, size){
  return new Promise((resolve)=>{
    if(typeof QRCode === 'undefined'){ resolve(''); return; }
    const holder = document.createElement('div');
    holder.style.display = 'none';
    document.body.appendChild(holder);
    new QRCode(holder, { text: text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
    setTimeout(()=>{
      const img = holder.querySelector('img');
      const canvas = holder.querySelector('canvas');
      let url = '';
      if(canvas) url = canvas.toDataURL('image/png');
      else if(img) url = img.src;
      document.body.removeChild(holder);
      resolve(url);
    }, 60);
  });
}

  openConfirmModal('이미 발급된 QR을 포함해 전체 발전기 QR을 다시 만들까요?\n\n발전기 번호가 그대로면 QR 내용은 똑같지만, 이미 본체에 붙어있는 QR이 있다면 새로 인쇄한 걸로 교체하실 필요는 없습니다. 분실·훼손된 QR만 다시 뽑고 싶다면 취소 후 [설정 → 발전기 모델 설정 → 관리]에서 그 발전기만 개별로 확인해주세요.', function(){ closeModal(); generateAllGenQrPrintFile(true); }, '전체 다시 인쇄', '취소');

async function showGenQrModal(id){
  const g = findGen(id);
  if(!g) return;
  const url = await buildQrDataUrl(genQrUrl(g.id), 220);
  if(!(DB.qrIssued||{})[g.id]){
    DB.qrIssued = DB.qrIssued || {};
    DB.qrIssued[g.id] = true;
    saveWithRetry(saveQrIssued);
  }
  document.getElementById('modal-root').innerHTML = `
  <div class="overlay" onclick="backdropClick(this,event,closeModal)">
    <div class="modal" style="text-align:center;">
      <h3>${g.id} QR코드</h3>
      <img src="${url}" width="200" height="200" style="margin:10px auto;display:block;">
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">닫기</button>
        <button class="btn primary" onclick="generateAllGenQrPrintFile(true)">전체 다시 인쇄 파일로 받기</button>
      </div>
    </div>
  </div>`;
}

function downloadExcelImportTemplate(){
  const bin = atob(EXCEL_IMPORT_TEMPLATE_B64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '발전기_전체데이터_불러오기_양식.xlsx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  flash('엑셀 양식 파일이 다운로드되었습니다.');
}
let pendingExcelImport = null;
function excelDateToStr(v){
  if(v===null || v===undefined || v==='') return '';
  if(v instanceof Date){
    if(isNaN(v.getTime())) return '';
    return toLocalDateStr(v);
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m){
    const mm = Number(m[2]), dd = Number(m[3]);
    if(mm<1||mm>12||dd<1||dd>31) return '';
    return `${m[1]}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  }
  return '';
}
function isBlankExcelRow(r){
  return Object.values(r).every(v=> v===null || v===undefined || String(v).trim()==='');
}
function excelBoolYN(v){
  const s = String(v||'').trim().toLowerCase();
  return s==='y' || s==='yes' || s==='예' || s==='네' || s==='true' || s==='o';
}
function sheetRowsOf(wb, name){
  if(!wb.SheetNames.includes(name)) return [];
  const ws = wb.Sheets[name];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
  return rows.map((r,i)=>({r, rowNum:i+2})).filter(x=>!isBlankExcelRow(x.r));
}
