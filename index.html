<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해성발전기 · 입출고 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F1EA;
    --surface:#FFFFFF;
    --surface-2:#FAF8F3;
    --border:#E1DCD0;
    --border-strong:#CFC8B8;
    --ink:#22242A;
    --ink-soft:#6B6E76;
    --ink-faint:#9A9C9F;
    --primary:#2C4A66;
    --primary-dark:#1B3247;
    --primary-tint:#E4ECF2;
    --ok:#2F7D4F;
    --ok-tint:#E4F1E8;
    --warn:#C97A1E;
    --warn-tint:#FBEDDB;
    --danger:#C23B3B;
    --danger-tint:#FBE6E6;
    --radius:10px;
    --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    --display:'Rajdhani','Noto Sans KR',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;padding-bottom:60px;}
  header{background:var(--primary-dark);color:#fff;padding:22px 20px 18px;}
  .brand-row{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:16px;flex-shrink:0;}
  .brand-name{font-size:13px;color:#B9C6D2;letter-spacing:.02em;}
  h1{font-family:var(--display);font-weight:700;font-size:24px;margin:6px 0 2px;letter-spacing:.01em;}
  .sub{font-size:13px;color:#9FB0BE;}
  nav{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;box-shadow:0 1px 0 rgba(0,0,0,.02);}
  nav button{flex:1;min-width:80px;border:none;background:transparent;padding:13px 6px;font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
  nav button.active{color:var(--primary-dark);border-bottom-color:var(--primary);font-weight:700;background:var(--surface-2);}
  .tab-unread-badge{display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;vertical-align:top;margin-left:1px;}
  main{max-width:1500px;width:100%;margin:0 auto;padding:18px 24px 40px;box-sizing:border-box;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:18px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;}
  .card .num{font-family:var(--mono);font-weight:700;font-size:26px;line-height:1;}
  .card .lbl{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .card.ok .num{color:var(--ok);} .card.warn .num{color:var(--warn);} .card.danger .num{color:var(--danger);}
  .section-title{font-size:18px;font-weight:800;margin:26px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .section-title .cnt{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:13px;}
  .table-scroll{overflow-x:auto;}
  .table-scroll table{min-width:880px;}
  .table-scroll td, .table-scroll th{white-space:nowrap;}
  .table-scroll td.wrap-ok{white-space:normal;}
  thead th{background:var(--surface-2);text-align:left;font-weight:700;color:var(--ink-soft);font-size:12px;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  .gid{font-family:var(--mono);font-weight:700;color:var(--primary-dark);white-space:nowrap!important;}
  .table-scroll td.gid{white-space:nowrap!important;}
  .muted{color:var(--ink-faint);}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .pill.ok{background:var(--ok-tint);color:var(--ok);}
  .pill.warn{background:var(--warn-tint);color:var(--warn);}
  .pill.danger{background:var(--danger-tint);color:var(--danger);}
  .pill.gray{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border);}
  button.pill{cursor:pointer;font-family:var(--sans);}
  .gauge-wrap{display:flex;align-items:center;gap:8px;min-width:150px;}
  .gauge{flex:1;height:8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;}
  .gauge-fill{height:100%;border-radius:5px 0 0 5px;}
  .gauge-txt{font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap;min-width:64px;text-align:right;}
  .btn{font-family:var(--sans);font-size:13px;font-weight:700;border:1px solid var(--border-strong);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;}
  .btn:hover{background:var(--surface-2);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn.primary:hover{background:var(--primary-dark);}
  .btn.danger{background:var(--danger-tint);border-color:var(--danger);color:var(--danger);}
  .btn.warn{background:var(--warn-tint);border-color:var(--warn);color:var(--warn);}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;}
  .empty{padding:34px 14px;text-align:center;color:var(--ink-faint);font-size:13px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius);}
  .overlay{position:fixed;inset:0;background:rgba(20,22,26,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{background:#fff;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 20px 24px;}
  @media(min-width:640px){.modal{border-radius:16px;}}
  .modal h3{font-family:var(--display);font-size:19px;margin:0 0 4px;}
  .modal .modal-sub{font-size:12px;color:var(--ink-soft);margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field-row{display:flex;gap:10px;margin-bottom:14px;}
  .field-row .field{margin-bottom:0;flex:1;min-width:0;}
  .field label{display:block;font-size:13.5px;font-weight:700;color:var(--primary);margin-bottom:5px;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border-strong);border-radius:8px;font-family:var(--sans);font-size:16px;background:#fff;color:var(--ink);}
  .field textarea{resize:vertical;min-height:60px;}
  input::placeholder,textarea::placeholder{color:var(--ink-faint)!important;font-weight:400!important;opacity:.8;}
  .field .hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}
  .field.chk{display:flex;align-items:center;gap:8px;}
  .field.chk input{width:16px;height:16px;}
  .field.chk label{margin:0;font-size:13px;font-weight:500;color:var(--ink);}
  .err{color:var(--danger);font-size:12px;margin-top:5px;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .modal-actions .btn{flex:1;text-align:center;}
  select#hist-select,select#hist-model-select{max-width:220px;}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .toolbar select{padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;font-family:var(--sans);font-size:13px;background:#fff;}
  .detail-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:12px;}
  .detail-head .gid-big{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--primary-dark);}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .detail-grid .item .k{font-size:11px;color:var(--ink-soft);}
  .detail-grid .item .v{font-family:var(--mono);font-weight:700;font-size:14px;margin-top:2px;}
  .settings-table input{width:100%;padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:13px;font-family:var(--sans);}
  .settings-table select{padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:13px;font-family:var(--sans);width:100%;}
  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);}
  .table-scroll{overflow-x:auto;}
  .save-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--primary-dark);color:#fff;padding:20px 36px;border-radius:16px;font-size:22px;font-weight:800;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.35);text-align:center;}
  .save-flash.show{opacity:1;}
  .util-two-col{display:flex;gap:16px;}
  .model-cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  @media(max-width:760px){.model-cards-grid{grid-template-columns:1fr;}}
  .util-two-col .table-scroll{flex:1;min-width:0;}
  .util-two-col .util-table{flex:1;min-width:0;overflow-x:visible;}
  .util-table table{width:100%;min-width:0;table-layout:fixed;}
  .util-table td, .util-table th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .util-table .gauge-wrap{min-width:0;gap:4px;}
  .util-table .gauge-txt{min-width:40px;font-size:14px;}
  .util-two-col .settings-table{flex:1;min-width:0;overflow-x:visible;}
  .util-two-col .settings-table table{width:100%;min-width:0;table-layout:auto;}
  .util-two-col .settings-table td, .util-two-col .settings-table th{white-space:normal;overflow:hidden;}
  .util-two-col .settings-table input, .util-two-col .settings-table select{min-width:0;}
  .model-settings-table table{table-layout:fixed;}
  .model-settings-table th, .model-settings-table td{padding:5px 6px;font-size:12.5px;}
  .model-settings-table td.gid{font-size:12.5px;}
  .model-settings-table input, .model-settings-table select{padding:4px 6px;font-size:12.5px;}
  .model-settings-table .btn.sm{padding:3px 7px;font-size:11px;}
  @media(max-width:760px){.util-two-col{flex-direction:column;}}
  .part-check{display:flex;align-items:center;gap:7px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--border);}
  .part-check:last-child{border-bottom:none;}
  .part-check input{width:15px;height:15px;flex-shrink:0;}
  .consumable-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
  .consumable-row input{flex:1;}
  .consumable-row input.qty{flex:0 0 60px;}
  .material-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
  .material-card .m-title{font-weight:700;font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .material-card .m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;font-size:12.5px;}
  .material-card .m-grid .k{color:var(--ink-soft);}
  .material-card .m-grid .v{font-family:var(--mono);font-weight:700;}
  .tag-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
  .tag{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:11px;}
  .prep-card{background:var(--warn-tint);border:1px solid var(--warn);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;}
  .prep-card .p-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;margin-bottom:6px;}
  .tech-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;max-width:520px;}

  /* 비밀번호 게이트 */
  #pw-gate{display:none;}
  #pw-gate.show{display:flex;position:fixed;inset:0;background:var(--primary-dark, #16324a);z-index:999;align-items:center;justify-content:center;padding:20px;}
  .pw-card{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.35);}
  .pw-title{font-size:19px;font-weight:800;margin-bottom:6px;text-align:center;}
  .pw-sub{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-bottom:18px;line-height:1.5;}
  .pw-input{width:100%;padding:11px 12px;border:1px solid var(--border-strong);border-radius:8px;font-size:15px;margin-bottom:10px;box-sizing:border-box;}
  .pw-err{color:var(--danger);font-size:12.5px;margin-top:-2px;margin-bottom:8px;}

  /* 사용설명서 */
  .manual-section{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:var(--surface);}
  .manual-section summary{cursor:pointer;padding:13px 16px;font-weight:800;font-size:14.5px;list-style:none;display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);}
  .manual-section summary::-webkit-details-marker{display:none;}
  .manual-section summary:after{content:'▾';font-size:12px;color:var(--ink-soft);transition:transform .15s;}
  .manual-section[open] summary:after{transform:rotate(180deg);}
  .manual-body{padding:4px 16px 14px;}
  .manual-body p{margin:0 0 10px;font-size:13px;color:var(--ink-soft);line-height:1.6;}
  .manual-btns{list-style:none;margin:0;padding:0;}
  .manual-btns li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--border);font-size:13px;line-height:1.5;}
  .manual-btns li:first-child{border-top:none;}
  .manual-btn-tag{flex-shrink:0;display:inline-block;background:var(--primary);color:#fff;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;margin-top:1px;}

  /* 인수증 미리보기 & 인쇄 */
  #receipt-overlay{display:none;}
  #receipt-overlay.show{display:block;position:fixed;inset:0;background:rgba(20,22,26,.6);z-index:300;overflow-y:auto;padding:20px 12px 40px;}
  .r-backdrop{min-height:100%;}
  .receipt-panel{background:#fff;max-width:720px;margin:0 auto;border-radius:12px;padding:18px;font-family:'Malgun Gothic','Noto Sans KR',sans-serif;color:#111;}
  .r-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .r-toolbar-title{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .print-msg{background:var(--warn-tint);border:1px solid var(--warn);color:#7a5314;font-size:12.5px;padding:10px 12px;border-radius:8px;margin-bottom:14px;}
  .r-copy{border:2px solid #222;border-radius:4px;padding:16px 18px;margin-bottom:12px;position:relative;overflow:hidden;}
  .r-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-size:52px;font-weight:900;letter-spacing:10px;color:rgba(120,120,120,0.35);white-space:nowrap;pointer-events:none;z-index:5;user-select:none;}
  .r-title{text-align:center;font-size:24px;font-weight:900;letter-spacing:4px;margin-bottom:12px;}
  .r-title .r-copy-tag{display:block;font-size:14.5px;font-weight:500;letter-spacing:2px;color:var(--ink-soft);margin-top:2px;}
  .r-row{display:flex;gap:16px;font-size:14.5px;margin-bottom:9px;}
  .r-top{justify-content:space-between;}
  .r-half{flex:1;} .r-full{flex:1;}
  .r-fill{display:inline-block;border-bottom:1px solid #999;min-width:130px;padding:0 4px;}
  .r-fill.wide{min-width:260px;}
  .r-table{width:100%;border-collapse:collapse;margin-bottom:9px;font-size:14px;}
  .r-table th{border:1px solid #333;padding:8px 6px;text-align:center;font-size:14.5px;}
  .r-table td{border:1px solid #333;padding:8px 6px;text-align:center;}
  .r-table th{background:#f0f0f0;}
  .r-confirm-text{font-size:17.5px;font-weight:800;padding-top:9px;margin-bottom:2px;}
  .r-sign-row{display:flex;justify-content:flex-end;padding-right:22%;margin-top:-14px;margin-bottom:6px;}
  .r-sign-label{font-size:14px;display:inline-block;border:2px solid #333;border-radius:50%;width:44px;height:44px;line-height:40px;text-align:center;}
  .r-footer{text-align:center;font-size:17.5px;font-weight:700;color:#333;margin-top:6px;}
  .r-notice{text-align:center;font-size:16.5px;color:#666;margin-top:3px;}
  .r-divider{position:relative;border-top:2px dashed #999;margin:14px 0;text-align:center;}
  .r-divider span{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#fff;padding:0 12px;font-size:14.5px;color:#888;letter-spacing:2px;}
  @media print{
    body > header, body > nav, body > main, body > #modal-root, body > #flash{display:none!important;}
    #receipt-overlay{position:static!important;background:#fff!important;padding:0!important;}
    .receipt-panel{max-width:170mm!important;border-radius:0!important;padding:0!important;margin:0 auto!important;}
    .no-print{display:none!important;}
    body{padding-bottom:0!important;}
    @page{size:A4 portrait;margin:16mm 14mm;}
  }
</style>
<!-- 인쇄시 브라우저 기본 머리글/바닥글(주소, 날짜, 페이지번호)을 원치 않으면
     인쇄 대화상자의 "추가 설정 > 머리글과 바닥글" 체크를 꺼주세요. -->

</head>
<body>

<div id="pw-gate"></div>

<header>
  <div class="brand-row">
    <div class="brand-mark">S</div>
    <div class="brand-name" id="brand-name-text">해성발전기</div>
    <span id="conn-status-badge" style="font-size:11px;margin-left:auto;"></span>
    <span id="last-saved-indicator" style="font-size:11px;color:rgba(255,255,255,.6);"></span>
    <button id="qr-scan-btn" onclick="openQrScanModal()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:700;">📷 QR 스캔</button>
    <button id="hard-refresh-btn" onclick="hardRefresh()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:700;">🔄 새로고침</button>
    <button id="save-all-btn" onclick="saveAllNow()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:700;">💾 전체 저장</button>
    <button id="user-badge" onclick="changeUserName()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;">이름 선택</button>
  </div>
  <div id="datetime-indicator" style="text-align:right;font-family:var(--mono);font-size:20px;font-weight:700;color:#FFD166;margin-top:6px;letter-spacing:.02em;"></div>
  <div style="text-align:right;font-size:12.5px;font-weight:700;color:#FFD166;margin-top:2px;">© 해성발전기 · 무단 복제 및 배포 금지 · 만든이: 홍승우</div>
  <h1 id="app-title-text">해성발전기 입출고 관리 시스템</h1>
  <div class="sub">입력한 내용은 인터넷을 통해 실시간으로 저장되어, 이 주소로 접속하는 모든 팀원 화면에 그대로 표시됩니다</div>
</header>

<nav id="tabbar"></nav>
<main id="content"><div class="loading">불러오는 중…</div></main>
<div id="modal-root"></div>
<div id="receipt-overlay"></div>
<div id="flash" class="save-flash"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBFsyc9pVNruWNOinoiJt-OZlfTHK__aE8",
  authDomain: "haesung3732.firebaseapp.com",
  databaseURL: "https://haesung3732-default-rtdb.asia-southeast1.firebasedatabase.app"
};
let firebaseAuthReady = null;
if(typeof firebase === 'undefined'){
  firebaseAuthReady = Promise.resolve(false);
} else {
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    firebaseAuthReady = new Promise(function(resolve){
      let settled = false;
      firebase.auth().onAuthStateChanged(function(user){
        if(user && !settled){ settled = true; resolve(true); }
      });
      firebase.auth().signInAnonymously().catch(function(err){
        if(!settled){ settled = true; resolve(false); }
      });
      setTimeout(function(){ if(!settled){ settled = true; resolve(false); } }, 8000);
    });
  }catch(e){
    firebaseAuthReady = Promise.resolve(false);
  }
}
async function getAuthQuery(){
  try{
    await firebaseAuthReady;
    const user = firebase.auth().currentUser;
    if(!user) return '';
    const token = await user.getIdToken();
    return 'auth='+encodeURIComponent(token);
  }catch(e){ return ''; }
}

// ===== Firebase Realtime Database 연동 (Claude 아티팩트의 window.storage 대체) =====
// 이 앱은 원래 window.storage API로 데이터를 저장했으나, 이 파일을 클로드 밖에서
// 팀원들과 공유되는 독립 웹페이지로 쓰기 위해 Firebase Realtime Database로 교체했습니다.
const FIREBASE_DB_URL = 'https://haesung3732-default-rtdb.asia-southeast1.firebasedatabase.app';
function fbKey(key){ return encodeURIComponent(key); }
function updateConnStatus(offline){
  const el = document.getElementById('conn-status-badge');
  if(!el) return;
  if(offline){
    el.textContent = '🟡 로컬 임시저장 (인터넷 연결 안됨)';
    el.style.color = '#FFD166';
  } else {
    el.textContent = '🟢 온라인';
    el.style.color = 'rgba(255,255,255,.55)';
  }
}
window.storage = {
  async get(key, shared){
    const cacheKey = 'gen-cache-'+(shared?'s-':'p-')+key;
    const path = (shared ? 'shared/' : 'personal/') + fbKey(key);
    try{
      const authQ = await getAuthQuery();
      const res = await fetch(`${FIREBASE_DB_URL}/${path}.json${authQ? '?'+authQ:''}`);
      if(!res.ok) throw new Error('네트워크 오류');
      const data = await res.json();
      if(data === null) throw new Error('키 없음');
      try{ localStorage.setItem(cacheKey, JSON.stringify({v:data})); }catch(e2){}
      updateConnStatus(false);
      return {key, value: data, shared};
    }catch(e){
      try{
        const cached = localStorage.getItem(cacheKey);
        if(cached!==null){
          updateConnStatus(true);
          return {key, value: JSON.parse(cached).v, shared};
        }
      }catch(e2){}
      throw e;
    }
  },
  async set(key, value, shared){
    const cacheKey = 'gen-cache-'+(shared?'s-':'p-')+key;
    try{ localStorage.setItem(cacheKey, JSON.stringify({v:value})); }catch(e2){}
    const path = (shared ? 'shared/' : 'personal/') + fbKey(key);
    try{
      const authQ = await getAuthQuery();
      const res = await fetch(`${FIREBASE_DB_URL}/${path}.json${authQ? '?'+authQ:''}`, {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(value)
      });
      if(!res.ok) throw new Error('저장 실패');
      updateConnStatus(false);
      return {key, value, shared};
    }catch(e){
      updateConnStatus(true);
      return {key, value, shared, offline:true};
    }
  },
  async delete(key, shared){
    const cacheKey = 'gen-cache-'+(shared?'s-':'p-')+key;
    const path = (shared ? 'shared/' : 'personal/') + fbKey(key);
    try{
      const authQ = await getAuthQuery();
      const res = await fetch(`${FIREBASE_DB_URL}/${path}.json${authQ? '?'+authQ:''}`, {method:'DELETE'});
      localStorage.removeItem(cacheKey);
      if(!res.ok) throw new Error('삭제 실패');
      updateConnStatus(false);
      return {key, deleted:true, shared};
    }catch(e){ updateConnStatus(true); return null; }
  },
  async list(prefix, shared){
    const base = shared ? 'shared' : 'personal';
    try{
      const authQ = await getAuthQuery();
      const res = await fetch(`${FIREBASE_DB_URL}/${base}.json?shallow=true${authQ? '&'+authQ:''}`);
      if(!res.ok) throw new Error('목록 조회 실패');
      const data = await res.json();
      const keys = data ? Object.keys(data) : [];
      const filtered = (prefix ? keys.filter(k=>k.startsWith(fbKey(prefix))) : keys).map(k=>decodeURIComponent(k));
      return {keys: filtered, prefix, shared};
    }catch(e){ return {keys:[], prefix, shared}; }
  }
};

const PW_STORAGE_KEY = 'gen-app-password-v1';
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function getStoredPassword(){
  try{
    const r = await window.storage.get(PW_STORAGE_KEY, true);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
function pwGateShow(html){
  const el = document.getElementById('pw-gate');
  if(!el) return;
  el.innerHTML = html;
  el.classList.add('show');
}
function pwGateHide(){
  const el = document.getElementById('pw-gate');
  if(!el) return;
  el.classList.remove('show');
  el.innerHTML = '';
}
async function initPasswordGate(){
  if(sessionStorage.getItem('gen-pw-unlocked')==='yes'){ init(); return; }
  const stored = await getStoredPassword();
  if(!stored){ renderPwSetupScreen(); }

}

async function submitPwSetup(){
  const p1 = document.getElementById('pw-setup-1').value;
  const p2 = document.getElementById('pw-setup-2').value;
  const errEl = document.getElementById('pw-setup-err');
  if(!p1 || p1.length<4){ errEl.textContent='비밀번호는 4자 이상 입력해주세요.'; errEl.style.display='block'; return; }
  if(p1!==p2){ errEl.textContent='비밀번호가 서로 다릅니다.'; errEl.style.display='block'; return; }
  const hash = await sha256Hex(p1);
  try{
    const r = await window.storage.set(PW_STORAGE_KEY, JSON.stringify({hash}), true);
    if(!r){ errEl.textContent='저장에 실패했습니다. 다시 시도해주세요.'; errEl.style.display='block'; return; }
  }catch(e){ errEl.textContent='저장에 실패했습니다. 다시 시도해주세요.'; errEl.style.display='block'; return; }
  sessionStorage.setItem('gen-pw-unlocked','yes');
  pwGateHide();
  init();
}

function renderPwLoginScreen(){
  pwGateShow(`

      <div class="pw-title">🔒 비밀번호 입력</div>
      <div class="pw-sub">입출고 관리 시스템 · 팀 공통 비밀번호를 입력해주세요.</div>

      <div id="pw-login-err" class="pw-err" style="display:none;"></div>
      <button class="btn primary" style="width:100%;" onclick="submitPwLogin()">확인</button>
    </div>
  `);
  setTimeout(()=>{ const el=document.getElementById('pw-login'); if(el) el.focus(); }, 50);

async function submitPwLogin(){
  const p = document.getElementById('pw-login').value;
  const errEl = document.getElementById('pw-login-err');
  if(!p){ errEl.textContent='비밀번호를 입력해주세요.'; errEl.style.display='block'; return; }
  const stored = await getStoredPassword();
  if(!stored){
    // 그 사이 다른 사람이 비밀번호를 해제한 경우
    sessionStorage.setItem('gen-pw-unlocked','yes');
    pwGateHide(); init(); return;
  }
  const hash = await sha256Hex(p);
  if(hash===stored.hash){
    sessionStorage.setItem('gen-pw-unlocked','yes');
    pwGateHide();
    init();
  } else {
    errEl.textContent='비밀번호가 틀렸습니다.'; errEl.style.display='block';
    document.getElementById('pw-login').value='';
  }
}
async function changeAppPassword(){
  const curEl = document.getElementById('f-pw-current');
  const newEl = document.getElementById('f-pw-new');
  const confEl = document.getElementById('f-pw-confirm');
  const msgEl = document.getElementById('f-pw-msg');
  const showMsg = (text, ok)=>{ msgEl.textContent=text; msgEl.style.display='block'; msgEl.style.color = ok? 'var(--ok)':'var(--danger)'; };
  const stored = await getStoredPassword();
  if(stored){
    const curHash = await sha256Hex(curEl.value||'');
    if(curHash!==stored.hash){ showMsg('현재 비밀번호가 올바르지 않습니다.', false); return; }
  }
  const nw = newEl.value, conf = confEl.value;
  if(!nw || nw.length<4){ showMsg('새 비밀번호는 4자 이상 입력해주세요.', false); return; }
  if(nw!==conf){ showMsg('새 비밀번호가 서로 다릅니다.', false); return; }
  const hash = await sha256Hex(nw);
  try{
    const r = await window.storage.set(PW_STORAGE_KEY, JSON.stringify({hash}), true);
    if(!r){ showMsg('저장에 실패했습니다.', false); return; }
  }catch(e){ showMsg('저장에 실패했습니다.', false); return; }
  curEl.value=''; newEl.value=''; confEl.value='';
  showMsg('비밀번호가 설정/변경되었습니다.', true);
}
async function removeAppPassword(){
  const curEl = document.getElementById('f-pw-current');

  if(!stored){ showMsg('이미 비밀번호 보호가 꺼져 있습니다.', true); return; }
  const curHash = await sha256Hex(curEl.value||'');

  }, '해제');
}

const ADMIN_MODE_PASSWORD_HASH = 'c585d6bd58c558d93a6340d107873d7b0f24002ad383e2af665ed9517253031d';
let adminModeUnlockedUntil = 0;
const ADMIN_MODE_DURATION_MS = 5*60*1000; // 5분
let adminModeRelockTimer = null;
function isAdminModeUnlocked(){ return Date.now() < adminModeUnlockedUntil; }
function scheduleAdminModeRelock(){
  if(adminModeRelockTimer) clearTimeout(adminModeRelockTimer);
  const remain = adminModeUnlockedUntil - Date.now();
  if(remain<=0) return;
  adminModeRelockTimer = setTimeout(function(){
    if(currentTab==='settings') renderContent();
  }, remain + 200);
}
async function submitAdminModeUnlock(){
  const el = document.getElementById('f-admin-pw');
  const errEl = document.getElementById('f-admin-pw-err');
  const hash = await sha256Hex((el&&el.value)||'');
  if(hash!==ADMIN_MODE_PASSWORD_HASH){
    if(errEl){ errEl.textContent = '관리자 비밀번호가 올바르지 않습니다.'; errEl.style.display = 'block'; }
    if(el){ el.value=''; el.focus(); }
    return;
  }
  adminModeUnlockedUntil = Date.now() + ADMIN_MODE_DURATION_MS;
  scheduleAdminModeRelock();
  renderContent();
  flash(`관리자 모드가 열렸습니다 (${Math.round(ADMIN_MODE_DURATION_MS/60000)}분 후 자동으로 다시 잠깁니다)`);

function toLocalDateStr(d){ return d.toLocaleDateString('en-CA'); }
let todayStr = () => toLocalDateStr(new Date());
function nowDateTimeStr(){
  const now = new Date();
  return `${toLocalDateStr(now)} ${now.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'})}`;

function isTechnician(){
  const name = (DB.currentUserName||'').trim();
  if(!name) return false;
  return (DB.technicians||[]).some(t => (t||'').trim() === name);
}

}

async function getOrInit(key, defVal){
  try{
    const r = await window.storage.get(key, true);
    return r ? JSON.parse(r.value) : defVal;
  }catch(e){
    try{ await window.storage.set(key, JSON.stringify(defVal), true); }catch(e2){ /* 저장 실패해도 기본값은 반환 */ }
    return defVal;
  }
}
async function peekStorage(key, fallback){
  try{
    const r = await window.storage.get(key, true);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){
    return fallback;
  }
}
async function getOrInitPersonal(key, defVal){
  try{
    const r = await window.storage.get(key, false);
    return r ? JSON.parse(r.value) : defVal;
  }catch(e){
    return defVal;
  }
}

  try{
    const r = await window.storage.set(key, value, shared);
    if(!r) throw new Error('저장 실패(응답 없음): '+key);
    return r;
  } finally {
    endSaving();
  }
}

const DOC_TEMPLATE_STORAGE_KEY = 'gen-doc-templates-v1';

let docTemplatesCache = null; // null=아직 안 불러옴, 배열=불러온 상태
async function loadDocTemplates(force){
  if(docTemplatesCache!==null && !force) return docTemplatesCache;
  try{
    const r = await window.storage.get(DOC_TEMPLATE_STORAGE_KEY, true);
    docTemplatesCache = r ? JSON.parse(r.value) : [];

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadDocTemplate(){
  const input = document.getElementById('f-doctpl-file');
  const file = input && input.files && input.files[0];
  if(!file) return;

    input.value = '';
    return;
  }
  const dataUrl = await fileToDataUrl(file);
  const list = await loadDocTemplates();
  list.push({
    id: uid(), fileName: file.name, dataUrl, sizeKB: Math.round(file.size/1024),
    uploadedBy: DB.currentUserName||'이름미상', uploadedDate: todayStr()

async function saveOneWithRetry(fn, retries){
  let lastErr = null;
  for(let i=0; i<=retries; i++){
    try{ await fn(); return {ok:true}; }
    catch(e){ lastErr = e; if(i<retries) await new Promise(r=>setTimeout(r, 500*(i+1))); }
  }
  return {ok:false, err: lastErr};
}

  const btn = document.getElementById('hard-refresh-btn');
  if(btn){ btn.disabled = true; btn.textContent = '새로고침 중…'; }
  try{

      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  const url = new URL(window.location.href);
  url.searchParams.set('_r', Date.now());
  window.location.href = url.toString();
}
async function saveWithRetry(fn, retries){

    if(r.ok){
      lastSavedAt = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
      updateLastSavedIndicator();

    }
  } finally {

  }
}

function estCurrentHours(g){
  if(g.status==='out' && g.rental && g.rental.longTerm && g.rental.estDaily>0 && g.rental.outDate){
    const days = Math.max(0,(Date.now() - new Date(g.rental.outDate+'T00:00:00').getTime())/86400000);
    return g.rental.startHours + days*g.rental.estDaily;
  }

}

function predictedDate(g){
  if(!(g.status==='out' && g.rental && g.rental.longTerm && g.rental.estDaily>0)) return null;
  const rem = estRemaining(g);
  if(rem<=0) return {overdue:true};
  const days = rem / g.rental.estDaily;
  const d = new Date(Date.now() + days*86400000);
  return {overdue:false, date: toLocalDateStr(d), days: Math.round(days)};
}

function daysFromToday(dateStr){

// 전화번호 입력칸에서 숫자만 입력해도 자동으로 하이픈(-)을 넣어줍니다.
// 서울(02) 지역번호는 2-3-4자리, 그 외(휴대폰 010 등, 지역번호)는 3-3-4 또는 3-4-4자리로 나눕니다.
function formatPhoneNumber(v){
  const num = (v||'').replace(/[^0-9]/g,'').slice(0,11);
  if(num.length < 4) return num;
  if(num.startsWith('02')){
    if(num.length <= 5) return num.slice(0,2)+'-'+num.slice(2);
    if(num.length <= 9) return num.slice(0,2)+'-'+num.slice(2,5)+'-'+num.slice(5);
    return num.slice(0,2)+'-'+num.slice(2,6)+'-'+num.slice(6,10);
  }
  if(num.length <= 6) return num.slice(0,3)+'-'+num.slice(3);
  if(num.length <= 10) return num.slice(0,3)+'-'+num.slice(3,6)+'-'+num.slice(6);
  return num.slice(0,3)+'-'+num.slice(3,7)+'-'+num.slice(7,11);
}
// 기존에 하이픈 없이(또는 다르게) 저장되어 있던 전화번호를 불러올 때 자동으로 정리합니다.
// (새로 입력하는 칸은 각 입력칸의 oninput에서 즉시 처리되고, 이 함수는 이미 저장돼 있던 옛날 데이터를 대상으로 합니다)
function migratePhoneFieldsInPlace(){
  const changed = {gens:false, rentals:false, reservations:false, companyInfo:false};
  (DB.gens||[]).forEach(g=>{
    if(g.rental && g.rental.phone){
      const f = formatPhoneNumber(g.rental.phone);
      if(f !== g.rental.phone){ g.rental.phone = f; changed.gens = true; }
    }
    if(g.disposalPhone){
      const f = formatPhoneNumber(g.disposalPhone);
      if(f !== g.disposalPhone){ g.disposalPhone = f; changed.gens = true; }
    }
    if(g.buyerPhone){
      const f = formatPhoneNumber(g.buyerPhone);
      if(f !== g.buyerPhone){ g.buyerPhone = f; changed.gens = true; }
    }
  });
  (DB.rentals||[]).forEach(r=>{
    if(r.phone){
      const f = formatPhoneNumber(r.phone);
      if(f !== r.phone){ r.phone = f; changed.rentals = true; }
    }
  });
  (DB.reservations||[]).forEach(r=>{
    if(r.phone){
      const f = formatPhoneNumber(r.phone);
      if(f !== r.phone){ r.phone = f; changed.reservations = true; }
    }
  });
  if(DB.companyInfo){
    if(DB.companyInfo.phone){
      const f = formatPhoneNumber(DB.companyInfo.phone);
      if(f !== DB.companyInfo.phone){ DB.companyInfo.phone = f; changed.companyInfo = true; }
    }
    if(DB.companyInfo.mobile){
      const f = formatPhoneNumber(DB.companyInfo.mobile);
      if(f !== DB.companyInfo.mobile){ DB.companyInfo.mobile = f; changed.companyInfo = true; }
    }
  }
  return changed;
}
async function persistPhoneMigration(changed){

    if(changed.companyInfo) tasks.push(saveCompanyInfo());
    if(tasks.length) await Promise.allSettled(tasks);
  }catch(e){}
}
function dow(dateStr){
  if(!dateStr) return dateStr;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  const days=['일','월','화','수','목','금','토'];
  return `${dateStr}(${days[d.getDay()]})`;
}
function inDateLabel(dateStr){
  const diff = daysFromToday(dateStr);
  if(diff===0) return '오늘입고';
  if(diff===1) return '입고임박';
  if(diff===2) return '입고2일전';
  if(diff===3) return '입고3일전';
  if(diff<0) return `${dow(dateStr)} (지연)`;
  return dow(dateStr);
}
// 날짜와 임박 상태를 한 줄로 합쳐서 보여줄 때 사용 (열 헤더가 "입고예정일"이므로 여기선 접두어 없이 날짜+상태만 표기)
function inDateLabelFull(dateStr){
  const diff = daysFromToday(dateStr);
  const dateTxt = dow(dateStr);
  if(diff===0) return `${dateTxt} (오늘)`;
  if(diff===1) return `${dateTxt} (임박)`;
  if(diff===2) return `${dateTxt} (2일전)`;
  if(diff===3) return `${dateTxt} (3일전)`;
  if(diff<0) return `${dateTxt} (지연)`;
  return dateTxt;
}
// 하루 최대 사용시간 기준 (이 시간을 초과해서 사용된 임대 건을 "과다사용"으로 표시합니다)
const OVERUSE_DAILY_LIMIT_DEFAULT = 10;

function rentalDays(r){
  if(!r || !r.outDate || !r.inDate) return null;
  const out = new Date(r.outDate+'T00:00:00');
  const inD = new Date(r.inDate+'T00:00:00');
  if(isNaN(out.getTime()) || isNaN(inD.getTime())) return null;
  const days = Math.round((inD-out)/86400000);
  return days>0 ? days : 1; // 당일 반납 등은 최소 1일로 계산
}
function rentalAvgDaily(r){
  const days = rentalDays(r);
  if(!days || r.usedHours==null) return null;
  return r.usedHours/days;
}
function isRentalOveruse(r){
  const avg = rentalAvgDaily(r);
  if(avg==null || avg<=overuseLimit()) return false;
  const historyCount = DB.rentals.filter(x=>x.genId===r.genId).length;
  return historyCount>=3;
}
function overuseRentalsList(){
  return DB.rentals.filter(isRentalOveruse).sort((a,b)=>rentalAvgDaily(b)-rentalAvgDaily(a));
}
function checkOveruseOnReturn(rentalId, id, oldVoltageForLog, voltage){
  const rec = DB.rentals.find(r=>r.id===rentalId);
  if(!rec || !isRentalOveruse(rec)) return false;
  const avg = rentalAvgDaily(rec);
  document.getElementById('modal-root').innerHTML = `
  <div class="overlay">
    <div class="modal">
      <h3>🚨 과다사용 확인</h3>
      <div class="modal-sub">${escR(rec.genId)} · ${escR(rec.customer||'거래처 미기재')}</div>
      <div style="background:var(--danger-tint);border:1px solid var(--danger);border-radius:8px;padding:14px;">
        <div style="font-weight:800;color:var(--danger);margin-bottom:8px;">이번 임대 기간 동안 하루 평균 ${avg.toFixed(1)}h 사용되어 기준(${overuseLimit()}h)을 초과했습니다.</div>
        <div class="field chk" style="margin:0;">
          <input type="checkbox" id="f-overuse-ack">
          <label for="f-overuse-ack">과다사용 내역을 확인했습니다 (거래처별 이력에 "과다사용" 태그가 자동으로 남습니다)</label>
        </div>
      </div>
      <div id="f-overuse-err" class="err" style="display:none;"></div>
      <div class="modal-actions">
        <button class="btn primary" onclick="submitOveruseAck('${rentalId}','${id}','${(oldVoltageForLog||'').replace(/'/g,"\\'")}','${(voltage||'').replace(/'/g,"\\'")}')">확인</button>
      </div>
    </div>

  return true;
}
async function submitOveruseAck(rentalId, id, oldVoltage, voltage){
  const chk = document.getElementById('f-overuse-ack');
  const errEl = document.getElementById('f-overuse-err');
  if(!chk || !chk.checked){
    if(errEl){ errEl.textContent = '확인 체크를 해야 닫을 수 있습니다.'; errEl.style.display = 'block'; }
    return;
  }
  const rec = DB.rentals.find(r=>r.id===rentalId);
  if(rec && rec.customer){
    DB.customerNotes = DB.customerNotes || {};
    const existing = DB.customerNotes[rec.customer] || {tags:[], note:''};
    if(!(existing.tags||[]).includes('과다사용')){
      existing.tags = [...(existing.tags||[]), '과다사용'];
      existing.updatedBy = DB.currentUserName||null;
      existing.updatedAt = todayStr();
      DB.customerNotes[rec.customer] = existing;
      await saveCustomerNotes();
    }
  }
  closeModal();
  maybeLogVoltageChange(id, oldVoltage, voltage);
}
function inDCountLabel(dateStr){
  const diff = daysFromToday(dateStr);
  if(diff<0) return `${dow(dateStr)} (지연)`;
  if(diff===0) return '오늘입고';
  if(diff===1) return '입고임박';
  return `입고${diff}일전`;
}

function gaugeHtml(elapsed, remaining, cycle){
  const cyc = cycle || DEFAULT_CYCLE;
  const pct = Math.min(100, Math.max(0,(elapsed/cyc)*100));
  const st = maintStatus(remaining);
  const color = st==='danger'?'var(--danger)':st==='warn'?'var(--warn)':'var(--ok)';
  const txt = remaining<0 ? (Math.abs(Math.round(remaining))+'h 초과') : (Math.round(remaining)+'h 남음');
  return `<div class="gauge-wrap"><div class="gauge"><div class="gauge-fill" style="width:${pct}%;background:${color}"></div></div><span class="gauge-txt" style="color:${color}">${txt}</span></div><div class="muted" style="font-size:11px;margin-top:2px;">마지막 정비 후 ${Math.round(elapsed).toLocaleString()}시간 사용</div>`;
}
function pillHtml(status){
  const map={ok:['정상','ok'],warn:['임박','warn'],danger:['정비필요','danger']};
  const [t,c]=map[status];

}
function voltageColor(voltage){
  const v = (voltage||'').replace(/\s/g,'').toUpperCase();
  const map = {
    '220V': '#2C7A4B',
    '380V': '#2C4A66',
    '440V': '#8A5A00',
    '480V': '#7A2C8A'
  };
  return map[v] || null;
}

function getSupplySelections(prefix){
  const el = document.getElementById(prefix+'-selections');
  if(!el) return [];
  try{ return JSON.parse(el.value||'[]'); }catch(e){ return []; }
}
function syncSupplyHiddenFields(prefix, arr){
  const hiddenEl = document.getElementById(prefix);
  const itemsEl = document.getElementById(prefix+'-items');
  const customEl = document.getElementById(prefix+'-custom');
  const display = arr.map(it=>`${it.name} x${it.qty}`).join(', ');
  if(hiddenEl) hiddenEl.value = display;
  if(itemsEl) itemsEl.value = JSON.stringify(arr.filter(it=>it.tracked).map(it=>({name:it.name, qty:it.qty})));
  if(customEl) customEl.value = arr.filter(it=>!it.tracked).map(it=>`${it.name} x${it.qty}`).join(', ');
}
function renderSupplyChips(prefix){
  const wrap = document.getElementById(prefix+'-chips');
  if(!wrap) return;
  const arr = getSupplySelections(prefix);
  if(arr.length===0){ wrap.innerHTML = `<span class="muted" style="font-size:12px;">선택된 부자재가 없습니다.</span>`; return; }
  wrap.innerHTML = arr.map((it,idx)=>{
    let stockTxt = '';
    if(it.tracked){
      const stock = (DB.suppliesStock && DB.suppliesStock[it.name]!==undefined) ? DB.suppliesStock[it.name] : 0;
      stockTxt = stock<=0 ? ` <span style="color:var(--danger);font-weight:700;">재고없음</span>` : ` <span class="muted" style="font-size:10px;">(재고 ${stock})</span>`;
    }
    return `<span class="pill ${it.tracked?'ok':'gray'}" style="display:inline-flex;align-items:center;gap:6px;">${escR(it.name)} x${it.qty}${stockTxt}<button type="button" onclick="removeSupplyFromPicker('${prefix}', ${idx})" style="border:none;background:none;cursor:pointer;font-weight:700;color:var(--danger);padding:0;">✕</button></span>`;
  }).join('');
}
function initSuppliesPicker(prefix){
  syncSupplyHiddenFields(prefix, getSupplySelections(prefix));
  renderSupplyChips(prefix);
}
function addSupplyToPicker(prefix){
  const searchEl = document.getElementById(prefix+'-search');
  const qtyEl = document.getElementById(prefix+'-qty-input');
  if(!searchEl) return;
  const name = searchEl.value.trim();
  if(!name) return;
  const qty = Math.max(1, Number(qtyEl.value)||1);
  const tracked = (DB.suppliesCatalog||[]).includes(name);
  const arr = getSupplySelections(prefix);
  const existingIdx = arr.findIndex(it=>it.name===name);
  if(existingIdx>=0) arr[existingIdx].qty = qty;
  else arr.push({name, qty, tracked});
  const selEl = document.getElementById(prefix+'-selections');
  if(selEl) selEl.value = JSON.stringify(arr);
  syncSupplyHiddenFields(prefix, arr);
  renderSupplyChips(prefix);
  searchEl.value = '';
  qtyEl.value = '1';
  searchEl.focus();
}
function removeSupplyFromPicker(prefix, idx){
  const arr = getSupplySelections(prefix);
  arr.splice(idx, 1);
  const selEl = document.getElementById(prefix+'-selections');
  if(selEl) selEl.value = JSON.stringify(arr);
  syncSupplyHiddenFields(prefix, arr);
  renderSupplyChips(prefix);
}

function inferConsumableKind(name, usedKinds){
  if(!name) return null;
  if(/오일필터/.test(name)) return !usedKinds.has('oilFilter1') ? 'oilFilter1' : (!usedKinds.has('oilFilter2') ? 'oilFilter2' : null);
  if(/연료필터/.test(name)) return !usedKinds.has('fuelFilter1') ? 'fuelFilter1' : (!usedKinds.has('fuelFilter2') ? 'fuelFilter2' : null);
  if(/에어필터/.test(name)) return !usedKinds.has('airFilter') ? 'airFilter' : null;
  if(!/필터/.test(name) && /오일/.test(name)) return !usedKinds.has('engineOil') ? 'engineOil' : null;
  return null;
}
function materialCandidateParts(model){
  const m = DB.materials[model];
  if(!m) return [];
  const parts = [];
  const usedKinds = new Set();
  if(m.engineOilLiters){ parts.push({label:`엔진오일${m.engineOilSpec? ` ${m.engineOilSpec}`:''} ${m.engineOilLiters}L`, partName:`엔진오일`, qty:m.engineOilLiters, kind:'engineOil'}); usedKinds.add('engineOil'); }
  if(m.oilFilter1Name){ parts.push({label:`오일필터1: ${m.oilFilter1Name}${m.oilFilter1Qty?` ×${m.oilFilter1Qty}`:''}`, partName:m.oilFilter1Name, qty:m.oilFilter1Qty||1, kind:'oilFilter1'}); usedKinds.add('oilFilter1'); }
  if(m.oilFilter2Name){ parts.push({label:`오일필터2: ${m.oilFilter2Name}${m.oilFilter2Qty?` ×${m.oilFilter2Qty}`:''}`, partName:m.oilFilter2Name, qty:m.oilFilter2Qty||1, kind:'oilFilter2'}); usedKinds.add('oilFilter2'); }
  if(m.fuelFilterName){ parts.push({label:`연료필터1: ${m.fuelFilterName}${m.fuelFilterQty?` ×${m.fuelFilterQty}`:''}`, partName:m.fuelFilterName, qty:m.fuelFilterQty||1, kind:'fuelFilter1'}); usedKinds.add('fuelFilter1'); }
  if(m.fuelFilter2Name){ parts.push({label:`연료필터2: ${m.fuelFilter2Name}${m.fuelFilter2Qty?` ×${m.fuelFilter2Qty}`:''}`, partName:m.fuelFilter2Name, qty:m.fuelFilter2Qty||1, kind:'fuelFilter2'}); usedKinds.add('fuelFilter2'); }
  if(m.airFilterName){ parts.push({label:`에어필터: ${m.airFilterName}${m.airFilterQty?` ×${m.airFilterQty}`:''}`, partName:m.airFilterName, qty:m.airFilterQty||1, kind:'airFilter'}); usedKinds.add('airFilter'); }
  if(m.fanBeltName) parts.push({label:`팬벨트: ${m.fanBeltName}${m.fanBeltQty?` ×${m.fanBeltQty}`:''}`, partName:m.fanBeltName, qty:m.fanBeltQty||1, kind:'fanBelt'});
  (m.consumables||[]).forEach(c=>{
    if(!c.name) return;
    const kind = inferConsumableKind(c.name, usedKinds);
    if(kind) usedKinds.add(kind);
    const unit = partUnitOf(c.name);
    parts.push({label:`${c.category? `[${c.category}] `:''}${c.name}${c.spec? ` (${c.spec})`:''}${c.qty?` ×${c.qty}${unit||''}`:''}`, partName:c.name, qty:c.qty||1, kind: kind||'consumable'});
  });
  return parts;
}
function allKnownPartNames(){
  const names = new Set();
  Object.values(DB.materials||{}).forEach(m=>{
    materialCandidatePartsFromMaterial(m).forEach(p=>names.add(p.partName));
  });
  Object.keys(DB.partsStock||{}).forEach(n=>names.add(n));

}
function materialCandidatePartsFromMaterial(m){
  if(!m) return [];
  const parts = [];
  if(m.engineOilLiters) parts.push({partName:'엔진오일'});
  if(m.oilFilter1Name) parts.push({partName:m.oilFilter1Name});
  if(m.oilFilter2Name) parts.push({partName:m.oilFilter2Name});
  if(m.fuelFilterName) parts.push({partName:m.fuelFilterName});
  if(m.fuelFilter2Name) parts.push({partName:m.fuelFilter2Name});
  if(m.airFilterName) parts.push({partName:m.airFilterName});
  if(m.fanBeltName) parts.push({partName:m.fanBeltName});
  (m.consumables||[]).forEach(c=>{ if(c.name) parts.push({partName:c.name}); });
  return parts;
}

function unreadCountFor(category, items){
  const user = (DB.currentUserName||'').trim();
  if(!user || !items || items.length===0) return 0;
  const readIds = new Set((((DB.readMarkers||{})[user]||{})[category]) || []);
  return items.filter(item=>item && item.id && !readIds.has(item.id)).length;
}
async function markAllReadFor(category, items){
  const user = (DB.currentUserName||'').trim();
  if(!user || !items || items.length===0) return;
  DB.readMarkers = DB.readMarkers || {};
  const userMarkers = DB.readMarkers[user] || {};
  const existing = new Set(userMarkers[category] || []);
  let changed = false;
  items.forEach(item=>{ if(item && item.id && !existing.has(item.id)){ existing.add(item.id); changed = true; } });
  if(!changed) return;
  userMarkers[category] = [...existing];
  DB.readMarkers[user] = userMarkers;
  await saveReadMarkers();
}
function markOneReadFor(category, id){
  const user = (DB.currentUserName||'').trim();
  if(!user || !id) return;
  DB.readMarkers = DB.readMarkers || {};
  const userMarkers = DB.readMarkers[user] || {};
  const existing = new Set(userMarkers[category] || []);
  if(existing.has(id)) return;
  existing.add(id);
  userMarkers[category] = [...existing];
  DB.readMarkers[user] = userMarkers;
  saveReadMarkers();
}

}

function captureFocusState(){
  try{
    const el = document.activeElement;
    if(!el || !el.id) return null;
    const state = {id: el.id, tag: el.tagName};
    if(typeof el.selectionStart === 'number'){
      try{ state.selStart = el.selectionStart; state.selEnd = el.selectionEnd; }catch(e){}
    }
    return state;
  }catch(e){ return null; }
}
function restoreFocusState(state){
  if(!state) return;
  try{
    const el = document.getElementById(state.id);
    if(!el) return;
    const active = document.activeElement;
    if(active && active.id === state.id) return;
    el.focus({preventScroll:true});
    if(typeof state.selStart === 'number' && typeof el.setSelectionRange === 'function'){
      try{ el.setSelectionRange(state.selStart, state.selEnd); }catch(e){}
    }
  }catch(e){}
}
function renderContent(){
  const _focus = captureFocusState();
  const c = document.getElementById('content');
  if(currentTab==='notice') c.innerHTML = renderNoticeTab();
  else if(currentTab==='dashboard') c.innerHTML = renderDashboard();

function regionOf(address){
  if(!address) return '기타';
  const a = address;
  if(/서울/.test(a)) return '서울';
  if(/인천/.test(a)) return '인천';
  if(/대전/.test(a)) return '대전';
  if(/세종/.test(a)) return '세종';
  if(/대구/.test(a)) return '대구';
  if(/부산/.test(a)) return '부산';
  if(/울산/.test(a)) return '울산';
  if(/제주/.test(a)) return '제주';
  const gyeonggiNorth = ['고양','파주','의정부','동두천','양주','포천','연천','가평','남양주','구리','김포'];
  const gyeonggiSouth = ['수원','성남','용인','안양','부천','안산','평택','화성','시흥','군포','의왕','하남','오산','이천','안성','여주','과천','광명'];
  if(gyeonggiNorth.some(c=>a.includes(c))) return '경기북부';
  if(gyeonggiSouth.some(c=>a.includes(c))) return '경기남부';
  if(/경기/.test(a)) return '경기(기타)';
  if(/광주/.test(a)) return '광주';
  const chungnam = ['천안','아산','서산','당진','논산','공주','보령','계룡','금산','부여','서천','청양','홍성','예산','태안'];
  if(chungnam.some(c=>a.includes(c)) || /충남/.test(a)) return '충남';
  const chungbuk = ['청주','충주','제천','보은','옥천','영동','증평','진천','괴산','음성','단양'];
  if(chungbuk.some(c=>a.includes(c)) || /충북/.test(a)) return '충북';
  const gangwon = ['춘천','원주','강릉','동해','태백','속초','삼척','홍천','횡성','영월','평창','정선','철원','화천','양구','인제','고성','양양'];
  if(gangwon.some(c=>a.includes(c)) || /강원/.test(a)) return '강원';
  const gyeongbuk = ['포항','경주','김천','안동','구미','영주','영천','상주','문경','경산','군위','의성','청송','영양','영덕','청도','고령','성주','칠곡','예천','봉화','울진','울릉'];
  if(gyeongbuk.some(c=>a.includes(c)) || /경북/.test(a)) return '경북';
  const gyeongnam = ['창원','진주','통영','사천','김해','밀양','거제','양산','의령','함안','창녕','남해','하동','산청','함양','거창','합천'];
  if(gyeongnam.some(c=>a.includes(c)) || /경남/.test(a)) return '경남';
  const jeonbuk = ['전주','군산','익산','정읍','남원','김제','완주','진안','무주','장수','임실','순창','고창','부안'];
  if(jeonbuk.some(c=>a.includes(c)) || /전북/.test(a)) return '전북';
  const jeonnam = ['목포','여수','순천','나주','광양','담양','곡성','구례','고흥','보성','화순','장흥','강진','해남','영암','무안','함평','영광','장성','완도','진도','신안'];
  if(jeonnam.some(c=>a.includes(c)) || /전남/.test(a)) return '전남';
  return '기타';
}
function backupReminderBannerHtml(){
  if(autoBackupFolderActive) return '';
  const dow0 = new Date(todayStr()+'T00:00:00').getDay(); // 0=일,1=월,...4=목
  const isBackupDay = (dow0===1 || dow0===4);
  if(!isBackupDay) return '';
  if(DB.lastBackupDate === todayStr()) return '';
  const dayLabel = dow0===1 ? '월요일' : '목요일';
  return `
    <div class="detail-card" style="background:var(--warn-tint);border-color:var(--warn);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
      <div style="font-size:13px;color:var(--warn);font-weight:700;">📦 오늘은 ${dayLabel}입니다 — 정기 백업을 아직 안 하셨어요. 데이터 백업을 챙겨주세요.</div>
      <button class="btn sm primary" onclick="downloadFullBackup()">지금 백업하기</button>
    </div>`;
}
function lowStockBannerHtml(){
  const lowParts = Object.keys(DB.partsMinStock||{}).filter(n=>{

      <div style="font-size:13px;color:var(--danger);font-weight:700;">🛠 장기임대 정비 임박 ${ltUrgent.length}대${dangerN>0? ` (정비필요 ${dangerN}대)`:''} — 방문 정비 준비가 필요합니다.</div>

}
function overuseBannerHtml(){

function renderDashboard(){
  const active = activeGens();
  const total = active.length;
  const inCount = active.filter(g=>g.status==='in').length;
  const outCount = active.filter(g=>g.status==='out').length;
  const brokenCount = active.filter(g=>g.underRepair).length;
  const forcedOutCount = active.filter(g=>g.status==='out' && g.rental && g.rental.forcedOut).length;
  const resCount = DB.reservations.length;
  const urgent = active.filter(g=>{
    if(!hasHourData(g)) return false;
    const r = g.status==='in'? remainingHours(g) : estRemaining(g);
    return maintStatus(r)!=='ok';
  });
  urgent.sort((a,b)=>{
    const ra = a.status==='in'? remainingHours(a) : estRemaining(a);
    const rb = b.status==='in'? remainingHours(b) : estRemaining(b);
    return ra-rb;
  });
  const dangerCount = urgent.filter(g=>{
    const r = g.status==='in'? remainingHours(g): estRemaining(g);
    return r<=0;
  }).length;

  let rows = urgent.slice(0,15).map(g=>{
    const r = g.status==='in'? remainingHours(g): estRemaining(g);
    const el = g.status==='in'? elapsedHours(g): estElapsed(g);
    return `<tr>
      <td class="gid">${g.id}</td>
      <td class="wrap-ok">${displayModel(g)}</td>
      <td>${g.status==='in'?'<span class="pill gray">입고</span>':'<span class="pill gray">출고중(추정)</span>'}</td>
      <td>${gaugeHtml(el, r, getCycle(g))}</td>
      <td>${pillHtml(maintStatus(r))}</td>
    </tr>`;
  }).join('');
  if(urgent.length===0) rows = `<tr><td colspan="5" class="muted" style="text-align:center;padding:20px;">정비가 임박한 발전기가 없습니다.</td></tr>`;

  // 최근 입고 처리한 발전기 (최근 5건)
  const recentIn = [...DB.rentals].filter(r=>r.inDate).sort((a,b)=>((b.inProcessedAt||b.inDate||'')).localeCompare((a.inProcessedAt||a.inDate||''))).slice(0,5);
  const recentInRows = recentIn.map(r=>{
    const g = findGen(r.genId);
    const given = r.fuelRequested!=null ? r.fuelRequested : r.fuelActual;
    let fuelCell = '<span class="muted">-</span>';
    if(given!=null){
      if(r.fuelNotUsed){
        fuelCell = '<span class="pill gray">연료사용안함</span>';
      } else if(r.measuredFuelHeightCm==null){
        fuelCell = '<span class="pill danger">연료 미확인</span>';
      } else {
        const remain = g ? computeFuelLiters(g, r.measuredFuelHeightCm) : null;
        fuelCell = remain!=null
          ? `<span style="color:var(--primary-dark);font-weight:700;">${given}L→${remain}L<br><span class="muted" style="font-weight:400;">(사용 ${Math.round((given-remain)*10)/10}L)</span></span>`
          : `<span class="muted">측정 ${r.measuredFuelHeightCm}cm</span>`;
      }
    }
    return `<tr>
      <td class="gid">${escR(r.genId)}</td>
      <td class="wrap-ok">${g? displayModel(g):'-'}</td>
      <td class="muted" style="font-size:12px;">${escR(r.inProcessedAt || dow(r.inDate) || '-')}</td>
      <td>${g? voltagePillHtml(g.id, g.voltage) : '-'}</td>
      <td class="muted" style="font-size:12px;">${escR(r.inProcessedBy||'-')}</td>
      <td class="wrap-ok" style="font-size:12px;">${escR(r.customer||'-')}</td>
      <td class="wrap-ok" style="font-size:12px;">${escR(r.address||'-')}</td>
      <td style="font-size:12px;">${fuelCell}</td>
    </tr>`;
  }).join('');

  // 입고 예정 (5일 이내, 최근 5건)
  const soonList = active.filter(g=>g.status==='out' && g.rental && expectedInDate(g.rental))
    .map(g=>({g, date: expectedInDate(g.rental)}))
    .filter(x=>daysFromToday(x.date)<=5)

  const soonRows = soonList.map(x=>{

  // 지역별 출고 현황 (출고중인 발전기의 주소 기준)

  const reserveSummary = [...DB.reservations]
    .sort((a,b)=>{

      const ad = a.loadDate||a.outDate||a.plannedOutDate||'';

      return ad.localeCompare(bd);

  const reserveSummaryRows = reserveSummary.map(r=>{

      <td class="gid">${r.genId}</td>
      <td class="wrap-ok">${g? displayModel(g): '-'}</td>
      <td class="wrap-ok">${r.customer||r.site||'<span class="muted">미기재</span>'}</td>
      <td>${r.pendingLoad? '<span class="pill warn">상차대기</span>' : '<span class="pill gray">출고예정</span>'}</td>
    </tr>`;
  }).join('');

  // 출고중 최근 요약 (출고일 최근순)
  const outSummary = [...outGens]
    .sort((a,b)=>((b.rental&&b.rental.outDate)||'').localeCompare((a.rental&&a.rental.outDate)||''))
    .slice(0,5);
  const outSummaryRows = outSummary.map(g=>{
    const rt = g.rental;
    return `<tr>
      <td class="gid">${g.id}</td>
      <td class="wrap-ok">${displayModel(g)}</td>

      <td class="muted">${dow(rt.outDate)||'-'}</td>

  // 소모품주문내역 요약 (미구입 우선)
  const coList = DB.consumableOrders || [];
  const coPendingCount = coList.filter(x=>!x.purchasedBy).length;
  const coSummary = [...coList].sort((a,b)=>{
    const aOpen = a.purchasedBy?1:0, bOpen = b.purchasedBy?1:0;

  }).slice(0,5);
  const coSummaryRows = coSummary.map(item=>{
    const specParts = [item.spec1, item.spec2].filter(Boolean).join(' / ');
    return `<tr>

      <td class="muted" style="font-size:12px;">${escR(specParts)||'-'}</td>

    </tr>`;
  }).join('');

  // 보완요청 요약 (미해결 우선, 최근순)
  const impList = DB.improvements || [];
  const impOpenCount = impList.filter(x=>!x.completedBy).length;
  const impSummary = [...impList].sort((a,b)=>{
    const aOpen = !a.completedBy, bOpen = !b.completedBy;
    if(aOpen!==bOpen) return aOpen? -1:1;
    return (b.createdDate||'').localeCompare(a.createdDate||'');
  }).slice(0,5);
  const impSummaryRows = impSummary.map(item=>{
    const done = !!item.completedBy;
    return `<tr>
      <td class="wrap-ok" style="font-size:13px;">${escR((item.content||'').slice(0,40))}${(item.content||'').length>40? '…':''}</td>

      <td>${done? '<span class="pill ok">완료</span>' : '<span class="pill warn">미해결</span>'}</td>
    </tr>`;
  }).join('');

  return `
    ${backupReminderBannerHtml()}
    ${lowStockBannerHtml()}
    ${longtermMaintBannerHtml()}
    ${overuseBannerHtml()}
    <div class="cards">
      <div class="card" style="cursor:pointer;" onclick="switchTab('history')"><div class="num">${total}</div><div class="lbl">전체 발전기</div></div>

    <div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(90px,1fr));">
      ${regionEntries.map(([region,count])=>`

          <div class="lbl">${region}</div>
        </div>
      `).join('')}

    <div class="section-title">정비 임박 / 필요 <span class="cnt">${urgent.length}대</span></div>
    <div class="table-scroll"><table>
      <thead><tr><th>번호</th><th>모델</th><th>상태</th><th>정비 주기</th><th></th></tr></thead>

      <span>🕐 최근 입고 처리한 발전기 <span class="cnt">최근 5대</span></span>
      <button class="btn sm" onclick="switchTab('in')">전체보기</button>
    </div>
    ${recentIn.length===0? `<div class="empty">최근 입고 처리한 발전기가 없습니다.</div>` : `
    <div class="table-scroll"><table>
      <thead><tr><th>번호</th><th>모델</th><th>입고 처리 시각</th><th>셋팅전압</th><th>처리자</th><th>거래처</th><th>지역</th><th>연료체크</th></tr></thead>

function capacityOf(g){
  const m = (g.model||'').match(/(\d+(?:\.\d+)?)\s*kW/i);
  return m ? parseFloat(m[1]) : Infinity;
}
function capacityFromModelStr(model){
  const m = (model||'').match(/(\d+(?:\.\d+)?)\s*kW/i);
  return m ? parseFloat(m[1]) : Infinity;
}
function sortModelsByCapacity(models){
  return [...models].sort((a,b)=>{
    const ca = capacityFromModelStr(a), cb = capacityFromModelStr(b);
    if(ca!==cb) return ca-cb;
    return a.localeCompare(b,'ko');
  });
}
function usableCapacityHtml(g){
  const cap = capacityOf(g);
  const ratio = g.usageRatio && g.usageRatio>0 && g.usageRatio<100 ? g.usageRatio : 100;
  if(!isFinite(cap) || ratio>=100) return '';
  const usable = Math.round(cap*ratio/100*10)/10;
  return `<div class="muted" style="font-size:11px;">정격 대비 ${ratio}% 사용 (약 ${usable}kW)</div>`;
}
function usableCapacityCell(g){
  const cap = capacityOf(g);
  if(!isFinite(cap)) return '<span class="muted">-</span>';
  const ratio = g.usageRatio && g.usageRatio>0 && g.usageRatio<=100 ? g.usageRatio : 100;
  const usable = Math.round(cap*ratio/100*10)/10;
  if(ratio>=100) return `<span class="muted">${cap}kW (100%)</span>`;
  return `<span style="color:var(--warn);font-weight:700;">${usable}kW</span> <span class="muted" style="font-size:11px;">(정격 ${cap}kW의 ${ratio}%)</span>`;
}
function sortByIdNatural(a, b){
  const aL = /^L-/i.test(a.id);
  const bL = /^L-/i.test(b.id);
  if(aL !== bL) return aL ? 1 : -1; // L 시리즈는 항상 맨 아래
  if(aL && bL){
    const priority = ['L-11','L-12','L-13']; // 이 세 대는 L 시리즈 내에서 항상 맨 위
    const aP = priority.indexOf(a.id.toUpperCase());
    const bP = priority.indexOf(b.id.toUpperCase());
    if(aP!==-1 || bP!==-1){
      if(aP!==-1 && bP!==-1) return aP-bP;
      return aP!==-1 ? -1 : 1;
    }
  }
  return a.id.localeCompare(b.id, undefined, {numeric:true, sensitivity:'base'});
}
function lastFuelInfo(genId){
  const g = findGen(genId);
  const recs = DB.rentals.filter(r=>r.genId===genId && (r.measuredFuelHeightCm!=null || r.fuelNotUsed)).sort((a,b)=>(b.inDate||'').localeCompare(a.inDate||''));
  if(recs.length===0) return null;
  const latest = recs[0];
  if(g && g.fuelResetAt && g.fuelResetAt >= (latest.inDate||'')) return null;
  return latest;
}
async function resetFuelReading(genId){
  const g = findGen(genId);
  if(!g) return;
  openConfirmModal('연료를 기준점까지 다시 뺐다는 뜻으로, 화면에 표시된 연료량을 초기화할까요? (기록은 이력에 그대로 남고, 목록 표시만 초기화됩니다)', async function(){
    g.fuelResetAt = todayStr();
    await saveGens();
    closeModal();
    renderContent();
    flash('연료 표시가 초기화되었습니다. 다음 출고 준비가 완료되었습니다.');
  }, '초기화');
}
function tankDimsOf(g){
  const m = DB.materials && g && DB.materials[g.model];
  return {
    width: (g && g.tankWidth>0) ? g.tankWidth : ((m && m.tankWidth) || null),
    depth: (g && g.tankDepth>0) ? g.tankDepth : ((m && m.tankDepth) || null),
    height: (g && g.tankHeight>0) ? g.tankHeight : ((m && m.tankHeight) || null)
  };
}
function genSizeOf(g){
  const m = DB.materials && g && DB.materials[g.model];
  return {
    width: (g && g.genWidth>0) ? g.genWidth : ((m && m.genWidth) || null),
    depth: (g && g.genDepth>0) ? g.genDepth : ((m && m.genDepth) || null),
    height: (g && g.genHeight>0) ? g.genHeight : ((m && m.genHeight) || null)
  };
}
function fuelBaselineOf(g){
  const m = DB.materials && g && DB.materials[g.model];
  const modelDefault = (m && m.fuelBaselineHeight>0) ? m.fuelBaselineHeight : 0;
  return (g && g.fuelBaselineHeight>0) ? g.fuelBaselineHeight : modelDefault;
}
function computeFuelLiters(g, heightCm){
  const {width:w, depth:d, height:h} = tankDimsOf(g);
  if(heightCm==null || !(w>0 && d>0)) return null;
  const baseline = fuelBaselineOf(g);
  const maxUsableHeight = h>0 ? Math.max(h - baseline, 0) : null;
  const clampedHeight = (maxUsableHeight>0 && heightCm>0) ? Math.min(heightCm, maxUsableHeight) : heightCm;
  return Math.round(w*d*clampedHeight/1000*10)/10;
}

function renderOutList(){

    const pred = predictedDate(g);

    return `<tr${rt.forcedOut? ` style="background:var(--danger-tint);"`:''}>
      <td><input type="checkbox" class="bulk-in-chk" data-gid="${g.id}" ${bulkInSelection.has(g.id)?'checked':''} onchange="toggleBulkInSelect('${g.id}', this.checked)"></td>
      <td class="gid">${g.id}</td>
      <td class="wrap-ok">${displayModel(g)}${usableCapacityHtml(g)}${(rt.fuelRequested!=null||rt.fuelActual!=null)? ` <span class="pill" style="color:var(--primary-dark);border-color:var(--primary);background:var(--primary-tint);" title="출고시 연료를 넣어드렸으니 입고시 잔량을 확인해주세요.">⛽ 기름체크 필요</span>`:''}${rt.forcedOut? `<div><span class="pill danger">🚨 미입금 출고</span></div><div class="muted" style="font-size:11px;color:var(--danger);">사유: ${escR(rt.forceReason||'-')}${rt.forcedBy? ` (${escR(rt.forcedBy)})`:''}</div>`:''}</td>
      <td class="muted" style="font-size:11px;">${rt.outProcessedBy? escR(rt.outProcessedBy) : '-'}</td>
      <td>${(()=>{ const v=g.voltage||rt.voltage; const c=voltageColor(v); return v? `<span style="${c?`color:${c};font-weight:700;`:''}">${escR(v)}</span>` : '<span class="muted">-</span>'; })()}</td>
      <td class="wrap-ok">
        ${rt.customer||'<span class="muted">미기재</span>'}
        ${(rt.manager||rt.phone)? `<div class="muted" style="font-size:11px;">${[rt.manager,rt.phone].filter(Boolean).join(' · ')}</div>`:''}
        <div class="muted" style="font-size:11px;">${[rt.site,rt.address].filter(Boolean).join(' · ')}</div>
        <div class="muted" style="font-size:11px;">부자재: ${rt.supplies||'없음'}</div>
        ${rt.fuelRequested? `<div class="muted" style="font-size:11px;">연료: 요청 ${rt.fuelRequested}L${rt.fuelActual && rt.fuelActual!==rt.fuelRequested? ` (실제주입 ${rt.fuelActual}L)`:''}</div>`:''}
        ${(rt.loadDate||rt.arriveTime)? `<div class="muted" style="font-size:11px;">상차/도착: ${[dow(rt.loadDate),rt.arriveTime].filter(Boolean).join(' · ')}</div>`:''}
        ${rt.freightBearer? `<div class="muted" style="font-size:11px;">운임료: ${rt.freightBearer}</div>`:''}
        ${rt.note? `<div class="muted" style="font-size:11px;">비고: ${rt.note}</div>`:''}
      </td>
      <td class="muted">${dow(rt.outDate)||'-'}</td>
      <td>${isLT? gaugeHtml(el,rem,getCycle(g)) : '<span class="muted" style="font-size:12px;">반납 시 확인</span>'}</td>
      <td style="font-size:12px;">${predTxt}</td>
      <td style="font-size:12px;">${expIn? (()=>{ const diff = daysFromToday(expIn); const isLate = diff!=null && diff<0; const cls = isLate?'danger':(diff<=1?'danger':(diff<=3?'warn':'gray')); return `<span class="pill ${cls}">📅 ${inDateLabelFull(expIn)}</span>`; })() : '<span class="muted">-</span>'}</td>
      <td>
        <div class="btn-row" style="flex-wrap:wrap;row-gap:4px;">
          ${rt.forcedOut? `<button class="btn sm primary" onclick="confirmOutPayment('${g.id}')" style="white-space:nowrap;">입금 확인</button>`:''}
          <button class="btn sm" onclick="openOutInfoEditModal('${g.id}')" style="white-space:nowrap;">정보 수정</button>
          <button class="btn sm" onclick="printReceipt('${g.id}')" style="white-space:nowrap;">인수증</button>
          <button class="btn sm primary" onclick="openInModal('${g.id}')" style="white-space:nowrap;">입고 처리</button>
        </div>
        <div class="btn-row" style="flex-wrap:wrap;row-gap:4px;margin-top:4px;">
          <button class="btn sm" onclick="quickForceInPrompt('${g.id}')" style="white-space:nowrap;" title="거래처·연료·부자재 등 정보 입력 없이 바로 [입고] 상태로 전환합니다. 잘못 출고 처리한 발전기를 되돌릴 때 사용하세요. 이번 출고 이력은 기록되지 않습니다.">⚡ 정보없이 강제입고</button>

        </div>
      </td>
    </tr>`;
  };
  const shortList = list.filter(g=>!g.rental.longTerm);
  const longList = list.filter(g=>g.rental.longTerm);
  const shortRows = shortList.map(rowHtml).join('');
  const longRows = longList.map(rowHtml).join('');
  const theadHtml = `<thead><tr><th style="width:30px;"><input type="checkbox" onchange="toggleSelectAllBulkIn(this)" title="전체 선택"></th><th>번호</th><th>모델</th><th>출고완료</th><th>전압</th><th>거래처/현장</th><th>도착일</th><th>정비 주기(추정)</th><th>정비 예상시점</th><th>입고예정일</th><th></th></tr></thead>`;

  // 용량(kW)별 버튼 목록
  const capacityCounts = {};
  allOutGens.forEach(g=>{
    const cap = capacityOf(g);
    if(!isFinite(cap)) return;
    capacityCounts[cap] = (capacityCounts[cap]||0) + 1;
  });
  const capacityEntries = Object.entries(capacityCounts).map(([k,v])=>[parseFloat(k),v]).sort((a,b)=>a[0]-b[0]);
  const capacityButtonsHtml = capacityEntries.length===0 ? '' : `
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
      <button class="btn sm${outCapacityFilter==null?' primary':''}" onclick="clearOutCapacityFilter()">전체</button>
      ${capacityEntries.map(([cap,cnt])=>`<button class="btn sm${outCapacityFilter===cap?' primary':''}" onclick="viewCapacityOutList(${cap})">${cap}kW <span class="muted" style="font-size:11px;">(${cnt})</span></button>`).join('')}
    </div>`;

  return `
    <div class="section-title">출고중 발전기 <span class="cnt">${list.length}대</span>${outRegionFilter? ` <span class="cnt" style="background:var(--warn-tint);color:var(--warn);border-color:var(--warn);">지역: ${escR(outRegionFilter)} <button onclick="clearOutRegionFilter()" style="border:none;background:none;cursor:pointer;font-weight:700;margin-left:4px;">✕</button></span>`:''}${outCapacityFilter!=null? ` <span class="cnt" style="background:var(--warn-tint);color:var(--warn);border-color:var(--warn);">용량: ${outCapacityFilter}kW <button onclick="clearOutCapacityFilter()" style="border:none;background:none;cursor:pointer;font-weight:700;margin-left:4px;">✕</button></span>`:''} <button type="button" class="btn sm" onclick="downloadOutFieldListFile()">🖨 출고 리스트 인쇄(단기/장기)</button></div>
    ${capacityButtonsHtml}
    <p class="muted" style="font-size:12.5px;margin-top:-4px;">같은 거래처에서 여러 대를 한 번에 반납받을 때는 왼쪽 체크박스로 여러 대를 선택한 뒤 "한번에 입고" 버튼을 눌러주세요. 현장 정기 점검 출장 전에는 위 "출고 리스트 인쇄" 버튼으로 단기 1장·장기 1장짜리 리스트를 뽑을 수 있습니다.</p>
    <div id="bulk-in-bar">${bulkInBarHtml()}</div>
    ${list.length===0? `<div class="empty">${outRegionFilter||outCapacityFilter!=null? `조건에 맞는 출고중인 발전기가 없습니다.`:'출고중인 발전기가 없습니다.'}</div>` : `
    <div class="section-title" style="font-size:14px;margin-top:14px;">단기임대 <span class="cnt">${shortList.length}대</span></div>
    ${shortList.length===0? `<div class="empty">단기임대 중인 발전기가 없습니다.</div>` : `
    <div class="table-scroll"><table>
      ${theadHtml}
      <tbody>${shortRows}</tbody>
    </table></div>`}
    <div class="section-title" style="font-size:14px;margin-top:20px;">장기임대 <span class="cnt">${longList.length}대</span></div>
    ${longList.length===0? `<div class="empty">장기임대 중인 발전기가 없습니다.</div>` : `
    <div class="table-scroll"><table>
      ${theadHtml}
      <tbody>${longRows}</tbody>
    </table></div>`}
    `}
  `;
}

function toggleLongterm(id){
  const g = findGen(id);
  const rt = g.rental;
  if(!rt) return;
  if(rt.longTerm){
    openConfirmModal('이 발전기를 "장기"에서 "단기"로 변경할까요?', function(){
      rt.longTerm = false;
      rt.estDaily = null;
      saveGens();
      renderContent();
      flash('단기로 변경되었습니다');
    });
  } else {
    openLongtermConvertModal(id);
  }
}
function openLongtermConvertModal(id){
  const g = findGen(id);
  document.getElementById('modal-root').innerHTML = `
  <div class="overlay" onclick="backdropClick(this,event,closeModal)">

}
async function submitLongtermConvert(id){

  g.rental.longTerm = true;
  g.rental.estDaily = v;

}

function toggleCHoursUnknown(){
  const unknown = document.getElementById('f-chours-unknown').checked;
  document.getElementById('f-chours-fields').style.display = unknown ? 'none' : 'block';
}
async function submitCheckHours(id){
  const g = findGen(id);
  const unknown = document.getElementById('f-chours-unknown').checked;
  if(unknown){
    g.hoursKnown = false;
    g.hoursNA = true;
    g.hoursUpdatedAt = nowDateTimeStr();
    g.hoursUpdatedBy = DB.currentUserName || null;
    await saveGens();
    closeModal();
    renderContent();
    flash('해당없음으로 표시되었습니다');
    return;
  }
  const hours = Number(document.getElementById('f-chours').value);
  const lastMaint = Number(document.getElementById('f-clastmaint').value);
  const errEl = document.getElementById('f-err');
  if(isNaN(hours) || hours<0 || isNaN(lastMaint) || lastMaint<0){
    errEl.textContent='숫자를 정확히 입력해주세요.'; errEl.style.display='block'; return;
  }
  if(lastMaint>hours){
    errEl.textContent='마지막 정비시 누적시간은 현재 누적시간보다 클 수 없습니다.'; errEl.style.display='block'; return;
  }
  g.hours = hours;
  g.lastMaintHours = lastMaint;
  g.hoursKnown = true;
  g.hoursNA = false;
  g.hoursUpdatedAt = nowDateTimeStr();
  g.hoursUpdatedBy = DB.currentUserName || null;
  await saveGens();
  closeModal();
  renderContent();
  flash('저장되었습니다');
}

  maintCapacityFilter = cap;

function renderMaintList(){
  const wrapCnt = document.getElementById('maint-list-cnt');
  const wrap = document.getElementById('maint-list-wrap');
  if(!wrap) return;
  const allGens = activeGens();
  const sorted = allGens.filter(g=>maintCapacityFilter==null || capacityOf(g)===maintCapacityFilter).sort((a,b)=>{
    const ra = hasHourData(a) ? (a.status==='in'? remainingHours(a): estRemaining(a)) : 9999;
    const rb = hasHourData(b) ? (b.status==='in'? remainingHours(b): estRemaining(b)) : 9999;
    return ra-rb;
  });
  if(wrapCnt) wrapCnt.textContent = `${sorted.length}대`;
  maintBulkTargetIds = sorted.map(g=>g.id);

  const capacityCounts = {};
  allGens.forEach(g=>{
    const cap = capacityOf(g);
    if(!isFinite(cap)) return;
    capacityCounts[cap] = (capacityCounts[cap]||0) + 1;
  });
  const capacityEntries = Object.entries(capacityCounts).map(([k,v])=>[parseFloat(k),v]).sort((a,b)=>a[0]-b[0]);
  const capacityButtonsHtml = capacityEntries.length===0 ? '' : `
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
      <button class="btn sm${maintCapacityFilter==null?' primary':''}" onclick="clearMaintCapacityFilter()">전체</button>
      ${capacityEntries.map(([cap,cnt])=>`<button class="btn sm${maintCapacityFilter===cap?' primary':''}" onclick="viewCapacityMaintList(${cap})">${cap}kW <span class="muted" style="font-size:11px;">(${cnt})</span></button>`).join('')}
      <button class="btn sm" style="margin-left:6px;color:var(--primary-dark);border-color:var(--primary);" onclick="openBulkCycleModal()">⚙️ 정비주기 일괄변경${sorted.length>0? ` (${sorted.length}대)`:''}</button>
    </div>`;

  let rows = sorted.map(g=>{
    const known = hasHourData(g);
    const el = g.status==='in'? elapsedHours(g): estElapsed(g);
    const rem = g.status==='in'? remainingHours(g): estRemaining(g);
    return `<tr>
      <td class="gid">${g.id}</td>
      <td class="wrap-ok">${displayModel(g)}</td>
      <td class="muted" style="font-size:12px;">${g.status==='in'?'입고':'출고중'}</td>
      <td>${known? gaugeHtml(el,rem,getCycle(g)) : '<span class="muted" style="font-size:12px;">확인 불가</span>'}</td>
      <td>${known? pillHtml(maintStatus(rem)) : '<span class="pill gray">-</span>'}</td>
      <td><div class="btn-row">
        <button class="btn sm" onclick="openMaintModal('${g.id}')">정비 등록</button>
        <button class="btn sm" onclick="goToHistory('${g.id}')">이력조회</button>
        <button class="btn sm" onclick="openAdjustModal('${g.id}')">직접수정</button>
        <button class="btn sm" onclick="openCycleModal('${g.id}')" style="${getCycle(g)!==DEFAULT_CYCLE? 'color:var(--danger);font-weight:700;border-color:var(--danger);':''}">정비주기(${getCycle(g)}h)</button>
      </div></td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `
    ${capacityButtonsHtml}
    ${sorted.length===0 ? `<div class="empty">${maintCapacityFilter!=null? `${maintCapacityFilter}kW 용량의 발전기가 없습니다.` : '검색 결과가 없습니다.'}</div>` : `
    <div class="table-scroll"><table>
      <thead><tr><th>번호</th><th>모델</th><th>현황</th><th>정비 주기</th><th>상태</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`}`;
}

        <input type="number" id="f-adj-fuelbaseline" min="0" step="0.5" value="${g.fuelBaselineHeight||''}" placeholder="예: 9">

      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">취소</button>

function toggleAdjUnknown(){
  const unknown = document.getElementById('f-adj-unknown').checked;
  document.getElementById('f-adj-fields').style.display = unknown ? 'none' : 'block';
}
async function submitAdjust(id){
  const g = findGen(id);
  const model = document.getElementById('f-adj-model').value.trim();
  const oldVoltage = g.voltage||'';
  const voltage = document.getElementById('f-adj-voltage').value.trim();
  const unknown = document.getElementById('f-adj-unknown').checked;
  const fuelBaselineHeight = Number(document.getElementById('f-adj-fuelbaseline').value)||null;
  const errEl = document.getElementById('f-err');
  let hours, lastMaint, lastMaintDate;
  if(!unknown){
    hours = Number(document.getElementById('f-adj-hours').value);
    lastMaint = Number(document.getElementById('f-adj-lastmaint').value);
    lastMaintDate = document.getElementById('f-adj-lastmaintdate').value || null;
    if(isNaN(hours) || hours<0 || isNaN(lastMaint) || lastMaint<0){
      errEl.textContent='숫자를 정확히 입력해주세요.'; errEl.style.display='block'; return;
    }
    if(lastMaint>hours){
      errEl.textContent='마지막 정비시 누적시간은 현재 누적시간보다 클 수 없습니다.'; errEl.style.display='block'; return;
    }
  }
  // 검증을 모두 통과한 뒤에만 실제 값 반영 (검증 실패시 메모리상 값이 먼저 바뀌어버리는 것 방지)
  g.model = model;
  g.voltage = voltage;
  g.fuelBaselineHeight = fuelBaselineHeight;
  if(unknown){
    g.hoursKnown = false;
    g.hoursNA = true;
  } else {
    g.hours = hours;
    g.lastMaintHours = lastMaint;
    g.lastMaintDate = lastMaintDate;
    g.hoursKnown = true;
    g.hoursNA = false;
  }
  g.hoursUpdatedAt = nowDateTimeStr();
  g.hoursUpdatedBy = DB.currentUserName || null;
  if(voltage !== oldVoltage.trim()){
    g.voltageUpdatedAt = nowDateTimeStr();
    g.voltageUpdatedAtMs = Date.now();
    g.voltageUpdatedBy = DB.currentUserName || null;
  }
  await saveGens();
  closeModal();
  renderContent();
  flash('수정되었습니다');
}

  document.getElementById('modal-root').innerHTML = `

function selectBulkCycleQuick(h){
  const input = document.getElementById('f-bulk-cycle');
  if(input) input.value = h;
  const wrap = document.getElementById('bulk-cycle-quick-buttons');
  if(wrap) wrap.querySelectorAll('button[data-cycle-h]').forEach(btn=>{
    btn.classList.toggle('primary', Number(btn.dataset.cycleH)===h);
  });

async function submitBulkCycle(){
  const saveBtn = document.getElementById('bulk-cycle-save-btn');
  if(saveBtn && saveBtn.disabled) return;
  if(saveBtn) saveBtn.disabled = true;
  try{
    const cycle = Number(document.getElementById('f-bulk-cycle').value);
    const errEl = document.getElementById('f-err');
    if(isNaN(cycle) || cycle<=0){
      errEl.textContent='정비 주기는 1 이상의 숫자로 입력해주세요.'; errEl.style.display='block';
      return;
    }
    const ids = maintBulkTargetIds;
    ids.forEach(id=>{ const g = findGen(id); if(g) g.cycle = cycle; });
    await saveGens();
    closeModal();
    renderContent();
    flash(`${ids.length}대의 정비 주기가 ${cycle}h로 일괄 변경되었습니다`);
  } finally {
    if(saveBtn) saveBtn.disabled = false;
  }
}

async function submitCycle(id){

  if(saveBtn) saveBtn.disabled = true;
  try{
    const g = findGen(id);
    const cycle = Number(document.getElementById('f-cycle').value);
    const errEl = document.getElementById('f-err');

function recomputeLastMaint(genId){
  const g = findGen(genId);
  if(!g) return;
  const recs = DB.maint.filter(m=>m.genId===genId);
  if(recs.length===0) return;
  const maxHours = Math.max(...recs.map(r=>r.hours||0));
  g.lastMaintHours = maxHours;
  if((g.hours||0) < maxHours) g.hours = maxHours;
  g.hoursKnown = true;
  g.hoursUpdatedAt = nowDateTimeStr();
  g.hoursUpdatedBy = DB.currentUserName || null;
  const atMax = recs.filter(r=>(r.hours||0)===maxHours).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(atMax.length>0 && atMax[0].date) g.lastMaintDate = atMax[0].date;
}
