<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전압설정</title>
<link rel="manifest" href="manifest-voltage.json">
<meta name="theme-color" content="#16212C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="전압설정">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --bg:#16212C; --panel:#1F2D3A; --panel-2:#26384A; --line:#34495D; --ink:#F1F4F7; --ink-soft:#A9B6C3;
  --volt:#F2B705; --v220:#4FA3E0; --v380:#F2B705; --v380p:#E8743B; --etc:#8FA3B5; --err:#F07C66;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100vh;}
button,input{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px;}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 40px;}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:10px;}
.top h1{font-size:18px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px;}
.bolt{display:inline-flex;width:28px;height:28px;border-radius:7px;background:var(--volt);color:#16212C;align-items:center;justify-content:center;font-size:16px;}
.back{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:38px;height:38px;font-size:18px;flex:none;}
.top .sub{font-size:12px;color:var(--ink-soft);margin-left:auto;}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;margin-bottom:12px;}
.search::placeholder{color:#7F8E9C;}

.list{display:flex;flex-direction:column;gap:8px;}
.mrow{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.mrow .name{font-weight:700;font-size:15.5px;}
.mrow .ids{font-size:12px;color:var(--ink-soft);margin-top:2px;word-break:keep-all;}
.mrow .kinds{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
.k{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid currentColor;}
.k.v220{color:var(--v220);} .k.v380{color:var(--v380);} .k.v380plus{color:var(--v380p);} .k.etc{color:var(--etc);}
.k.off{opacity:.3;}
.empty,.msg{color:var(--ink-soft);text-align:center;padding:28px 10px;}
.msg.err{color:var(--err);}

.sec{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.sec h2{margin:0;font-size:15px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-left:6px solid var(--etc);background:var(--panel-2);}
.sec.v220 h2{border-left-color:var(--v220);} .sec.v380 h2{border-left-color:var(--v380);} .sec.v380plus h2{border-left-color:var(--v380p);}
.sec h2 small{font-size:12px;color:var(--ink-soft);font-weight:500;}
.note{padding:10px 14px 0;white-space:pre-wrap;font-size:14.5px;}
.photos{padding:10px;display:flex;flex-direction:column;gap:10px;}
.photos button{border:0;padding:0;background:none;display:block;}
.photos img{width:100%;border-radius:8px;display:block;background:#0E161E;}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none;}
.chips a{flex:none;text-decoration:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 11px;background:var(--panel);border:1px solid var(--line);}
.chips a.v220{color:var(--v220);} .chips a.v380{color:var(--v380);} .chips a.v380plus{color:var(--v380p);} .chips a.etc{color:var(--etc);}

.viewer{position:fixed;inset:0;background:#000;z-index:20;overflow:auto;touch-action:pinch-zoom pan-x pan-y;}
.viewer img{width:100%;min-height:100%;object-fit:contain;display:block;}
.viewer .close{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:20px;z-index:21;}
.viewer .hint{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#bbb;font-size:12px;pointer-events:none;}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
.kcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:118px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:left;border-top:6px solid var(--etc);}
.kcard.v220{border-top-color:var(--v220);} .kcard.v380{border-top-color:var(--v380);} .kcard.v380plus{border-top-color:var(--v380p);}
.kcard .kl{font-size:20px;font-weight:700;}
.kcard .kn{font-size:30px;font-weight:700;margin-top:auto;line-height:1;}
.kcard .kn small{font-size:14px;font-weight:500;color:var(--ink-soft);margin-left:2px;}
.kcard:disabled{opacity:.45;}
.foot{margin-top:18px;font-size:11.5px;color:#7F8E9C;text-align:center;}
.foot button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:12px;margin-top:6px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
// 사무실 프로그램과 같은 Firebase에서 "읽기만" 합니다. (모델 정보 ~5KB + 고른 모델의 사진만)
const DB_URL = 'https://haesung3732-default-rtdb.asia-southeast1.firebasedatabase.app';
const FB = { apiKey:"AIzaSyBFsyc9pVNruWNOinoiJt-OZlfTHK__aE8", authDomain:"haesung3732.firebaseapp.com", databaseURL: DB_URL };
let fbOk=false;
try{ firebase.initializeApp(FB); firebase.auth().signInAnonymously().catch(()=>{}); fbOk=true; }catch(e){}
function waitUser(ms){
  return new Promise(res=>{
    if(!fbOk){ res(null); return; }
    const u=firebase.auth().currentUser; if(u){ res(u); return; }
    let done=false; const un=firebase.auth().onAuthStateChanged(x=>{ if(x&&!done){ done=true; un(); res(x); } });
    setTimeout(()=>{ if(!done){ done=true; un(); res(firebase.auth().currentUser||null); } }, ms);
  });
}
async function getShared(key){
  const u = await waitUser(15000);
  const q = u ? '?auth='+encodeURIComponent(await u.getIdToken()) : '';
  const r = await fetch(`${DB_URL}/shared/${encodeURIComponent(key)}.json${q}`);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const v = await r.json();
  return v==null ? null : (typeof v==='string' ? JSON.parse(v) : v);
}

// 미리보기(about:srcdoc) 같은 환경에서는 history 기능이 막혀 있어 오류가 나지 않게 감쌉니다.
function hPush(st, url){ try{ history.pushState(st, '', url); return true; }catch(e){ return false; } }
function hBack(){ try{ if(history.state && (history.state.kind || history.state.viewer)){ history.back(); return; } }catch(e){} goHome(); }
function goHome(){ const v=document.getElementById('viewer'); if(v) v.remove(); S.kind=null; render(); }
const KINDS = ['v220','v380','v380plus','etc'];
const LABEL = {v220:'220V', v380:'380V', v380plus:'380V 이상', etc:'기타참고'};
const S = { counts:{}, vers:{}, kind:null, q:'', error:'', offline:false, loaded:false };
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

// 장수·버전만 업체정보에서 가져옵니다 (작은 데이터)
async function loadBase(){
  const c = lsGet('vg2-base');
  if(c){ S.counts=c.counts||{}; S.vers=c.vers||{}; S.loaded=true; render(); }
  try{
    const ci = (await getShared('gen-company-info-v1')) || {};
    S.counts = ci.vpCounts || {}; S.vers = ci.vpVer || {};
    S.loaded = true; S.offline=false; S.error='';
    lsSet('vg2-base', {counts:S.counts, vers:S.vers});
  }catch(e){
    if(!S.loaded) S.error='불러오지 못했습니다. 인터넷 연결을 확인하세요.'; else S.offline=true;
  }
  if(!S.kind) render();
}
// 종류별 사진: 한 번 받으면 폰에 저장, 사무실에서 바꿨을 때만 다시 받음
async function loadKind(kind){
  const ver = S.vers[kind] || 0;
  const c = lsGet('vg2-p-'+kind);
  if(c && c.ver===ver) return c.data;
  if(!(S.counts[kind]>0)) return [];
  const data = (await getShared('gen-vphoto-all-v1-'+kind)) || [];
  if(!lsSet('vg2-p-'+kind, {ver, data})){
    Object.keys(localStorage).filter(k=>k.startsWith('vg2-p-')).forEach(k=>localStorage.removeItem(k));
    lsSet('vg2-p-'+kind, {ver, data});
  }
  return data;
}
function render(){
  const app = document.getElementById('app');
  if(S.kind) return;
  if(!S.loaded){
    app.innerHTML = `<div class="wrap"><div class="top"><h1><span class="bolt">⚡</span>전압설정</h1></div><div class="msg${S.error?' err':''}">${esc(S.error||'불러오는 중…')}</div></div>`;
    return;
  }
  app.innerHTML = `<div class="wrap">
    <div class="top"><h1><span class="bolt">⚡</span>전압설정</h1><span class="sub">${S.offline? '오프라인 · 저장본':''}</span></div>
    <div class="kgrid">${KINDS.map(k=>`<button class="kcard ${k}" onclick="openKind('${k}')" ${S.counts[k]>0?'':'disabled'}>
      <span class="kl">${LABEL[k]}</span><span class="kn">${S.counts[k]||0}<small>장</small></span></button>`).join('')}</div>
    <div class="foot">사진은 한 번 보면 폰에 저장되어 다음부터는 데이터를 쓰지 않습니다.<br><button onclick="clearCache()">저장된 사진 지우기</button></div>
  </div>`;
}
function photosHtml(){
  const q = S.q.trim().toLowerCase();
  const list = (window._photos||[]).map((p,i)=>({p,i})).filter(x=>!q || String(x.p.caption||'').toLowerCase().includes(q));
  if(!list.length) return `<div class="msg">${q? '찾는 설명이 없습니다.' : '사진이 없습니다.'}</div>`;
  return list.map(({p,i})=>`<section class="sec ${S.kind}">
      ${p.caption? `<div class="note">${esc(p.caption)}</div>`:''}
      <div class="photos"><button onclick="openViewer(${i})" aria-label="사진 크게 보기"><img src="${p.src}" alt="${esc(p.caption||LABEL[S.kind])}" loading="lazy"></button></div>
    </section>`).join('');
}
async function openKind(kind, fromPop){
  S.kind = kind; S.q='';
  if(!fromPop) hPush({kind}, '#'+kind);
  document.getElementById('app').innerHTML = `<div class="wrap">
    <div class="top"><button class="back" onclick="hBack()" aria-label="처음으로">‹</button><h1>${LABEL[kind]} <span class="sub" style="margin:0 0 0 4px;">${S.counts[kind]||0}장</span></h1></div>
    <input id="q" class="search" type="search" placeholder="설명으로 찾기 (예: 6BT, 볼보)" oninput="S.q=this.value; document.getElementById('secs').innerHTML=photosHtml();">
    <div id="secs"><div class="msg">사진 불러오는 중…</div></div>
  </div>`;
  window.scrollTo(0,0);
  let arr;
  try{ arr = await loadKind(kind); }
  catch(e){ if(S.kind===kind) document.getElementById('secs').innerHTML = `<div class="msg err">사진을 불러오지 못했습니다. 인터넷 연결을 확인하세요.</div>`; return; }
  if(S.kind!==kind) return;
  window._photos = arr;
  document.getElementById('secs').innerHTML = photosHtml();
}
function openViewer(i){
  const p = (window._photos||[])[i]; if(!p) return;
  const v = document.createElement('div'); v.className='viewer'; v.id='viewer';
  v.innerHTML = `<img src="${p.src}" alt=""><button class="close" aria-label="닫기" onclick="closeViewer()">✕</button><div class="hint">${p.caption? esc(p.caption.split('\n')[0])+' · ':''}두 손가락으로 확대</div>`;
  document.body.appendChild(v);
  v.dataset.pushed = hPush({viewer:true, kind:S.kind}) ? '1' : '';
}
function closeViewer(fromPop){
  const v=document.getElementById('viewer'); if(!v) return;
  const pushed = v.dataset.pushed==='1';
  v.remove();
  if(!fromPop && pushed){ try{ history.back(); }catch(e){} }
}
function clearCache(){
  Object.keys(localStorage).filter(k=>k.startsWith('vg2-p-')).forEach(k=>localStorage.removeItem(k));
  alert('폰에 저장된 사진을 지웠습니다.');
}
window.addEventListener('popstate', e=>{
  if(document.getElementById('viewer')){ closeViewer(true); return; }
  const st = e.state;
  if(st && st.kind){ if(S.kind!==st.kind) openKind(st.kind, true); }
  else { S.kind=null; render(); }
});
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
try{ history.replaceState({}, '', location.pathname); }catch(e){}
render(); loadBase();
</script>
</body>
</html>
